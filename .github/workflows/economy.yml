# Refreshes data/economy.json for the U.S. Economy Today page.
# Runs every morning, and can be run by hand from the Actions tab ("Run workflow").
name: Update economy data

on:
  schedule:
    - cron: "23 14 * * *"   # 14:23 UTC = 9:23 AM Eastern (10:23 in summer), after BLS's 8:30 AM releases
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: economy-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Fetch the latest numbers
        run: python scripts/fetch_economy.py
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Save the data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/economy.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update economy data"
            git push
          fi
