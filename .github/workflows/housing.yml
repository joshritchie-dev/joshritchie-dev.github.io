# Refreshes data/housing.json for the State Housing Stats page.
# Runs every Monday, and can be run by hand from the Actions tab ("Run workflow").
name: Update housing data

on:
  schedule:
    - cron: "41 15 * * 1"   # Mondays 15:41 UTC = 10:41 AM Eastern (11:41 in summer)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: housing-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Fetch state housing data
        run: python scripts/fetch_housing.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Save the data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/housing.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update housing data"
            git pull --rebase origin main
            git push
          fi
