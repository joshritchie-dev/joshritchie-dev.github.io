<style>
/* OFFBEAT. A museum after hours: ink-violet floors, gold frames, amber torchlight, one hot pink for trouble. */
:root {
  --bg:#0d0f22; --panel:#17193a; --panel2:#20234c; --line:#34386b; --ink:#f4eefc; --mute:#a7a3c9;
  --gold:#f2c14e; --pink:#ff4f8b; --mint:#7cf0a8; --violet:#9b7bff; --amber:#ffc457;
  --display:'Righteous', 'Arial Black', system-ui, sans-serif;
  --body:'DM Sans', 'Segoe UI', system-ui, sans-serif;
  --mono:'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme:dark;

* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:radial-gradient(1200px 600px at 50% -10%, #23205a 0%, var(--bg) 60%) fixed, var(--bg); color:var(--ink); font:15px/1.45 var(--body); padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); overflow:hidden; -webkit-tap-highlight-color:transparent; }
button { font:inherit; color:inherit; cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:0.4; }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
.ghost { background:rgba(255,255,255,0.05); border:1px solid var(--line); border-radius:999px; padding:6px 14px; }
.ghost:hover { border-color:var(--violet); }
.btn { border:0; border-radius:999px; padding:10px 20px; font:400 16px/1 var(--display); letter-spacing:0.5px; background:var(--gold); color:#1d1300; box-shadow:0 4px 0 #a5781c; }
.btn:hover:not(:disabled) { filter:brightness(1.07); }
.btn:active:not(:disabled) { transform:translateY(2px); box-shadow:0 2px 0 #a5781c; }
.btn.alt { background:var(--panel2); color:var(--ink); box-shadow:0 4px 0 #0a0b1d; border:1px solid var(--line); }
.btn.pink { background:var(--pink); color:#2a0414; box-shadow:0 4px 0 #a32456; }
.mute { color:var(--mute); }
.mono { font-family:var(--mono); }
kbd { font:500 12px/1 var(--mono); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:2px 5px; background:var(--panel2); }

#app { height:100%; max-width:1300px; margin:0 auto; display:grid; grid-template-rows:auto minmax(0, 1fr) auto; gap:8px; }
.top { display:flex; align-items:center; gap:10px 18px; flex-wrap:wrap; }
.logo { font:400 26px/1 var(--display); letter-spacing:1px; color:var(--ink); text-shadow:3px 3px 0 var(--pink); }
.logo b { font-weight:400; color:var(--gold); text-shadow:3px 3px 0 #6a3fd6; margin-left:2px; display:inline-block; transform:translateY(3px) rotate(4deg); }
.hud { display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center; font-size:14px; }
.hud .chip { background:rgba(255,255,255,0.05); border:1px solid var(--line); border-radius:999px; padding:4px 11px; white-space:nowrap; }
.hud .chip b { font:500 14px/1 var(--mono); }
.hud .chip.ok { border-color:var(--mint); color:var(--mint); }
.hud .chip.hot { border-color:var(--pink); color:var(--pink); }
.hud .name { font:400 16px/1.1 var(--display); color:var(--gold); }
.tools { margin-left:auto; display:flex; gap:6px; }

.stage { position:relative; border-radius:18px; overflow:hidden; background:#0b0c1d; box-shadow:0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,0.45); min-height:220px; touch-action:none; }
#cv { display:block; width:100%; height:100%; }
.count { position:absolute; inset:0; display:grid; place-items:center; font:400 min(28vw, 180px)/1 var(--display); color:var(--gold); text-shadow:6px 6px 0 var(--pink); pointer-events:none; opacity:0; }
.count.go { animation:count .45s ease-out; }
@keyframes count { from { opacity:1; transform:scale(1.25); } to { opacity:0; transform:scale(0.9); } }

.beat { display:flex; align-items:center; gap:12px; }
#bb { flex:1; height:58px; min-width:0; display:block; }
.pad { display:none; grid-template-columns:repeat(3, 60px); grid-template-rows:repeat(2, 52px); gap:6px; grid-template-areas:'. u .' 'l d r'; }
.pad button { border:1px solid var(--line); background:var(--panel2); border-radius:14px; display:grid; place-items:center; touch-action:none; }
.pad button svg { width:24px; height:24px; fill:var(--ink); }
.pad button:active, .pad button.hit { background:var(--violet); }
.pad [data-dir="3"] { grid-area:u; } .pad [data-dir="2"] { grid-area:l; } .pad [data-dir="1"] { grid-area:d; } .pad [data-dir="0"] { grid-area:r; }
body.touch .pad { display:grid; }

/* ---- full screens and overlays ---- */
#screen .ov { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background:rgba(8,8,22,0.72); overflow:auto; backdrop-filter:blur(3px); }
#screen .ov.solid { background:radial-gradient(900px 500px at 50% 0%, #2a2468 0%, #0d0f22 70%); }
.card { width:min(640px, 100%); background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:22px 24px; box-shadow:0 30px 70px rgba(0,0,0,0.5); max-height:calc(100vh - 32px); overflow:auto; }
.card h1 { font:400 30px/1.05 var(--display); margin:0 0 8px; letter-spacing:0.5px; }
.card h2 { font:400 18px/1.2 var(--display); margin:16px 0 8px; color:var(--gold); }
.card p { margin:8px 0; }
.foot { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; margin-top:18px; align-items:center; }
.title { text-align:center; width:min(720px, 100%); }
.title .big { font:400 min(22vw, 120px)/0.9 var(--display); letter-spacing:2px; text-shadow:6px 6px 0 var(--pink); margin:10px 0 6px; }
.title .big b { font-weight:400; color:var(--gold); text-shadow:6px 6px 0 #6a3fd6; display:inline-block; transform:translateY(8px) rotate(5deg); }
.title .tag { font:400 18px/1.3 var(--display); color:var(--mute); letter-spacing:1px; }
.title .foot { justify-content:center; }
.title .eq { display:flex; gap:4px; justify-content:center; height:34px; align-items:flex-end; margin:18px 0 4px; }
.title .eq i { width:8px; background:var(--violet); border-radius:3px; animation:eq 0.65s ease-in-out infinite alternate; }
@keyframes eq { from { height:6px; } to { height:34px; } }
.heists { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; margin-top:12px; }
.heist { text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:6px; }
.heist:hover:not(:disabled) { border-color:var(--gold); transform:translateY(-2px); }
.heist canvas { width:100%; height:70px; border-radius:10px; display:block; background:#111; }
.heist .n { font:500 12px/1 var(--mono); color:var(--mute); }
.heist b { font:400 17px/1.15 var(--display); }
.heist .st { color:var(--gold); letter-spacing:2px; font-size:15px; }
.heist .st i { color:#3d406f; font-style:normal; }
.heist .bpm { font:12px/1 var(--mono); color:var(--mute); }
.heist.locked { opacity:0.45; }
.brief { display:grid; grid-template-columns:200px 1fr; gap:18px; align-items:start; }
.brief canvas { width:200px; height:160px; border-radius:14px; display:block; }
.tipbox { background:rgba(155,123,255,0.12); border:1px solid rgba(155,123,255,0.4); border-radius:12px; padding:10px 12px; font-size:14px; }
.stars { display:flex; gap:10px; justify-content:center; margin:14px 0 6px; flex-wrap:wrap; }
.stars div { width:150px; text-align:center; background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:10px 8px; }
.stars div b { display:block; font:400 34px/1 var(--display); color:#3d406f; }
.stars div.on b { color:var(--gold); text-shadow:0 0 18px rgba(242,193,78,0.5); }
.stars div span { font-size:13px; color:var(--mute); }
.nums { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:12px 0; }
.nums div { background:var(--panel2); border-radius:12px; padding:8px 10px; font-size:12px; color:var(--mute); }
.nums b { display:block; font:500 20px/1.1 var(--mono); color:var(--ink); }
.big-res { font:400 44px/1 var(--display); text-align:center; margin:4px 0; }
.big-res.win { color:var(--mint); text-shadow:4px 4px 0 #1f6b45; }
.big-res.lose { color:var(--pink); text-shadow:4px 4px 0 #6b1f3a; }
.set { display:grid; grid-template-columns:150px 1fr auto; gap:10px 14px; align-items:center; margin:10px 0; }
.set input[type=range] { width:100%; accent-color:var(--gold); }
.tog { display:flex; align-items:center; gap:10px; margin:10px 0; cursor:pointer; }
.tog input { width:18px; height:18px; accent-color:var(--gold); }
.calib { text-align:center; }
.calib .dot { width:90px; height:90px; border-radius:50%; margin:16px auto; background:var(--panel2); border:3px solid var(--violet); }
.calib .dot.on { background:var(--violet); }

#toasts { position:fixed; left:50%; top:70px; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; z-index:30; pointer-events:none; width:min(460px, calc(100% - 32px)); }
.toast { background:#1c1e44; border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:10px; padding:8px 13px; box-shadow:0 10px 24px rgba(0,0,0,0.4); animation:tin .18s ease-out; font-size:14px; }
.toast.bad { border-left-color:var(--pink); }
.toast.good { border-left-color:var(--mint); }
@keyframes tin { from { transform:translateY(-6px); opacity:0; } }

@media (max-width: 760px) {
  body { padding-top:8px; padding-bottom:8px; }
  .logo { font-size:20px; }
  .hud { font-size:12px; gap:6px; order:3; width:100%; }
  .hud .chip { padding:3px 9px; } .hud .chip b { font-size:12px; }
  .hud .name { font-size:14px; width:100%; }
  .hud .chip.streak { display:none; }
  .brief { grid-template-columns:1fr; } .brief canvas { width:100%; height:140px; }
  .nums { grid-template-columns:repeat(2, 1fr); }
  .card { padding:18px; } .card h1 { font-size:24px; }
  .set { grid-template-columns:1fr; gap:4px; }
  .pad { grid-template-columns:repeat(3, 56px); grid-template-rows:repeat(2, 50px); }
  #bb { height:50px; }
}

const FEELS = { lounge:{ swing:0.12, hat:'soft' }, bossa:{ swing:0.08, hat:'shaker' }, funk:{ swing:0.04, hat:'tight' }, disco:{ swing:0, hat:'open' } };
const GUARD_LINES = ['Is it me or is this music slower than usual?', 'I should\'ve been a dancer.', 'Thirty years and I still don\'t get modern art.', 'Did that painting just wink?', 'My feet hurt in four-four time.', 'Who keeps humming?', 'Smooth jazz again. Every night.', 'If I hear one more saxophone…'];
// =====================================================================
// OFFBEAT — the heist, beat by beat (no DOM)
// =====================================================================
// The world only changes on the beat. Beat k sits at time k*B. The player can move once per beat inside
// the window [kB - W, kB + W]; when that window closes the world ticks (guards step, cameras turn, lasers flip).
// A move outside any window still happens, but it makes noise.
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const SAVE_KEY = 'offbeat_v1';
let S = null;

// ---------------------------------------------------------------------
// LEVEL LOADING
// ---------------------------------------------------------------------
function parseLevel(L) {
  const rows = L.map, H = rows.length, W = Math.max(...rows.map(r => r.length));
  const g = { W, H, wall:[], items:{}, doors:{}, lasers:{}, start:null, exit:null, target:null };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = rows[y][x] || '#', i = y * W + x;
    g.wall[i] = c === '#' || c === 'C';
    if (c === 'S') g.start = { x, y };
    else if (c === 'E') g.exit = { x, y };
    else if (c === 'T') { g.target = { x, y }; g.items[i] = 'target'; }
    else if (c === '$') g.items[i] = 'gem';
