<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Power Cycle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Unbounded:wght@300;700;800&display=swap" rel="stylesheet">
<style>
/* Power Cycle. Flat and dark; the accent is whatever gradient your deepest reset unlocked.
   --g (the gradient), --c1/--c2 (its ends) are set from script. */
:root {
  --bg:#0c0e13; --panel:#151922; --panel2:#1c2130; --line:#2a3142; --ink:#e9edf5; --mute:#8d96aa; --bad:#ff5d5d; --good:#6fe0a0;
  --c1:#b5ad92; --c2:#e6dfc8; --g:linear-gradient(90deg, #b5ad92, #e6dfc8);
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme:dark;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--body); padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); overflow:hidden; }
button { font:inherit; color:inherit; cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:0.45; }
:focus-visible { outline:2px solid var(--c2); outline-offset:2px; }
.ghost { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 11px; }
.ghost:hover { border-color:var(--c1); }
.btn { border:0; border-radius:8px; padding:8px 13px; font-weight:600; background:var(--g); color:#0c0e13; }
.btn:hover:not(:disabled) { filter:brightness(1.08); }
.btn.alt { background:var(--panel2); color:var(--ink); border:1px solid var(--line); }
.btn.sm { padding:5px 9px; font-size:13px; }
.mono { font-family:var(--mono); }
.mute { color:var(--mute); }

#app { height:100%; max-width:1500px; margin:0 auto; display:grid; grid-template-columns:minmax(0, 1fr) 380px; grid-template-rows:auto minmax(0, 1fr); gap:10px; grid-template-areas:'top top' 'stage side'; }

/* ---- top ---- */
.top { grid-area:top; display:flex; align-items:center; gap:10px 20px; flex-wrap:wrap; }
.brand { display:flex; flex-direction:column; gap:3px; }
.logo { font:800 20px/1 var(--display); letter-spacing:0.5px; background:var(--g); -webkit-background-clip:text; background-clip:text; color:transparent; }
.logo b { font-weight:300; margin-left:4px; }
.era { font:500 11px/1 var(--mono); color:var(--mute); text-transform:uppercase; letter-spacing:0.8px; }
.money { display:flex; flex-direction:column; min-width:150px; }
.money b { font:600 24px/1.05 var(--mono); }
.money span { font:13px/1.2 var(--mono); color:var(--mute); }
.plan { display:flex; flex-direction:column; gap:4px; min-width:200px; flex:0 1 260px; }
.pl { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--mute); }
.pl b { font:500 12px/1.2 var(--mono); color:var(--ink); }
.bar { display:block; height:6px; border-radius:3px; background:var(--panel2); overflow:hidden; }
.bar b { display:block; height:100%; width:0; background:var(--g); border-radius:3px; }
.plan.thr .pl span::after { content:' · throttled'; color:var(--c2); }
.pl2 { font:11px/1.2 var(--mono); color:var(--mute); }
.pl2 b { color:var(--ink); font-weight:500; }
.tools { margin-left:auto; display:flex; gap:6px; }

/* ---- stage ---- */
.stage { grid-area:stage; position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); min-height:260px; touch-action:none; background:#101218; }
#cv { display:block; width:100%; height:100%; }
.hint { position:absolute; left:12px; right:12px; bottom:10px; text-align:center; font-size:13px; color:var(--mute); pointer-events:none; text-shadow:0 1px 2px #000; }
.hint b { color:var(--ink); font-weight:600; }
.ticket { position:absolute; left:12px; top:12px; width:min(300px, calc(100% - 24px)); background:#f4f1e8; color:#1c1b17; border-radius:10px; padding:10px 12px 12px; box-shadow:0 10px 30px rgba(0,0,0,0.45); font-size:13px; animation:tin .25s ease-out; }
.ticket .th { display:flex; justify-content:space-between; font:600 11px/1 var(--mono); color:#6b6656; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
.ticket p { margin:0 0 9px; font-weight:500; }
.ticket .btn { width:100%; color:#0c0e13; }
.ticket .tbar { height:3px; background:#d9d3c1; border-radius:2px; margin-top:8px; overflow:hidden; }
.ticket .tbar b { display:block; height:100%; background:#1c1b17; }

/* ---- side ---- */
.side { grid-area:side; display:flex; flex-direction:column; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.tabs { display:flex; border-bottom:1px solid var(--line); }
.tabs button { flex:1; background:none; border:0; padding:11px 6px; font-weight:600; color:var(--mute); position:relative; border-bottom:2px solid transparent; }
.tabs button.on { color:var(--ink); border-bottom-color:var(--c2); }
.tabs .dot { position:absolute; top:9px; margin-left:4px; width:7px; height:7px; border-radius:50%; background:var(--c2); display:inline-block; }
.pane { overflow:auto; padding:12px; min-height:0; flex:1; }
h3 { font:700 12px/1 var(--display); letter-spacing:0.5px; text-transform:uppercase; margin:14px 0 8px; color:var(--mute); }
h3:first-child { margin-top:2px; }

.toolrow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
.dirbtn { display:inline-flex; align-items:center; gap:6px; }
.dirbtn i { display:inline-block; font-style:normal; transition:transform .15s; }
.parts { display:grid; gap:6px; }
.prt { display:grid; grid-template-columns:auto minmax(0, 1fr) auto; gap:4px 10px; align-items:center; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:6px 8px 6px 6px; }
.prt.on { border-color:var(--c2); box-shadow:inset 0 0 0 1px var(--c2); }
.prt .pick { display:contents; }
.prt .pickb { background:none; border:0; padding:0; display:flex; align-items:center; gap:10px; text-align:left; grid-column:1 / 3; min-width:0; }
.prt img { width:36px; height:36px; flex:none; }
.prt .nm { font-weight:600; display:block; }
.prt .st { font-size:12px; color:var(--mute); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prt .cost { font:12px/1.2 var(--mono); color:var(--c2); }
.prt .cost.no { color:var(--bad); }
.prt .up { grid-column:3; grid-row:1; font:12px/1.15 var(--mono); padding:5px 8px; border-radius:8px; border:1px solid var(--line); background:var(--panel); text-align:right; min-width:120px; }
.prt .up small { display:block; color:var(--mute); }
.prt .up:not(:disabled):hover { border-color:var(--c1); }
.prt.locked { opacity:0.55; }
.prt.locked .pickb { cursor:default; }
.upall { display:flex; gap:8px; align-items:center; margin:10px 0 4px; flex-wrap:wrap; }
.tog { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--mute); cursor:pointer; user-select:none; }
.tog input { accent-color:var(--c2); width:16px; height:16px; }
.insp { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px; }
.insp .hd { display:flex; gap:10px; align-items:center; }
.insp .hd img { width:40px; height:40px; }
.insp p { margin:6px 0; font-size:13px; color:var(--mute); }
.insp { margin:0 0 12px; border-color:var(--c1); }
.lvtag { font:600 11px/1 var(--mono); background:var(--g); color:#0c0e13; border-radius:5px; padding:3px 6px; margin-left:4px; vertical-align:2px; }
.nownext { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:13px; margin:8px 0; }
.nownext span { color:var(--mute); }
.nownext b { font:500 12px/1.4 var(--mono); }
.insp .acts { display:flex; gap:6px; flex-wrap:wrap; }

/* ---- the reset ladder ---- */
.rung { border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--panel2); overflow:hidden; }
.rung .sw { height:6px; }
.rung .in { padding:9px 11px 11px; }
.rung .rh { display:flex; align-items:baseline; gap:8px; justify-content:space-between; }
.rung .rn { font-weight:700; }
.rung .lv { font:600 11px/1 var(--mono); color:var(--mute); white-space:nowrap; }
.rung .q { font-size:12px; color:var(--mute); margin:3px 0 7px; font-style:italic; }
.rung .req { font:12px/1.3 var(--mono); color:var(--mute); display:flex; justify-content:space-between; gap:8px; }
.rung .bar { margin:5px 0 8px; }
.rung .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.rung .have { font:12px/1.35 var(--mono); }
.rung .have b { color:var(--ink); }
.rung .bonus { color:var(--mute); }
.rung .shop { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
.rung .shop button { text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12px; line-height:1.3; }
.rung .shop button b { display:block; font-size:12px; }
.rung .shop button span { color:var(--mute); display:block; }
.rung .shop button em { font:normal 11px/1.2 var(--mono); color:var(--c2); display:block; margin-top:2px; }
.rung .shop button:not(:disabled):hover { border-color:var(--c1); }
.rung.locked { opacity:0.5; }
.rung.locked .sw { background:repeating-linear-gradient(90deg, #2a3142 0 8px, #1c2130 8px 16px); }
.rung.next { border-color:var(--c1); }
.rung .unl { font-size:12px; margin-top:6px; }
.rung details summary { cursor:pointer; font-size:12px; color:var(--mute); margin-top:6px; }

.log { list-style:none; margin:0; padding:0; }
.log li { border-bottom:1px dashed var(--line); padding:7px 0; font-size:13px; }
.log li small { display:block; font:11px/1.3 var(--mono); color:var(--mute); }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.stats div { background:var(--panel2); border-radius:8px; padding:7px 9px; font-size:12px; color:var(--mute); }
.stats b { display:block; font:600 15px/1.2 var(--mono); color:var(--ink); }

/* ---- modals ---- */
#ovWrap .ov { position:fixed; inset:0; background:rgba(5,6,9,0.72); display:grid; place-items:center; padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); z-index:20; overflow:auto; }
.modal { width:min(560px, 100%); background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 20px; max-height:calc(100vh - 32px); overflow:auto; box-shadow:0 30px 60px rgba(0,0,0,0.5); }
.modal h1 { font:800 22px/1.15 var(--display); margin:0 0 8px; }
.modal p { margin:6px 0; }
.modal .foot { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px; }
.modal ul { padding-left:18px; margin:6px 0; } .modal li { margin:5px 0; }
.title { text-align:center; }
.title .big { font:800 40px/0.95 var(--display); background:var(--g); -webkit-background-clip:text; background-clip:text; color:transparent; margin:6px 0 10px; }
.title .big b { font-weight:300; display:block; }
.title .foot { justify-content:center; }
.title .stripes { display:flex; height:8px; border-radius:4px; overflow:hidden; margin:14px 0 4px; }
.title .stripes i { flex:1; }
.era-ov { position:fixed; inset:0; z-index:25; display:grid; place-items:center; padding:20px; text-align:center; color:#0c0e13; animation:eraIn .5s ease-out; }
.era-ov .card { max-width:520px; }
.era-ov .k { font:600 13px/1 var(--mono); letter-spacing:1px; text-transform:uppercase; opacity:0.75; }
.era-ov h1 { font:800 34px/1.05 var(--display); margin:10px 0; }
.era-ov p { font-size:16px; margin:8px 0; }
.era-ov .btn { background:#0c0e13; color:#fff; margin-top:14px; padding:10px 18px; }
@keyframes eraIn { from { opacity:0; transform:scale(1.04); } }

#toasts { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; z-index:30; pointer-events:none; width:min(460px, calc(100% - 32px)); }
.toast { background:#1c2130; border:1px solid var(--line); border-left:4px solid var(--c2); border-radius:8px; padding:8px 12px; box-shadow:0 10px 24px rgba(0,0,0,0.4); animation:tin .2s ease-out; font-size:13px; }
.toast.bad { border-left-color:var(--bad); }
@keyframes tin { from { transform:translateY(6px); opacity:0; } }

@media (max-width: 900px) {
  body { overflow:auto; height:auto; } html { height:auto; }
  #app { height:auto; grid-template-columns:minmax(0, 1fr); grid-template-rows:none; grid-template-areas:'top' 'stage' 'side'; }
  .stage { height:clamp(260px, 72vw, 520px); }
  .side { max-height:none; }
  .pane { overflow:visible; }
  .plan { flex:1 1 100%; order:5; }
  .money { min-width:0; }
  .tools { margin-left:auto; }
}
@media (max-width: 480px) {
  .money b { font-size:20px; }
  .logo { font-size:17px; }
  #bHelp { display:none; }
  .rung .shop { grid-template-columns:1fr; }
  .prt .up { min-width:84px; }
}
</style>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo">POWER<b>CYCLE</b></span><span class="era" id="era"></span></div>
    <div class="money"><b id="bytes">0 B</b><span id="rate">0 B/s</span></div>
    <div class="plan" id="plan" title="Your internet plan. Income past it is throttled hard. Each new kind of reset upgrades the plan.">
      <div class="pl"><span>ISP plan</span><b id="planTxt"></b></div>
      <i class="bar"><b id="planBar"></b></i>
      <div class="pl2" id="vpnTxt" hidden></div>
    </div>
    <div class="tools"><button type="button" class="ghost" id="bHelp">How to play</button><button type="button" class="ghost" id="bMenu">Menu</button></div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="The server room. Pick a part, then click a square."></canvas>
    <div class="ticket" id="ticket" hidden></div>
    <div class="hint" id="hint"></div>
  </main>
  <aside class="side">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="build" class="on" aria-selected="true">Build</button>
      <button type="button" role="tab" data-tab="resets" aria-selected="false">Resets<i class="dot" id="resetDot" hidden></i></button>
      <button type="button" role="tab" data-tab="desk" aria-selected="false">Help desk</button>
    </nav>
    <section class="pane" id="tab-build"></section>
    <section class="pane" id="tab-resets" hidden></section>
    <section class="pane" id="tab-desk" hidden></section>
  </aside>
</div>
<div id="ovWrap"></div>
<div id="toasts" aria-live="polite"></div>
<script>
"use strict";
// =====================================================================
// POWER CYCLE — content
// =====================================================================
// Every amount (bytes, layer currencies, packet values) is stored as log10(x). LZ means zero.
const LZ = -1e9;
const lg = x => x > 0 ? Math.log10(x) : LZ;
function lAdd(a, b) { if (b > a) { const t = a; a = b; b = t; } if (b <= LZ + 1) return a; const d = b - a; if (d < -16) return a; return a + Math.log10(1 + Math.pow(10, d)); }
function lSub(a, b) { if (b <= LZ + 1) return a; const d = b - a; if (d >= -1e-12) return LZ; if (d < -16) return a; return a + Math.log10(1 - Math.pow(10, d)); }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
// floor() of a log-space amount (only matters while it's small)
function lFloor(l) { if (l <= LZ + 1) return LZ; if (l >= 15) return l; const f = Math.floor(Math.pow(10, l) + 1e-9); return f >= 1 ? Math.log10(f) : LZ; }

const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmtL(l) {   // a plain count, log-space in
  if (l <= LZ + 1 || l < -6) return '0';
  if (l < 3) { const n = Math.pow(10, l); return n < 10 && Math.abs(n - Math.round(n)) > 0.05 ? n.toFixed(1) : Math.round(n).toString(); }
  const e = Math.floor(l / 3 + 1e-9);
  if (e < SUF.length) { const v = Math.pow(10, l - e * 3); return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + SUF[e]; }
  let ex = Math.floor(l), m = Math.pow(10, l - ex); if (m >= 9.995) { m = 1; ex++; } return m.toFixed(2) + 'e' + ex;
}
// bytes, the SI way, until the SI runs out of prefixes
const BYTE_UNITS = ['B', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB', 'RB', 'QB'];
function fmtB(l) {
  if (l <= LZ + 1 || l < -6) return '0 B';
  if (l < 3) { const n = Math.pow(10, l); return (n < 10 && n % 1 > 0.05 ? n.toFixed(1) : Math.floor(n)) + ' B'; }
  const e = Math.floor(l / 3 + 1e-9);
  if (e < BYTE_UNITS.length) { const v = Math.pow(10, l - e * 3); return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + ' ' + BYTE_UNITS[e]; }
  let ex = Math.floor(l), m = Math.pow(10, l - ex); if (m >= 9.995) { m = 1; ex++; } return m.toFixed(2) + 'e' + ex + ' B';
}
const fmtN = n => n < 1000 ? String(Math.floor(n)) : fmtL(Math.log10(n));

// ---------------------------------------------------------------------
// THE TEN RESETS
// ---------------------------------------------------------------------
// req: log10 bytes earned since your last reset of this level or deeper.
// w: how hard this layer's currency (earned this cycle) multiplies bytes: x(1+E)^w.
// grad: the colours of the whole game once you've done this reset at least once.
const LAYERS = [
  { n:'Factory Default', gname:'Beige Box', grad:['#b5ad92', '#e6dfc8'] },
  { n:'Refresh the Page', verb:'Refresh', cur:'Refreshes', one:'Refresh', req:6, w:1.0, gname:'Loading Spinner', grad:['#36d1dc', '#5b86e5'],
    quip:'Press F5. Everything on the page goes away. The page comes back. Somehow it\'s better.', unlock:'Overclockers' },
  { n:'Close and Reopen the App', verb:'Relaunch', cur:'Relaunches', one:'Relaunch', req:10, w:1.2, gname:'Splash Screen', grad:['#f7971e', '#ffd200'],
    quip:'Not minimise. Close. All the way. Even the little icon by the clock.', unlock:'Routers, VPNs, and Auto-Upgrade' },
  { n:'Reboot the Computer', verb:'Reboot', cur:'Reboots', one:'Reboot', req:15, w:1.4, gname:'Blue Screen', grad:['#1d4fd8', '#6dd5fa'],
    quip:'Save your work. Just kidding, there\'s no saving. Hold the power button.', unlock:'Blockchains, and Auto-Refresh' },
  { n:'Unplug the Router and Wait 30 Seconds', verb:'Unplug', cur:'Unplugs', one:'Unplug', req:21, w:1.6, gname:'Blinking Lights', grad:['#00b09b', '#96c93d'],
    quip:'The full thirty. Not twenty. The router can tell.', unlock:'a bigger board (10×7), and Auto-Relaunch' },
  { n:'Reinstall the Operating System', verb:'Reinstall', cur:'Reinstalls', one:'Reinstall', req:28, w:1.8, gname:'Default Wallpaper', grad:['#fc5c7d', '#6a82fb'],
    quip:'Do you agree to the terms and conditions? You do. You always do.', unlock:'the LLM, and Auto-Reboot' },
  { n:'Factory Reset (Find a Paperclip)', verb:'Factory Reset', cur:'Paperclips', one:'Paperclip', req:36, w:2.0, gname:'Smoke Detected', grad:['#f12711', '#f5af19'],
    quip:'There is a tiny hole on the back. Hold it for ten seconds. Then ten more.', unlock:'a bigger board (12×8), and Auto-Unplug' },
  { n:'Replace the Hardware', verb:'Replace', cur:'Warranties', one:'Warranty', req:45, w:2.2, gname:'Fresh Silicon', grad:['#7f00ff', '#e100ff'],
    quip:'The new one is the same as the old one but it has a light on it.', unlock:'Printers, and Auto-Reinstall' },
  { n:'Restart the Company', verb:'Restart', cur:'Rebrands', one:'Rebrand', req:55, w:2.4, gname:'Brand Refresh', grad:['#00b4db', '#b993d6', '#ff6f61'],
    quip:'New name, new logo, same printer. Everyone gets a lanyard.', unlock:'a bigger board (14×9), Interns, and Auto-Factory Reset' },
  { n:'Reboot the Internet', verb:'Reboot', cur:'Pings', one:'Ping', req:66, w:2.6, gname:'Static Noise', grad:['#e8e8f0', '#9d9dff', '#ff7ae6'],
    quip:'There is a big switch. It is in a basement. Nobody has ever pressed it. Press it.', unlock:'the Help Desk Bot, and Auto-Replace' },
  { n:'Restart the Universe', verb:'Restart', cur:'Big Bangs', one:'Big Bang', req:78, w:3.0, gname:'Big Bang', grad:['#ff3b3b', '#ffa53b', '#fff23b', '#3bff7a', '#3bd8ff', '#5b5bff', '#c03bff'],
    quip:'Have you tried turning it off and on again? Yes. All of it. Everything. Hold on.', unlock:'the end (and Auto-Restart the Company)' }
];

const ACTS = {
  close() { closeModal(); },
  begin() { closeModal(); U.started = true; try { localStorage.setItem('power_cycle_seen', '1'); } catch (e) {} helpModal(); },
  help() { helpModal(); },
  sound() { U.sound = !U.sound; try { localStorage.setItem('power_cycle_sound', U.sound ? '1' : '0'); } catch (e) {} menuModal(); },
  wipeAsk() { wipeAsk(); },
  wipe() { wipeSave(); newGame(); U.sel = null; U.tool = null; U.sig = {}; U.log = []; U.started = false; ICONS_CLEAR(); applyTheme(); closeModal(); titleModal(); },
  winModal() { winModal(); },
  tab(t) { U.tab = t; document.querySelectorAll('.tabs button').forEach(b => { const on = b.dataset.tab === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); }); for (const n of ['build', 'resets', 'desk']) $('tab-' + n).hidden = n !== t; U.sig = {}; refresh(true); },
  tool(t) { if (!unlockedPart(t)) { toast(`Unlocked by ${unlockerOf(t)}.`, 'bad'); sfx('err'); return; } U.tool = U.tool === t ? null : t; U.sel = null; sfx('click'); refresh(true); },
  inspect() { U.tool = null; sfx('click'); refresh(true); },
  rot() { U.dir = (U.dir + 1) % 4; sfx('click'); refresh(true); },
  uptype(t) { const info = typeInfo(t); if (!info) return; const e = upgrade(info.low); if (e) { toast(e, 'bad'); sfx('err'); } else sfx('up'); refresh(); },
  upSel(n) { const t = U.sel && selTile(); if (!t) return; const e = upgrade(t, +n || 1); if (e) { toast(e, 'bad'); sfx('err'); } else sfx('up'); refresh(); },
  desel() { U.sel = null; refresh(true); },
  upall() { const n = upgradeAll(); if (n) sfx('up'); else { toast('Nothing affordable yet.', 'bad'); sfx('err'); } refresh(); },
  autoup(_, el) { S.auto.up = el.checked; },
  autor(k, el) { S.auto.r[+k] = el.checked; },
  reset(k) { k = +k; if (!canReset(k)) { sfx('err'); return; } resetAsk(k); },
  doReset(k) { k = +k; closeModal(); U.manual = k; if (doReset(k)) sfx('reset'); refresh(true); },
  shop(a) { const [k, w] = a.split(':'); const e = buyShop(+k, w); if (e) { toast(e, 'bad'); sfx('err'); } else { sfx('up'); U.sig = {}; } refresh(true); },
  rotSel() { const t = U.sel && selTile(); if (t) { rotateAt(t.x, t.y); sfx('click'); refresh(true); } },
  delSel() { const t = U.sel && selTile(); if (t) { removeTile(t); U.sel = null; refresh(true); } },
  unjamSel() { const t = U.sel && selTile(); if (t && unjam(t.x, t.y)) { sfx('fixed'); refresh(true); } },
  switchSel() { const t = U.sel && selTile(); if (t && t.block > 0 && switchServer(t)) { sfx('fixed'); refresh(true); } },
  fix() { const L = resolveTicket(); if (L !== null) sfx('fixed'); refresh(); }
};
function unlockerOf(t) { const k = PARTS[t].layer; return k ? `${LAYERS[k].n} (reset level ${k})` : 'nothing'; }
function onAct(e) {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  audio(); const f = ACTS[el.dataset.act]; if (f) f(el.dataset.arg, el);
}
function onChange(e) { const el = e.target.closest('[data-act]'); if (!el) return; const f = ACTS[el.dataset.act]; if (f) f(el.dataset.arg, el); }
// removing is free and refunds nothing, unless you change your mind within 15 seconds of buying
function removeTile(t) {
  const lb = U.lastBuy, total = S.resets.reduce((a, b) => a + b, 0);
  if (lb && lb.id === t.id && S.t - lb.t < 15 && lb.resets === total && lb.L > LZ + 1) { S.bytes = lAdd(S.bytes, lb.L); toast(`Returned it. ${fmtB(lb.L)} back.`); }
  U.lastBuy = null; removeAt(t.x, t.y); sfx('click');
}

function handlePending() {
  if (!S.pending.length) return;
  const list = S.pending.splice(0);
  for (const p of list) {
    switch (p.type) {
      case 'era': applyTheme(); ICONS_CLEAR(); sfx('era'); eraOverlay(p.k); U.sig = {}; break;
      case 'reset': if (U.manual === p.k && !(U.modal && U.modal.kind === 'era')) toast(`${LAYERS[p.k].verb}: +${fmtL(p.g)} ${p.g < 0.01 ? LAYERS[p.k].one : LAYERS[p.k].cur}.`); if (U.manual === p.k) U.manual = 0; U.sig = {}; break;
      case 'ticket': sfx('ticket'); break;
      case 'fixed': U.log.unshift({ who:p.who, text:p.what, fix:p.fix, L:p.L, bot:p.bot, t:S.t }); if (U.log.length > 30) U.log.length = 30; if (!p.bot) toast(`Fixed: ${p.fix} +${fmtB(p.L)}, and double income for 20s.`); break;
      case 'caught': sfx('jam'); if (!U.seenCaught) { U.seenCaught = true; toast('Your ISP spotted a VPN. Its traffic is throttled like everything else until you click it and switch servers.'); } break;
      case 'switched': if (!p.intern) toast(`Reconnected. You are now browsing from ${p.loc}.`); break;
      case 'jam': if (!U.seenJam) { U.seenJam = true; sfx('jam'); toast('A printer jammed. Click it to clear the jam.'); } break;
      case 'win': break;
    }
  }
}
function ICONS_CLEAR() { for (const k in ICONS) delete ICONS[k]; }

function typeInfo(t) { const list = upgradable(t); if (!list.length) return null; let lo = Infinity, hi = 0; for (const x of list) { lo = Math.min(lo, tlv(x)); hi = Math.max(hi, tlv(x)); } return { n:list.length, lo, hi, low:cheapest(list) }; }

        ${P.up && !lock ? `<button type="button" class="up" data-act="uptype" data-arg="${t}" id="pu-${t}" title="Upgrades your lowest-level ${esc(P.n)} by one level"></button>` : '<span></span>'}

  }

  for (const t of ORDER) {

function resetsTab(force) {
  const el = $('tab-resets');

    let h = `<p class="mute" style="margin:0 0 10px;font-size:13px">Each reset needs Bytes earned since you last did it (or anything deeper). Currency you earn this cycle multiplies all Bytes.</p>`;
    for (let k = 1; k <= NL; k++) {
      const L = LAYERS[k], reached = k <= S.reached, next = k === S.reached + 1;
      if (!reached && !next) { h += `<div class="rung locked"><div class="sw"></div><div class="in"><div class="rh"><span class="rn">???</span><span class="lv">LEVEL ${k}</span></div></div></div>`; continue; }
      const sh = SHOP[k].b;
      h += `<div class="rung ${next ? 'next' : ''}" id="rung-${k}"><div class="sw" style="background:${reached ? cssGrad(L.grad) : 'var(--line)'}"></div><div class="in">
        <div class="rh"><span class="rn">${esc(L.n)}</span><span class="lv">LEVEL ${k}</span></div>
        ${next ? `<div class="q">${esc(L.quip)}</div>` : ''}
        <div class="req"><span id="rq-${k}"></span><span id="rp-${k}"></span></div>
        <i class="bar"><b id="rb-${k}"></b></i>
        <div class="row"><button type="button" class="btn sm" data-act="reset" data-arg="${k}" id="rbtn-${k}">${esc(L.verb)}</button><span class="have" id="rg-${k}"></span></div>
        ${reached ? `<div class="have" style="margin-top:6px" id="rh-${k}"></div>
          ${autoUnlocked(k) ? `<label class="tog" style="margin-top:6px"><input type="checkbox" data-act="autor" data-arg="${k}" ${S.auto.r[k] ? 'checked' : ''}> Auto-${esc(L.verb.toLowerCase())} whenever it would at least double your ${esc(L.cur)}</label>` : k <= NL - 2 ? `<div class="mute" style="font-size:12px;margin-top:6px">Automated once you reach level ${k + 2}.</div>` : ''}
          <div class="shop">
            <button type="button" data-act="shop" data-arg="${k}:a" id="sa-${k}"><b>${esc(SHOP_A.n)} · ${S.shopA[k]}</b><span>${esc(SHOP_A.d.replace('{cur}', L.cur).replace('{one}', L.one))}</span><em id="sac-${k}"></em></button>
            <button type="button" data-act="shop" data-arg="${k}:b" id="sb-${k}"><b>${esc(sh.n)} · ${S.shopB[k]}/${sh.max}</b><span>${esc(sh.d)}</span><em id="sbc-${k}"></em></button>

    setText('rq-' + k, `${fmtB(S.C[k])} / ${fmtB(L.req)}`);
    const g = gainL(k);

      setText('rh-' + k, `Have ${fmtL(S.H[k])} · earned this cycle ${fmtL(S.E[k])} → Bytes ×${fmtL(bonus)}`);

    }
  }
}

  el.innerHTML = `<h3>Resolved tickets</h3>${U.log.length ? `<ul class="log">${U.log.map(l => `<li><small>${esc(l.who)}${l.bot ? ' · fixed by the bot' : ''} · +${fmtB(l.L)}</small>“${esc(l.text)}”<br><span class="mute">${esc(l.fix)}</span></li>`).join('')}</ul>` : '<p class="mute">Tickets turn up on the board every minute or so. Fix them for a burst of Bytes.</p>'}
    <h3>Stats</h3><div class="stats">
      <div><b>${fmtB(st.earned)}</b>earned, all time</div><div><b>${fmtN(st.packets)}</b>packets delivered</div>
      <div><b>${fmtN(S.resets.reduce((a, b) => a + b, 0))}</b>resets</div><div><b>${fmtN(st.tickets)}</b>tickets fixed</div>
      <div><b>${fmtN(st.jams)}</b>printer jams</div><div><b>${fmtDur(S.t)}</b>on the clock</div></div>
    ${S.reached >= 9 ? '<p class="mute" style="font-size:12px">The Help Desk Bot fixes tickets for you now, at half the reward.</p>' : ''}`;
}

// ---------------------------------------------------------------------
// HUD, TICKET, HINT
// ---------------------------------------------------------------------
function hud() {
  setText('bytes', fmtB(S.bytes));
  setText('rate', `${fmtB(S.inc)}/s${S.boostT > 0 ? ' · ×2 for ' + Math.ceil(S.boostT) + 's' : ''}`);
  const cap = planL(), thr = RAW > cap + 0.01;
  setText('planTxt', S.reached >= NL ? 'unlimited' : `${fmtB(cap)}/s`);
  const vt = $('vpnTxt'), showV = TUN_A > 0 && S.reached < NL, vh = showV ? `+ VPN tunnel <b>${fmtB(tunnelL())}/s</b> the ISP can't see` : '';
  if (vt.hidden === showV) vt.hidden = !showV; if (showV && U.sig.vpn !== vh) { U.sig.vpn = vh; vt.innerHTML = vh; }
  $('planBar').style.width = (S.reached >= NL ? 100 : clamp(Math.pow(10, Math.min(0, Math.max(S.inc, -9) - cap)) * 100, 0, 100)).toFixed(1) + '%';
  $('plan').classList.toggle('thr', thr && S.reached < NL);
  const dot = $('resetDot'); dot.hidden = !(canReset(S.reached + 1) && S.reached < NL);
  // ticket card
  const tk = $('ticket');
  if (S.ticket) {
    if (tk.hidden || tk.dataset.n !== String(S.ticket.n)) { tk.dataset.n = S.ticket.n; tk.innerHTML = `<div class="th"><span>Ticket #${S.ticket.n}</span><span>${esc(S.ticket.who)}</span></div><p>“${esc(S.ticket.what)}”</p><button type="button" class="btn" data-act="fix">Turn it off and on again</button><div class="tbar"><b id="tkb"></b></div>`; tk.hidden = false; }
    const b = $('tkb'); if (b) b.style.width = clamp(S.ticket.t / 20 * 100, 0, 100) + '%';
  } else if (!tk.hidden) tk.hidden = true;
  // hint
  let h = '';
  const jams = Object.values(S.tiles).filter(t => t.jam > 0).length;
  const caught = Object.values(S.tiles).filter(t => t.type === 'vpn' && t.block > 0).length;
  if (jams) h = `<b>${jams} printer${jams > 1 ? 's' : ''} jammed.</b> Click ${jams > 1 ? 'them' : 'it'} to clear${S.reached >= 8 ? ', or let the interns get to it' : ''}.`;
  else if (caught) h = `<b>${caught} VPN${caught > 1 ? 's' : ''} caught by the ISP.</b> Click ${caught > 1 ? 'them' : 'it'} to switch servers${S.reached >= 8 ? ', or let the interns do it' : ''}.`;
  else if (U.tool) h = COARSE ? `Placing <b>${esc(PARTS[U.tool].n)}</b> facing ${ARROWS[U.dir]} · tap a square` : `Placing <b>${esc(PARTS[U.tool].n)}</b> facing ${ARROWS[U.dir]} · R to rotate · Esc to stop`;
  else if (!S.reached && !upgradable('server').some(t => t.lvl)) h = 'Click the <b>Server</b> on the board and upgrade it. It\'ll send packets faster, and worth more.';
  else if (!S.reached && !own('comp')) h = 'Pick a <b>Compressor</b> and click a cable between the Server and the Uplink. It adds value to every packet.';
  else if (!S.reached && S.C[1] < LAYERS[1].req) h = `Earn <b>${fmtB(LAYERS[1].req)}</b> to unlock your first fix: <b>Refresh the Page</b>. More Servers need more Uplinks, or more lines.`;
  else if (canReset(S.reached + 1) && S.reached < NL) h = `<b>${esc(LAYERS[S.reached + 1].n)}</b> is ready in the Resets tab.`;
  else if (thr && S.reached < NL) h = unlockedPart('vpn') ? 'Your ISP is throttling you. Hide some traffic behind a <b>VPN</b>, or do a deeper reset to upgrade the plan.' : 'Your ISP is throttling you. A deeper reset upgrades the plan.';
  if (U.sig.hint !== h) { U.sig.hint = h; $('hint').innerHTML = h; }
}
function refresh(force) {
  if (!S) return;
  hud();
  if (U.tab === 'build') buildTab(force); else if (U.tab === 'resets') resetsTab(force); else deskTab(force);
}

// ---------------------------------------------------------------------
// BOARD INPUT
// ---------------------------------------------------------------------
function evPos(e) { const r = R.cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function setHover(t) { U.hover = t; }
function tryPlaceAt(x, y, dir) {
  const t = U.tool; if (!t) return false;
  const here = tileAt(x, y);
  if (here && here.type === t) return false;
  const c = partCostL(t), err = place(t, x, y, dir);
  if (err) { if (!U.drag || !U.drag.quiet) { toast(err, 'bad'); sfx('err'); } return false; }
  const nt = tileAt(x, y); U.lastBuy = { id:nt.id, L:c, t:S.t, resets:S.resets.reduce((a, b) => a + b, 0) };
  if (t !== 'cable') sfx('place');
  return true;
}
function onDown(e) {
  audio();
  if (!S || U.modal) return;
  const [px, py] = evPos(e), t = tileFromXY(px, py);
  if (e.button === 2) { if (t && tileAt(t.x, t.y)) { rotateAt(t.x, t.y); sfx('click'); } else ACTS.rot(); e.preventDefault(); return; }
  if (!t) { U.sel = null; refresh(true); return; }
  try { R.cv.setPointerCapture(e.pointerId); } catch (er) {}
  if (U.tool === 'cable') { U.drag = { last:t, quiet:false }; if (!tileAt(t.x, t.y)) tryPlaceAt(t.x, t.y, U.dir); U.drag.quiet = true; return; }
  if (U.tool) {
    const here = tileAt(t.x, t.y);
    if (here && here.type === 'printer' && here.jam > 0) { unjam(t.x, t.y); sfx('fixed'); return; }
    if (here && here.type === 'vpn' && here.block > 0) { switchServer(here); sfx('fixed'); return; }
    if (here && here.type !== 'cable') { U.sel = here.id; sfx('click'); if (U.tab !== 'build') ACTS.tab('build'); refresh(true); return; }
    tryPlaceAt(t.x, t.y, U.dir); refresh(); return;
  }
  const here = tileAt(t.x, t.y);
  if (here && here.type === 'printer' && here.jam > 0) { unjam(t.x, t.y); sfx('fixed'); }
  if (here && here.type === 'vpn' && here.block > 0) { switchServer(here); sfx('fixed'); }
  U.sel = here ? here.id : null; if (here) { sfx('click'); if (U.tab !== 'build') ACTS.tab('build'); } refresh(true);
}
function onMove(e) {
  if (!S) return;
  const [px, py] = evPos(e), t = tileFromXY(px, py);
  setHover(e.pointerType === 'mouse' || U.drag ? t : null);
  if (U.drag && t && (t.x !== U.drag.last.x || t.y !== U.drag.last.y)) {
    // walk one square at a time from the last square to this one, pointing each cable at the next
    let { x, y } = U.drag.last;
    while (x !== t.x || y !== t.y) {
      const dx = Math.sign(t.x - x), dy = dx ? 0 : Math.sign(t.y - y), d = dx > 0 ? 0 : dx < 0 ? 2 : dy > 0 ? 1 : 3;
      const cur = tileAt(x, y); if (cur && cur.type === 'cable') cur.dir = d;
      x += dx; y += dy;
      if (!tileAt(x, y)) tryPlaceAt(x, y, d);
      U.dir = d;
    }
    U.drag.last = t;
  }
}
function onUp() { if (U.drag) { U.drag = null; refresh(true); } }

// ---------------------------------------------------------------------
// LOOP
// ---------------------------------------------------------------------
function loop(ts) {
  const dt = Math.min(0.25, Math.max(0, (ts - U.last) / 1000 || 0)); U.last = ts;
  if (S) {
    // the game keeps running under the menus (it's an idle game), except the title screen
    if (U.started) { let left = dt; while (left > 1e-6) { const st = Math.min(0.05, left); tick(st); left -= st; } handlePending(); }
    fxStep(dt);
    const hv = U.hover, bad = !!(U.tool && hv && canPlace(U.tool, hv.x, hv.y));
    drawBoard({ sel:U.sel, hover:hv, tool:U.tool, dir:U.dir, bad });
    U.domT -= dt; if (U.domT <= 0) { U.domT = 0.2; refresh(); }
    U.saveT += dt; if (U.saveT > 5 && U.started) { U.saveT = 0; save(); }
  }
  requestAnimationFrame(loop);
}
function start(data) {
  R.cv = $('cv'); R.g = R.cv.getContext('2d');
  try { U.sound = localStorage.getItem('power_cycle_sound') !== '0'; } catch (e) {}
  let loaded = false;
  if (data && data.s) loaded = loadRaw(data.s);
  if (!loaded && hasSave()) { let raw = null; try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {} loaded = !!raw && loadRaw(raw); }
  if (!loaded) newGame();
  applyTheme(); boardResize();
  addEventListener('resize', boardResize);
  if (window.ResizeObserver) new ResizeObserver(() => boardResize()).observe($('stage'));
  R.cv.addEventListener('pointerdown', onDown);
  R.cv.addEventListener('pointermove', onMove);
  addEventListener('pointerup', onUp); addEventListener('pointercancel', onUp);
  R.cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !U.drag) setHover(null); });
  R.cv.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('click', onAct);
  document.addEventListener('change', onChange);
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { audio(); ACTS.tab(b.dataset.tab); }));
  $('bHelp').onclick = () => { audio(); helpModal(); };
  $('bMenu').onclick = () => { audio(); if (!U.modal) menuModal(); else if (U.modal.closable) closeModal(); };
  addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.key !== 'Escape') return;
    if (e.key === 'Escape') { if (U.modal) { if (U.modal.closable) closeModal(); return; } if (U.tool) { U.tool = null; refresh(true); return; } U.sel = null; refresh(true); return; }
    if (U.modal) return;
    if (e.key === 'r' || e.key === 'R') { const t = U.sel && selTile(); if (t && !U.tool) ACTS.rotSel(); else ACTS.rot(); }
    else if (e.key === 'u' || e.key === 'U') ACTS.upall();
    else if (/^[0-9]$/.test(e.key)) { const t = ORDER[e.key === '0' ? 9 : +e.key - 1]; if (t) ACTS.tool(t); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && U.sel) ACTS.delSel();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && U.started) save(); });
  addEventListener('pagehide', () => { if (U.started) save(); });
  let seen = false; try { seen = !!localStorage.getItem('power_cycle_seen'); } catch (e) {}
  if (data && data.s && loaded) { U.started = true; }
  else if (loaded) {
    U.started = true;
    const away = (Date.now() - (S.saved || Date.now())) / 1000;
    const L = offline(away);
    if (L > LZ + 1) awayModal(away, L);
  } else if (!seen) titleModal();
  else { U.started = true; }
  refresh(true);
  requestAnimationFrame(loop);
}
try { window.claude?.hot?.snapshot?.(() => ({ s:S ? JSON.stringify(Object.assign({}, S, { pending:[] })) : null })); } catch (e) {}
(window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}));
</script>
