<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gerald's Back</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Gerald's Back. One committed nautical look: deep navy sea, foam text, coral and sand accents.
   Desktop: palette | shell | gazette. Phone: everything stacks and the page scrolls. */
:root {
  --bg:#0f2b3d; --panel:#163b52; --panel2:#1d4a64; --line:#2a5a77; --ink:#eaf7f4; --mute:#9cc2cc;
  --coral:#ff7a59; --kelp:#4caf7a; --sand:#f3d98b; --warn:#ffb020; --bad:#ff5d5d; --good:#6fe0a0; --sea:#5ec8ff;
  --paper:#f6efdc; --pink:#33281a;
  --display:'Bungee', 'Arial Black', Impact, sans-serif;
  --body:'Rubik', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme:dark;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 var(--body); padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); overflow:hidden; }
button { font:inherit; color:inherit; cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:0.45; }
:focus-visible { outline:3px solid var(--sand); outline-offset:2px; }
h2 { font:13px/1 var(--display); letter-spacing:0.5px; margin:0 0 8px; color:var(--sand); font-weight:400; }
.card { background:rgba(22,59,82,0.92); border:1px solid var(--line); border-radius:12px; }
.ghost { border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:6px 11px; font-weight:500; }
.ghost:hover { border-color:var(--sea); }
.btn { border:0; border-radius:10px; padding:9px 14px; font-weight:600; background:var(--coral); color:#2a0f06; box-shadow:0 3px 0 #b34a30; }
.btn:hover:not(:disabled) { filter:brightness(1.08); }
.btn:active:not(:disabled) { transform:translateY(2px); box-shadow:0 1px 0 #b34a30; }
.btn.alt { background:var(--panel2); color:var(--ink); box-shadow:0 3px 0 #0a2333; }
.btn.sm { padding:6px 10px; font-size:13px; }
.btn.kelp { background:var(--kelp); color:#06240f; box-shadow:0 3px 0 #2c7a4e; }

#app { height:100%; max-width:1600px; margin:0 auto; display:grid; grid-template-columns:212px minmax(0, 1fr) 300px; grid-template-rows:auto minmax(0, 1fr); gap:10px; grid-template-areas:'bar bar bar' 'build stage side'; }

/* ---- top bar ---- */
.bar { grid-area:bar; display:flex; align-items:center; gap:8px 16px; flex-wrap:wrap; }
.brand { font:22px/0.9 var(--display); color:var(--sand); letter-spacing:0.5px; text-shadow:0 3px 0 #7a5a1c; }
.brand span { display:block; color:var(--coral); text-shadow:0 3px 0 #8c3320; font-size:17px; margin-top:2px; }
.res { display:flex; flex-wrap:wrap; gap:6px; }
.r { display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:4px 9px 4px 6px; min-width:0; }
.r svg { width:20px; height:20px; flex:none; }
.r b { font:15px/1 var(--display); font-weight:400; }
.r small { color:var(--mute); font-size:12px; }
.r.low { border-color:var(--warn); }
.r.low b { color:var(--warn); }
.r.neg { border-color:var(--bad); }
.r.neg b { color:var(--bad); }
.clock { display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap; }
.day { font:14px/1 var(--display); color:var(--mute); }
.speed { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:9px; overflow:hidden; }
.speed button { border:0; background:none; padding:7px 9px; display:grid; place-items:center; }
.speed button svg { height:13px; width:auto; fill:var(--mute); }
.speed button.on { background:var(--panel2); }
.speed button.on svg { fill:var(--sand); }
.speed button:hover svg { fill:var(--ink); }

/* ---- build palette ---- */
.build { grid-area:build; min-height:0; overflow:auto; padding-right:2px; }
.pal { display:grid; gap:5px; }
.pb { display:grid; grid-template-columns:38px 1fr; grid-template-rows:auto auto; gap:1px 8px; align-items:center; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:5px 8px 5px 5px; position:relative; }
.pb img { width:38px; height:38px; grid-row:1 / 3; grid-column:1; align-self:center; }
.pb .nm, .pb .st { grid-column:2; }
.pb .nm { font-weight:600; font-size:13px; line-height:1.15; }
.pb .st { font-size:12px; color:var(--mute); display:flex; gap:8px; white-space:nowrap; }
.pb .st .c { color:var(--sand); }
.pb .st .w { color:var(--sea); }
.pb:hover:not(:disabled) { border-color:var(--sea); }
.pb.on { border-color:var(--sand); background:var(--panel2); box-shadow:inset 0 0 0 1px var(--sand); }
.pb.poor .c { color:var(--bad); }
.pb.locked { opacity:0.5; }
.pb.locked .st { color:var(--mute); }
.pb .key { position:absolute; right:6px; top:5px; font-size:10px; color:var(--mute); }

/* ---- stage ---- */
.stage { grid-area:stage; position:relative; border-radius:16px; overflow:hidden; background:#1a6e93; box-shadow:0 0 0 1px var(--line), 0 18px 40px rgba(0,0,0,0.35); min-height:300px; touch-action:none; }
#cv { display:block; width:100%; height:100%; cursor:pointer; }
#cv.placing { cursor:crosshair; }
.ov-tl { position:absolute; left:10px; top:10px; pointer-events:none; }
.ov-tr { position:absolute; right:10px; top:10px; pointer-events:none; }
.ov-b { position:absolute; left:10px; right:10px; bottom:10px; display:flex; justify-content:center; pointer-events:none; }
.level { display:flex; align-items:center; gap:8px; padding:6px 10px 6px 6px; }
#lv { width:100px; height:70px; display:block; }
.lvtxt { display:flex; flex-direction:column; gap:2px; min-width:66px; }
.lvtxt b { font:20px/1 var(--display); font-weight:400; }
.lvtxt span { font-size:12px; color:var(--mute); }
.level.warn .lvtxt b { color:var(--warn); }
.level.bad .lvtxt b { color:var(--bad); }
.gerald { padding:8px 10px; width:178px; }
.gname { font:14px/1 var(--display); color:var(--kelp); margin-bottom:6px; }
.meter { display:grid; grid-template-columns:58px 1fr; align-items:center; gap:6px; margin:3px 0; font-size:12px; color:var(--mute); }
.meter i { display:block; height:8px; border-radius:4px; background:#0b2232; overflow:hidden; }
.meter b { display:block; height:100%; border-radius:4px; background:var(--kelp); transition:width .3s; }
.meter b.mid { background:var(--warn); }
.meter b.low { background:var(--bad); }
.gnote { font-size:12px; color:var(--mute); margin-top:5px; line-height:1.3; }
.gnote.bad { color:var(--bad); font-weight:600; }
.voyage { pointer-events:auto; display:flex; align-items:center; gap:10px; padding:7px 10px; max-width:100%; flex-wrap:wrap; justify-content:center; }
.vstops { display:flex; gap:4px; align-items:center; }
.vstops i { width:9px; height:9px; border-radius:50%; background:#0b2232; border:1px solid var(--line); display:block; }
.vstops i.done { background:var(--kelp); border-color:var(--kelp); }
.vstops i.now { background:var(--sand); border-color:var(--sand); }
.vstops i.end { width:12px; height:12px; border-color:var(--sand); }
.vtxt { font-size:13px; }
.vtxt b { color:var(--sand); }
.vbar { width:120px; height:7px; background:#0b2232; border-radius:4px; overflow:hidden; }
.vbar b { display:block; height:100%; background:var(--sea); }
.zoom { position:absolute; right:10px; bottom:62px; display:flex; flex-direction:column; gap:4px; }
.zoom button { width:36px; height:32px; border-radius:8px; border:1px solid var(--line); background:rgba(22,59,82,0.92); font:16px/1 var(--display); padding:0; }
.zoom button:last-child { font:11px/1 var(--body); font-weight:600; }
.zoom button:hover { border-color:var(--sea); }
.tip { position:absolute; left:50%; bottom:62px; transform:translateX(-50%); background:rgba(10,30,45,0.92); border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:13px; pointer-events:none; max-width:min(380px, 60%); text-align:center; }
.tip.bad { border-color:var(--bad); color:#ffd4d4; }
.cap { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); background:rgba(90,10,10,0.88); border:2px solid var(--bad); border-radius:12px; padding:10px 16px; font:16px/1.2 var(--display); text-align:center; pointer-events:none; animation:pulse 0.7s infinite alternate; }
@keyframes pulse { to { transform:translate(-50%, -50%) scale(1.06); } }

/* ---- side ---- */
.side { grid-area:side; display:grid; grid-template-rows:auto minmax(0, 1fr); gap:10px; min-height:0; }
.insp { padding:10px 12px; }
.insp .hd { display:flex; gap:10px; align-items:center; margin-bottom:6px; }
.insp .hd img { width:52px; height:52px; }
.insp .hd b { font:15px/1.1 var(--display); font-weight:400; display:block; }
.insp .hd small { color:var(--mute); }
.insp p { margin:4px 0 8px; color:var(--mute); font-size:13px; }
.insp .facts { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:13px; margin:6px 0 8px; }
.insp .facts dt { color:var(--mute); }
.insp .facts dd { margin:0; font-weight:500; }
.insp .acts { display:flex; flex-wrap:wrap; gap:6px; }
.insp .bal { display:flex; align-items:center; gap:6px; margin:6px 0; }
.insp .bal input { flex:1; accent-color:var(--sea); }
.good { color:var(--good) !important; } .bad { color:var(--bad) !important; } .warn { color:var(--warn) !important; }
.gz { padding:10px 0 0; display:flex; flex-direction:column; min-height:0; background:var(--paper); color:#2a2318; border-color:#d8ccad; }
.gzh { font:16px/1 var(--display); color:#2a2318; text-align:center; padding:0 10px 8px; border-bottom:3px double #2a2318; margin:0 10px; }
.feed { list-style:none; margin:0; padding:6px 12px 10px; overflow:auto; min-height:0; flex:1; }
.feed li { padding:6px 0; border-bottom:1px dashed #cbbd99; font-size:13px; line-height:1.35; }
.feed li small { display:block; font-size:10px; letter-spacing:0.5px; color:#857656; text-transform:uppercase; font-weight:600; }
.feed li.bad { color:#9b2414; }
.feed li.good { color:#1d6a3d; }
.feed li.event { font-weight:600; }
.feed li.warn { color:#8a5300; }

/* ---- modals ---- */
#ovWrap .ov { position:fixed; inset:0; background:rgba(5,18,28,0.72); display:grid; place-items:center; padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); z-index:20; overflow:auto; }
.modal { width:min(640px, 100%); background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 20px; box-shadow:0 30px 60px rgba(0,0,0,0.5); max-height:calc(100vh - 32px); overflow:auto; }
.modal h1 { font:26px/1.05 var(--display); font-weight:400; margin:0 0 6px; color:var(--sand); }
.modal h3 { font:14px/1 var(--display); font-weight:400; margin:14px 0 8px; color:var(--sand); }
.modal p { margin:6px 0; }
.modal .mute { color:var(--mute); }
.modal .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.modal .foot { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px; }
.modal ul.help { padding-left:18px; margin:6px 0; }
.modal ul.help li { margin:4px 0; }
.title { text-align:center; }
.title .logo { font:48px/0.9 var(--display); color:var(--sand); text-shadow:0 5px 0 #7a5a1c; margin:4px 0 2px; }
.title .logo span { display:block; color:var(--coral); text-shadow:0 5px 0 #8c3320; font-size:38px; margin-top:4px; }
.title .tag { color:var(--mute); margin:12px 0 4px; font-size:15px; }
.title .foot { justify-content:center; }
.title canvas { width:min(380px, 100%); height:auto; display:block; margin:6px auto 0; }
.paper { background:var(--paper); color:#2a2318; border-color:#d8ccad; }
.paper .mast { font:13px/1 var(--display); text-align:center; border-bottom:3px double #2a2318; padding-bottom:7px; letter-spacing:1px; }
.paper .mast small { display:block; font:11px/1.4 var(--body); letter-spacing:0; color:#857656; margin-top:4px; }
.paper h1 { color:#2a2318; font-size:24px; margin-top:12px; }
.paper .btn.alt { background:#e6dcc0; color:#2a2318; box-shadow:0 3px 0 #b8a67c; }
.opts { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin-top:10px; }
.opt { background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:6px; text-align:left; }
.opt:hover { border-color:var(--sand); }
.opt svg { width:34px; height:34px; }
.opt b { font:15px/1.1 var(--display); font-weight:400; color:var(--sand); }
.opt .ty { font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:0.5px; }
.opt p { font-size:13px; margin:0; flex:1; }
.opt .len { font-size:12px; color:var(--sea); }
.route { display:flex; gap:6px; align-items:center; margin:8px 0 2px; flex-wrap:wrap; }
.route i { width:12px; height:12px; border-radius:50%; background:#0b2232; border:1px solid var(--line); display:block; }
.route i.done { background:var(--kelp); border-color:var(--kelp); }
.route i.now { background:var(--sand); border-color:var(--sand); box-shadow:0 0 0 3px rgba(243,217,139,0.25); }
.trade { display:grid; grid-template-columns:1fr auto auto; gap:6px 10px; align-items:center; }
.trade .nm { display:flex; align-items:center; gap:6px; }
.trade .nm svg { width:20px; height:20px; }
.trade .pr { color:var(--sand); font-size:12px; display:block; }
.plans { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:8px; }
.plan { background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px; display:grid; grid-template-columns:52px 1fr; gap:4px 10px; }
.plan img { width:52px; height:52px; grid-row:span 2; }
.plan b { font-weight:600; }
.plan p { font-size:12px; margin:0; color:var(--mute); grid-column:1 / -1; }
.plan .btn { grid-column:1 / -1; }
.arrive { background:var(--panel2); border-radius:10px; padding:8px 10px; margin:8px 0; border-left:4px solid var(--kelp); }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; margin:12px 0; }
.stats div { background:var(--panel2); border-radius:10px; padding:8px 10px; }
.stats b { display:block; font:20px/1 var(--display); font-weight:400; color:var(--sand); }
.stats small { color:var(--mute); }
.rank { font:34px/1 var(--display); color:var(--coral); text-align:center; margin:10px 0 2px; }
.score { text-align:center; color:var(--mute); }

#toasts { position:fixed; left:50%; bottom:76px; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; z-index:30; pointer-events:none; width:min(460px, calc(100% - 32px)); }
.toast { background:#0b2232; border:1px solid var(--line); border-radius:10px; padding:8px 14px; box-shadow:0 10px 24px rgba(0,0,0,0.4); animation:tin .2s ease-out; text-align:center; }
.toast.bad { border-color:var(--bad); }
.toast.good { border-color:var(--kelp); }
.toast.warn { border-color:var(--warn); }
@keyframes tin { from { transform:translateY(8px); opacity:0; } }

/* ---- phone / narrow ---- */
@media (max-width: 960px) {
  body { overflow:auto; height:auto; }
  html { height:auto; }
  #app { height:auto; grid-template-columns:minmax(0, 1fr); grid-template-rows:none; grid-template-areas:'bar' 'stage' 'build' 'side'; }
  .stage { height:clamp(400px, 118vw, 620px); min-height:0; }
  .bar { display:grid; grid-template-columns:auto 1fr; align-items:center; }
  .res { grid-column:1 / -1; grid-row:2; }
  .clock { justify-self:end; }
  #bHelp { display:none; }
  .build { overflow:visible; }
  .pal { grid-auto-flow:column; grid-auto-columns:172px; align-items:start; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity; }
  .pb { scroll-snap-align:start; }
  .side { grid-template-rows:none; }
  .feed { max-height:300px; }
  .clock { margin-left:0; }
  .brand { font-size:18px; } .brand span { font-size:14px; }
}
@media (max-width: 560px) {
  .r { padding:3px 7px 3px 5px; }
  .r b { font-size:13px; }
  .r svg { width:17px; height:17px; }
  .r small { display:none; }
  .gerald { width:140px; padding:6px 8px; }
  .meter { grid-template-columns:48px 1fr; font-size:11px; }
  .gnote { display:none; }
  #lv { width:72px; height:50px; }
  .lvtxt { min-width:0; max-width:96px; }
  .lvtxt span { font-size:11px; line-height:1.2; }
  .tip { font-size:12px; padding:5px 8px; }
  .lvtxt b { font-size:16px; }
  .level { padding:4px 8px 4px 4px; }
  .vbar { width:70px; }
  .vstops { display:none; }
  .day { display:none; }
  .tip { max-width:calc(100% - 120px); bottom:58px; }
  .ghost { padding:5px 8px; }
  .title .logo { font-size:38px; } .title .logo span { font-size:30px; }
}
</style>
<div id="app">
  <header class="bar">
    <div class="brand" aria-label="Gerald's Back">GERALD'S<span>BACK</span></div>
    <div class="res" id="res" aria-label="City resources"></div>
    <div class="clock">
      <span class="day" id="hDay">Day 1</span>
      <div class="speed" role="group" aria-label="Speed">
        <button type="button" data-sp="0" title="Pause (Space)" aria-label="Pause"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg></button>
        <button type="button" data-sp="1" title="Normal speed (1)" aria-label="Normal speed"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg></button>
        <button type="button" data-sp="2" title="Fast (2)" aria-label="Fast"><svg viewBox="0 0 24 16"><path d="M2 2l9 6-9 6zM12 2l9 6-9 6z"/></svg></button>
        <button type="button" data-sp="3" title="Very fast (3)" aria-label="Very fast"><svg viewBox="0 0 32 16"><path d="M1 2l9 6-9 6zM11 2l9 6-9 6zM21 2l9 6-9 6z"/></svg></button>
      </div>
      <button type="button" class="ghost" id="bHelp">How to play</button>
      <button type="button" class="ghost" id="bMenu">Menu</button>
    </div>
  </header>
  <aside class="build" aria-label="Build">
    <h2>Build</h2>
    <div class="pal" id="pal"></div>
  </aside>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Gerald's shell, with the city on it. Pick a building, then click a square."></canvas>
    <div class="ov-tl">
      <div class="level card" id="level" title="The bubble floats to the high side. The water rises on the low side.">
        <canvas id="lv" width="200" height="140" aria-hidden="true"></canvas>
        <div class="lvtxt"><b id="lvDeg">0°</b><span id="lvNote">Level</span></div>
      </div>
    </div>
    <div class="ov-tr">
      <div class="gerald card" id="gCard">
        <div class="gname">Gerald</div>
        <div class="meter"><label>Fullness</label><i><b id="gFull"></b></i></div>
        <div class="meter"><label>Mood</label><i><b id="gMood"></b></i></div>
        <div class="gnote" id="gNote"></div>
      </div>
    </div>
    <div class="ov-b">
      <div class="voyage card" id="voy"></div>
    </div>
    <div class="zoom" id="zoom" role="group" aria-label="Zoom"><button type="button" data-act="zin" aria-label="Zoom in">+</button><button type="button" data-act="zout" aria-label="Zoom out">−</button><button type="button" data-act="zfit" aria-label="Fit the whole turtle">Fit</button></div>
    <div class="tip" id="tip" hidden></div>
    <div class="cap" id="capWarn" hidden></div>
  </main>
  <aside class="side" aria-label="Details">
    <section class="insp card" id="insp"></section>
    <section class="gz card">
      <h2 class="gzh">The Shell Gazette</h2>
      <ol class="feed" id="feed" aria-live="polite"></ol>
    </section>
  </aside>
</div>
<div id="ovWrap"></div>
<div id="toasts" aria-live="polite"></div>
<script>
"use strict";
// =====================================================================
// GERALD'S BACK — content
// =====================================================================
const N = 15, CX = 7, CY = 7, RX = 7.5, RY = 6.8;
const DAY = 30;                 // seconds per day at 1×
const BASE_MASS = 40;           // Gerald himself, as far as the maths is concerned
const TILT_K = 3.0;             // how hard weight leans the shell

const SAVE_KEY = 'geralds_back_v1';
let S = null;
const GRID = { inside:[], rim:[], h:[], nx:[], ny:[], water:new Float32Array(N * N), wet:new Uint8Array(N * N) };
const idx = (x, y) => y * N + x;
const inB = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = () => Math.random();
const pick = a => a[Math.floor(rnd() * a.length)];
const fmt = v => (v < 0 ? '−' : '') + Math.floor(Math.abs(v)).toLocaleString('en-US');

// shell geometry, computed once
(function shell() {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const nx = (x - CX) / RX, ny = (y - CY) / RY, d2 = nx * nx + ny * ny, i = idx(x, y);
    GRID.inside[i] = d2 <= 1; GRID.h[i] = Math.max(0, 1 - d2); GRID.nx[i] = nx; GRID.ny[i] = ny;
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = idx(x, y); if (!GRID.inside[i]) { GRID.rim[i] = false; continue; }
    GRID.rim[i] = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => !inB(x + dx, y + dy) || !GRID.inside[idx(x + dx, y + dy)]);
  }
})();

// ---------------------------------------------------------------------
// NEW GAME
// ---------------------------------------------------------------------
function newGame() {
  S = { v:1, day:0, t:0, clams:160, fish:30, kelp:45, goods:0, pop:12, immig:0, tiles:new Array(N * N).fill(0), blds:{}, nextId:1,
    tilt:{ x:0, y:0 }, tiltT:{ x:0, y:0 }, cap:0, surge:{ amp:0, t:0, dur:0, peakHit:false }, gust:0,
    gerald:{ hunger:15, mood:70, dive:0 }, itch:null, itchIn:1.6, mods:[], taxMod:1, barn:null,
    leg:null, stop:0, options:[], port:null, event:null, phase:'chart', used:{},
    unlocked:Object.fromEntries(PALETTE.map(k => [k, !LOCKED_START.includes(k)])), firsts:{}, log:[], pending:[],
    stats:{ built:0, dives:0, scratches:0, floods:0, maxPop:8, ruined:0, events:0, earned:0 }, hap:60, over:null, rate:{} };
  place('hall', 6, 6, true);
  place('hut', 5, 8, true); place('hut', 9, 6, true);
  place('fishery', 1, 4, true);
  place('kelp', 13, 3, true);
  S.options = rollOptions(0);
  log('Welcome aboard. The Shell Gazette is proud to serve the only city on a turtle. Gerald has not been told.', 'event');
  return S;
}
function log(text, k = 'news') { S.log.unshift({ d:S.day, text, k }); if (S.log.length > 60) S.log.length = 60; }

// ---------------------------------------------------------------------
// BUILDINGS
// ---------------------------------------------------------------------
const bAt = (x, y) => inB(x, y) ? S.blds[S.tiles[idx(x, y)]] : null;
function footprint(type, x, y) { const n = BLD[type].size || 1, out = []; for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) out.push([x + i, y + j]); return out; }
function canPlace(type, x, y) {
  const d = BLD[type]; if (!d) return 'Unknown building.';
  for (const [tx, ty] of footprint(type, x, y)) {
    if (!inB(tx, ty) || !GRID.inside[idx(tx, ty)]) return 'That\'s off the shell.';
    if (S.tiles[idx(tx, ty)]) return 'Something is already there.';
  }
  if (d.rim && !GRID.rim[idx(x, y)]) return 'This goes on the edge of the shell.';
  return '';
}
function place(type, x, y, free) {
  const d = BLD[type];
  if (!free) {
    if (!S.unlocked[type]) return 'You need the blueprint for that.';
    const why = canPlace(type, x, y); if (why) return why;
    if (S.clams < d.cost) return `Costs ${d.cost} Clams.`;
    S.clams -= d.cost; S.stats.built++;
  }
  const b = { id:S.nextId++, type, x, y, size:d.size || 1, hp:d.hp || 100, wet:0, fill:0, target:0, staff:0 };
  S.blds[b.id] = b;
  for (const [tx, ty] of footprint(type, x, y)) S.tiles[idx(tx, ty)] = b.id;
  if (!free && !S.firsts[type] && NEWS.firsts[type]) { S.firsts[type] = 1; log(NEWS.firsts[type], 'event'); }
  return '';
}
function removeB(id) { const b = S.blds[id]; if (!b) return; for (const [tx, ty] of footprint(b.type, b.x, b.y)) S.tiles[idx(tx, ty)] = 0; delete S.blds[id]; }
function demolish(id) {
  const b = S.blds[id]; if (!b) return 'Nothing there.';
  if (b.type === 'hall') return 'The council would never allow it.';
  if (b.type === 'rubble') { if (S.clams < 10) return 'Clearing rubble costs 10 Clams.'; S.clams -= 10; removeB(id); return ''; }
  const refund = Math.floor(BLD[b.type].cost * 0.4 * b.hp / (BLD[b.type].hp || 100));
  S.clams += refund; removeB(id); return '';
}
function repairCost(b) { const max = BLD[b.type].hp || 100; return Math.ceil(BLD[b.type].cost * 0.5 * (1 - b.hp / max)); }
function repair(id) { const b = S.blds[id]; if (!b || b.type === 'rubble') return 'Nothing to fix.'; const c = repairCost(b); if (!c) return 'It\'s fine.'; if (S.clams < c) return `Costs ${c} Clams.`; S.clams -= c; b.hp = BLD[b.type].hp || 100; return ''; }
function setBallast(id, target) { const b = S.blds[id]; if (b && b.type === 'ballast') b.target = clamp(target, 0, BLD.ballast.ballast); }
// residents weigh something too: one weight per ten people, spread over the homes
function weightOf(b) {
  if (b.type === 'ballast') return b.fill;
  const d = BLD[b.type]; let w = d.w;
  if (d.house && b.hp > 0 && S.pop > 0) { const H = S.rate.housing || housing(); if (H) w += (S.pop / H) * d.house / 10; }
  return w;
}
function centre(b) { const n = b.size; return [b.x + (n - 1) / 2, b.y + (n - 1) / 2]; }
const count = (s, type) => Object.values(s.blds).filter(b => b.type === type && b.hp > 0).length;

// ---------------------------------------------------------------------
// TILT + WATER
// ---------------------------------------------------------------------
function massCentre(extra) {
  let m = BASE_MASS, sx = 0, sy = 0;
  const add = (w, x, y) => { m += w; sx += w * (x - CX); sy += w * (y - CY); };
  for (const b of Object.values(S.blds)) { const [x, y] = centre(b); add(weightOf(b), x, y); }
  if (S.barn) add(S.barn.w, S.barn.x, S.barn.y);
  if (extra) add(extra.w, extra.x, extra.y);
  return { x:sx / m, y:sy / m, m };
}
function tiltFor(com) { return { x:com.x * TILT_K / RX, y:com.y * TILT_K / RY }; }
// tilt if a building were added (for the placement preview)
function previewTilt(type, x, y) { const n = BLD[type].size || 1; return tiltFor(massCentre({ w:type === 'ballast' ? 0 : BLD[type].w, x:x + (n - 1) / 2, y:y + (n - 1) / 2 })); }
function surgeLevel() { const s = S.surge; if (!s.dur) return 0; const p = s.t / s.dur; const env = p < 0.25 ? p / 0.25 : p > 0.75 ? (1 - p) / 0.25 : 1; return s.amp * env; }
function waterAt(i, T = S.tilt) {
  let w = WATER0 + WATER_TILT * (T.x * GRID.nx[i] + T.y * GRID.ny[i]) + surgeLevel();
  if (S.leg && S.leg.to.type === 'storm' && S.phase === 'sail') w += 0.07 * Math.sin(S.t * 1.7 + GRID.nx[i] * 3);
  return w;
}
function wallBonus(x, y) {
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const b = bAt(x + i, y + j); if (b && b.type === 'seawall' && b.hp > 0) return 0.25; }
  return 0;
}
function computeWater() {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = idx(x, y); if (!GRID.inside[i]) continue;
    const w = waterAt(i); GRID.water[i] = w;
    GRID.wet[i] = GRID.h[i] + wallBonus(x, y) < w ? 1 : 0;
  }
}
const isWet = b => footprint(b.type, b.x, b.y).some(([x, y]) => GRID.wet[idx(x, y)]);
const tiltDeg = T => Math.hypot(T.x, T.y) * 20;   // for display: 1.0 tilt ≈ 20°

// ---------------------------------------------------------------------
// ECONOMY
// ---------------------------------------------------------------------
function housing() {
  let h = 0; const goodsOk = S.rate.goodsOk !== false;
  for (const b of Object.values(S.blds)) { const d = BLD[b.type]; if (!d.house || b.hp <= 0) continue; h += d.goods && !goodsOk ? Math.round(d.house * 0.6) : d.house; }
  return h;
}
function modSum(k) { return S.mods.filter(m => m.k === k).reduce((a, m) => a + m.v, 0); }
function addMod(s, k, v, days) { s.mods.push({ k, v, days }); }
function inRange(b, type, r) {
  const [x, y] = centre(b); let n = 0;
  for (const o of Object.values(S.blds)) { if (o.type !== type || o.hp <= 0) continue; const [ox, oy] = centre(o); if (Math.max(Math.abs(ox - x), Math.abs(oy - y)) <= r + (o.size - 1) / 2 + (b.size - 1) / 2) n++; }
  return n;
}

function handlePending() {
  if (!S.pending.length) return;
  const list = S.pending.splice(0);
  for (const p of list) {
    switch (p.type) {

      case 'itch': sfx('alarm'); toast(`Gerald has an itch near ${where(p.x, p.y)}. A Back Scratcher within 3 squares will handle it.`, 'warn'); break;
      case 'polite': floatAt(p.x, p.y, 'AHHH', '#6fe0a0'); sfx('polite'); break;

}

  const el = $('level'); el.classList.toggle('warn', mag > 0.45 && mag <= CAPSIZE); el.classList.toggle('bad', mag > CAPSIZE);
  $('lvDeg').textContent = (pred ? tiltDeg(pred) : tiltDeg(S.tilt)).toFixed(1) + '°';
  $('lvNote').textContent = pred ? `would lean: ${sideName(pred)}` : mag < 0.05 ? 'Level' : `low side: ${sideName(S.tilt)}`;
}

// ---------------------------------------------------------------------
// POINTER, CAMERA
// ---------------------------------------------------------------------
const PTR = new Map(); let DRAG = null, PINCH = null;
function evPos(e) { const r = V.cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

function clampPan() { const mx = V.W * 0.5 * V.zoom, my = V.H * 0.5 * V.zoom; V.px = clamp(V.px, -mx, mx); V.py = clamp(V.py, -my, my); if (V.zoom <= 1.001) { V.px = clamp(V.px, -V.W * 0.25, V.W * 0.25); V.py = clamp(V.py, -V.H * 0.25, V.H * 0.25); } }

  else if (PTR.size === 1) DRAG = { x0:x, y0:y, px:V.px, py:V.py, moved:false, type:e.pointerType, btn:e.button };
}
function onMove(e) {

  if (DRAG && PTR.has(e.pointerId)) {
    if (!DRAG.moved && Math.hypot(x - DRAG.x0, y - DRAG.y0) > (DRAG.type === 'mouse' ? 5 : 10)) DRAG.moved = true;
    if (DRAG.moved) { V.px = DRAG.px + x - DRAG.x0; V.py = DRAG.py + y - DRAG.y0; clampPan(); return; }
  }

}
function onUp(e) {
  const [x, y] = evPos(e); const had = PTR.has(e.pointerId); PTR.delete(e.pointerId);
  if (PINCH) { if (PTR.size < 2) { PINCH = null; DRAG = null; } return; }
  if (had && DRAG && !DRAG.moved && DRAG.btn === 0) tap(x, y, DRAG.type);
  DRAG = null;
}
function setHover(t) { const k = t ? t.x + ',' + t.y : ''; if (k !== (U.hover ? U.hover.x + ',' + U.hover.y : '')) { U.hover = t; U.ghostKey = ''; } }
function tap(px, py, type) {
  if (!S || !U.playing || U.modal) return;
  const t = screenToTile(px, py);
  if (U.tool) {
    if (!t) { U.pend = null; setHover(null); return; }
    if (type !== 'mouse') { if (!U.pend || U.pend.x !== t.x || U.pend.y !== t.y) { U.pend = t; setHover(t); sfx('click'); return; } }
    U.pend = null; setHover(t); tryPlace(t); return;
  }
  const b = t && bAt(t.x, t.y); U.sel = b ? b.id : null; if (b) sfx('click');
  if (type !== 'mouse') setHover(t);
}
function ghostFor(t) { if (!U.tool || !t) return null; const a = anchorOf(U.tool, t); return { id:0, type:U.tool, x:a.x, y:a.y, size:BLD[U.tool].size || 1, hp:100, wet:0, fill:0, target:0, working:true, staff:1 }; }
function ghostWhy(gh) { if (!S.unlocked[gh.type]) return 'You need the blueprint for that.'; const w = canPlace(gh.type, gh.x, gh.y); if (w) return w; if (S.clams < BLD[gh.type].cost) return `Costs ${BLD[gh.type].cost} Clams. You have ${fmt(S.clams)}.`; return ''; }
function tryPlace(t) {
  const gh = ghostFor(t); if (!gh) return;
  const err = place(gh.type, gh.x, gh.y);
  if (err) { toast(err, 'bad'); sfx('err'); return; }
  const id = S.nextId - 1; U.just = { id, at:performance.now() };
  const z = tileTopSafe(gh.x, gh.y); burst(gh.x + (gh.size - 1) / 2, gh.y + (gh.size - 1) / 2, z, 12, '#f3d98b'); floatAt(gh.x, gh.y, `−${BLD[gh.type].cost}`, '#f3d98b');
  sfx('build'); U.ghostKey = '';
  if (S.clams < BLD[gh.type].cost) { U.tool = null; toast('Out of Clams for another one of those.', 'warn'); }
}
function uiState() {
  const ui = { tool:U.tool, sel:U.sel, hover:U.hover, ghost:null, bad:false, predWet:null };
  if (U.tool && U.hover && U.playing && !U.modal) {
    const gh = ghostFor(U.hover); ui.ghost = gh; ui.hover = { x:gh.x, y:gh.y };
    const why = ghostWhy(gh); ui.bad = !!why;
    const key = `${gh.type}|${gh.x}|${gh.y}|${S.nextId}|${S.clams >= BLD[gh.type].cost}|${S.unlocked[gh.type]}|${Object.values(S.blds).filter(b => b.type === 'ballast').map(b => b.fill.toFixed(1)).join()}`;
    if (key !== U.ghostKey) {
      U.ghostKey = key;
      if (!why) {
        const T = ghostTilt(gh.type, gh.x, gh.y), before = calmWet(S.tiltT), after = calmWet(T, gh.type === 'seawall' ? gh : null);
        const fresh = [...after].filter(i => !before.has(i)), hit = new Set();
        for (const i of fresh) { const b = S.blds[S.tiles[i]]; if (b && b.type !== 'rubble') hit.add(b.id); }
        const drained = [...before].filter(i => !after.has(i)).length;
        U.pred = { T, fresh, hit:hit.size, drained, why:'' };

}
function tipText() {
  const tip = $('tip');
  if (U.tool && U.pred) {
    const d = BLD[U.tool];
    if (U.pred.why) { tip.textContent = U.pred.why; tip.className = 'tip bad'; tip.hidden = false; return; }
    const T = U.pred.T; let s = `${d.n}: ${d.cost} Clams. Shell would lean ${tiltDeg(T).toFixed(1)}° to the ${sideName(T)}.`;
    if (U.pred.fresh.length) s += ` ${U.pred.fresh.length} more square${U.pred.fresh.length > 1 ? 's' : ''} would flood${U.pred.hit ? ` (${U.pred.hit} building${U.pred.hit > 1 ? 's' : ''})` : ''}.`;
    else if (U.pred.drained) s += ` ${U.pred.drained} square${U.pred.drained > 1 ? 's' : ''} would dry out.`;
    if (U.pend) s += ' Tap again to build.';
    tip.textContent = s; tip.className = 'tip' + (Math.hypot(T.x, T.y) > 0.6 || U.pred.hit ? ' bad' : ''); tip.hidden = false; return;
  }
  if (!U.tool && U.hover && !U.modal) { const b = bAt(U.hover.x, U.hover.y); if (b) { tip.textContent = `${BLD[b.type].n}${b.wet > 0 ? ' (underwater)' : ''}`; tip.className = 'tip'; tip.hidden = false; return; } }
  tip.hidden = true;
}

// ---------------------------------------------------------------------
// LOOP
// ---------------------------------------------------------------------
function loop(ts) {
  const dt = Math.min(0.1, Math.max(0, (ts - U.last) / 1000 || 0)); U.last = ts;
  if (S && U.playing && !S.over) {
    const mult = U.modal && U.modal.pause ? 0 : SPEEDS[U.speed];
    if (S.phase === 'sail') { let left = dt * mult; while (left > 1e-6 && S.phase === 'sail') { const st = Math.min(0.1, left); tick(st); left -= st; } }
    else if (S.phase !== 'over') idle(dt);
    U.saveT += dt; if (U.saveT > 4) { U.saveT = 0; save(); }
  } else if (S && !U.playing) idle(dt);
  if (S && U.playing) handlePending();
  if (S) {
    fxStep(dt);
    const ui = uiState();
    try { drawWorld(ui); } catch (e) { console.error(e); }
    U.domT -= dt; if (U.domT <= 0) { U.domT = 0.2; if (U.playing) hud(); drawLevel(U.pred && U.pred.T); }
    tipText();
    const cw = $('capWarn'), mag = Math.hypot(S.tilt.x, S.tilt.y);
    if (S.cap > 0 && mag > CAPSIZE && !S.over) { cw.hidden = false; cw.textContent = `GERALD IS ROLLING OVER! ${Math.max(0, 15 - S.cap).toFixed(0)}s`; } else cw.hidden = true;
    V.cv.classList.toggle('placing', !!U.tool);
  }
  requestAnimationFrame(loop);
}

function start(data) {
  V.cv = $('cv'); V.g = V.cv.getContext('2d');
  try { U.sound = localStorage.getItem('geralds_back_sound') !== '0'; } catch (e) {}
  if (data && data.s && loadRaw(data.s)) { U.playing = !!data.playing; }
  else if (hasSave()) { let raw = null; try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {} if (!raw || !loadRaw(raw)) newGame(); }
  else newGame();
  viewResize();
  addEventListener('resize', viewResize);
  if (window.ResizeObserver) new ResizeObserver(() => viewResize()).observe($('stage'));
  V.cv.addEventListener('pointerdown', onDown);
  V.cv.addEventListener('pointermove', onMove);
  V.cv.addEventListener('pointerup', onUp);
  V.cv.addEventListener('pointercancel', e => { PTR.delete(e.pointerId); PINCH = null; DRAG = null; });
  V.cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setHover(null); });
  V.cv.addEventListener('contextmenu', e => { e.preventDefault(); if (U.tool) ACTS.cancel(); else U.sel = null; });
  V.cv.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = evPos(e); zoomAt(x, y, V.zoom * Math.exp(-e.deltaY * 0.0015)); }, { passive:false });
  for (const id of ['ovWrap', 'pal', 'insp', 'voy', 'zoom']) { const el = $(id); if (el) el.addEventListener('click', onAct); }

  $('bHelp').onclick = () => { audio(); if (!U.modal || U.modal.closable) helpModal(); };
  $('bMenu').onclick = () => { audio(); if (!U.playing) return; if (!U.modal) menuModal(); else if (U.modal.closable) closeModal(); };
  addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'Escape') { if (U.tool) { ACTS.cancel(); return; } if (U.modal && U.modal.closable) { const t = U.modal.kind === 'help' ? U.helpThen : null; closeModal(); if (t) t(); return; } if (U.sel) { U.sel = null; return; } if (!U.modal && U.playing) menuModal(); return; }
    if (U.modal) return;
    if (e.key === ' ') { e.preventDefault(); U.speed = U.speed === 0 ? (U.prevSpeed || 1) : (U.prevSpeed = U.speed, 0); }
    else if (e.key === '1' || e.key === '2' || e.key === '3') U.speed = +e.key;
    else if ((e.key === 'Delete' || e.key === 'Backspace') && U.sel) ACTS.demolish(U.sel);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && U.playing) save(); });
  buildPalette();
  if (U.playing) { hud(); resumePhase(); } else titleModal();

}
try { window.claude?.hot?.snapshot?.(() => ({ s:S && !S.over ? JSON.stringify(S) : null, playing:U.playing })); } catch (e) {}
(window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}));
</script>
