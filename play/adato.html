<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ADATO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ADATO — a cheerful corporate intranet that is slowly eating you.
   Single deliberate light look: fluorescent greige, corporate blue, highlighter yellow. */
:root {
  --bg:#e7e9e1; --paper:#fbfbf7; --paper2:#f2f3ee; --ink:#1c2230; --mute:#5f6779; --line:#d2d5cb;
  --brand:#2c4bd6; --brand-soft:#e4e9ff; --marker:#fff06b; --good:#1b8556; --bad:#c93b28; --warn:#a96f0c;
  --display:'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--body); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:12px; }
button, input { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
#app { height:100%; display:grid; grid-template-rows:auto auto minmax(0, 1fr); gap:10px; max-width:1500px; margin:0 auto; }

/* ---- header ---- */
.top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.brand { display:flex; align-items:baseline; gap:10px; margin-right:auto; }
.brand b { font:800 26px/1 var(--display); letter-spacing:-0.5px; color:var(--brand); }
.brand span { font-size:12px; color:var(--mute); letter-spacing:0.4px; text-transform:uppercase; }
.clock { display:flex; flex-direction:column; align-items:flex-end; }
.clock b { font:600 20px/1 var(--mono); font-variant-numeric:tabular-nums; }
.clock span { font-size:12px; color:var(--mute); }
.who { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.pill { background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12.5px; white-space:nowrap; }
.pill.title { background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:600; }
.pill.money { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.ghost { background:transparent; border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12.5px; color:var(--mute); }
.ghost:hover { border-color:var(--ink); color:var(--ink); }

/* ---- meters ---- */
.meters { display:flex; flex-wrap:wrap; gap:8px; }
.meter { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:6px 10px; min-width:0; flex:1 1 120px; }
.meter .k { font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--mute); display:flex; justify-content:space-between; gap:6px; }
.meter .v { font:600 15px/1.2 var(--mono); font-variant-numeric:tabular-nums; }
.meter .v small { color:var(--mute); font-weight:400; font-size:12px; }
.bar { height:6px; background:var(--paper2); border-radius:3px; overflow:hidden; margin-top:4px; }
.bar i { display:block; height:100%; background:var(--brand); border-radius:3px; transition:width .35s; }
.bar.good i { background:var(--good); } .bar.bad i { background:var(--bad); } .bar.warn i { background:var(--warn); }
.meter.ok { border-color:#9bd3b7; }
.meter.skills { flex:2 1 220px; }
.skills .row3 { display:flex; gap:12px; }
.skills .row3 div { flex:1; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }
.chip { font-size:11.5px; padding:1px 7px; border-radius:999px; background:var(--brand-soft); color:var(--brand); font-weight:600; }

/* ---- main grid ---- */
main.grid { display:grid; grid-template-columns:minmax(0, 1.3fr) minmax(340px, 1fr); gap:12px; min-height:0; }
.mapcol { display:grid; grid-template-rows:auto minmax(0, 1fr); gap:10px; min-height:0; }
.mapbox { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:6px; }
.mapbox canvas { display:block; width:100%; height:auto; aspect-ratio:760 / 480; max-width:100%; border-radius:8px; }
.feed { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 12px; overflow:auto; min-height:120px; }
.feed h4, .pane-h { margin:0 0 6px; font:700 12px/1.2 var(--body); text-transform:uppercase; letter-spacing:0.8px; color:var(--mute); }
.entry { padding:7px 0; border-bottom:1px dashed var(--line); }
.entry:last-child { border-bottom:0; }
.entry .ts { font:500 11px var(--mono); color:var(--mute); margin-right:6px; }
.entry.first { animation:pop .45s ease-out; }
.entry.k-bingo .txt { font-weight:700; }
.entry.k-good .txt { color:#14563a; } .entry.k-bad .txt { color:#7a2214; }
@keyframes pop { from { background:var(--brand-soft); } to { background:transparent; } }
.deltas { display:inline-flex; gap:4px; flex-wrap:wrap; margin-left:4px; vertical-align:1px; }
.d { font:600 11px/1.6 var(--mono); padding:0 6px; border-radius:999px; background:#e3f3ea; color:var(--good); white-space:nowrap; }
.d.neg { background:#fbe6e2; color:var(--bad); }

.side { display:flex; flex-direction:column; min-height:0; background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.tabs { display:flex; overflow-x:auto; border-bottom:1px solid var(--line); background:var(--paper2); scrollbar-width:none; }
.tabs button { border:0; background:transparent; padding:10px 12px; font-size:13px; font-weight:600; color:var(--mute); border-bottom:2px solid transparent; white-space:nowrap; }
.tabs button.on { color:var(--ink); border-bottom-color:var(--brand); background:var(--paper); }
.tabs .badge { display:inline-block; min-width:17px; padding:0 5px; margin-left:5px; border-radius:999px; background:var(--bad); color:#fff; font-size:11px; line-height:17px; text-align:center; }
.tabs .badge.blue { background:var(--brand); }
#pane { padding:12px; overflow:auto; min-height:0; flex:1; }

/* ---- room pane ---- */
.room-h { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.room-h h2 { margin:0; font:700 21px/1.1 var(--display); text-wrap:balance; }
.room-h span { color:var(--mute); font-size:12.5px; }
.people { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 10px; }
.person { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:3px 4px 3px 4px; font-size:12.5px; }
.person i { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; color:#fff; font:700 9px var(--body); font-style:normal; }
.person button { border:0; background:var(--brand-soft); color:var(--brand); border-radius:999px; padding:2px 8px; font-size:12px; font-weight:600; }
.person button[disabled] { background:var(--paper2); color:var(--mute); cursor:default; }
.result { background:var(--brand-soft); border-radius:10px; padding:9px 11px; margin-bottom:10px; font-size:13.5px; }
.acts { display:grid; gap:7px; }
.act { display:grid; grid-template-columns:auto minmax(0, 1fr) auto; gap:4px 10px; align-items:start; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
.act:hover:not([disabled]) { border-color:var(--brand); box-shadow:0 1px 0 var(--brand); }
.act[disabled] { opacity:0.55; cursor:not-allowed; }
.act .n { font-weight:650; }
.act .desc { grid-column:2 / 4; font-size:12.5px; color:var(--mute); }
.act .meta { font:500 11.5px/1.5 var(--mono); color:var(--mute); text-align:right; white-space:nowrap; }
.act .why { grid-column:2 / 4; font-size:12px; color:var(--bad); font-weight:600; }
.act .key { font:600 11px/18px var(--mono); width:18px; height:18px; text-align:center; border-radius:5px; background:var(--paper2); color:var(--mute); margin-top:1px; }
.goto { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:6px; margin-top:6px; }
.goto button { text-align:left; background:var(--paper2); border:1px solid transparent; border-radius:8px; padding:6px 9px; font-size:12.5px; }
.goto button:hover:not([disabled]) { border-color:var(--brand); }
.goto button[disabled] { opacity:0.5; cursor:not-allowed; }
.goto button small { display:block; color:var(--mute); font-family:var(--mono); font-size:11px; }
.sec { margin:16px 0 8px; font:700 12px/1.2 var(--body); text-transform:uppercase; letter-spacing:0.8px; color:var(--mute); }
.shop { display:grid; gap:7px; }
.item { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:2px 10px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
.item .n { font-weight:650; }
.item .desc { font-size:12.5px; color:var(--mute); grid-column:1; }
.item .own { font:600 12px var(--mono); color:var(--brand); }
.btn { border:1px solid var(--brand); background:var(--brand); color:#fff; border-radius:8px; padding:6px 11px; font-weight:600; font-size:13px; white-space:nowrap; }
.btn.alt { background:var(--paper); color:var(--brand); }
.btn[disabled] { opacity:0.45; cursor:not-allowed; }
.btn.big { padding:10px 18px; font-size:15px; }
.note { font-size:12.5px; color:var(--mute); }

/* ---- career / bingo / decoder ---- */
.req { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:2px 10px; padding:7px 0; border-bottom:1px dashed var(--line); }
.req .v { font:600 13px var(--mono); font-variant-numeric:tabular-nums; }
.req .bar { grid-column:1 / 3; }
.req.ok .v { color:var(--good); }
.callout { border-radius:10px; padding:10px 12px; margin:10px 0; font-size:13.5px; background:var(--paper2); }
.callout.go { background:#e3f3ea; color:#14563a; font-weight:600; }
.callout.warn { background:#fdf0d8; color:#6e4806; }
.callout.bad { background:#fbe6e2; color:#7a2214; }
.stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:6px; }
.stats div { background:var(--paper2); border-radius:8px; padding:6px 9px; font-size:12px; color:var(--mute); }
.stats b { display:block; color:var(--ink); font:600 15px var(--mono); }
.achs { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:6px; }
.ach { border:1px dashed var(--line); border-radius:8px; padding:6px 9px; font-size:12px; color:var(--mute); }
.ach.got { border-style:solid; border-color:#9bd3b7; background:#eef8f2; color:var(--ink); }
.ach b { display:block; font-size:12.5px; }
.bingo { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:4px; }
.bingo div { aspect-ratio:1; max-width:100%; border:1px solid var(--line); border-radius:6px; display:grid; place-items:center; text-align:center; font-size:11px; line-height:1.15; padding:3px; overflow-wrap:anywhere; background:var(--paper); position:relative; }
.bingo div.on { background:var(--marker); border-color:#e2d24a; font-weight:700; }
.bingo div.on::after { content:''; position:absolute; inset:18%; border:3px solid rgba(201,59,40,0.55); border-radius:50%; transform:rotate(-8deg); }
.bingo div.free { background:var(--brand); color:#fff; font-weight:700; }
.dec-search { width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); margin:4px 0 10px; }
.dec { display:grid; gap:4px; }
.dec div { padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px; }
.dec b { font-weight:650; }
.dec .unk { color:var(--mute); letter-spacing:1px; }
.mail { display:grid; gap:6px; }
.mail button { text-align:left; display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:1px 8px; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
.mail button.unread { border-left:4px solid var(--brand); }
.mail button .f { font-weight:650; font-size:13px; }
.mail button .t { font:500 11px var(--mono); color:var(--mute); }
.mail button .s { grid-column:1 / 3; font-size:13px; color:var(--ink); }
.empty { color:var(--mute); font-size:13px; padding:20px 4px; text-align:center; }

/* ---- jargon ---- */
mark.jg { background:linear-gradient(transparent 12%, var(--marker) 12%, var(--marker) 88%, transparent 88%); color:inherit; padding:0 1px; border-radius:2px; cursor:help; }
mark.jg:focus-visible { outline:2px solid var(--ink); }
#jtip { position:fixed; z-index:60; max-width:270px; background:var(--ink); color:var(--paper); border-radius:9px; padding:8px 11px; font-size:13px; pointer-events:none; box-shadow:0 8px 24px rgba(20,24,32,.25); }
#jtip b { display:block; font:700 11px/1.4 var(--body); letter-spacing:0.8px; text-transform:uppercase; color:var(--marker); }

/* ---- modal ---- */
.ov { position:fixed; inset:0; z-index:40; background:rgba(28,34,48,.5); display:grid; place-items:center; padding:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.modal { width:100%; max-width:580px; max-height:calc(100% - 8px); overflow:auto; background:var(--paper); border-radius:14px; padding:20px 22px; box-shadow:0 20px 60px rgba(20,24,32,.35); animation:rise .25s ease-out; }
@keyframes rise { from { transform:translateY(10px); opacity:0; } to { transform:none; opacity:1; } }
.modal h2 { margin:0 0 4px; font:800 26px/1.1 var(--display); text-wrap:balance; }
.modal h3 { margin:14px 0 6px; font:700 13px/1.2 var(--body); text-transform:uppercase; letter-spacing:0.8px; color:var(--mute); }
.modal p { margin:8px 0; }
.modal .kicker { font:700 12px/1.2 var(--body); letter-spacing:1px; text-transform:uppercase; color:var(--brand); }
.modal .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.mhead { border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:10px; font-size:13px; }
.mhead div { display:grid; grid-template-columns:62px minmax(0, 1fr); }
.mhead span { color:var(--mute); }
.mhead .subj { font:700 17px/1.3 var(--body); margin-top:4px; display:block; }
.choice { display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--paper); border-radius:10px; padding:9px 12px; margin-top:7px; }
.choice:hover:not([disabled]) { border-color:var(--brand); }
.choice[disabled] { opacity:0.5; cursor:not-allowed; }
.choice small { display:block; font:500 11.5px var(--mono); color:var(--mute); margin-top:2px; }
.li { padding:5px 0 5px 14px; position:relative; }
.li::before { content:''; position:absolute; left:0; top:12px; width:6px; height:6px; border-radius:50%; background:var(--line); }
.li.good::before { background:var(--good); } .li.bad::before { background:var(--bad); }
.rating { font:800 18px/1.2 var(--display); margin:4px 0; }
.rating.exceeds { color:var(--good); } .rating.meets { color:var(--brand); } .rating.below { color:var(--bad); }
.post { border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:10px; background:var(--paper2); }
.post .ph { display:flex; gap:10px; align-items:center; margin-bottom:6px; }
.post .av { width:36px; height:36px; border-radius:50%; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; }
.post .meta { font-size:12px; color:var(--mute); margin-top:8px; }
.title-hero { font:800 clamp(40px, 9vw, 64px)/0.95 var(--display); color:var(--brand); letter-spacing:-1.5px; margin:0; }
.title-sub { font:600 15px var(--body); color:var(--mute); letter-spacing:0.4px; margin:6px 0 12px; }
.field { margin-top:4px; width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--paper); font-size:15px; }
.bgs { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px; margin-top:8px; }
.bgs button { text-align:left; border:1.5px solid var(--line); background:var(--paper); border-radius:10px; padding:9px 11px; }
.bgs button.on { border-color:var(--brand); background:var(--brand-soft); }
.bgs b { display:block; }
.bgs span { font-size:12.5px; color:var(--mute); }

/* ---- toasts ---- */
#toasts { position:fixed; z-index:50; right:max(16px, env(safe-area-inset-right, 0px)); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); display:grid; gap:6px; justify-items:end; pointer-events:none; }
.toast { background:var(--ink); color:var(--paper); border-radius:10px; padding:8px 12px; font-size:13px; max-width:320px; box-shadow:0 8px 24px rgba(20,24,32,.25); animation:rise .25s ease-out; }
.toast b { color:var(--marker); }
.toast mark.jg { color:var(--ink); }

@media (max-width:980px) {
  #app { height:auto; grid-template-rows:auto; }
  main.grid { grid-template-columns:minmax(0, 1fr); }
  .mapcol { display:contents; }
  .mapbox { order:1; } .side { order:2; } .feed { order:3; max-height:320px; }
  .side { overflow:visible; }
  #pane { overflow:visible; }
  .clock { align-items:flex-start; }
}
@media (max-width:520px) {
  .brand span { display:none; }
  .meter { flex-basis:46%; }
  .meter.skills { flex-basis:100%; }
  .act .meta { grid-column:2 / 4; text-align:left; }
}
@media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
<div id="app">
  <header class="top">
    <div class="brand"><b>ADATO</b><span>A Day At The Office</span></div>
    <div class="who"><span class="pill title" id="hTitle">Unpaid Intern</span><span class="pill money" id="hCash">$20</span><span class="pill money" id="hBudget" hidden>Budget $0</span></div>
    <div class="clock"><b id="hClock">9:00 AM</b><span id="hDay">Monday · Week 1</span></div>
    <button class="ghost" id="bSound" type="button">Sound: on</button>
    <button class="ghost" id="bMenu" type="button">Menu</button>
  </header>
  <section class="meters" id="meters" aria-label="Your stats"></section>
  <main class="grid">
    <div class="mapcol">
      <div class="mapbox"><canvas id="map" aria-label="Office floor plan. Click a room to walk there."></canvas></div>
      <section class="feed" id="feed" aria-live="polite"></section>
    </div>
    <aside class="side">
      <nav class="tabs" id="tabs" aria-label="Panels"></nav>
      <div id="pane"></div>
    </aside>
  </main>
</div>
<div id="ovWrap"></div>
<div id="toasts" aria-live="polite"></div>
<div id="jtip" hidden></div>
<script>
"use strict";
// =====================================================================
// ADATO — CONTENT
// Every phrase in JARGON is detected in spoken text (results, emails,
// chats), highlighted, decoded on hover, and stamped on the bingo card.
// [canonical phrase, satirical translation, optional regex source]
// =====================================================================
const JARGON = [
  ['circle back', 'We will never speak of this again.', 'circl(?:e|ed|ing) back'],
  ['touch base', 'Interrupt someone to confirm nothing has changed.', 'touch(?:ing|ed)? base'],
  ['synergy', 'Two departments doing one job, worse.', 'synerg(?:y|ies|ize|izing|istic)'],
  ['leverage', 'Use, but with more syllables.', 'leverag(?:e|ed|ing)'],
  ['move the needle', 'Make a number on a slide go up.', 'mov(?:e|ed|ing) the needle'],
  ['low-hanging fruit', 'Work someone else already did.'],
  ['deep dive', 'A meeting about a meeting.', 'deep[- ]dives?'],
  ['take it offline', 'Stop talking in front of my boss.', 'tak(?:e|ing) (?:it|this) offline'],
  ['bandwidth', 'Willingness, disguised as capacity.'],
  ['paradigm shift', 'The same thing, in a new font.'],
  ['value add', 'The part we bill extra for.', 'value[- ]adds?'],
  ['pivot', 'We were wrong, but faster.', 'pivot(?:ed|ing|s)?'],
  ['run it up the flagpole', 'Ask someone more senior to say no.', '(?:run|ran|running) it up the flagpole'],
  ['parking lot', 'Where good ideas go to die.'],
  ['win-win', 'I win twice.', 'win[- ]win'],
  ['thought leadership', 'Opinions with a headshot.'],
  ['disrupt', 'Break something that worked.', 'disrupt(?:ed|ing|ive|ion)?'],
  ['ideate', 'Think, but billable.', 'ideat(?:e|ed|ing|ion)'],
  ['north star', 'A metric nobody can name.'],
  ['core competency', 'The one thing we haven\'t outsourced yet.', 'core competenc(?:y|ies)'],
  ['best practice', 'What a consultant did once, in 2009.', 'best practices?'],
  ['action item', 'A task assigned to whoever left the call first.', 'action items?'],
  ['deliverable', 'Anything with a logo on it.', 'deliverables?'],
  ['stakeholder', 'Someone who can say no but never says yes.', 'stakeholders?'],
  ['alignment', 'Everyone agreeing to do nothing.', 'align(?:ment|ed)'],
  ['holistic', 'We didn\'t read any of it, all at once.', 'holistic(?:ally)?'],
  ['scalable', 'Works until a second person uses it.', 'scal(?:able|e it)'],
  ['game changer', 'Slightly different.', 'game[- ]changers?'],
  ['blue-sky thinking', 'Ideas with no budget.', 'blue[- ]sky(?: thinking)?'],
  ['think outside the box', 'Do my job for me.', '(?:think(?:ing)? )?outside the box'],

const ROOMS = {

  boss:     { x:220, y:16,  w:150, h:120, floor:'#eee6da', doors:[[295, 136, 'top']] },

  team:     { x:268, y:176, w:244, h:144, floor:'#e5eaec', doors:[[390, 176, 'bot'], [390, 320, 'top']] },
  it:       { x:520, y:176, w:120, h:144, floor:'#e2e4e9', doors:[[580, 176, 'bot'], [580, 320, 'top']] },
  roof:     { x:648, y:176, w:96,  h:144, floor:'#dcd8cf', doors:[[696, 176, 'bot']] },
  break:    { x:16,  y:360, w:210, h:104, floor:'#f1e8d8', doors:[[121, 360, 'bot']] },
  wellness: { x:234, y:360, w:170, h:104, floor:'#e5efe8', doors:[[319, 360, 'bot']] },
  lobby:    { x:412, y:360, w:332, h:104, floor:'#ebeae5', doors:[[578, 360, 'bot']] },
};
// where people stand inside each room
const SPOTS = {
  conf:[[114, 80]], boss:[[262, 92]], hr:[[440, 92]], exec:[[600, 96]], desk:[[66, 236]], team:[[390, 250]], it:[[560, 270]],
  roof:[[696, 260]], break:[[121, 420]], wellness:[[300, 420]], lobby:[[560, 420]],
};
const TOP_Y = 156, BOT_Y = 340, HALL_X = 252;

// --- route graph -------------------------------------------------------
const GRAPH = (() => {
  const nodes = [], edges = [];
  const add = (x, y, tag) => { nodes.push({ x, y, tag }); return nodes.length - 1; };
  const link = (a, b) => { const d = Math.hypot(nodes[a].x - nodes[b].x, nodes[a].y - nodes[b].y); edges.push([a, b, d]); };
  const top = [], bot = [];
  const center = {};
  for (const [id, r] of Object.entries(ROOMS)) {
    const [sx, sy] = SPOTS[id][0]; center[id] = add(sx, sy, id);
    for (const [dx, dy] of r.doors) {
      const d = add(dx, dy, 'door'); link(center[id], d);
      const cy = dy <= TOP_Y + 20 && dy >= TOP_Y - 20 ? TOP_Y : (Math.abs(dy - TOP_Y) < Math.abs(dy - BOT_Y) ? TOP_Y : BOT_Y);
      const c = add(dx, cy, 'hall'); link(d, c); (cy === TOP_Y ? top : bot).push(c);
    }
  }
  top.push(add(HALL_X, TOP_Y, 'hall')); bot.push(add(HALL_X, BOT_Y, 'hall'));
  link(top[top.length - 1], bot[bot.length - 1]);
  for (const line of [top, bot]) { line.sort((a, b) => nodes[a].x - nodes[b].x); for (let i = 1; i < line.length; i++) link(line[i - 1], line[i]); }
  const adj = nodes.map(() => []);
  for (const [a, b, d] of edges) { adj[a].push([b, d]); adj[b].push([a, d]); }
  return { nodes, adj, center };
})();
function routeBetween(a, b) {
  if (a === b) return { pts:[], len:0 };
  const { nodes, adj, center } = GRAPH, s = center[a], t = center[b];
  const dist = nodes.map(() => Infinity), prev = nodes.map(() => -1), done = nodes.map(() => false);
  dist[s] = 0;
  for (;;) {
    let u = -1, best = Infinity; for (let i = 0; i < nodes.length; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
    if (u < 0 || u === t) break; done[u] = true;
    for (const [v, d] of adj[u]) if (dist[u] + d < dist[v]) { dist[v] = dist[u] + d; prev[v] = u; }
  }
  const pts = []; for (let u = t; u >= 0; u = prev[u]) pts.unshift([nodes[u].x, nodes[u].y]);
  return { pts, len:dist[t] };
}
const walkMinutes = (a, b) => a === b ? 0 : Math.max(2, Math.round(routeBetween(a, b).len / 60));
function roomAtPoint(x, y) { for (const [id, r] of Object.entries(ROOMS)) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return id; return null; }

// --- drawing -----------------------------------------------------------
const MAP = {
  cv:null, g:null, dpr:1, scale:1, hover:null, player:{ x:560, y:420, path:[], cb:null }, npcs:[], t:0,
  isLocked:() => false, onClick:null, teamView:null, bossId:'todd', youLoc:'lobby',
};
function mapInit(cv) {
  MAP.cv = cv; MAP.g = cv.getContext('2d');
  // CSS sizes the canvas (width 100%, fixed aspect ratio); we only size the pixel buffer
  const resize = () => {
    const w = Math.max(100, cv.getBoundingClientRect().width);
    MAP.dpr = Math.min(2.5, window.devicePixelRatio || 1); MAP.scale = w / MW;
    const bw = Math.round(w * MAP.dpr), bh = Math.round(w * MH / MW * MAP.dpr);
    if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  };
  resize(); addEventListener('resize', resize); if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  const toL = e => { const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) / r.width * MW, y:(e.clientY - r.top) / r.height * MH }; };
  cv.addEventListener('mousemove', e => { const p = toL(e); MAP.hover = roomAtPoint(p.x, p.y); cv.style.cursor = MAP.hover && !MAP.isLocked(MAP.hover) ? 'pointer' : 'default'; MAP.mx = p.x; MAP.my = p.y; });
  cv.addEventListener('mouseleave', () => { MAP.hover = null; });
  cv.addEventListener('click', e => { const p = toL(e); const id = roomAtPoint(p.x, p.y); if (id && MAP.onClick) MAP.onClick(id); });
  // wanderers
  MAP.npcs = WANDERERS.map((id, i) => { const home = PEOPLE[id].home; const [x, y] = spotFor(home, i); return { id, x, y, room:home, path:[], wait:1 + Math.random() * 6, dest:home }; });
  let last = performance.now();
  const loop = now => { requestAnimationFrame(loop); const dt = Math.min(0.05, (now - last) / 1000); last = now; MAP.t += dt; stepWalkers(dt); try { drawMap(); } catch (err) { console.error(err); } };
  requestAnimationFrame(loop);
}
function spotFor(room, k) { const [x, y] = SPOTS[room][0]; const a = (k * 2.399) % (Math.PI * 2); const r = 10 + (k % 3) * 9; return [x + Math.cos(a) * r, y + Math.sin(a) * r * 0.6]; }
function stepWalkers(dt) {
  const pl = MAP.player;
  if (pl.path.length) {
    let move = 540 * dt;
    while (move > 0 && pl.path.length) { const [tx, ty] = pl.path[0], d = Math.hypot(tx - pl.x, ty - pl.y); if (d <= move) { pl.x = tx; pl.y = ty; pl.path.shift(); move -= d; } else { pl.x += (tx - pl.x) / d * move; pl.y += (ty - pl.y) / d * move; move = 0; } }
    if (!pl.path.length && pl.cb) { const cb = pl.cb; pl.cb = null; cb(); }
  }
  MAP.npcs.forEach((n, i) => {
    if (n.path.length) {
      let move = 34 * dt;
      while (move > 0 && n.path.length) { const [tx, ty] = n.path[0], d = Math.hypot(tx - n.x, ty - n.y); if (d <= move) { n.x = tx; n.y = ty; n.path.shift(); move -= d; } else { n.x += (tx - n.x) / d * move; n.y += (ty - n.y) / d * move; move = 0; } }
      if (!n.path.length) { n.room = n.dest; n.wait = 6 + Math.random() * 14; }
      return;
    }
    n.wait -= dt;
    if (n.wait <= 0) {
      const opts = ['desk', 'break', 'conf', 'lobby', 'wellness', 'hr', 'it', 'team'].filter(r => r !== n.room && !MAP.isLocked(r));
      const dest = Math.random() < 0.35 ? PEOPLE[n.id].home : opts[Math.floor(Math.random() * opts.length)];
      if (dest === n.room) { n.wait = 4 + Math.random() * 6; return; }
      const r = routeBetween(n.room, dest); const end = spotFor(dest, i + 1);
      n.path = r.pts.slice(1, -1).concat([end]); n.dest = dest; n.room = null;
    }
  });
}
function mapWalk(from, to, cb) {
  const r = routeBetween(from, to), pl = MAP.player;
  if (!r.pts.length) { cb && cb(); return; }
  pl.path = r.pts.slice(1); pl.cb = cb;
}
function mapPlace(loc) { const [x, y] = SPOTS[loc][0]; MAP.player.x = x; MAP.player.y = y + 6; MAP.player.path = []; }

const J = (() => {
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  const sorted = items.slice().sort((a, b) => b.src.length - a.src.length);
  const all = new RegExp('\\b(?:' + sorted.map(x => x.src).join('|') + ')\\b', 'gi');
  const which = str => { for (const it of sorted) if (it.test.test(str)) return it.i; return -1; };
  return { items, all, which };
})();

  S.log.slice(0, 40).forEach((e, i) => { h += `<div class="entry k-${e.kind}${i === 0 && top !== FEED_TOP ? ' first' : ''}"><span class="ts">${WEEKDAYS[(e.day - 1) % 5].slice(0, 3)} ${clock(e.min)}</span><span class="txt">${jz(e.text)}</span>${deltaHtml(e.deltas)}</div>`; });
  FEED_TOP = top; $('feed').innerHTML = h;
}
let PEOPLE_SIG = '';
function renderAll() { syncMap(); renderHud(); renderMeters(); renderTabs(); renderPane(); renderFeed(); PEOPLE_SIG = peopleAt(S.loc).join(); }
setInterval(() => { if (!S || TAB !== 'here') return; const sig = peopleAt(S.loc).join(); if (sig !== PEOPLE_SIG) { PEOPLE_SIG = sig; const el = document.querySelector('#pane .people'); if (el) el.outerHTML = peopleHtml(); } }, 1000);

// ---------------------------------------------------------------------
// FLOW
// ---------------------------------------------------------------------
function toast(html, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; $('toasts').appendChild(t); setTimeout(() => t.remove(), ms); while ($('toasts').children.length > 4) $('toasts').firstChild.remove(); }
function flush() {
  const jar = [];
  for (const p of S.pending) {
    if (p.type === 'jargon') jar.push(p.i);
    else if (p.type === 'bingo') { sfx('bingo'); toast('<b>BINGO!</b> Line complete: +6 Visibility, +6 Morale'); }
    else if (p.type === 'ach') { const a = ACHIEVEMENTS.find(x => x.id === p.id); toast(`Achievement: <b>${esc(a.n)}</b><br>${esc(a.d)}`, 3400); }
    else if (p.type === 'mail') { const e = emailById(p.id); sfx('mail'); toast(`New email from ${esc(fromName(e))}<br>${jz(fill(e.subj))}`, 3200); }
    else if (p.type === 'burnout') { sfx('bad'); toast('<b>Burnout.</b> Mandatory wellness journey: you lose time and visibility.', 4200); }
    else MQ.push(p);
  }
  S.pending = [];
  if (jar.length) toast(jar.length === 1 ? `Decoded: <b>${esc(JARGON[jar[0]][0])}</b>` : `Decoded <b>${jar.length}</b> new phrases`, 2000);
  const pri = { eod:0, promo:1, end:2 }; MQ.sort((a, b) => pri[a.type] - pri[b.type]);
  if (!MODAL) nextModal();
}
function nextModal() {
  const p = MQ.shift(); if (!p) return;
  if (p.type === 'eod') eodModal(p.sum); else if (p.type === 'promo') promoModal(p.rank); else if (p.type === 'end') endModal(p.id);
}
function act(id) {
  if (BUSY || MODAL) return; audio();
  if (id === 'quit') { const h = `<div class="kicker">Roof Access</div><h2>Quit to start a podcast?</h2><p>${jz("This ends your career at SynergyCorp. There is no circling back.")}</p><div class="row"><button type="button" class="btn alt" id="qNo">Stay. It is what it is.</button><button type="button" class="btn" id="qYes" style="background:var(--bad);border-color:var(--bad)">Quit and record episode 1</button></div>`; openModal(h); $('qNo').onclick = () => closeModal(); $('qYes').onclick = () => { closeModal(true); doAction('quit'); flush(); renderAll(); }; return; } const ok = doAction(id); if (!ok) { sfx('bad'); return; } sfx('click'); LAST = { loc:S.loc, day:S.day, e:S.log[0] }; if (S.loc === 'lobby') mapPlace(S.loc); flush(); renderAll(); }
function goTo(id) {
  if (BUSY || MODAL || !S || S.over) return; audio();
  if (id === S.loc) { TAB = 'here'; renderAll(); return; }
  if (LOCS[id].minRank && S.rank < LOCS[id].minRank) { sfx('bad'); toast(`${esc(LOCS[id].n)} is locked until ${esc(RANKS[LOCS[id].minRank].t)}.`); return; }
  BUSY = true; sfx('walk'); const from = S.loc;
  mapWalk(from, id, () => { travel(id); BUSY = false; LAST = null; TAB = TAB === 'team' && id === 'team' ? 'team' : 'here'; flush(); renderAll(); });
}
function chat(pid) { if (BUSY || MODAL) return; if (chatWith(pid)) { sfx('click'); LAST = { loc:S.loc, day:S.day, e:S.log[0] }; flush(); renderAll(); } }

// ---------------------------------------------------------------------
// MODALS
// ---------------------------------------------------------------------
function openModal(html, closable = true) {
  closeModal(true);
  const ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  $('ovWrap').appendChild(ov); MODAL = { ov, closable };
  if (closable) ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  const f = ov.querySelector('button, input'); if (f) setTimeout(() => f.focus(), 30);
  return ov.firstChild;
}
function closeModal(silent) { if (!MODAL) return; MODAL.ov.remove(); MODAL = null; hideTip(); if (!silent) { renderAll(); nextModal(); } }
function mailModal(k) {
  const m = S.inbox[k]; if (!m) return;
  const e = openMail(k); flush(); renderAll();
  const p = PEOPLE[e.from === 'boss' ? bossId() : e.from];
  let h = `<div class="kicker">Inbox</div><div class="mhead"><div><span>From</span><b>${esc(fromName(e))}${p ? ` <span style="font-weight:400;color:var(--mute)">· ${esc(p.role)}</span>` : ''}</b></div><div><span>Sent</span><span style="color:var(--ink)">${WEEKDAYS[weekday()]} ${clock(m.min)}</span></div><span class="subj">${jz(fill(e.subj))}</span></div>`;
  h += paras(fill(e.body));
  e.choices.forEach((c, ci) => {
    const why = choiceBlocked(c), meta = [];
    if (c.mins) meta.push(c.mins + ' min');
    if (c.fx && typeof c.fx.budget === 'string') meta.push(fmtMoney(-amount('budget', c.fx.budget)) + ' budget');
    if (c.fx && c.fx.bw < 0) meta.push(c.fx.bw + ' BW');
    if (c.chance) meta.push('Risky');
    if (why) meta.push(why);
    h += `<button type="button" class="choice" data-ci="${ci}"${why ? ' disabled' : ''}>${jz(fill(c.label))}${meta.length ? `<small>${esc(meta.join(' · '))}</small>` : ''}</button>`;
  });
  const box = openModal(h);
  box.querySelectorAll('[data-ci]').forEach(b => b.onclick = () => {
    const before = S.log[0]; answerMail(k, +b.dataset.ci); const res = S.log[0] !== before ? S.log[0] : null;
    sfx('click'); flush();
    box.innerHTML = `<div class="kicker">Reply sent</div><h2 style="font-size:20px">${jz(fill(e.subj))}</h2>${res ? `<p>${jz(res.text)}</p><p>${deltaHtml(res.deltas)}</p>` : ''}<div class="row"><button type="button" class="btn big" id="mOk">Back to work</button></div>`;
    $('mOk').onclick = () => closeModal(); $('mOk').focus(); renderAll();
  });
}
function eodModal(sum) {
  const nextDay = S.over ? null : WEEKDAYS[weekday()];
  let h = `<div class="kicker">End-of-day report</div><h2>${sum.weekday}, Week ${sum.week}: wrap-up</h2>`;
  h += sum.lines.map(([t, c]) => `<div class="li ${c}">${jz(t)}</div>`).join('');
  if (sum.review) {
    const r = sum.review;
    h += `<h3>Quarterly Performance Review</h3><div class="rating ${r.rating}">${r.rating === 'exceeds' ? 'Exceeds Expectations' : r.rating === 'meets' ? 'Meets Expectations' : 'Needs Improvement'}</div>`;
    h += `<p class="note">Impact this quarter: ${fmtNum(r.impact)} of ${fmtNum(r.quota)} target (${Math.round(r.ratio * 100)}%).</p><p>${jz(r.text)}</p>` + r.lines.map(l => `<div class="li">${jz(l)}</div>`).join('');
  }
  h += `<div class="row"><button type="button" class="btn big" id="mOk">${nextDay ? 'Start ' + nextDay : 'Continue'}</button></div>`;
  const box = openModal(h, false);
  if (sum.review) sfx(sum.review.rating === 'below' ? 'bad' : 'good'); else sfx('cash');
  $('mOk').onclick = () => { mapPlace(S.loc); LAST = null; TAB = 'here'; closeModal(); };
}
function promoModal(rk) {
  sfx('promo');
  const R2 = RANKS[rk], post = fill(pickOne(LINKEDIN_POSTS)).replace(/\{TITLE\}/g, R2.t);
  let h = `<div class="kicker">Promotion</div><h2>You're now ${/^[AEIOU]/i.test(R2.t) ? 'an' : 'a'} ${esc(R2.t)}</h2><p>${jz(S.log[0] ? S.log[0].text : '')}</p>`;
  h += `<div class="post"><div class="ph"><div class="av">${esc(S.name[0] || 'Y')}</div><div><b>${esc(S.name)}</b><div class="note">${esc(R2.t)} at SynergyCorp · 1m</div></div></div>${jz(post)}<div class="meta">${(Math.floor(Math.random() * 900) + 120).toLocaleString('en-US')} reactions · ${Math.floor(Math.random() * 90) + 12} comments · "Congrats!! Let's connect"</div></div>`;
  h += `<h3>What changes</h3><div class="li good">Salary: ${fmtMoney(R2.pay)} per day.</div>`;
  if (R2.budget) h += `<div class="li good">Department budget: ${fmtMoney(R2.budget)} per day. Headcount: ${R2.hc}.</div>`;
  if (UNLOCKS[rk]) h += `<div class="li good">${jz(UNLOCKS[rk])}</div>`;
  if (R2.need) h += `<div class="li">Your Impact resets for the new role, and your visibility halves: new level, new peers.</div>`;
  h += `<div class="row"><button type="button" class="btn big" id="mOk">I'm humbled</button></div>`;
  openModal(h, false); $('mOk').onclick = () => closeModal();
}
function endModal(id) {
  const E = ENDINGS[id], st = S.stats; sfx(id === 'ceo' ? 'promo' : 'bad'); wipeSave();
  let h = `<div class="kicker">${id === 'ceo' ? 'You win' : 'Career over'}</div><h2>${esc(E.title)}</h2><p class="note">${esc(E.sub)}</p><p>${jz(E.text)}</p>`;
  h += `<div class="stats"><div>Days at SynergyCorp<b>${S.day}</b></div><div>Final title<b style="font-size:13px">${esc(rank().t)}</b></div><div>Lifetime impact<b>${fmtNum(S.impactLife)}</b></div><div>Jargon decoded<b>${Object.keys(S.heard).length} / ${JARGON.length}</b></div><div>Meetings<b>${st.meetings}</b></div><div>Coffees<b>${st.coffees}</b></div><div>Reply-alls<b>${st.replyall}</b></div><div>Achievements<b>${Object.keys(S.ach).length} / ${ACHIEVEMENTS.length}</b></div></div>`;
  h += `<div class="row"><button type="button" class="btn big" id="mOk">Start a new career</button></div>`;
  openModal(h, false); $('mOk').onclick = () => { closeModal(true); MQ = []; titleModal(); };
}
function titleModal() {
  const cont = hasSave();
  let h = `<p class="title-hero">ADATO</p><p class="title-sub">A Day At The Office</p>`;
  h += `<p>${jz("Welcome to SynergyCorp. Start as an Unpaid Intern on a folding chair and climb all the way to CEO. Leverage synergies, touch base with your boss, survive the 15-minute standup, and circle back to your dreams.")}</p>`;
  h += `<p class="note">Every action costs time. Every Friday is a performance review. Highlighted jargon can be hovered or tapped to decode.</p>`;
  if (cont) h += `<div class="row" style="margin-top:6px"><button type="button" class="btn big" id="tCont">Continue your career</button></div><h3>Or start over</h3>`;
  h += `<label class="note" for="tName">Your name</label><input class="field" id="tName" maxlength="20" value="Alex" autocomplete="off">`;
  h += `<h3>Background</h3><div class="bgs">` + Object.entries(BACKGROUNDS).map(([k, b]) => `<button type="button" data-bg="${k}" class="${k === BG_PICK ? 'on' : ''}"><b>${esc(b.n)}</b><span>${esc(b.d)}</span></button>`).join('') + '</div>';
  h += `<div class="row"><button type="button" class="btn big${cont ? ' alt' : ''}" id="tStart">Start your first day</button></div>`;
  const box = openModal(h, false);
  box.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => { BG_PICK = b.dataset.bg; box.querySelectorAll('[data-bg]').forEach(x => x.classList.toggle('on', x === b)); sfx('click'); });
  $('tStart').onclick = () => { audio(); newGame($('tName').value.trim() || 'Alex', BG_PICK); mapPlace(S.loc); TAB = 'here'; LAST = null; closeModal(true); MQ = []; renderAll(); save(); sfx('good'); mailModal(0); };
  if (cont) $('tCont').onclick = () => { audio(); load(); mapPlace(S.loc); closeModal(true); renderAll(); toast('Welcome back. Your inbox missed you.'); };
}
function menuModal() {
  let h = `<div class="kicker">Menu</div><h2>Settings &amp; help</h2><div class="row"><button type="button" class="btn alt" id="mHow">How to play</button><button type="button" class="btn alt" id="mSnd">Sound: ${SOUND ? 'on' : 'off'}</button><button type="button" class="btn alt" id="mNew" style="border-color:var(--bad);color:var(--bad)">Start a new career</button></div><div class="row"><button type="button" class="btn" id="mOk">Back to work</button></div>`;
  openModal(h);
  $('mOk').onclick = () => closeModal(); $('mHow').onclick = howModal; $('mSnd').onclick = () => { toggleSound(); menuModal(); };
  $('mNew').onclick = () => { const b = $('mNew'); if (b.dataset.arm) { closeModal(true); wipeSave(); titleModal(); } else { b.dataset.arm = 1; b.textContent = 'Click again to quit your job'; } };
}
function howModal() {
  const h = `<div class="kicker">How to play</div><h2>Your first day, explained</h2>
  <div class="li">Click a room on the floor plan, or use the Walk somewhere list, to walk there. Walking takes a few minutes.</div>
  <div class="li">Every action takes time and most cost Bandwidth (your energy). Coffee, lunch, naps and bagels restore it.</div>
  <div class="li">Keep Morale above zero or you will be sent on a mandatory "wellness journey". Low morale makes everything less effective.</div>
  <div class="li">To get promoted, meet the Impact, Visibility and skill targets on the Career tab, then ask your boss in their office.</div>
  <div class="li">Every Friday is a Quarterly Review. Two Needs Improvement ratings in a row and you are offboarded.</div>
  <div class="li">From Team Lead on, hire a team in the Team Pod. Their impact flows in every minute that passes, whatever you're doing.</div>
  <div class="li">Visibility fades overnight. The day runs 9 to 6; you can stay until 9 PM for overtime. Go home from the Lobby.</div>
  <div class="li">Highlighted words are jargon. Hover or tap to decode them. They also stamp your weekly Buzzword Bingo card.</div>
  <div class="li">Number keys 1 to 9 trigger the actions in the room you're in.</div>
  <div class="row"><button type="button" class="btn" id="mOk">Got it</button></div>`;
  openModal(h); $('mOk').onclick = () => closeModal();
}
function toggleSound() { SOUND = !SOUND; try { localStorage.setItem('adato_sound', SOUND ? 'on' : 'off'); } catch (e) {} renderHud(); if (SOUND) sfx('click'); }

// ---------------------------------------------------------------------
// JARGON TOOLTIP
// ---------------------------------------------------------------------
let TIP_EL = null;
function showTip(el) {
  const i = +el.dataset.j, tip = $('jtip'); if (!JARGON[i]) return;
  tip.innerHTML = `<b>${esc(JARGON[i][0])}</b>${esc(JARGON[i][1])}`; tip.hidden = false; TIP_EL = el;
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = Math.min(innerWidth - tw - 8, Math.max(8, r.left + r.width / 2 - tw / 2)), y = r.top - th - 8; if (y < 8) y = r.bottom + 8;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { $('jtip').hidden = true; TIP_EL = null; }
document.addEventListener('mouseover', e => { const m = e.target.closest && e.target.closest('mark.jg'); if (m) showTip(m); else if (TIP_EL) hideTip(); });
document.addEventListener('focusin', e => { const m = e.target.closest && e.target.closest('mark.jg'); if (m) showTip(m); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('mark.jg')) hideTip(); });
addEventListener('scroll', hideTip, true);

// ---------------------------------------------------------------------
// INPUT
// ---------------------------------------------------------------------
document.addEventListener('click', e => {
  const mk = e.target.closest('mark.jg'); if (mk) { if (TIP_EL === mk) hideTip(); else showTip(mk); e.stopPropagation(); return; }
  const t = e.target.closest('[data-tab],[data-a],[data-go],[data-chat],[data-mail],[data-gear],[data-hire],[data-tool]'); if (!t || !S) return;
  if (MODAL && !MODAL.ov.contains(t)) return;
  if (t.dataset.tab) { TAB = t.dataset.tab; sfx('click'); renderAll(); return; }
  if (t.dataset.a) return act(t.dataset.a);
  if (t.dataset.go) return goTo(t.dataset.go);
  if (t.dataset.chat) return chat(t.dataset.chat);
  if (t.dataset.mail) { sfx('click'); return mailModal(+t.dataset.mail); }
  if (t.dataset.gear) { if (buyGear(t.dataset.gear)) { sfx('cash'); flush(); renderAll(); } return; }
  if (t.dataset.hire) { if (hire(t.dataset.hire)) { sfx('cash'); flush(); renderAll(); } return; }
  if (t.dataset.tool) { if (buyTool(t.dataset.tool)) { sfx('cash'); flush(); renderAll(); } return; }
}, true);
document.addEventListener('input', e => { if (e.target.id === 'decQ') { DEC_Q = e.target.value; renderPane(); } });
addEventListener('keydown', e => {
  if (e.key === 'Escape' && MODAL && MODAL.closable) { closeModal(); return; }
  if (MODAL || BUSY || !S || e.target.tagName === 'INPUT') return;
  if (/^[1-9]$/.test(e.key) && TAB === 'here') { const id = ACT_KEYS[+e.key - 1]; if (id) act(id); }
});
$('bSound').onclick = toggleSound;
$('bMenu').onclick = () => { if (!MODAL) menuModal(); };

// ---------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------
function boot() {
  mapInit($('map'));
  MAP.onClick = id => goTo(id);
  if (load()) { mapPlace(S.loc); renderAll(); titleModal(); }
  else { newGame('Alex', 'mba'); S.dummy = true; S.pending = []; mapPlace(S.loc); renderAll(); titleModal(); }
}
addEventListener('beforeunload', () => { if (S && !S.over) save(); });
boot();
</script>
