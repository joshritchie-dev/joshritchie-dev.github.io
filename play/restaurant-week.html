<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Restaurant Week</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a candlelit bistro. The cream menu card is the centerpiece during prep; during service the room splits into host stand, tables and the pass. Single dark look by design. */
:root {
  --room: #1c1315; --room2: #261a1b; --wood: #2f2120; --wood2: #3d2b29; --line: #4a3633;
  --fg: #f3e9dc; --mute: #b9a796; --dim: #8a7768;
  --linen: #f7f1e5; --linen2: #ede4d2; --ink: #2a1f1a; --ink2: #6b5a4c;
  --brass: #d1ab62; --candle: #f2c879; --wine: #93303f; --good: #7cb86f; --warn: #e2a24a; --bad: #e0664f;
  --f-menu: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  --f-ui: "Jost", "Futura", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--room); color: var(--fg); font: 15px/1.45 var(--f-ui);
  background-image: radial-gradient(ellipse at 30% -10%, rgba(242, 200, 121, .10), transparent 55%), radial-gradient(ellipse at 90% 110%, rgba(147, 48, 63, .14), transparent 50%);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }
#app { max-width: 1340px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 6px 2px 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; margin-right: auto; line-height: 1; }
.brand b { font: italic 600 30px/1 var(--f-menu); color: var(--candle); letter-spacing: .3px; }
.brand small { font: 500 10.5px/1.6 var(--f-ui); letter-spacing: 3px; text-transform: uppercase; color: var(--mute); margin-top: 2px; }
.hs { display: flex; flex-direction: column; line-height: 1.15; min-width: 62px; }
.hs small { font: 500 10.5px/1.3 var(--f-ui); color: var(--mute); text-transform: uppercase; letter-spacing: 1.2px; }
.hs b { font: 600 18px/1.2 var(--f-ui); font-variant-numeric: tabular-nums; }
.hs b.bad { color: var(--bad); }
.speed { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.speed button { background: transparent; border: 0; border-right: 1px solid var(--line); padding: 6px 10px; font: 600 13px/1 var(--f-ui); color: var(--mute); }
.speed button:last-child { border-right: 0; }
.speed button.on { background: var(--candle); color: var(--ink); }
.hbtns { display: flex; gap: 6px; }
.hb { background: transparent; border: 1px solid var(--line); color: var(--mute); border-radius: 4px; padding: 6px 10px; font: 500 12.5px/1 var(--f-ui); letter-spacing: .5px; }
.hb:hover { color: var(--fg); border-color: var(--mute); }

/* ---------- prep ---------- */
.prep { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 22px; align-items: start; }
.menucol { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 10px; }
.card { background: var(--linen); color: var(--ink); border-radius: 3px; padding: 30px 34px 24px; text-align: center; box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.2);
  background-image: linear-gradient(180deg, rgba(255,255,255,.5), transparent 30%), repeating-linear-gradient(0deg, rgba(0,0,0,.012) 0 1px, transparent 1px 3px); position: relative; }
.card::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(43, 33, 28, .28); pointer-events: none; }
.card .rw { font: 500 11px/1 var(--f-ui); letter-spacing: 4px; text-transform: uppercase; color: var(--ink2); }
.card h2 { font: italic 600 40px/1.05 var(--f-menu); margin: 8px 0 2px; }
.card .px { font: 500 13px/1.3 var(--f-ui); letter-spacing: 1.5px; color: var(--ink2); text-transform: uppercase; }
.card .orn { display: block; margin: 12px auto 6px; width: 60px; height: 10px; }
.card .course { margin-top: 14px; }
.card .course h3 { font: 600 11.5px/1 var(--f-ui); letter-spacing: 3.5px; text-transform: uppercase; color: var(--wine); margin: 0 0 8px; }
.dishbtn { display: block; width: 100%; background: transparent; border: 1px dashed transparent; border-radius: 3px; padding: 6px 8px; color: var(--ink); text-align: center; }
.dishbtn:hover { border-color: rgba(43, 33, 28, .3); }
.dishbtn.sel { border-color: var(--wine); background: rgba(147, 48, 63, .06); }
.dishbtn .dn { font: italic 600 21px/1.15 var(--f-menu); text-wrap: balance; }
.dishbtn .ds { font: 500 12px/1.4 var(--f-ui); color: var(--ink2); letter-spacing: .5px; }
.dishbtn .ds b { color: var(--wine); font-weight: 600; }
.dishbtn.banned .dn { text-decoration: line-through; opacity: .5; }
.card .fine { margin-top: 18px; font: 400 11px/1.4 var(--f-ui); color: var(--ink2); }
.open-btn { background: var(--candle); color: var(--ink); border: 0; border-radius: 4px; padding: 14px; font: 600 16px/1 var(--f-ui); letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 8px 20px rgba(0,0,0,.4); }
.open-btn:hover { filter: brightness(1.06); }
.open-btn:disabled { background: var(--wood2); color: var(--dim); }
.editor { background: var(--room2); border: 1px solid var(--line); border-radius: 6px; min-width: 0; display: flex; flex-direction: column; }
.tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 11px 12px 9px; font: 500 13px/1 var(--f-ui); letter-spacing: 1px; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--candle); }
.tabs button small { color: var(--dim); margin-left: 3px; }
.pane { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 420px; }
.pane > * { flex-shrink: 0; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ph h2 { margin: 0; font: italic 600 26px/1.1 var(--f-menu); color: var(--fg); text-wrap: balance; }
.ph span { font-size: 12.5px; color: var(--mute); text-align: right; }
.note { margin: 0; font-size: 13.5px; color: var(--mute); max-width: 66ch; }
.sec { font: 600 11px/1.2 var(--f-ui); letter-spacing: 2px; text-transform: uppercase; color: var(--brass); border-top: 1px solid var(--line); padding-top: 10px; display: flex; justify-content: space-between; gap: 8px; }
.sec small { font: 400 12px/1.2 var(--f-ui); letter-spacing: 0; text-transform: none; color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--wood); border: 1px solid var(--line); border-radius: 3px; padding: 6px 9px; font: 500 13px/1.15 var(--f-ui); color: var(--fg); text-align: left; }
.chip small { font: 500 11px/1 var(--f-ui); color: var(--mute); margin-left: 5px; }
.chip.on { background: var(--candle); color: var(--ink); border-color: var(--candle); }
.chip.on small { color: var(--ink2); }
.chip.lie { border-style: dashed; }
.chip .lt { color: var(--bad); font-weight: 600; margin-left: 5px; font-size: 11px; }
.chip.on .lt { color: var(--wine); }
.chip:disabled { opacity: .38; }
.chip:not(:disabled):hover { border-color: var(--candle); }
.statbox { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.statbox div { background: var(--wood); border-radius: 4px; padding: 7px 9px; font-size: 11.5px; color: var(--mute); min-width: 0; }
.statbox b { display: block; font: 600 18px/1.2 var(--f-ui); color: var(--fg); font-variant-numeric: tabular-nums; }
.gap { padding: 9px 12px; border-radius: 4px; background: var(--wood); border-left: 3px solid var(--good); font-size: 13.5px; }
.gap.bad { border-left-color: var(--bad); } .gap.warn { border-left-color: var(--warn); }
.prev { font: italic 600 22px/1.2 var(--f-menu); color: var(--candle); }
.row { background: var(--wood); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.row.on { border-color: #6b5530; }
.row h3 { margin: 0; font: 600 14.5px/1.25 var(--f-ui); }
.row h3 small { display: block; font: 400 12px/1.3 var(--f-ui); color: var(--mute); margin-top: 2px; }
.row p { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--mute); }
.btn { background: var(--candle); color: var(--ink); border: 0; border-radius: 3px; padding: 8px 12px; font: 600 13px/1 var(--f-ui); letter-spacing: .4px; white-space: nowrap; }
.btn:hover:not(:disabled) { filter: brightness(1.07); }
.btn:disabled { background: var(--wood2); color: var(--dim); }
.btn.alt { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.alt:hover:not(:disabled) { border-color: var(--candle); }
.btn.red { background: var(--bad); color: #fff; }
.tag { font: 500 11px/1 var(--f-ui); padding: 3px 6px; border-radius: 2px; background: var(--wood2); color: var(--mute); white-space: nowrap; }
.tag.g { color: var(--good); } .tag.r { color: var(--bad); } .tag.y { color: var(--candle); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--mute); }
.dots i.on { background: var(--candle); border-color: var(--candle); }
.rev { background: var(--wood); border-radius: 4px; padding: 8px 10px; font-size: 13.5px; }
.rev .who { font-size: 11.5px; color: var(--mute); }
.stars { color: var(--candle); letter-spacing: 1px; }
.dec-l { display: flex; flex-direction: column; gap: 5px; }
.dec { background: var(--wood); border-radius: 3px; padding: 6px 9px; font-size: 13px; color: var(--mute); }
.dec b { display: block; font: italic 600 17px/1.2 var(--f-menu); color: var(--fg); }
.dec.no { opacity: .5; }
.srch { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 3px; background: var(--room); color: var(--fg); }
.ach { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ach div { background: var(--wood); border-radius: 3px; padding: 6px 8px; font-size: 12px; color: var(--dim); }
.ach div b { display: block; font: 600 13px/1.2 var(--f-ui); color: var(--mute); }
.ach div.got { color: var(--mute); } .ach div.got b { color: var(--candle); }

/* ---------- service ---------- */
.svc { display: grid; grid-template-columns: 230px minmax(0, 1fr) 270px; gap: 14px; align-items: start; }
.svc h2 { margin: 0 0 8px; font: 600 11.5px/1 var(--f-ui); letter-spacing: 2.5px; text-transform: uppercase; color: var(--brass); }
.host, .kitchen { background: var(--room2); border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0; }
.queue { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.qcard { background: var(--wood); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; animation: pop .25s ease-out; }
.qcard .nm { font: 600 13.5px/1.2 var(--f-ui); }
.qcard .ty { font-size: 11.5px; color: var(--mute); }
.bar { grid-column: 1 / -1; height: 5px; background: var(--room); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.bar i.mid { background: var(--warn); } .bar i.low { background: var(--bad); }
.empty { font-size: 13px; color: var(--dim); font-style: italic; }
.room { min-width: 0; }
.room-h { display: flex; justify-content: space-between; align-items: baseline; }
.room-h span { font-size: 12.5px; color: var(--mute); }
.tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.tbl { background: radial-gradient(ellipse at 50% 0%, #4a3430, var(--wood) 70%); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 148px; position: relative; }
.tbl.free { background: var(--room2); border-style: dashed; }
.tbl .th { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.tbl .tn { font: 600 11px/1 var(--f-ui); letter-spacing: 2px; text-transform: uppercase; color: var(--brass); }
.tbl .mood { font-size: 18px; line-height: 1; }
.tbl .pn { font: italic 600 19px/1.1 var(--f-menu); }
.tbl .pt { font-size: 11.5px; color: var(--mute); }
.tbl .st { font-size: 13px; color: var(--fg); min-height: 18px; }
.tbl .st.hot { color: var(--candle); font-weight: 600; }
.tbl .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.tbl .acts .btn { flex: 1; padding: 9px 8px; font-size: 13.5px; }
.tbl.critic-spotted { box-shadow: 0 0 0 2px var(--candle) inset; }
.pips { display: flex; gap: 4px; }
.pips i { flex: 1; height: 4px; border-radius: 2px; background: var(--room); }
.pips i.done { background: var(--candle); } .pips i.now { background: var(--mute); }
.tbl .note-i { position: absolute; right: 36px; top: 9px; font-size: 12px; color: var(--candle); }
.pass { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.burner { background: var(--wood); border-radius: 4px; padding: 6px 9px; font-size: 12.5px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 6px; }
.burner.idle { color: var(--dim); font-style: italic; }
.burner .bar i { background: var(--candle); }
.plate { background: #3a2a1f; border: 1px solid #7a5a2a; border-radius: 4px; padding: 6px 9px; font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; }
.plate.cold { border-color: var(--bad); }
.plate b { color: var(--candle); font-weight: 600; }
.lineinfo { font-size: 12px; color: var(--mute); }
.feed { display: flex; flex-direction: column; gap: 5px; max-height: 360px; overflow-y: auto; }
.fd { font-size: 12.5px; color: var(--mute); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.fd.review { color: var(--fg); }
.fd .who { display: block; font-size: 11px; color: var(--dim); }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }

/* jargon */
mark.jg { background: transparent; color: inherit; border-bottom: 1px dotted currentColor; cursor: help; padding: 0; }
#jtip { position: fixed; z-index: 90; max-width: 260px; background: #120c0d; color: var(--fg); border: 1px solid var(--brass); border-radius: 4px; padding: 8px 10px; font-size: 13px; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
#jtip b { display: block; font: italic 600 18px/1.15 var(--f-menu); color: var(--candle); margin-bottom: 2px; }

/* modals */
.ov { position: fixed; inset: 0; z-index: 50; background: rgba(10, 6, 7, .74); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.mo { background: var(--room2); border: 1px solid var(--line); border-top: 3px solid var(--candle); border-radius: 6px; width: min(580px, 100%); max-height: 100%; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 24px 70px rgba(0,0,0,.7); }
.mo.wide { width: min(740px, 100%); }
.mo .kicker { font: 600 11px/1.2 var(--f-ui); letter-spacing: 2.5px; text-transform: uppercase; color: var(--brass); }
.mo h2 { margin: 0; font: italic 600 32px/1.05 var(--f-menu); text-wrap: balance; }
.mo p { margin: 0; }
.mo ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.mo .btn { padding: 10px 14px; font-size: 14px; }
.choice { display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--wood); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; font-size: 14px; color: var(--fg); }
.choice:hover:not(:disabled) { border-color: var(--candle); }
.choice small { font-size: 12px; color: var(--mute); }
.opt { display: flex; align-items: center; gap: 10px; background: var(--wood); border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px; font-size: 14px; cursor: pointer; }
.opt input { accent-color: var(--candle); width: 18px; height: 18px; flex: none; }
.opt span { flex: 1; } .opt small { color: var(--mute); font-size: 12px; }
.opt.dis { opacity: .45; cursor: not-allowed; }
.picks { background: var(--linen); color: var(--ink); border-radius: 3px; padding: 10px 14px; display: flex; flex-direction: column; gap: 3px; }
.picks div { font: italic 600 17px/1.25 var(--f-menu); }
.picks small { font: 500 11px/1 var(--f-ui); color: var(--wine); letter-spacing: 2px; text-transform: uppercase; font-style: normal; margin-right: 6px; }
.tells { font-size: 13.5px; color: var(--candle); }
.tells i { color: var(--mute); }
.res { background: var(--wood); border-left: 3px solid var(--mute); padding: 9px 12px; border-radius: 2px; font-size: 14px; }
.res.good { border-left-color: var(--good); } .res.bad { border-left-color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
.stats div { background: var(--wood); border-radius: 4px; padding: 7px 9px; font-size: 12px; color: var(--mute); min-width: 0; }
.stats b { display: block; font: 600 18px/1.25 var(--f-ui); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.paper { background: var(--linen); color: var(--ink); border-radius: 2px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.paper .mast { font: 700 12px/1 var(--f-ui); letter-spacing: 3px; text-transform: uppercase; border-bottom: 2px solid var(--ink); padding-bottom: 6px; display: flex; justify-content: space-between; }
.paper h3 { margin: 0; font: italic 700 26px/1.1 var(--f-menu); }
.paper .by { font: 500 12px/1.3 var(--f-ui); color: var(--ink2); }
.paper p { font: 400 17px/1.4 var(--f-menu); margin: 0; }
.paper .big { font: 700 30px/1 var(--f-menu); color: var(--wine); letter-spacing: 3px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; border-bottom: 1px solid var(--line); padding-top: 6px; }
.bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; height: 100%; font-size: 11px; color: var(--mute); }
.bars i { display: block; width: 100%; background: var(--candle); border-radius: 2px 2px 0 0; min-height: 2px; }
.bars i.neg { background: var(--bad); }

#toasts { position: fixed; z-index: 70; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
.toast { background: #120c0d; color: var(--fg); border: 1px solid var(--line); border-left: 3px solid var(--candle); border-radius: 4px; padding: 8px 12px; font-size: 13.5px; max-width: 340px; box-shadow: 0 6px 20px rgba(0,0,0,.5); animation: pop .25s ease-out; }
.toast.tip { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }
.toast b { color: var(--candle); }

@media (max-width: 1100px) { .svc { grid-template-columns: 200px minmax(0, 1fr); } .kitchen { grid-column: 1 / -1; } .feed { max-height: 220px; } }
@media (max-width: 900px) {
  .prep { grid-template-columns: minmax(0, 1fr); }
  .menucol { position: static; }
  .pane { min-height: 0; }
}
@media (max-width: 640px) {
  .svc { grid-template-columns: minmax(0, 1fr); }
  .queue { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .qcard { min-width: 170px; }
  .tables { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tbl { padding: 8px 9px 10px; min-height: 138px; }
  .tbl .pn { font-size: 17px; }
  .tbl .acts .btn { padding: 10px 6px; font-size: 13px; }
}
@media (max-width: 560px) {
  body { font-size: 14px; }

function step(dt) {

  }

    const p = sv.parties[id], T = TYPES[p.type];

    if (p.pat <= 0) {

      addFeed('sys', `${p.name}'s party of ${p.size} gave up waiting and left.`);
      if (p.critic) { const c = CRITICS.find(x => x.night === p.critic); S.critics[c.night] = { stars:0, lines:['I never got a table. I will not be returning to find out what I missed.'], name:c.name, outlet:c.outlet, spotted:false, sat:0 }; S.rating = clamp(S.rating - 0.4 * c.weight, 1, 5); }

  if (sv.t >= OPEN_FOR + 5) for (const id of sv.queue.slice()) { const p = sv.parties[id]; p.state = 'gone'; S.night$.lost += p.size; sv.queue = sv.queue.filter(x => x !== id); }
  const busy = Object.values(sv.parties).some(p => p.table && p.state !== 'gone');

}
function closeNight() {
  const sv = SV();
  for (const id in sv.parties) { const p = sv.parties[id]; if (p.table && p.state !== 'leaving' && p.state !== 'gone') { if (p.picks) finishParty(p, true); else { p.state = 'gone'; S.night$.lost += p.size; } } }

  S.cash -= n.staff + n.fee;
  n.revenue = n.prix + n.supp + n.upsell; n.profit = n.revenue - n.food - n.staff - n.fee;
  n.avg = n.reviews.length ? n.reviews.reduce((a, b) => a + b, 0) / n.reviews.length : 0;
  n.critic = S.critics[S.night] || null;

  award('first');

let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t0, dur, type = 'sine', vol = 0.1, f2) {

  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);

const SFX_T = {};
function sfx(k) {
  if (!SOUND) return; const now = performance.now(); if (SFX_T[k] && now - SFX_T[k] < 120) return; SFX_T[k] = now;
  if (k === 'ding') { tone(1568, 0, 0.9, 'sine', 0.09); tone(2093, 0, 0.6, 'sine', 0.03); }
  else if (k === 'pay') { tone(988, 0, 0.08, 'square', 0.04); tone(1319, 0.08, 0.25, 'triangle', 0.08); }
  else if (k === 'arrive') { tone(784, 0, 0.18, 'triangle', 0.05); tone(659, 0.16, 0.25, 'triangle', 0.05); }
  else if (k === 'walk') tone(330, 0, 0.35, 'sawtooth', 0.04, 200);
  else if (k === 'click') tone(1200, 0, 0.03, 'square', 0.02);
  else if (k === 'good') { tone(660, 0, 0.1, 'triangle', 0.07); tone(880, 0.1, 0.1, 'triangle', 0.07); tone(1100, 0.2, 0.25, 'triangle', 0.07); }
  else if (k === 'bad') tone(300, 0, 0.3, 'square', 0.05, 200);
}

const KEYS = { tables:{}, queue:'', pass:'' };

let DEC_N = 0, LAST_DEC = 0;
function flush() {
  if (!S) return;
  const L = S.pending; S.pending = [];
  for (const p of L) {
    if (p.type === 'tip') toast(esc(TIPS[p.id]), 8000, 'tip');
    else if (p.type === 'ach') { const a = ACHIEVEMENTS.find(x => x.id === p.id); if (a) { toast(`Achievement: <b>${esc(a.name)}</b><br>${esc(a.d)}`, 4000); sfx('good'); } }
    else if (p.type === 'report') { save(); queueModal(reportModal); }
    else if (p.type === 'over') { save(); queueModal(endModal); }
  }
  while (FX.length) {
    const e = FX.shift();
    if (e.type === 'ding') sfx('ding'); else if (e.type === 'pay') sfx('pay'); else if (e.type === 'arrive') sfx('arrive'); else if (e.type === 'walk') sfx('walk');
  }
  if (S.newHeard) { DEC_N += S.newHeard; S.newHeard = 0; }
  const now = performance.now();
  if (DEC_N && now - LAST_DEC > 3000) { toast(`Decoded <b>${DEC_N}</b> new phrase${DEC_N > 1 ? 's' : ''}. Hover dotted text.`, 2200); DEC_N = 0; LAST_DEC = now; if (Object.keys(S.heard).length >= 60) award('decoder'); }
}

}
document.addEventListener('click', e => {
  const mk = e.target.closest && e.target.closest('mark.jg');
  if (mk && !mk.closest('button, label')) { if (TIP_EL === mk) hideTip(); else showTip(mk); e.stopPropagation(); e.preventDefault(); return; }
  if (!S) return;
  const t = e.target.closest('[data-tab],[data-sel],[data-base],[data-word],[data-portion],[data-supp],[data-up],[data-pack],[data-seat],[data-order],[data-serve],[data-check],[data-chef],[data-speed],#bOpen'); if (!t) return;
  if (MODAL && !MODAL.ov.contains(t)) return;
  if (t.dataset.speed !== undefined) { SPEED = +t.dataset.speed; if (SPEED) PREV_SPEED = SPEED; renderHeader(); return; }
  if (t.id === 'bOpen') { if (openDoors()) { KEYS.tables = {}; KEYS.queue = ''; KEYS.pass = ''; $('tables').innerHTML = ''; SPEED = PREV_SPEED || 1; sfx('arrive'); renderAll(); } return; }
  if (t.dataset.seat || t.dataset.order || t.dataset.serve || t.dataset.check || t.dataset.chef) { svcAction(t); renderService(); renderHeader(); return; }
  if (t.dataset.tab) { TAB = t.dataset.tab; renderTabs(); renderPane(); $('pane').scrollTop = 0; return; }
  if (t.dataset.sel) { const [c, i] = t.dataset.sel.split(':'); SEL = { c, i:+i }; TAB = 'dish'; sfx('click'); renderPrep(); if (innerWidth < 900) $('tabs').scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if (t.dataset.base) return act(setBase(SEL.c, SEL.i, t.dataset.base));
  if (t.dataset.word) return act(setWord(SEL.c, SEL.i, t.dataset.word));
  if (t.dataset.portion) return act(setPortion(SEL.c, SEL.i, +t.dataset.portion));
  if (t.dataset.supp) return act(setSupp(SEL.c, SEL.i, t.dataset.supp === 'mp' ? 'mp' : +t.dataset.supp));
  if (t.dataset.up) return act(buyUp(t.dataset.up));
  if (t.dataset.pack) return act(buyPack(t.dataset.pack));
});
document.addEventListener('input', e => { if (e.target.id === 'decQ') { DEC_Q = e.target.value; renderPane(); const el = $('decQ'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } } });
document.addEventListener('mouseover', e => { const m = e.target.closest && e.target.closest('mark.jg'); if (m) showTip(m); else if (TIP_EL) hideTip(); });
document.addEventListener('focusin', e => { const m = e.target.closest && e.target.closest('mark.jg'); if (m) showTip(m); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('mark.jg')) hideTip(); });
addEventListener('scroll', () => { if (TIP_EL) hideTip(); }, true);
addEventListener('keydown', e => {
  if (e.key === 'Escape' && MODAL && MODAL.closable) { closeModal(); return; }
  if (MODAL || !S || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === ' ' && S.phase === 'service') { e.preventDefault(); if (SPEED) { PREV_SPEED = SPEED; SPEED = 0; } else SPEED = PREV_SPEED || 1; renderHeader(); }
});
$('bHelp').onclick = () => { if (!MODAL && S) { const was = SPEED; SPEED = 0; helpModal(); MODAL.onclose = was; } };
$('bMenu').onclick = () => { if (!MODAL && S) menuModal(); };

// ---------------------------------------------------------------------
// LOOP
// ---------------------------------------------------------------------
let LAST = 0, LAST_UI = 0;
function loop(ts) {
  const dt = Math.min(0.1, Math.max(0, (ts - (LAST || ts)) / 1000)); LAST = ts;
  if (S && S.phase === 'service' && !MODAL && SPEED > 0) {
    let left = dt * SPEED;
    while (left > 0 && S.phase === 'service') { const d = Math.min(0.05, left); step(d); left -= d; }
  }
  if (S) {
    if (S.phase === 'service' && S.svc) { if (ts - LAST_UI > 80) { LAST_UI = ts; renderService(); renderHeader(); } }
    else if (ts - LAST_UI > 400) { LAST_UI = ts; renderHeader(); }
    flush();
    if (S.phase !== 'service' && $('prep').hidden) renderAll();
  }
  requestAnimationFrame(loop);
}
// help/menu during service restore speed when closed
const _close = closeModal;
closeModal = function (silent) { const m = MODAL; _close(silent); if (m && m.onclose !== undefined && !silent) SPEED = m.onclose || PREV_SPEED; };

// ---------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------
function start(data) {
  if (data && data.save && load(data.save)) { renderAll(); route(); }
  else { newGame(); renderAll(); titleModal(); }
  requestAnimationFrame(loop);
}
addEventListener('beforeunload', () => save());
try { window.claude?.hot?.snapshot?.(() => { let saved = null; try { saved = localStorage.getItem(SAVE_KEY); } catch (e) {} return { save:S && S.phase !== 'service' ? JSON.stringify(S) : saved }; }); } catch (e) {}
(window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}));
</script>
