<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sustainability Report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@700&family=Courier+Prime:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
/* Layout: a walnut desk holding two documents — the glossy public report (left) and the manila confidential file (right). Single look by design. */
:root {
  --desk: #211a15; --desk2: #2c231c; --desk3: #3a2f26; --desk-fg: #f1e9dc; --desk-mute: #b9ab94; --desk-dim: #8a7c67;
  --manila: #ecdfbd; --manila2: #e2d2a8; --manila3: #d6c491; --ink: #2a241d; --ink2: #5a4f41; --ink3: #85775f;
  --stamp: #b0261c; --pen: #1f4e8c; --ok: #2c6e33; --warn: #a3590f; --paper: #fbf8f1;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-news: "Fraunces", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--desk-fg); font: 15px/1.45 var(--f-ui);
  background-image: repeating-linear-gradient(92deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px), repeating-linear-gradient(88deg, rgba(0,0,0,.08) 0 1px, transparent 1px 23px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid #f0c060; outline-offset: 2px; }
#app { max-width: 1340px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

/* header */
.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 8px 4px 10px; border-bottom: 1px solid var(--desk3); }
.co { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.co-mark { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #1b3a26; color: #cfe7c6; font: 800 20px/1 var(--f-news); border: 2px solid #4f7a55; flex: none; }
.co-tx { display: flex; flex-direction: column; min-width: 0; }
.co-tx b { font: 700 21px/1.1 var(--f-news); letter-spacing: .2px; }
.co-tx small { color: var(--desk-mute); font-size: 12px; }
.hs { display: flex; flex-direction: column; line-height: 1.15; min-width: 64px; }
.hs small { font: 500 10.5px/1.3 var(--f-mono); color: var(--desk-mute); text-transform: uppercase; letter-spacing: .8px; }
.hs b { font: 600 18px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.hs b.bad { color: #ff8a73; }
.mini { display: block; width: 84px; height: 4px; background: var(--desk3); border-radius: 2px; margin-top: 3px; overflow: hidden; }
.mini i { display: block; height: 100%; background: #e8c46a; }
.hbtns { display: flex; gap: 6px; }
.hb { background: transparent; border: 1px solid var(--desk3); color: var(--desk-mute); border-radius: 4px; padding: 6px 10px; font: 500 12.5px/1 var(--f-mono); }
.hb:hover { color: var(--desk-fg); border-color: var(--desk-mute); }

/* desk */
.desk { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.pub { display: flex; flex-direction: column; gap: 10px; min-width: 0; position: sticky; top: 10px; }
.lbl { display: flex; align-items: baseline; gap: 10px; }
.lbl b { font: 700 13px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 1.2px; color: var(--desk-fg); }
.lbl span { font-size: 12.5px; color: var(--desk-dim); }
.pages { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.shelf { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; min-height: 20px; }
.shelf .sh-l { width: 100%; font: 500 11px/1 var(--f-mono); color: var(--desk-dim); text-transform: uppercase; letter-spacing: 1px; }
.thumb { width: 58px; flex: none; cursor: pointer; background: none; border: 0; padding: 0; text-align: center; }
.thumb .page { box-shadow: 0 3px 8px rgba(0,0,0,.5); }
.thumb small { display: block; font: 500 10.5px/1.4 var(--f-mono); color: var(--desk-mute); margin-top: 3px; }
.thumb.sc small { color: #ff8a73; }

/* ---------- the report page (container-scaled) ---------- */
.page { --pa:#2f8f4e; --pb:#d9f2d0; --pc:#0f3d22; --pd:#f4fbef; --pf:"Nunito", sans-serif; --pw:800;
  container-type: inline-size; aspect-ratio: 1 / 1.414; max-width: 100%; background: var(--pd); color: var(--pc); position: relative; overflow: hidden; border-radius: 2px;
  box-shadow: 0 1px 0 rgba(255,255,255,.3) inset, 0 14px 30px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.4); }
.page.pf-hand { --pw: 700; }
.cv-top { position: absolute; left: 0; right: 0; top: 0; padding: 6cqw 7cqw 0; display: flex; justify-content: space-between; align-items: flex-start; z-index: 2; }
.cv-co { font: var(--pw) 4.4cqw/1.1 var(--pf); letter-spacing: .02em; max-width: 60%; }
.cv-yr { font: 600 3.1cqw/1.2 var(--f-ui); text-transform: uppercase; letter-spacing: .14em; text-align: right; opacity: .8; }
.cv-art { position: absolute; left: 0; right: 0; top: 17%; height: 52%; }
.cv-art svg { width: 100%; height: 100%; display: block; }
.cv-art .spin { animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.cv-title { position: absolute; left: 7cqw; right: 7cqw; top: 71%; font: var(--pw) 9.6cqw/1.02 var(--pf); letter-spacing: -.01em; text-wrap: balance; color: var(--pc); }
.pf-hand .cv-title { font-size: 12cqw; }
.pf-mono .cv-title { font-size: 8.4cqw; letter-spacing: 0; }
.cv-foot { position: absolute; left: 7cqw; right: 7cqw; bottom: 4.5cqw; display: flex; justify-content: space-between; font: 500 2.5cqw/1.2 var(--f-ui); opacity: .7; }
.cv-band { position: absolute; left: 0; right: 0; bottom: 0; height: 1.6cqw; background: var(--pa); }
.sp { position: absolute; inset: 0; padding: 6cqw 7cqw 4.5cqw; display: flex; flex-direction: column; gap: 2.2cqw; }
.sp-h { display: flex; justify-content: space-between; align-items: baseline; border-bottom: .5cqw solid var(--pa); padding-bottom: 1.6cqw; }
.sp-h b { font: var(--pw) 4.6cqw/1 var(--pf); }
.sp-h span { font: 600 2.7cqw/1 var(--f-ui); text-transform: uppercase; letter-spacing: .12em; opacity: .7; }
.sp-stat { display: flex; align-items: flex-end; gap: 3cqw; }
.sp-stat b { font: var(--pw) 15cqw/.9 var(--pf); color: var(--pa); letter-spacing: -.03em; }
.sp-stat b.nz { font-size: 14cqw; }
.sp-stat span { font: 500 3.1cqw/1.25 var(--f-ui); padding-bottom: 1.4cqw; max-width: 46%; }
.sp-chart { background: var(--pb); border-radius: 1.4cqw; padding: 2cqw 2cqw 1cqw; }
.sp-chart svg { width: 100%; display: block; }
.sp-chart .cap { font: 600 2.6cqw/1.2 var(--f-ui); opacity: .75; margin-bottom: .6cqw; }
.sp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw; }
.sp-cols h4 { margin: 0 0 1cqw; font: 700 2.8cqw/1.2 var(--f-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--pa); }
.sp-cols ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .6cqw; font: 500 2.5cqw/1.2 var(--f-ui); }
.sp-cols li::before { content: "✓ "; color: var(--pa); font-weight: 700; }
.sp-cols li.x::before { content: "✗ "; color: #b0261c; }
.sp-fn { margin-top: auto; flex-shrink: 0; font: 400 1.8cqw/1.25 var(--f-ui); opacity: .78; border-top: .3cqw solid currentColor; padding-top: 1cqw; display: flex; flex-direction: column; gap: .1cqw; }
.sp-fn i { font-style: normal; }
.page.mini-pg .cv-foot, .page.mini-pg .cv-yr { display: none; }

/* ---------- the confidential file ---------- */
.file { display: flex; flex-direction: column; min-width: 0; }
.ftab { align-self: flex-start; background: var(--manila3); color: var(--ink); border-radius: 8px 8px 0 0; padding: 7px 16px 5px; display: flex; gap: 10px; align-items: baseline; margin-left: 14px; }
.ftab b { font: 700 13px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 2px; color: var(--stamp); }
.ftab span { font: 500 11.5px/1 var(--f-mono); color: var(--ink2); }
.num, .tabs, .pane { background: var(--manila); color: var(--ink); }
.num { border-radius: 4px 4px 0 0; padding: 14px 16px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; border-bottom: 1px dashed var(--manila3); box-shadow: 0 10px 28px rgba(0,0,0,.4); }
.n-main { min-width: 0; }
.n-k { font: 600 11px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: 1px; color: var(--ink2); }
.n-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.n-big b { font: 600 34px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.n-big b.ok { color: var(--ok); } .n-big b.bad { color: var(--stamp); }
.n-big span { font: 500 13.5px/1.2 var(--f-mono); color: var(--ink2); }
.n-bar { position: relative; height: 10px; background: var(--manila3); border-radius: 2px; margin: 6px 0 2px; }
.n-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ok); border-radius: 2px; }
.n-bar i.bad { background: var(--stamp); }
.n-bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.n-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; margin-top: 6px; font-size: 13px; }
.n-rows div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--manila3); padding: 2px 0; min-width: 0; }
.n-rows span { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.n-rows b { font: 600 13px/1.3 var(--f-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.n-rows b.bad { color: var(--stamp); } .n-rows b.ok { color: var(--ok); }
.n-side { display: flex; flex-direction: column; align-items: stretch; gap: 8px; min-width: 150px; }
.esgb { border: 2px solid var(--ink); border-radius: 4px; padding: 5px 8px; text-align: center; background: var(--paper); }
.esgb small { display: block; font: 600 10px/1.2 var(--f-mono); letter-spacing: .8px; text-transform: uppercase; color: var(--ink2); }
.esgb b { font: 700 26px/1.1 var(--f-news); }
.esgb span { display: block; font: 500 11px/1.2 var(--f-mono); color: var(--ink2); }
.pubbtn { background: var(--ink); color: var(--manila); border: 0; border-radius: 4px; padding: 11px 12px; font: 700 14px/1.1 var(--f-mono); letter-spacing: .5px; }
.pubbtn:hover:not(:disabled) { background: #000; }
.pubbtn:disabled { background: var(--ink3); color: var(--manila2); }
.n-why { grid-column: 1 / -1; font-size: 12.5px; color: var(--stamp); margin: 0; }
.tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--manila3); padding: 0 8px; }
.tabs button { background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 10px 10px 8px; font: 600 12.5px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .6px; color: var(--ink2); white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--stamp); }
.tabs button small { color: var(--ink3); margin-left: 3px; }
.pane { padding: 14px 16px 18px; border-radius: 0 0 4px 4px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 14px 28px rgba(0,0,0,.4); min-height: 360px; }
.pane > * { flex-shrink: 0; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ph h2 { margin: 0; font: 700 20px/1.15 var(--f-news); text-wrap: balance; }
.ph span { font: 500 12px/1.3 var(--f-mono); color: var(--ink2); text-align: right; }
.note { margin: 0; font-size: 13.5px; color: var(--ink2); max-width: 64ch; }
.sec { font: 700 11.5px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink2); border-top: 1px solid var(--manila3); padding-top: 9px; display: flex; justify-content: space-between; gap: 8px; }
.sec small { font: 500 11.5px/1.2 var(--f-ui); text-transform: none; letter-spacing: 0; color: var(--ink3); }
.row { background: var(--paper); border: 1px solid var(--manila3); border-radius: 4px; padding: 9px 11px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.row.on { border-color: var(--ink2); box-shadow: inset 3px 0 0 var(--ink2); }
.row.off { opacity: .55; }
.row h3 { margin: 0; font: 600 14.5px/1.25 var(--f-ui); }
.row h3 small { display: block; font: 400 12px/1.3 var(--f-ui); color: var(--ink2); margin-top: 1px; }
.row p { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--ink2); }
.row .ctl { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.tags { grid-column: 1 / -1; display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font: 500 11px/1 var(--f-mono); padding: 3px 5px; border-radius: 2px; background: var(--manila2); color: var(--ink2); white-space: nowrap; }
.tag.g { background: #d4e6c8; color: var(--ok); } .tag.r { background: #f1d0c4; color: var(--stamp); } .tag.b { background: #d3dff0; color: var(--pen); } .tag.y { background: #f3e2b0; color: var(--warn); }
.btn { background: var(--ink); color: var(--manila); border: 0; border-radius: 3px; padding: 7px 10px; font: 600 12.5px/1 var(--f-mono); white-space: nowrap; }
.btn:hover:not(:disabled) { background: #000; }
.btn:disabled { background: var(--manila3); color: var(--ink3); }
.btn.alt { background: transparent; color: var(--ink); border: 1px solid var(--ink3); }
.btn.alt:hover:not(:disabled) { border-color: var(--ink); background: var(--manila2); }
.btn.red { background: var(--stamp); color: #fff; }
.sw { width: 40px; height: 22px; border-radius: 11px; border: 1px solid var(--ink3); background: var(--manila2); position: relative; padding: 0; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink3); transition: left .15s; }
.sw.on { background: var(--ink); border-color: var(--ink); }
.sw.on::after { left: 20px; background: var(--manila); }
.fnb { border: 1px dashed var(--ink3); background: transparent; border-radius: 3px; padding: 4px 7px; font: 600 11.5px/1 var(--f-mono); color: var(--ink2); }
.fnb.on { border-style: solid; background: var(--ink2); color: var(--manila); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink2); }
.dots i.on { background: var(--ink2); }
.off-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
.off-row input[type=range] { flex: 1; accent-color: var(--ink); min-width: 0; }
.off-row input[type=number] { width: 64px; font: 600 13px/1 var(--f-mono); padding: 4px 6px; border: 1px solid var(--ink3); border-radius: 3px; background: var(--paper); color: var(--ink); }
.off-row b { font: 600 13px/1 var(--f-mono); min-width: 70px; text-align: right; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; }
.chips button { background: var(--paper); border: 1px solid var(--manila3); border-radius: 3px; padding: 6px 8px; font: 500 12.5px/1.15 var(--f-ui); color: var(--ink); text-align: left; }
.chips button small { font: 500 11px/1 var(--f-mono); color: var(--ink3); margin-left: 4px; }
.chips button.on { background: var(--ink); color: var(--manila); border-color: var(--ink); }
.chips button.on small { color: var(--manila2); }
.chips button:disabled { opacity: .45; }
.esg-l { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13px; }
.esg-l span { color: var(--ink2); } .esg-l b { font: 600 13px/1.3 var(--f-mono); text-align: right; }
.esg-l .t { border-top: 1px solid var(--ink3); padding-top: 3px; color: var(--ink); font-weight: 600; }
.risk { display: grid; grid-template-columns: minmax(0, 1fr) 56px 64px auto; gap: 6px 10px; align-items: center; font-size: 13px; }
.risk .h { font: 600 10.5px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .7px; color: var(--ink3); }
.risk .nm { min-width: 0; }
.risk .e { font: 600 13px/1 var(--f-mono); }
.ebar { height: 6px; background: var(--manila3); border-radius: 2px; overflow: hidden; }
.ebar i { display: block; height: 100%; background: var(--stamp); }
.dec-l { display: flex; flex-direction: column; gap: 5px; }
.dec { background: var(--paper); border-radius: 3px; padding: 6px 9px; font-size: 13px; }
.dec b { display: block; font: 600 13.5px/1.2 var(--f-news); }
.dec.no { opacity: .55; }
.srch { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--ink3); border-radius: 3px; background: var(--paper); color: var(--ink); }
.ach { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.ach div { background: var(--paper); border-radius: 3px; padding: 6px 8px; font-size: 12px; color: var(--ink3); min-width: 0; }
.ach div b { display: block; font: 600 12.5px/1.2 var(--f-ui); }
.ach div.got { color: var(--ink2); } .ach div.got b { color: var(--ok); }
.logl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.logl div { display: grid; grid-template-columns: 40px 1fr; gap: 8px; border-bottom: 1px dotted var(--manila3); padding-bottom: 3px; }
.logl span { font: 600 11.5px/1.5 var(--f-mono); color: var(--ink3); }

/* jargon */
mark.jg { background: transparent; color: inherit; border-bottom: 1px dotted currentColor; cursor: help; padding: 0; }
#jtip { position: fixed; z-index: 90; max-width: 270px; background: #17120e; color: var(--desk-fg); border: 1px solid #6a5a45; border-radius: 4px; padding: 8px 10px; font-size: 13px; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
#jtip b { display: block; font: 700 14px/1.2 var(--f-news); color: #f0d9a8; margin-bottom: 2px; }

/* overlays */
.ov { position: fixed; inset: 0; z-index: 50; background: rgba(12, 9, 6, .74); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.mo { background: var(--manila); color: var(--ink); border-radius: 4px; width: min(600px, 100%); max-height: 100%; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 24px 70px rgba(0,0,0,.7); position: relative; }
.mo.wide { width: min(760px, 100%); }
.mo .kicker { font: 600 11.5px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink2); }
.mo h2 { margin: 0; font: 800 28px/1.08 var(--f-news); text-wrap: balance; }
.mo p { margin: 0; }
.mo .from { font: 500 12.5px/1.3 var(--f-mono); color: var(--ink2); }
.mo ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.mo .btn { padding: 10px 14px; font-size: 13.5px; }
.choice { display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--manila3); border-radius: 4px; padding: 10px 12px; font-size: 14px; }
.choice:hover:not(:disabled) { border-color: var(--ink); }
.choice:disabled { opacity: .5; }
.choice small { font: 500 12px/1.3 var(--f-mono); color: var(--ink2); max-width: 46%; text-align: right; }
.stamp { position: absolute; right: 18px; top: 14px; transform: rotate(-8deg); border: 3px solid var(--stamp); color: var(--stamp); font: 800 18px/1 var(--f-mono); letter-spacing: 2px; padding: 5px 10px; border-radius: 3px; opacity: .85; text-transform: uppercase; }
.res { background: var(--paper); border-left: 3px solid var(--ink3); padding: 9px 12px; border-radius: 2px; }

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const fmtM = v => { const a = Math.abs(v), s = v < 0 ? '−$' : '$'; return a >= 1000 ? s + (a / 1000).toFixed(a >= 10000 ? 1 : 2) + 'B' : s + Math.round(a) + 'M'; };
const fmtMt = v => (Math.abs(v) < 10 ? v.toFixed(1) : Math.round(v).toString()) + ' Mt';
const byId = (L, id) => L.find(x => x.id === id);

// ---------------------------------------------------------------------
// JARGON
// ---------------------------------------------------------------------
const J = (() => {
  const e = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const items = JARGON.map(([p, m, re], i) => ({ i, p, src:re || e(p), test:new RegExp('^(?:' + (re || e(p)) + ')$', 'i') }));
  const sorted = items.slice().sort((a, b) => b.src.length - a.src.length);
  const all = new RegExp('(?<![\\w-])(?:' + sorted.map(x => x.src).join('|') + ')(?![\\w-])', 'gi');
  const which = str => { for (const it of sorted) if (it.test.test(str)) return it.i; return -1; };
  return { all, which };
})();
function findJargon(text) { const out = []; J.all.lastIndex = 0; let m; while ((m = J.all.exec(text))) { const i = J.which(m[0]); if (i >= 0) out.push(i); } return out; }
function hear(text) { if (!S) return; for (const i of findJargon(text)) if (!S.heard[i]) { S.heard[i] = 1; S.newHeard = (S.newHeard || 0) + 1; } }

const lvl = id => S.proj[id] || 0;
function projEff(id) { const p = byId(PROJECTS, id), l = lvl(id); return l ? p.levels[l - 1][1] : 0; }
const on = id => !!S.tricks[id];
function divEm() { let m = 1; for (const f of FIELDS) if (S.divested[f.id]) m *= 1 - f.em; return m; }
function divProd() { let m = 1; for (const f of FIELDS) if (S.divested[f.id]) m *= 1 - f.prod; return m; }
const yearsIn = () => S.year - 2025;

// ---------------------------------------------------------------------
// THE NUMBERS
// ---------------------------------------------------------------------
function compute() {
  const g = S.g, dE = divEm(), dP = divProd();
  const un1 = BASE_S1 * g * dE, un2 = BASE_S2 * g * dE;
  let s1 = un1 * (1 - projEff('methane')) * (1 - projEff('flaring')) * (1 - projEff('electrify'));
  s1 = Math.max(0, s1 - (lvl('ccs') ? 4 : 0) - (lvl('solar') ? 0.001 : 0));
  const s2 = un2 * (1 - projEff('ppa'));
  const real = s1 + s2, unabated = un1 + un2, cred = clamp(1 - real / unabated, 0, 1);
  let world = real; for (const f of FIELDS) if (S.divested[f.id]) world += (BASE_S1 + BASE_S2) * g * f.em * 1.1;
  const s3 = BASE_S3 * g * dP;
  // what the report says
  const r1 = s1 * (on('estimate') ? 0.8 : 1);
  const r2 = on('recs') ? 0 : s2;
  let rep = (r1 + r2) * (on('boundary') ? 0.85 : 1) * (on('future') ? 0.9 : 1);
  if (S.yr.restate.addBack) rep += S.yr.restate.addBack;
  let off = 0; for (const o of OFFSETS) off += S.offsets[o.id] || 0;
  const net = rep - off;
  const prod = g * dP;
  const base = on('rebase') ? 60 : 50;
  const target = Math.max(0, base * (1 - yearsIn() / 15) * (on('intensity') ? prod : 1));
  // annual costs
  const cost = annualCosts(s2);
  return { s1, s2, s3, real, unabated, cred, world, rep, off, net, prod, base, target, met:net <= target + 1e-9, cost, annual:cost.total, avail:S.cash - cost.total };
}
function annualCosts(s2) {
  const c = { offsets:0, recs:0, pages:PAGES[S.design.pages].cost, legal:0, footnotes:0, pledges:0 };
  for (const o of OFFSETS) c.offsets += (S.offsets[o.id] || 0) * o.price;
  if (on('recs')) c.recs = Math.round(s2 * 1.5 * 10) / 10;
  for (const l of LEGAL) if (!l.once && S.legal[l.id]) c.legal += l.cost;
  c.footnotes = skeletons().filter(k => S.fn[k.id]).length * FOOTNOTE_COST;
  for (const p of PLEDGES) if (S.pledges[p.id] && p.upkeep) c.pledges += p.upkeep;
  c.total = c.offsets + c.recs + c.pages + c.legal + c.footnotes + c.pledges;
  return c;
}
// Everything a journalist could find this year
function skeletons() {
  const out = [], m = id => (S.burned[id] || 1) * (S.yr.exp[id] || 1);
  for (const t of TRICKS) {
    if (!on(t.id)) continue;
    let e = t.exp;
    if (t.id === 'recs' && lvl('ppa') >= 2) e = 0;
    else if (t.id === 'recs' && lvl('ppa') === 1) e *= 0.5;
    if (t.id === 'estimate') e *= 1 - 0.3 * lvl('methane');
    if (t.id === 'future' && lvl('ccs')) e = 3;
    if (e > 0) out.push({ id:t.id, kind:'trick', name:t.name, e:e * m(t.id), expose:t.expose });
  }

    ${H.length >= 2 ? `<div class="histbox">${ART.history(H.map(h => Object.assign({}, h)))}<div class="legend"><span><i style="background:#7fc48d"></i>Reported net</span><span><i style="background:#e8d6b0"></i>Real (our books)</span><span><i style="background:#d98c5f"></i>Real (incl. sold fields)</span><span><i style="background:#9a8f7c"></i>Target</span></div></div>` : ''}
    <div class="stats"><div>Reports<b>${H.length}</b></div><div>Final ESG<b>${S.ratingLast}</b></div><div>Stock<b>$${S.stock.toFixed(2)}</b></div>
      <div>Scandals<b>${S.stats.scandals}</b></div><div>Offsets bought<b>${fmtMt(S.stats.offsetsBought)}</b></div><div>Spent on real fixes<b>${fmtM(S.stats.spentReal)}</b></div>
      <div>Jargon decoded<b>${Object.keys(S.heard).length}/${JARGON.length}</b></div><div>Achievements<b>${Object.keys(S.ach).length}/${ACHIEVEMENTS.length}</b></div><div>Footnotes, final report<b>${last.design ? footnotes().length : 0}</b></div></div>
    <div class="covers">${H.map(h => `<div class="thumb">${coverHTML(h.design, h.year, h.name, 1)}<small>${h.year}</small></div>`).join('')}</div>
    <div class="acts"><button type="button" class="btn" id="mNew">New career</button></div>`, { kind:'end', wide:true });
  $('mNew').onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} closeModal(true); startNew(); };
}
function archiveModal(i) {
  const h = S.history[i]; if (!h) return;
  openModal(`<div class="kicker">Archive · ${h.year}</div><h2>${esc(byId(TITLES, h.design.title).t)}</h2>
    <div style="max-width:220px">${coverHTML(h.design, h.year, h.name, 1)}</div>
    <div class="stats"><div>Reported net<b>${fmtMt(h.net)}</b></div><div>Target<b>${fmtMt(h.target)}</b></div><div>Real<b>${fmtMt(h.real)}</b></div><div>ESG<b>${h.rating}</b></div><div>Scandals<b>${h.scandals}</b></div><div>Board<b>${Math.round(h.board)}</b></div></div>
    <div class="acts"><button type="button" class="btn" id="mOk">Close</button></div>`, { closable:true });
  $('mOk').onclick = () => closeModal();
}

// ---------------------------------------------------------------------
// ENGINE NOTIFICATIONS
// ---------------------------------------------------------------------
let LAST_DEC = 0, DEC_N = 0;
function flushPending() {
  if (!S) return;
  const L = S.pending; S.pending = [];
  for (const p of L) {
    if (p.type === 'tip') toast(esc(TIPS[p.id]), 8000, 'tip');
    else if (p.type === 'ach') { const a = byId(ACHIEVEMENTS, p.id); if (a) toast(`Achievement: <b>${esc(a.name)}</b><br>${esc(a.d)}`, 4500); }
  }
  if (S.newHeard) { DEC_N += S.newHeard; S.newHeard = 0; }
  const now = performance.now();
  if (DEC_N && now - LAST_DEC > 2500) { toast(`Decoded <b>${DEC_N}</b> new phrase${DEC_N > 1 ? 's' : ''}. Hover dotted text to translate.`, 2400); DEC_N = 0; LAST_DEC = now; if (Object.keys(S.heard).length >= 80) award('decoder'); }
}

// ---------------------------------------------------------------------
// SAVE / LOAD
// ---------------------------------------------------------------------
function save() { if (!S) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load(raw) { try { const d = JSON.parse(raw || localStorage.getItem(SAVE_KEY)); if (!d || d.v !== 1 || !d.design) return false; S = d; return true; } catch (e) { return false; } }

// ---------------------------------------------------------------------
// INPUT
// ---------------------------------------------------------------------
function act(ok) { if (ok) { save(); renderAll(); } }
document.addEventListener('click', e => {
  const mk = e.target.closest && e.target.closest('mark.jg');
  if (mk) { if (TIP_EL === mk) hideTip(); else showTip(mk); e.stopPropagation(); e.preventDefault(); return; }
  if (!S) return;
  const t = e.target.closest('[data-tab],[data-proj],[data-trick],[data-divest],[data-fn],[data-fill],[data-pledge],[data-unpledge],[data-des],[data-legal],[data-arch],#bPub'); if (!t) return;
  if (MODAL && !MODAL.ov.contains(t)) return;
  if (t.id === 'bPub') return doPublish();
  if (t.dataset.tab) { TAB = t.dataset.tab; renderTabs(); renderPane(); $('pane').scrollTop = 0; return; }
  if (t.dataset.arch !== undefined) return archiveModal(+t.dataset.arch);
  if (t.dataset.proj) return act(buyProject(t.dataset.proj));
  if (t.dataset.trick) return act(toggleTrick(t.dataset.trick));
  if (t.dataset.divest) return act(divest(t.dataset.divest));
  if (t.dataset.fn) return act(toggleFootnote(t.dataset.fn));
  if (t.dataset.pledge) return act(makePledge(t.dataset.pledge));
  if (t.dataset.unpledge) return act(withdrawPledge(t.dataset.unpledge));
  if (t.dataset.des) return act(setDesign(t.dataset.des, t.dataset.v));
  if (t.dataset.legal) return act(toggleLegal(t.dataset.legal));
  if (t.dataset.fill) { const R = compute(), o = byId(OFFSETS, t.dataset.fill), gap = Math.ceil((R.net - R.target) * 2) / 2; if (gap > 0) act(setOffset(o.id, (S.offsets[o.id] || 0) + gap)); return; }
});
let OFF_T = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'decQ') { DEC_Q = t.value; renderPane(); const el = $('decQ'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
  if (t.dataset.off || t.dataset.offn) {
    const id = t.dataset.off || t.dataset.offn, v = parseFloat(t.value); if (isNaN(v)) return;
    setOffset(id, v);
    // update this row and the summary without rebuilding the slider being dragged
    const row = t.closest('.row'); if (row) { const o = byId(OFFSETS, id), mt = S.offsets[id]; row.querySelector('.off-row b').textContent = fmtM(mt * o.price); const other = row.querySelector(t.dataset.off ? '[data-offn]' : '[data-off]'); if (other) other.value = mt; }
    renderNum(); renderPages();
    clearTimeout(OFF_T); OFF_T = setTimeout(() => { save(); }, 300);
  }
});
document.addEventListener('change', e => { if (e.target.dataset.off || e.target.dataset.offn) { save(); renderAll(); } });
document.addEventListener('mouseover', e => { const m = e.target.closest && e.target.closest('mark.jg'); if (m) showTip(m); else if (TIP_EL) hideTip(); });
document.addEventListener('focusin', e => { const m = e.target.closest && e.target.closest('mark.jg'); if (m) showTip(m); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('mark.jg')) hideTip(); });
addEventListener('scroll', () => { if (TIP_EL) hideTip(); }, true);
addEventListener('keydown', e => { if (e.key === 'Escape' && MODAL && MODAL.closable) closeModal(); });
$('bHelp').onclick = () => { if (!MODAL && S) helpModal(); };
$('bMenu').onclick = () => { if (!MODAL && S) menuModal(); };
setInterval(() => { if (S) flushPending(); }, 700);

// ---------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------
function start(data) {
  if (data && data.save && load(data.save)) { renderAll(); route(); return; }
  newGame(); renderAll(); titleModal();
}
addEventListener('beforeunload', () => save());
try { window.claude?.hot?.snapshot?.(() => ({ save:S ? JSON.stringify(S) : null })); } catch (e) {}
(window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}));
</script>

</body></html>
