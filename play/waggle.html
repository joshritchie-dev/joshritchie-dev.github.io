<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Waggle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Layout: one-screen hive console. Comb (dance floor) | meadow map | field notes; stacks on phones.
     A single deliberate look: the dark inside of an oak hollow, lit by honey. */
  --ink:#16100a; --panel:#201710; --raise:#2b2016; --line:#4d3b27; --line-soft:#32261a;
  --text:#ece2c8; --muted:#a8987b; --wax:#f4e4b6;
  --honey:#f2a91d; --honey-deep:#c27a0b; --leaf:#93b858; --sky:#78bfdc; --warn:#ec6d45; --plum:#c08ad0;
  --display:'IM Fell English SC','IM Fell English',Georgia,'Times New Roman',serif;
  --serif:'IM Fell English',Georgia,'Times New Roman',serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--ink);color:var(--text);font:14px/1.45 var(--body);overflow-x:hidden}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HUD */
#hud{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px;padding:8px 14px;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px}
.brand{font-family:var(--display);font-size:28px;line-height:1;color:var(--honey);letter-spacing:.01em}
.when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.when .day{font-family:var(--serif);font-size:17px;color:var(--wax)}
.when .clock{font:500 17px var(--mono);font-variant-numeric:tabular-nums;color:var(--text)}
.wx{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.wx svg{width:18px;height:18px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.stat{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.stat b{font:500 16px var(--mono);font-variant-numeric:tabular-nums;color:var(--wax)}
.stat span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stat em{font-style:normal;font-size:11px;color:var(--muted)}
.stat em.low{color:var(--warn)} .stat em.ok{color:var(--leaf)}
.ctrls{display:flex;gap:6px;align-items:center}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--honey-deep)}
.btn:focus-visible,.choice:focus-visible,.tabs button:focus-visible,.row:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
.btn.on{background:var(--honey);color:#2a1a05;border-color:var(--honey)}
.btn.icon{padding:5px 8px;min-width:34px}

/* Play area */
#play{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.38fr) minmax(250px,288px);grid-template-rows:minmax(0,1fr);gap:12px}
#combPane{grid-column:1;grid-row:1} #mapPane{grid-column:2;grid-row:1} #side{grid-column:3;grid-row:1}
.pane{position:relative;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.stage{display:flex;align-items:center;justify-content:center}
.stage canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.cap{position:absolute;left:12px;top:9px;pointer-events:none;font-family:var(--display);font-size:15px;color:var(--wax);opacity:.85;letter-spacing:.02em}
.cap small{display:block;font:11px var(--body);letter-spacing:.04em;color:var(--muted);text-transform:none;opacity:.95}
#toasts{position:absolute;left:50%;top:44px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92%,420px)}
.toast{background:rgba(22,16,10,.88);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12.5px;text-align:center;transition:opacity .5s}
.toast.bad{border-color:var(--warn);color:#ffd6c6}
.toast.good{border-color:var(--honey-deep)}

/* Side */
#side{display:flex;flex-direction:column;overflow:auto;padding:12px 12px 14px;gap:12px}
.h{font-family:var(--display);font-size:16px;color:var(--wax);letter-spacing:.02em}
.sub{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:#3a2c1c;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--honey)}
.bar i.b2{background:#8a6a3c}
.bar i.g{background:#a2495a}
.card{background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:10px 11px;display:flex;flex-direction:column;gap:5px}
.card .t{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--wax)}
.card .t .x{margin-left:auto}
.cbody{display:flex;flex-direction:column;gap:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
.hint{font-size:12.5px;color:var(--honey)}
.warnline{font-size:12.5px;color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px;letter-spacing:.04em}
.tabs button.on{color:var(--wax);border-bottom-color:var(--honey)}
.list{display:flex;flex-direction:column;gap:6px;min-height:40px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:7px 8px;border-radius:8px;background:var(--raise);border:1px solid transparent;font-size:12.5px;cursor:default}
.row.click{cursor:pointer}
.row.click:hover{border-color:var(--line)}
.row .nm{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{grid-column:2/4;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.row .mini{grid-column:2/4;height:4px}
.row .rx{background:none;border:1px solid var(--line);border-radius:6px;padding:1px 7px;cursor:pointer;color:var(--muted);font-size:11.5px}
.row .rx:hover{color:var(--warn);border-color:var(--warn)}
.row.bad .nm{color:#ffbfa8}
.chip{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.open{color:#2a1a05;background:var(--honey);border-color:var(--honey)}
.chip.wait{color:var(--wax)}
.chip.bad{color:var(--warn);border-color:var(--warn)}
.logline{font-size:12px;color:var(--muted);padding:4px 2px;border-bottom:1px solid var(--line-soft)}
.logline b{font:500 11px var(--mono);color:var(--text);margin-right:6px}
.logline.bad{color:#f3b39d} .logline.good{color:var(--wax)}
.empty{font-size:12.5px;color:var(--muted);padding:6px 2px}

/* Coach */
#coach{grid-column:1;grid-row:1;align-self:end;margin:10px;position:relative;z-index:3;background:rgba(24,17,10,.94);border:1px solid var(--honey-deep);border-radius:9px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:7px}
#coach .ct{font-family:var(--display);color:var(--honey);font-size:15px}
#coach .cb{display:flex;gap:8px;justify-content:flex-end}

/* Modal */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,7,4,.72);backdrop-filter:blur(3px);padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{width:min(600px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;color:var(--honey);text-wrap:balance}
.sheet h3{margin:0;font-family:var(--serif);font-weight:400;font-size:19px;color:var(--wax)}
.sheet p{margin:0;max-width:62ch}
.sheet .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.choices{display:grid;gap:10px}
.choice{text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.choice:hover{border-color:var(--honey)}
.choice b{color:var(--wax);font-weight:600}
.choice span{font-size:12.5px;color:var(--muted)}
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.perks .choice{min-height:120px}
.perks .choice b{font-family:var(--serif);font-size:17px;font-weight:400}
.ledger{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13.5px;font-variant-numeric:tabular-nums}
.ledger b{font-family:var(--mono);font-weight:500;text-align:right;color:var(--wax)}
.ledger .neg{color:#f3b39d!important}
.ledger .sep{grid-column:1/3;border-top:1px solid var(--line-soft);margin:3px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.big{background:var(--honey);color:#2a1a05;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer}
.big:hover{filter:brightness(1.07)}
.big.ghost{background:var(--raise);color:var(--text);border:1px solid var(--line)}
.big:focus-visible{outline:2px solid var(--wax);outline-offset:2px}
.title-word{font-family:var(--display);font-size:72px;line-height:.9;color:var(--honey);margin:0}
.lede{font-family:var(--serif);font-size:19px;color:var(--wax);font-style:italic}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{font-family:var(--serif);font-size:24px;color:var(--wax)}

@media (max-width:980px){
  #app{height:auto;min-height:100%}
  #play{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
  .stage{aspect-ratio:1/1;width:100%;max-width:100%}
  #combPane,#mapPane,#side{grid-column:auto;grid-row:auto}
  #mapPane{order:1} #combPane{order:2;aspect-ratio:1/1.12} #coach{order:3;grid-column:auto;grid-row:auto;margin:0} #side{order:4;overflow:visible}
  .stats{margin-left:0}
}
@media (max-width:560px){
  .perks{grid-template-columns:1fr}
  .perks .choice{min-height:0}
  .modes{grid-template-columns:1fr}
  .title-word{font-size:56px}
  .brand{font-size:24px}
  .stats{gap:12px}
  .sheet{padding:18px 16px}
  #combPane .cap small{display:none}
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

<div id="app">
  <header id="hud">
    <div class="brand">Waggle</div>
    <div class="when"><span class="day" id="hDay">Day 1 · Spring</span><span class="clock" id="hClock">06:00</span></div>
    <div class="wx" id="hWx"></div>
    <div class="stats">
      <div class="stat"><span>Honey</span><b id="sHoney">0.0 kg</b><em id="sNeed">winter needs ~ kg</em></div>
      <div class="stat"><span>Pollen</span><b id="sPollen">0.0 kg</b><em id="sPollenNote">brood food</em></div>
      <div class="stat"><span>Bees</span><b id="sBees">0</b><em id="sBrood">brood 0</em></div>
      <div class="stat" id="waterStat" hidden><span>Water</span><b id="sWater">0 / 0 L</b><em>hot day</em></div>
    </div>
    <div class="ctrls" role="group" aria-label="Speed">
      <button class="btn icon" id="bPause" title="Pause (Space)" aria-label="Pause">❚❚</button>
      <button class="btn" data-speed="1" title="Normal speed (1)">1×</button>
      <button class="btn" data-speed="2" title="Double speed (2)">2×</button>
      <button class="btn" data-speed="4" title="Fast (3)">4×</button>
      <button class="btn icon" id="bSound" title="Sound on/off" aria-label="Sound">♪</button>
      <button class="btn icon" id="bMenu" title="Help and menu" aria-label="Menu">?</button>
    </div>
  </header>
  <main id="play">
    <section class="pane stage" id="combPane" aria-label="The comb, where you dance">
      <canvas id="comb"></canvas>
      <div class="cap">The comb<small>top of the comb = toward the sun</small></div>
    </section>
    <div id="coach" hidden></div>
    <section class="pane stage" id="mapPane" aria-label="The meadow map">
      <canvas id="map"></canvas>
      <div class="cap">The meadow<small>3 km around the old oak</small></div>
      <div id="toasts"></div>
    </section>
    <aside class="pane" id="side">
      <div>
        <div class="h">Foragers</div>
        <div class="bar" style="margin-top:6px"><i id="fBarBusy"></i><i class="b2" id="fBarWait"></i><i class="g" id="fBarGuard"></i></div>
        <div class="sub" id="fTxt" style="margin-top:4px"></div>
      </div>
      <div id="selCard" class="card" hidden></div>
      <div class="tabs" role="tablist">
        <button class="on" data-tab="routes" role="tab">Routes</button>
        <button data-tab="flowers" role="tab">Flowers</button>
        <button data-tab="log" role="tab">Log</button>
      </div>
      <div id="tabRoutes" class="list"></div>
      <div id="tabFlowers" class="list" hidden></div>
      <div id="tabLog" class="list" hidden></div>
    </aside>
  </main>
</div>
<div id="modal" hidden></div>

<script>
(function(){
'use strict';

/* =========================================================
   CONSTANTS & DATA
   ========================================================= */
const C = {
  RANGE:3000, HALF:3300, FOG_N:66, FOG_CELL:100,
  DAY0:6, DAY1:20, DAYS:22, MIN_PER_SEC:10,
  SPEED:50, FORAGE:18, UNLOAD:8, SQUAD:100, FOR_FRAC:0.4,
  LOAD:0.012, PLOAD:0.005, WLOAD:0.12, FUEL:0.0003, SEARCH:110,
  REV_LAND:230, REV_SCOUT:330, REV_HOME:650,

// d: bloom days (inclusive), h: open hours, q: nectar quality, p: pollen, sup: squads it can feed, r: radius (m)
const TYPES = {

  dandelion:{name:'Dandelions',       d:[1,9],  h:[9,17],   q:1.0,p:1.0, sup:10, r:190, col:['#f7c71a','#ffd94c','#e9aa0c']},
  hawthorn: {name:'Hawthorn hedge',   d:[5,10], h:[8,18],   q:1.2,p:.5,  sup:8,  r:150, col:['#f6f2e8','#ecdade','#ffffff']},

  rapeseed: {name:'Oilseed rape',     d:[4,10], h:[8,18],   q:1.5,p:.7,  sup:30, r:360, col:['#f3e11a','#ffea3c','#d8c510'], spray:true, field:true},

  primrose: {name:'Evening primrose', d:[10,18],h:[17,20.5],q:1.6,p:.6,  sup:10, r:140, col:['#fff37c','#f6e45c','#fffbb2']},
  phacelia: {name:'Phacelia strip',   d:[12,18],h:[8,17],   q:1.5,p:.9,  sup:16, r:210, col:['#91a5ea','#abb9f2','#7388d8'], field:true},

  heather:  {name:'Heather moor',     d:[17,22],h:[9,17],   q:1.4,p:.6,  sup:24, r:430, col:['#b6609f','#cb7cb6','#954980']},
  ivy:      {name:'Flowering ivy',    d:[19,22],h:[10,16],  q:1.3,p:.9,  sup:12, r:150, col:['#d1d96c','#bac656','#e2e88c']},

  water:    {name:'Pond',             d:[1,22], h:[6,21],   q:0,  p:0,   sup:0,  r:120, col:['#78bfdc'], water:true},
};
const ROUTE_COLS = ['#ffd166','#7fd1ff','#ff9f80','#c6a7ff','#9be38a','#ffb3d1','#f6e27a','#8ee6d6'];

  {id:'wings',   name:'Strong wings',    text:'Foragers fly 20% faster.'},

  {id:'baskets', name:'Pollen baskets',  text:'Every trip brings back 50% more pollen.'},
  {id:'scent',   name:'Scent marking',   text:'Foragers that land off target search twice as far for flowers.'},
  {id:'guards',  name:'Fierce guards',   text:'Losses to hornets, spray and rain are cut by 60%.'},

  {id:'frugal',  name:'Frugal hive',     text:'The colony eats 25% less and needs 10% less honey for winter.'},
  {id:'water',   name:'Water carriers',  text:'Water trips carry 2.5 times as much.'},
  {id:'weather', name:'Weather sense',   text:'Foragers come home before showers with no losses. Overcast days no longer cut nectar.'},

const EVENTS = {
  swarm:{title:'Swarm fever', text:'The hive is packed wall to wall. Scouts have found a hollow tree, and the old queen is ready to leave with half the colony.', choices:[
    {label:'Let them swarm', note:'Half the bees, a third of the honey and a fifth of the pollen leave. +1 daughter colony at year end. The new queen lays from the third night, a little faster.',

      fx:S=>{S.honey=Math.max(0,S.honey-1.5); S.swarmCool=S.day+4; return 'Wax builders went to work. The colony settled.';}}]},
  varroa:{title:'Mites in the brood', when:S=>S.day>=7, text:'Varroa mites are riding on young bees. A grooming morning would keep them in check.', choices:[
    {label:'Grooming morning', note:'No foraging until noon today.', fx:S=>{S.noFlyUntil=12; return 'Workers spent the morning grooming. Foragers fly from noon.';}},
    {label:'Ignore them', note:'+1% deaths every night for the rest of the year.', fx:S=>{S.mods.mort+=0.01; return 'The mites spread quietly.';}}]},
  waxmoth:{title:'Wax moths', when:S=>S.day>=4, text:'Moth larvae are tunnelling through old comb at the back of the hive.', choices:[
    {label:'Clean it out', note:'−0.8 kg honey.', fx:S=>{S.honey=Math.max(0,S.honey-0.8); return 'Old comb was chewed out and rebuilt.';}},
    {label:'Leave it', note:'Lose a quarter of tonight’s new brood.', fx:S=>{S.flags.moth=true; return 'The moths stayed.';}}]},
  queen:{title:'The queen is slowing', when:S=>S.day>=11&&S.day<=17, text:'Workers have started a queen cell. They want to replace her with a daughter.', choices:[
    {label:'Let them supersede', note:'No eggs for 3 nights, then +20% eggs.', fx:S=>{S.layPause=Math.max(S.layPause,3); S.mods.lay*=1.2; return 'A new queen will emerge in three days.';}},
    {label:'Keep the old queen', note:'−10% eggs from now on.', fx:S=>{S.mods.lay*=0.9; return 'The queen cell was torn down.';}}]},
  robbers:{title:'Robbers at the entrance', when:S=>S.day>=9&&S.honey>=8, text:'Bees from a wild colony are testing your guards. They can smell the stores.', choices:[
    {label:'Post guards', note:'8 forager squads stay home today.', fx:S=>{S.guardSquads=8; return '800 foragers are guarding the entrance today.';}},
    {label:'Risk it', note:'Half the time, robbers take 20% of the honey.', fx:S=>{ if(Math.random()<0.5){const l=S.honey*0.2; S.honey-=l; return `Robbers carried off ${l.toFixed(1)} kg of honey.`;} return 'The robbers gave up and left.';}}]},
  bear:{title:'Something at the oak', when:S=>S.day>=15, text:'Claws are scraping at the bark below the entrance. It smells of bear.', choices:[
    {label:'Sting it away', note:'Lose 700 bees.', fx:S=>{S.bees=Math.max(0,S.bees-700); return '700 bees died driving the bear off.';}},
    {label:'Stay quiet', note:'Half the time it tears out 30% of the honey.', fx:S=>{ if(Math.random()<0.5){const l=S.honey*0.3; S.honey-=l; return `The bear got a paw in and took ${l.toFixed(1)} kg of honey.`;} return 'The bear lost interest and wandered off.';}}]},
  lemonade:{title:'Spilled lemonade', when:S=>S.day>=8&&S.day<=17, text:'A picnic on the village green left a sticky pool of lemonade. Wasps have found it too.', choices:[
    {label:'Raid it', note:'+0.6 kg honey, lose 150 bees to wasps.', fx:S=>{S.honey+=0.6; S.bees=Math.max(0,S.bees-150); return 'Foragers brought back lemonade. 150 did not come home.';}},
    {label:'Leave it', note:'Nothing happens.', fx:()=> 'The wasps can have it.'}]},
  drought:{title:'Dry spell', when:S=>S.day>=9&&S.day<=19, text:'No rain for a week. For the next three days, flowers give 30% less nectar.', choices:[
    {label:'Understood', note:'', fx:S=>{S.droughtUntil=S.day+2; return 'Nectar stays thin until the end of day '+(S.day+2)+'.';}}]},
};

/* =========================================================
   UTILITIES
   ========================================================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function gauss(){let u=0;while(u===0)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*Math.random());}
function polar(b,d){return [d*Math.sin(b*D2R), d*Math.cos(b*D2R)];}
function bearingOf(x,y){return (Math.atan2(x,y)/D2R+360)%360;}
function norm360(a){return ((a%360)+360)%360;}
function signed180(a){return ((a%360)+540)%360-180;}
function compass(b){return ['N','NE','E','SE','S','SW','W','NW'][Math.round(norm360(b)/45)%8];}
function fmtDist(m){return m<950 ? (Math.round(m/10)*10)+' m' : (m/1000).toFixed(1)+' km';}
function fmtH(h){h=Math.max(0,h);const hh=Math.floor(h),mm=Math.floor((h-hh)*60+1e-6);return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function fmtN(n){return Math.round(n).toLocaleString('en-US');}
function relSun(a){a=signed180(a);const r=Math.round(Math.abs(a));if(r<=2)return 'straight toward the sun';if(r>=178)return 'straight away from the sun';return `${r}° ${a>0?'right':'left'} of the sun`;}
function segDist(ax,ay,bx,by,px,py){const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let t=L?((px-ax)*dx+(py-ay)*dy)/L:0;t=clamp(t,0,1);return Math.hypot(ax+dx*t-px,ay+dy*t-py);}
function season(d){return d<=7?'spring':d<=16?'summer':'autumn';}
function sunAz(h){const x=clamp((h-13)/7,-1,1);return norm360(180+120*Math.sin(x*Math.PI/2));}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stars(v,a,b){return v<a?'★':v<b?'★★':'★★★';}

/* =========================================================
   WORLD GENERATION
   ========================================================= */
function genWorld(seed){
  const R=mulberry32(seed>>>0);
  const rnd=(a,b)=>a+(b-a)*R();
  const W={seed,patches:[],hornets:[],woods:[],moor:[],fields:[],houses:[],lanes:[],river:[],trees:[]};
  const taken=[]; let pid=1;
  const fits=(x,y,r,ign)=>{
    const d=Math.hypot(x,y);
    if(d<260+r*0.6||d>C.RANGE-60-r*0.4) return false;
    for(const t of taken){ if(t.tag&&ign&&ign.includes(t.tag)) continue; if(Math.hypot(t.x-x,t.y-y)<t.r+r+(t.tag?20:80)) return false; }
    return true;
  };
  const add=(type,x,y,r,name)=>{
    const T=TYPES[type];
    const q=T.water?0:T.q*rnd(.88,1.12);
    const Rr=T.water?0:T.sup*q*0.008;
    const p={id:pid++,type,name:name||T.name,label:'',x,y,r,q,p:T.water?0:T.p*rnd(.85,1.15),R:Rr,Smax:Rr*3,S:Rr*3,known:false,spray:false,spraySeen:false,ang:R()*Math.PI,dots:[]};
    makeDots(p,R); W.patches.push(p); taken.push({x,y,r}); return p;
  };
  const near=(type,cx,cy,spread,ign,dmin=0,dmax=1e9,name)=>{
    const T=TYPES[type];
    for(let i=0;i<160;i++){
      const a=R()*TAU,d=Math.sqrt(R())*spread,x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d,r=T.r*rnd(.85,1.15),dd=Math.hypot(x,y);
      if(dd<dmin||dd>dmax) continue;
      if(fits(x,y,r,ign)) return add(type,x,y,r,name);
    }
    return null;
  };
  const ring=(type,dmin,dmax,ign,name)=>{
    const T=TYPES[type];
    for(let i=0;i<200;i++){
      const [x,y]=polar(R()*360,rnd(dmin,dmax)); const r=T.r*rnd(.85,1.15);
      if(fits(x,y,r,ign)) return add(type,x,y,r,name);
    }
    return null;
  };
  // Regions in four rough quarters
  const b0=R()*360;
  const dirs=shuffle([b0, b0+90+rnd(-20,20), b0+180+rnd(-20,20), b0+270+rnd(-20,20)],R);
  const V=polar(dirs[0],rnd(1100,1550)), F=polar(dirs[1],rnd(1300,1850)), Wd=polar(dirs[2],rnd(1050,1450)), M=polar(dirs[3],rnd(2350,2600));
  W.village={x:V[0],y:V[1]}; W.farm={x:F[0],y:F[1]}; W.wood={x:Wd[0],y:Wd[1]}; W.moorC={x:M[0],y:M[1]};
  // River
  const phi=R()*Math.PI, dx=Math.cos(phi), dy=Math.sin(phi), nx=-dy, ny=dx, off=rnd(480,820)*(R()<.5?-1:1), ph=R()*TAU, ph2=R()*TAU;
  for(let t=-4200;t<=4200;t+=110){
    const w=Math.sin(t/650+ph)*150+Math.sin(t/230+ph2)*35;
    const x=nx*(off+w)+dx*t, y=ny*(off+w)+dy*t;
    W.river.push([x,y]);
    if(Math.hypot(x,y)<C.RANGE+200) taken.push({x,y,r:55,tag:'river'});
  }
  // Woods
  for(let i=0;i<7;i++){ const a=R()*TAU,d=R()*420; const c={x:Wd[0]+Math.cos(a)*d,y:Wd[1]+Math.sin(a)*d,r:rnd(230,400)}; if(Math.hypot(c.x,c.y)<c.r+250) continue; W.woods.push(c); taken.push({x:c.x,y:c.y,r:c.r*0.8,tag:'wood'}); }
  // Moor
  for(let i=0;i<6;i++){ const a=R()*TAU,d=R()*420; const c={x:M[0]+Math.cos(a)*d,y:M[1]+Math.sin(a)*d,r:rnd(300,500)}; W.moor.push(c); taken.push({x:c.x,y:c.y,r:c.r*0.7,tag:'moor'}); }
  // Water first: the nearest river point within range, a pond, a second river point
  let best=null,bd=1e9; for(const [x,y] of W.river){const d=Math.hypot(x,y); if(d>350&&d<bd){bd=d;best=[x,y];}}
  if(best&&bd<C.RANGE-200) add('water',best[0],best[1],110,'River shallows');
  ring('water',450,900,null,'Pond');
  const farPts=W.river.filter(([x,y])=>{const d=Math.hypot(x,y);return d>1300&&d<2600;});
  if(farPts.length){ const pt=farPts[Math.floor(R()*farPts.length)]; if(fits(pt[0],pt[1],100,['river'])) add('water',pt[0],pt[1],100,'River pool'); }
  // Willows by the river
  for(let k=0;k<2;k++){ const pts=W.river.filter(([x,y])=>{const d=Math.hypot(x,y);return d>500&&d<2100;}); for(let i=0;i<40&&pts.length;i++){ const pt=pts[Math.floor(R()*pts.length)]; const r=TYPES.willow.r*rnd(.85,1.15); if(fits(pt[0],pt[1],r,['river'])){add('willow',pt[0],pt[1],r);break;} } }
  // Guaranteed early food near the oak
  ring('dandelion',380,620);
  // Village
  for(let i=0;i<3;i++) near('garden',V[0],V[1],300,['river']);
  near('linden',V[0],V[1],420,['river']);
  near('lavender',V[0],V[1],520,['river']);
  // Farm
  near('rapeseed',F[0],F[1],650);
  near('sunflower',F[0],F[1],700);
  near('phacelia',F[0],F[1],750);
  near('orchard',F[0],F[1],850);
  // Woods & moor
  for(let i=0;i<2;i++) near('bramble',Wd[0],Wd[1],720,['wood']);
  for(let i=0;i<2;i++) near('ivy',Wd[0],Wd[1],520,['wood']);
  for(let i=0;i<2;i++) near('heather',M[0],M[1],480,['moor'],0,C.RANGE-40);
  // Meadows & hedges
  for(let i=0;i<2;i++) ring('dandelion',500,1800);
  for(let i=0;i<3;i++) ring('clover',450,2300);
  for(let i=0;i<2;i++) ring('hawthorn',450,2100);
  for(let i=0;i<2;i++) ring('primrose',600,2400);
  for(let i=0;i<2;i++) ring('goldenrod',700,2600);
  // Hornets
  for(let i=0;i<80;i++){ const a=R()*TAU,d=R()*380,x=Wd[0]+Math.cos(a)*d,y=Wd[1]+Math.sin(a)*d; if(Math.hypot(x,y)>850&&Math.hypot(x,y)<C.RANGE-200){W.hornets.push({x,y,r:260,known:false});break;} }
  for(let i=0;i<120;i++){ const [x,y]=polar(R()*360,rnd(1500,2600)); if(W.hornets.every(h=>Math.hypot(h.x-x,h.y-y)>900)){W.hornets.push({x,y,r:260,known:false});break;} }
  // Decor: houses, fields, lanes, trees
  for(let i=0;i<60&&W.houses.length<20;i++){ const a=R()*TAU,d=Math.sqrt(R())*360,x=V[0]+Math.cos(a)*d,y=V[1]+Math.sin(a)*d; if(W.river.some(([rx,ry])=>Math.hypot(rx-x,ry-y)<90)) continue; if(W.houses.some(h=>Math.hypot(h.x-x,h.y-y)<55)) continue; W.houses.push({x,y,w:rnd(26,46),h:rnd(18,30),a:R()*Math.PI,roof:['#9b4a32','#7d3a2a','#8c6a4a','#6d5545'][Math.floor(R()*4)]}); }
  for(let i=0;i<3;i++){ const a=R()*TAU,d=rnd(500,1000),x=F[0]+Math.cos(a)*d,y=F[1]+Math.sin(a)*d; if(Math.hypot(x,y)<C.RANGE+300) W.fields.push({x,y,w:rnd(380,620),h:rnd(260,420),a:R()*Math.PI,kind:R()<.5?'plough':'stubble'}); }
  const lane=(ax,ay,bx,by)=>{const pts=[];const n=18;const wob=R()*TAU;for(let i=0;i<=n;i++){const t=i/n;const px=lerp(ax,bx,t),py=lerp(ay,by,t);const s=Math.sin(t*Math.PI)*Math.sin(t*5+wob)*90;pts.push([px+(-(by-ay))/Math.hypot(bx-ax,by-ay)*s,py+(bx-ax)/Math.hypot(bx-ax,by-ay)*s]);}W.lanes.push(pts);};
  lane(0,0,V[0],V[1]); lane(V[0],V[1],F[0],F[1]);
  for(let i=0;i<120;i++){ const [x,y]=polar(R()*360,rnd(300,3300)); W.trees.push({x,y,r:rnd(18,32)}); }
  // Labels: duplicate names get a compass suffix
  const cnt={}; for(const p of W.patches) cnt[p.name]=(cnt[p.name]||0)+1;
  for(const p of W.patches){ p.dist=Math.hypot(p.x,p.y); p.bearing=bearingOf(p.x,p.y); p.label = cnt[p.name]>1 ? `${p.name} (${compass(p.bearing)})` : p.name; }
  // Make duplicate labels unique (same name & same compass)
  const seen={}; for(const p of W.patches){ if(seen[p.label]){ seen[p.label]++; p.label+=' '+seen[p.label]; } else seen[p.label]=1; }
  return W;
}
function makeDots(p,R){
  const T=TYPES[p.type]; if(T.water) return;
  if(T.field){
    const L=p.r*1.9, Wd=p.r*1.25, rows=Math.max(4,Math.round(Wd/38)), per=Math.max(6,Math.round(L/30));
    const ca=Math.cos(p.ang), sa=Math.sin(p.ang);
    for(let i=0;i<rows;i++) for(let j=0;j<per;j++){
      if(R()<0.25) continue;
      const u=(j/(per-1)-0.5)*L+(R()-.5)*14, v=(i/(rows-1)-0.5)*Wd+(R()-.5)*8;
      p.dots.push([u*ca-v*sa,u*sa+v*ca,Math.floor(R()*T.col.length),1.4+R()*1.2]);
    }
  } else {
    const n=Math.round(clamp(p.r/5,22,90));
    for(let i=0;i<n;i++){ const a=R()*TAU, d=Math.pow(R(),0.6)*p.r; p.dots.push([Math.cos(a)*d,Math.sin(a)*d,Math.floor(R()*T.col.length),1.3+R()*1.4]); }
  }
  shuffle(p.dots,R);
}

/* =========================================================
   STATE & SIMULATION
   ========================================================= */
let W=null, S=null;
let HEADLESS=false;

function newRun(seed,mode){
  W=genWorld(seed);
  S={v:1,seed,mode,day:1,hour:C.DAY0,phase:'morning',
     bees:C.START_BEES,brood:[800,900,1000],honey:C.START_HONEY,pollen:C.START_POLLEN,water:0,waterNeed:0,
     weather:{kind:'sunny',rain:null,hot:false},perks:[],mods:{mort:0,lay:1},layPause:0,swarms:0,swarmCool:0,
     used:[],noFlyUntil:0,guardSquads:0,droughtUntil:0,flags:{},
     fog:new Uint8Array(C.FOG_N*C.FOG_N),squads:[],routes:[],scouts:[],scoutPlan:[],nid:1,rcol:0,
     today:blankToday(),log:[],morning:null,pendingPerk:null,stats:{found:0,totalH:0,peakBees:C.START_BEES,trips:0},
     tut:0};
  reveal(0,0,C.REV_HOME,true);
  prepMorning();
  return S;
}
function blankToday(){return {h:0,p:0,w:0,fuel:0,lost_hornet:0,lost_spray:0,lost_rain:0,trips:0};}
function hasPerk(id){return S.perks.includes(id);}
function dayEnd(){return hasPerk('dusk')?21:C.DAY1;}
function isRaining(h){const r=S.weather.rain;return !!r&&h>=r[0]&&h<r[1];}
function flySpeed(){return C.SPEED*(hasPerk('wings')?1.2:1)*(S.weather.kind==='windy'?0.85:1);}
function spreadAt(d){return (C.SPREAD0+C.SPREADK*d)*(S.weather.kind==='windy'?1.5:1)*(hasPerk('precise')?0.65:1);}
function guardMult(){return hasPerk('guards')?0.4:1;}
function inBloom(p,day){const T=TYPES[p.type];return day>=T.d[0]&&day<=T.d[1];}
function bloomStr(p,day){const T=TYPES[p.type];if(day<T.d[0]||day>T.d[1])return 0;if(T.water)return 1;if(T.d[1]-T.d[0]>=4&&(day===T.d[0]||day===T.d[1]))return .6;return 1;}
function isOpen(p,h){const T=TYPES[p.type];return h>=T.h[0]&&h<T.h[1];}
function patchById(id){return W.patches.find(p=>p.id===id)||null;}
function routeById(id){return id?S.routes.find(r=>r.id===id)||null:null;}
function winterNeed(b){return (C.W_BASE+(b===undefined?S.bees:b)*C.W_BEE)*(hasPerk('frugal')?0.9:1);}
function layCap(d){return d<=7?900+100*d:d<=16?1800:Math.max(400,1800-220*(d-16));}
function fogIdx(x,y){const n=C.FOG_N,h=n*C.FOG_CELL/2;const i=Math.floor((x+h)/C.FOG_CELL),j=Math.floor((h-y)/C.FOG_CELL);if(i<0||j<0||i>=n||j>=n)return -1;return j*n+i;}
function fogAt(x,y){const k=fogIdx(x,y);return k<0?1:S.fog[k];}
function idleSquads(){return S.squads.filter(q=>q.st==='idle');}

let fogDirty=true, fogPaint=null;
function reveal(x,y,rad,silent){
  const n=C.FOG_N,cell=C.FOG_CELL,h=n*cell/2;
  const i0=Math.max(0,Math.floor((x-rad+h)/cell)),i1=Math.min(n-1,Math.floor((x+rad+h)/cell));
  const j0=Math.max(0,Math.floor((h-(y+rad))/cell)),j1=Math.min(n-1,Math.floor((h-(y-rad))/cell));
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const cx=-h+(i+.5)*cell,cy=h-(j+.5)*cell;if(Math.hypot(cx-x,cy-y)<=rad){S.fog[j*n+i]=1;}}
  if(fogPaint) fogPaint(x,y,rad);
  for(const p of W.patches){
    if(p.known) continue;
    if(Math.hypot(p.x-x,p.y-y)<rad+p.r*0.4){
      p.known=true; S.stats.found++;
      if(!silent){ log(`Found ${p.label}, ${fmtDist(p.dist)} ${compass(p.bearing)}.`,'good'); }
    }
  }
  for(const hn of W.hornets){ if(!hn.known&&Math.hypot(hn.x-x,hn.y-y)<rad*0.7){hn.known=true; if(!silent) log(`Spotted a hornet nest ${fmtDist(Math.hypot(hn.x,hn.y))} ${compass(bearingOf(hn.x,hn.y))}. Hornets hunt foragers that pass near it from day 9.`,'bad');} }
}

function mkSquad(n){return {id:S.nid++,n,st:'idle',route:0,x:0,y:0,lx:0,ly:0,t:0,load:null,pid:0,poor:0,why:'',jit:Math.random()*TAU};}
function buildSquads(){
  const foragers=Math.floor(S.bees*C.FOR_FRAC);
  const ns=Math.floor(foragers/C.SQUAD), rem=foragers-ns*C.SQUAD;
  S.squads=[];
  for(let i=0;i<ns;i++) S.squads.push(mkSquad(C.SQUAD));
  if(rem>=30) S.squads.push(mkSquad(rem));
  const g=Math.min(S.guardSquads,S.squads.length);
  for(let i=0;i<g;i++) S.squads[i].st='guard';
  if(hasPerk('memory')&&S.routes.length){
    const idle=idleSquads(); let k=0;
    for(const r of S.routes){ const want=Math.min(r.want||0,idle.length-k); for(let i=0;i<want;i++){const q=idle[k++];q.route=r.id;q.st='wait';q.t=i*2.5;} }
    S.routes=S.routes.filter(r=>S.squads.some(q=>q.route===r.id));
  } else S.routes=[];
  for(const r of S.routes){r.waitUntil=0;r.todayH=0;r.todayP=0;r.todayW=0;r.trips=0;r.poisonWarned=false;r.waitLogged=false;r.lost=0;r.why='';}
}

function createRoute(bearing,dist,k,srcPid){
  dist=clamp(dist,60,C.RANGE);
  const idle=idleSquads(); k=Math.min(k,idle.length); if(k<=0) return null;
  const [ax,ay]=polar(bearing,dist);
  let tgt=srcPid?patchById(srcPid):null;
  if(!tgt){ let bd=1e9; for(const p of W.patches){ if(!p.known) continue; const d=Math.hypot(p.x-ax,p.y-ay)-p.r; if(d<150&&d<bd){bd=d;tgt=p;} } }
  const r={id:S.nid++,ax,ay,bearing:norm360(bearing),dist,col:ROUTE_COLS[S.rcol++%ROUTE_COLS.length],pid:tgt?tgt.id:0,

function recallRoute(id){

function kill(q,n,cause){n=Math.min(n,q.n);q.n-=n;S.bees=Math.max(0,S.bees-n);S.today['lost_'+cause]+=n;if(q.n<15){S.bees=Math.max(0,S.bees-q.n);S.today['lost_'+cause]+=q.n;q.n=0;q.dead=true;}}

function depart(q,r){

function hornetCheck(q,r){

    if(Math.random()>=0.3) continue;

function arrive(q){

let chimeCb=null;

function moveTo(o,tx,ty,step){

function launchScout(){

    for(const q of S.squads){ if(q.st==='out'||q.st==='forage'){ q.st='back'; q.load=null; if(rainNow&&!hasPerk('weather')){const loss=Math.round(q.n*0.06*guardMult()); if(loss>0) kill(q,loss,'rain');} } }

/* ---------- night ---------- */
function night(){

  sm.broodLostW=broodLostW;
  const emerged=S.brood[0]; S.bees+=emerged; sm.emerged=emerged;
  let cap=layCap(S.day)*S.mods.lay*(hasPerk('queen')?1.25:1), laid=0, limit='';
  if(S.layPause>0){ S.layPause--; limit='queenless'; }

    const byP=S.pollen/C.EGG_P, byH=Math.max(0,S.honey-0.3)/C.EGG_H;
    laid=Math.max(0,Math.floor(Math.min(cap,byP,byH)));

  }
  let mothLoss=0; if(S.flags.moth){ mothLoss=Math.round(laid*0.25); laid-=mothLoss; }
  S.brood=[S.brood[1],S.brood[2],laid];
  sm.laid=laid; sm.cap=Math.round(cap); sm.limit=limit; sm.mothLoss=mothLoss;
  const eat=S.bees*C.EAT*(hasPerk('frugal')?0.75:1);
  S.honey-=eat; sm.eat=eat; sm.eggHoney=laid*C.EGG_H; sm.starved=0;
  if(S.honey<0){ sm.starved=Math.round(S.bees*0.2); S.bees-=sm.starved; S.honey=0; }
  const mort=(C.MORT+S.mods.mort)*(hasPerk('hardy')?0.7:1);
  const died=Math.round(S.bees*mort); S.bees-=died; sm.died=died;

function rollWeather(day){

         : se==='summer'?[['sunny',.36],['hot',.30],['cloudy',.10],['showers',.14],['windy',.10]]

  let x=R(), kind=t[t.length-1][0];
  for(const [k,w] of t){ if(x<w){kind=k;break;} x-=w; }
  const w={kind,rain:null,hot:kind==='hot'};
  if(kind==='showers'){ const s=9+Math.floor(R()*14)/2, len=1.5+Math.floor(R()*4)/2; w.rain=[s,Math.min(s+len,19.5)]; }
  return w;
}
function weatherText(w){

    case 'sunny': return 'Sunny. Good flying all day.';
    case 'hot': return 'Hot. The brood needs water carried in to stay cool.';
    case 'cloudy': return 'Overcast. Flowers give 20% less nectar.';
    case 'windy': return 'Windy. Recruits scatter more and fly slower.';
    case 'showers': return `Showers from ${fmtH(w.rain[0])} to ${fmtH(w.rain[1])}. Nobody flies in the rain.`;

}

    const T=TYPES[key]; if(T.water||T.d[0]!==S.day||S.day===1||hinted) continue;

  }

  if(S.day===8) notes.push({t:'Summer begins. The queen lays at full pace now.',k:''});

function renderCombBase(){
  const s=CV.s, cw=CV.w, ch=CV.h, broodT=S.brood.reduce((a,b)=>a+b,0);
  const key=[cw,ch,CV.dpr,Math.round(S.honey*2),Math.round(S.pollen*10),Math.round(broodT/250)].join('|');
  if(key===combKey) return; combKey=key;
  const d=CV.dpr; combBase.width=cw*d; combBase.height=ch*d;
  const g=combBase.getContext('2d'); g.setTransform(d,0,0,d,0,0);
  g.fillStyle='#1a1209'; g.fillRect(0,0,cw,ch);
  const hr=s/27, w=Math.sqrt(3)*hr, hh=1.5*hr, cc=combCenter();
  const cells=[];
  for(let row=-1;row*hh<ch+hr;row++) for(let col=-1;col*w<cw+w;col++){ const x=col*w+(row&1?w/2:0), y=row*hh; cells.push({x,y,dc:Math.hypot(x-cc.x,y-cc.y),kind:'empty',seed:(row*131+col*71)&1023}); }
  const floorR=s*0.2;
  const inner=cells.filter(c=>c.dc>floorR).sort((a,b)=>a.dc-b.dc);
  cells.forEach(c=>{ if(c.dc<=floorR) c.kind='floor'; });
  const N=inner.length;
  const nb=Math.round(N*0.30*clamp(broodT/9000,0,1));
  const np=Math.round(N*0.14*clamp(S.pollen/5,0,1));
  for(let i=0;i<nb;i++) inner[i].kind='brood';
  for(let i=nb;i<nb+np&&i<N;i++) inner[i].kind='pollen';
  const rest=inner.slice(nb+np).sort((a,b)=>a.y-b.y);
  const nh=Math.round(rest.length*0.62*clamp(S.honey/40,0,1));
  for(let i=0;i<nh;i++){ rest[i].kind='honey'; rest[i].capped=i<nh*0.55; }
  const PC=['#e8a33a','#d9c34a','#c45e2a','#b38ad0','#e6d070','#9fb44a','#e07b3c'];
  const hex=(x,y,r)=>{g.beginPath();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();};
  for(const c of cells){
    hex(c.x,c.y,hr*0.97);
    switch(c.kind){
      case 'floor': g.fillStyle='#21170c'; g.fill(); g.strokeStyle='#3b2a19'; g.lineWidth=1.4; g.stroke(); break;
      case 'empty': g.fillStyle='#2a1d10'; g.fill(); g.strokeStyle='#5a4128'; g.lineWidth=1.6; g.stroke(); hex(c.x,c.y,hr*0.62); g.fillStyle='#1f150b'; g.fill(); break;
      case 'brood': { g.fillStyle='#5a4128'; g.fill(); hex(c.x,c.y,hr*0.86); const gr=g.createRadialGradient(c.x-hr*.25,c.y-hr*.3,1,c.x,c.y,hr); gr.addColorStop(0,'#e0b06a'); gr.addColorStop(1,'#9a6430'); g.fillStyle=gr; g.fill(); break; }
      case 'pollen': { g.fillStyle='#5a4128'; g.fill(); hex(c.x,c.y,hr*0.78); g.fillStyle=PC[c.seed%PC.length]; g.fill(); g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.arc(c.x+hr*.18,c.y+hr*.2,hr*.35,0,TAU); g.fill(); break; }
      case 'honey': { g.fillStyle='#6a4a22'; g.fill(); hex(c.x,c.y,hr*0.84); if(c.capped){ g.fillStyle='#ecd59a'; g.fill(); g.fillStyle='rgba(255,255,255,.25)'; g.beginPath(); g.arc(c.x-hr*.2,c.y-hr*.25,hr*.25,0,TAU); g.fill(); } else { const gr=g.createRadialGradient(c.x-hr*.2,c.y-hr*.3,1,c.x,c.y,hr); gr.addColorStop(0,'#ffd76a'); gr.addColorStop(1,'#c97c0c'); g.fillStyle=gr; g.fill(); g.fillStyle='rgba(255,255,255,.4)'; g.beginPath(); g.ellipse(c.x-hr*.25,c.y-hr*.3,hr*.18,hr*.09,-0.5,0,TAU); g.fill(); } break; }
    }
  }
  const vg=g.createRadialGradient(cc.x,cc.y,s*0.15,cc.x,cc.y,Math.max(cw,ch)*0.72); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(8,5,2,.78)'); g.fillStyle=vg; g.fillRect(0,0,cw,ch);
  const sp=g.createRadialGradient(cc.x,cc.y,0,cc.x,cc.y,s*0.24); sp.addColorStop(0,'rgba(255,200,110,.10)'); sp.addColorStop(1,'rgba(255,200,110,0)'); g.fillStyle=sp; g.fillRect(0,0,cw,ch);

function initCrowd(){
  const R=mulberry32(77); crowd=[];
  for(let i=0;i<46;i++){ const a=R()*TAU, d=0.1+R()*0.36; crowd.push({a,d,h:R()*TAU,sp:0.02+R()*0.05,ph:R()*10}); }

// one figure-eight waggle dance: run through the centre, loop back on alternating sides
function danceShape(t,ang,km,len){
  const runT=0.25+0.75*km, retT=0.75, cyc=runT+retT;
  const n=Math.floor(t/cyc), tc=t-n*cyc, side=n%2?1:-1;
  const ux=Math.sin(ang), uy=-Math.cos(ang), px=-uy, py=ux;
  if(tc<runT){ const f=tc/runT, along=(f-0.5)*len, lat=Math.sin(tc*TAU*13)*len*0.06; return {x:ux*along+px*lat,y:uy*along+py*lat,h:ang+Math.sin(tc*TAU*13)*0.35,wag:true}; }
  const th=(tc-runT)/retT*Math.PI;
  const along=Math.cos(th)*len/2, lat=side*Math.sin(th)*len*0.42;
  const dax=-Math.sin(th)*len/2, dlat=side*Math.cos(th)*len*0.42;
  return {x:ux*along+px*lat,y:uy*along+py*lat,h:Math.atan2(ux*dax+px*dlat,-(uy*dax+py*dlat)),wag:false};
}
function comb2dance(x,y){
  const cc=combCenter(); const dx=x-cc.x, dy=y-cc.y; const r=Math.hypot(dx,dy);
  const ang=Math.atan2(dx,-dy)/D2R;
  const dist=clamp(r/cc.R,0,1)*C.RANGE;
  return {ang:norm360(ang),dist,r};
}
function dancePreview(){

  const d=comb2dance(hold.x,hold.y); if(d.dist<100) return null;

}

let hoverDancer=null;

function addDancer(p){

  let dx=0.3,dy=0.1;
  for(let i=0;i<60;i++){ const a=Math.random()*TAU, d=0.25+Math.random()*0.1; dx=Math.cos(a)*d; dy=Math.sin(a)*d; if(dy<-0.22) continue; if(DANCERS.every(o=>Math.hypot(o.dx-dx,o.dy-dy)>0.24)) break; }
  DANCERS.push({pid:p.id,dx:clamp(dx,-0.36,0.36),dy:clamp(dy,-0.3,0.36),age:0,life:14});
  if(DANCERS.length>3) DANCERS.shift();
}

  hold= dn ? {mode:'follow',dancer:dn,pid:dn.pid,x:pt.x,y:pt.y,t:0,circuits:0,next:0.28,interval:0.28,id:e.pointerId}

function endHold(e,cancel){
  if(!hold||(e&&hold.id!==e.pointerId)) return;
  const h=hold; hold=null;
  const cc=combCenter(), s=CV.s;
  let bearing,dist,pid=0,ang,km,ox=cc.x,oy=cc.y;
  if(h.mode==='follow'){ const p=patchById(h.pid); if(!p) return; bearing=p.bearing; dist=p.dist; pid=p.id; ang=(p.bearing-sunAz(S.hour))*D2R; ox=cc.x+h.dancer.dx*s; oy=cc.y+h.dancer.dy*s; }
  else { const d=comb2dance(h.x,h.y); if(d.dist<100){ if(!cancel) toast('Drag away from the centre: distance from the centre is distance to fly.'); return; } bearing=sunAz(S.hour)+d.ang; dist=d.dist; ang=d.ang*D2R; }
  km=dist/1000;
  if(cancel||h.circuits<=0){ if(!cancel&&h.circuits<=0) toast(idleSquads().length?'Hold a little longer: each dance circuit recruits a squad.':'No idle squads. Recall a route to free some.'); return; }
  const r=createRoute(bearing,dist,h.circuits,pid);
  if(r){
    lastDance={t:h.t,ang,km,len:s*(0.07+0.13*km/3),ox,oy};
    AU.send();
    toast(`${h.circuits} squad${h.circuits===1?'':'s'} → ${fmtDist(dist)} ${compass(bearing)}${r.pid?' · '+r.label:''}`,'good');
    if(S.tut===1) { S.tut=2; showCoach(); }
  }
}

function syncList(box,items,keyFn,make,update){
  const old=new Map(); for(const el of Array.from(box.children)) if(el.dataset.key) old.set(el.dataset.key,el); else el.remove();
  items.forEach((it,i)=>{ const k=String(keyFn(it)); let el=old.get(k); if(el) old.delete(k); else { el=make(it); el.dataset.key=k; } update(el,it); if(box.children[i]!==el) box.insertBefore(el,box.children[i]||null); });
  old.forEach(el=>el.remove());
}
function routeStatus(r){
  const sq=S.squads.filter(q=>q.route===r.id);

  const out=sq.filter(q=>q.st==='out'||q.st==='forage'||q.st==='back').length;
  return {t:out?`${out} in the air`:'between trips',k:'open'};
}

    <div class="wx" style="font-size:14px;color:var(--text)">${WX_ICON[S.weather.kind]}<span>${esc(weatherText(S.weather))}</span></div>
    ${S.weather.hot?`<p class="sub">Carry ${S.waterNeed.toFixed(1)} L of water today (dance to a pond or the river), or some brood will overheat.</p>`:''}
    ${m.notes.length?`<ul>${m.notes.map(n=>`<li class="${n.k==='bad'?'warnline':n.k==='good'?'hint':''}">${esc(n.t)}</li>`).join('')}</ul>`:''}
    <div class="ledger"><span>Honey</span><b>${S.honey.toFixed(1)} kg</b><span>Pollen</span><b>${S.pollen.toFixed(2)} kg</b><span>Bees</span><b>${fmtN(S.bees)}</b><span>Forager squads</span><b>${S.squads.length}</b>${S.perks.length?`<span>Instincts</span><b style="font-family:var(--body)">${S.perks.map(id=>PERKS.find(p=>p.id===id).name).join(', ')}</b>`:''}</div>
    ${ev?`<div class="card"><h3>${esc(ev.title)}</h3><p>${esc(ev.text)}</p><div class="choices">${ev.choices.map((c,i)=>`<button class="choice" data-ev="${i}"><b>${esc(c.label)}</b>${c.note?`<span>${esc(c.note)}</span>`:''}</button>`).join('')}</div></div>`
         :`${m.result?`<p class="hint">${esc(m.result)}</p>`:''}<div class="actions"><button class="big" data-go>Start the day</button></div>`}
  `,el=>{
    el.querySelectorAll('[data-ev]').forEach(b=>b.addEventListener('click',()=>{ applyEvent(+b.dataset.ev); save(); showMorning(); }));
    const go=el.querySelector('[data-go]'); if(go) go.addEventListener('click',()=>{ closeModal(); startDay(); setPaused(false); showCoach(); });
  });
}
function showNight(sm){
  AU.dusk();
  const lost=sm.lostHornet+sm.lostSpray+sm.lostRain;
  const row=(a,b,neg)=>`<span>${a}</span><b class="${neg?'neg':''}">${b}</b>`;
  openModal(`
    <div class="eyebrow">Night</div>
    <h2>Day ${sm.day} is over</h2>
    <div class="ledger">
      ${row('Honey brought in','+'+sm.h.toFixed(2)+' kg')}
      ${row('Honey burned in flight','−'+sm.fuel.toFixed(2)+' kg',true)}
      ${row('Honey eaten by the colony','−'+sm.eat.toFixed(2)+' kg',true)}
      ${row('Honey fed to new brood','−'+sm.eggHoney.toFixed(2)+' kg',true)}
      ${row('Pollen brought in','+'+sm.p.toFixed(2)+' kg')}
      ${sm.hot?row('Water carried',`${sm.w.toFixed(1)} of ${sm.waterNeed.toFixed(1)} L`,sm.w<sm.waterNeed):''}
      <i class="sep"></i>
      ${row('Eggs laid',fmtN(sm.laid)+(sm.limit==='pollen'?' (short of pollen)':sm.limit==='honey'?' (short of honey)':sm.limit==='queenless'?' (no laying queen)':''),sm.limit&&sm.limit!=='queenless')}
      ${row('Young bees emerged','+'+fmtN(sm.emerged))}
      ${row('Died of old age','−'+fmtN(sm.died),true)}
      ${lost?row('Lost in the field ('+[sm.lostHornet?`hornets ${fmtN(sm.lostHornet)}`:'',sm.lostSpray?`spray ${fmtN(sm.lostSpray)}`:'',sm.lostRain?`rain ${fmtN(sm.lostRain)}`:''].filter(Boolean).join(', ')+')','−'+fmtN(lost),true):''}
      ${sm.broodLostW?row('Brood lost to heat','−'+fmtN(sm.broodLostW),true):''}
      ${sm.mothLoss?row('Brood lost to wax moths','−'+fmtN(sm.mothLoss),true):''}
      ${sm.starved?row('Starved','−'+fmtN(sm.starved),true):''}
      <i class="sep"></i>
      ${row('Honey in the comb',sm.honey.toFixed(1)+' kg')}
      ${row('Pollen in the comb',sm.pollen.toFixed(2)+' kg')}
      ${row('Bees',fmtN(sm.bees))}
      ${row('Brood',fmtN(sm.brood))}
    </div>
    ${sm.starved?'<p class="warnline">The honey ran out overnight. A fifth of the colony starved.</p>':''}
    ${sm.limit==='pollen'?'<p class="warnline">The queen stopped laying early because there was not enough pollen. Fewer bees will emerge in three days.</p>':''}
    <div class="actions"><button class="big" data-go>${sm.end?'Continue':'Sleep'}</button></div>
  `,el=>{
    el.querySelector('[data-go]').addEventListener('click',()=>{
      if(sm.end==='collapse') return showCollapse();
      if(sm.end==='winter') return showWinter();
      if(S.pendingPerk) return showPerk();
      showMorning();
    });
  });
}
function showPerk(){
  const ids=S.pendingPerk||[]; if(!ids.length){ S.pendingPerk=null; return showMorning(); }
  openModal(`
    <div class="eyebrow">The colony learns</div>
    <h2>Choose an instinct</h2>
    <p class="sub">Every third night the colony settles into a new habit. It lasts for the rest of the year.</p>
    <div class="perks">${ids.map(id=>{const p=PERKS.find(x=>x.id===id);return `<button class="choice" data-perk="${id}"><b>${esc(p.name)}</b><span>${esc(p.text)}</span></button>`;}).join('')}</div>
  `,el=>{
    el.querySelectorAll('[data-perk]').forEach(b=>b.addEventListener('click',()=>{ choosePerk(b.dataset.perk); log(`New instinct: ${PERKS.find(p=>p.id===b.dataset.perk).name}.`,'good'); if(b.dataset.perk==='memory'){} buildSquadsKeep(); save(); showMorning(); }));
  });
}
function buildSquadsKeep(){ buildSquads(); }
function recordBest(score){ const b=+(lsGet(BEST_KEY)||0); if(score>b){ lsSet(BEST_KEY,String(score)); return true; } return false; }
function showWinter(){
  const r=winterResult(); const nb=recordBest(r.score); lsDel(SAVE_KEY);
  openModal(`
    <div class="eyebrow">Winter</div>
    <h2>${r.survive?'The colony survived':'The colony did not survive'}</h2>
    <p class="result">${esc(r.grade)}</p>
    <p>${r.survive?`The bees clustered tight around the queen and shivered their wing muscles warm through the cold months. In March the first foragers flew out to the willows.`:esc(r.why)}</p>
    <div class="ledger">
      <span>Honey stored</span><b>${S.honey.toFixed(1)} kg</b>
      <span>Honey needed</span><b>${r.need.toFixed(1)} kg</b>
      <span>Winter cluster</span><b>${fmtN(S.bees)} bees (min ${fmtN(C.CLUSTER)})</b>
      <span>Daughter colonies</span><b>${S.swarms}</b>
      <span>Flower patches found</span><b>${S.stats.found} of ${W.patches.length}</b>
      <i class="sep"></i>
      <span>Score</span><b>${fmtN(r.score)}${nb?' · new best':''}</b>
    </div>
    <p class="sub">Score: 1,000 for surviving, 400 per swarm, 30 per spare kilo of honey, 1 per 50 bees, 5 per patch found.</p>
    <div class="actions"><button class="big" data-new="guided">New year, Guided</button><button class="big ghost" data-new="wild">New year, Wild</button></div>
  `,el=>el.querySelectorAll('[data-new]').forEach(b=>b.addEventListener('click',()=>beginNew(b.dataset.new))));
}
function showCollapse(){
  lsDel(SAVE_KEY);
  openModal(`
    <div class="eyebrow">Day ${S.day-1}</div>
    <h2>The colony collapsed</h2>
    <p>Too few bees were left to keep the brood warm and the queen fed. The oak is quiet now.</p>
    <p class="sub">Feed the brood with pollen every night, keep honey above zero, and keep foragers away from hornets and sprayed fields.</p>
    <div class="actions"><button class="big" data-new="guided">Try again, Guided</button><button class="big ghost" data-new="wild">Try again, Wild</button></div>
  `,el=>el.querySelectorAll('[data-new]').forEach(b=>b.addEventListener('click',()=>beginNew(b.dataset.new))));
}
function reopenFlow(){
  if(!S) return showTitle();
  if(S.phase==='morning') return S.pendingPerk?showPerk():showMorning();
  if(S.phase==='winter') return showWinter();
  if(S.phase==='over') return showCollapse();
}
function showMenu(){
  if(!S){ return; }
  const wasPaused=paused; setPaused(true);
  openModal(`
    <h2>How to dance</h2>
    <ul>
      <li><b>Up on the comb is toward the sun.</b> The sun’s bearing is shown on the map rim and moves through the day.</li>
      <li><b>Press and hold on the comb</b> to dance. Angle from straight up = angle from the sun. Distance from the centre = distance to fly (rings show 0.5 to 3 km).</li>
      <li><b>Keep holding</b> to recruit more squads (100 bees each). Let go to send them.</li>
      <li><b>Press and hold a dancing scout</b> to send squads exactly where she went.</li>
      <li>Squads keep working a route until the flowers close, drain or fade, then give up and come home. Recall a route any time from the side panel.</li>
      <li>Far flights take longer and burn honey. Hornets kill foragers that fly near their nest from day 9. Sprayed fields kill foragers that land there.</li>
      <li>Pollen feeds brood, brood becomes bees three nights later. Honey feeds everyone and must last the winter.</li>
      <li>Keys: Space pauses, 1 / 2 / 3 set speed.</li>
    </ul>
    <div class="actions">
      <button class="big ghost" data-restart>Abandon this colony</button>
      <button class="big" data-close>Back to the hive</button>
    </div>
  `,el=>{
    el.querySelector('[data-close]').addEventListener('click',()=>{ closeModal(); setPaused(wasPaused); reopenFlow(); });
    el.querySelector('[data-restart]').addEventListener('click',()=>{
      const sheet=el.querySelector('.actions');
      sheet.innerHTML='<span class="warnline" style="margin-right:auto">This colony and its save will be lost.</span><button class="big ghost" data-no>Keep playing</button><button class="big" data-yes>Abandon it</button>';
      sheet.querySelector('[data-no]').addEventListener('click',()=>{ closeModal(); setPaused(wasPaused); reopenFlow(); });
      sheet.querySelector('[data-yes]').addEventListener('click',()=>{ lsDel(SAVE_KEY); S=null; closeModal(); showTitle(); });
    });
  });
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastFrame=performance.now(), sideTimer=0, hudTimer=0, saveTimer=0;
function frame(now){
  const dtR=Math.min(0.1,(now-lastFrame)/1000); lastFrame=now; realT+=dtR;
  if(S&&W&&!HEADLESS){
    fit();
    const running=!paused&&!modalOpen&&(S.phase==='day'||S.phase==='dusk');
    if(running){
      let dtMin=dtR*C.MIN_PER_SEC*speed;
      while(dtMin>0){ const d=Math.min(2,dtMin); dtMin-=d; const res=step(d); if(res==='dayover'){ endDay(); break; } }
    }
    // dance gesture timing runs in real time (also while paused)
    if(hold&&!modalOpen){
      hold.t+=dtR;
      const valid=hold.mode==='follow'||comb2dance(hold.x,hold.y).dist>=100;
      if(valid){ while(hold.t>=hold.next){ const idle=idleSquads().length; if(hold.circuits<idle){ hold.circuits=Math.min(idle,hold.circuits+(hasPerk('recruit')?2:1)); AU.tick(hold.circuits); } hold.interval=Math.max(0.09,hold.interval*0.86); hold.next+=hold.interval; } }
      else hold.next=hold.t+hold.interval;
      if(hold&&hold.mode==='follow'&&!DANCERS.includes(hold.dancer)){ /* dancer left: keep following her find */ }
    }
    if(lastDance){ lastDance.t+=dtR; if(lastDance.t>2.2) lastDance=null; }
    if(!paused&&!modalOpen){ for(const d of DANCERS) d.age+=dtR; DANCERS=DANCERS.filter(d=>d.age<d.life||(hold&&hold.dancer===d)); }
    AU.rainLevel((S.phase==='day'||S.phase==='dusk')&&isRaining(S.hour)&&!modalOpen?1:0);
    drawMap(); drawComb(dtR);
    hudTimer-=dtR; if(hudTimer<=0){ hudTimer=0.15; updateHUD(); }
    sideTimer-=dtR; if(sideTimer<=0){ sideTimer=0.3; updateSide(false); }
    saveTimer-=dtR; if(saveTimer<=0){ saveTimer=10; if(S.phase==='day'||S.phase==='dusk'||S.phase==='morning') save(); }
  }
  requestAnimationFrame(frame);
}
function endDay(){
  hold=null; lastDance=null; DANCERS=[];
  const sm=night();
  save();
  showNight(sm);
}
window.addEventListener('resize',()=>{ terrainKey=''; combKey=''; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S) save(); });

/* ---------- test hooks ---------- */
window.WG={ get S(){return S;}, get W(){return W;}, C, TYPES, PERKS, EVENTS,
  newRun, step, night, startDay, createRoute, recallRoute, applyEvent, choosePerk, winterResult, sunAz, polar, bearingOf, inBloom, isOpen, bloomStr, findTarget, idleSquads, spreadAt, winterNeed, serialize, deserialize,
  setHeadless(v){HEADLESS=v;}, showPerk, showWinter, showCollapse, showNight, endDay, showMenu, beginNew, showMorning, closeModal, setPaused, setSpeed, comb2dance, combCenter, get modalOpen(){return modalOpen;}, get DANCERS(){return DANCERS;}, addDancer };

/* ---------- boot ---------- */
function boot(data){
  fit();
  if(data&&data.save){ try{ deserialize(data.save); resumeLoaded(); }catch(e){ showTitle(); } }
  else showTitle();
  if(data&&data.ui&&data.ui.speed) setSpeed(data.ui.speed);
  requestAnimationFrame(t=>{lastFrame=t;frame(t);});
}
try{ window.claude?.hot?.snapshot?.(()=>({save:S&&W&&S.phase!=='over'&&S.phase!=='winter'?serialize():null,ui:{speed}})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
