];
const TILECACHE = {};
function tileSet(bi) {
  if (TILECACHE[bi]) return TILECACHE[bi];
  const B = BIOMES[bi], r = mulberry32(100 + bi), T = {};
  const tile = fn => { const c = mkCanvas(16, 16), x = c.getContext('2d'); fn(x); return c; };
  const px = (x, X, Y, col) => { x.fillStyle = col; x.fillRect(X, Y, 1, 1); };
  // floors: 4 variants of worn flagstones
  T.floor = [0, 1, 2, 3].map(v => tile(x => {
    x.fillStyle = B.floor[1]; x.fillRect(0, 0, 16, 16);
    const off = v % 2 ? 8 : 0;
    x.fillStyle = B.floor[0]; x.fillRect(0, 7, 16, 1); x.fillRect(0, 15, 16, 1); x.fillRect((3 + off) % 16, 0, 1, 7); x.fillRect((11 + off) % 16, 8, 1, 7);
    x.fillStyle = B.floor[2]; x.fillRect(0, 0, 16, 1); x.fillRect(0, 8, 16, 1);
    for (let i = 0; i < 10; i++) px(x, Math.floor(r() * 16), Math.floor(r() * 16), r() < 0.5 ? B.floor[0] : B.floor[2]);
    if (v === 3) { x.fillStyle = B.floor[0]; for (let i = 0; i < 4; i++) x.fillRect(4 + i, 3 + i + (i > 1 ? 1 : 0), 1, 1); }
  }));
  // north wall face: bricks
  T.wallFace = [0, 1].map(v => tile(x => {
    x.fillStyle = B.wall[1]; x.fillRect(0, 0, 16, 16);
    x.fillStyle = B.wall[0];
    for (let row = 0; row < 4; row++) { x.fillRect(0, row * 4 + 3, 16, 1); const o = (row + v) % 2 ? 0 : 4; x.fillRect(o, row * 4, 1, 3); x.fillRect(o + 8, row * 4, 1, 3); }
    x.fillStyle = B.wall[2]; for (let row = 0; row < 4; row++) x.fillRect(0, row * 4, 16, 1);
    for (let i = 0; i < 6; i++) px(x, Math.floor(r() * 16), Math.floor(r() * 16), B.wall[0]);
    x.fillStyle = B.edge; x.fillRect(0, 0, 16, 1);
    x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(0, 13, 16, 3);
  }));
  T.wallTop = tile(x => { x.fillStyle = B.top; x.fillRect(0, 0, 16, 16); for (let i = 0; i < 8; i++) px(x, Math.floor(r() * 16), Math.floor(r() * 16), tint(B.top, 0.08)); });
  // pillar (block) and crate
  T.pillar = tile(x => {
    x.fillStyle = 'rgba(0,0,0,0.4)'; x.fillRect(1, 12, 15, 4);
    x.fillStyle = B.wall[0]; x.fillRect(1, 1, 14, 14);
    x.fillStyle = B.wall[1]; x.fillRect(2, 2, 12, 7); x.fillStyle = B.wall[2]; x.fillRect(2, 2, 12, 1); x.fillRect(2, 2, 1, 7);
    x.fillStyle = B.wall[0]; x.fillRect(2, 9, 12, 1); x.fillStyle = tint(B.wall[0], -0.25); x.fillRect(2, 10, 12, 4);
    x.fillStyle = OUT; x.strokeStyle = OUT; x.lineWidth = 1; x.strokeRect(0.5, 0.5, 15, 15);
  });
  T.crate = [0, 1, 2].map(dmg => tile(x => {
    x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(2, 12, 14, 4);
    x.fillStyle = '#5a3a24'; x.fillRect(2, 2, 12, 12); x.fillStyle = '#7a5030'; x.fillRect(3, 3, 10, 10);
    x.fillStyle = '#9a6a40'; x.fillRect(3, 3, 10, 1); x.fillStyle = '#5a3a24'; x.fillRect(3, 8, 10, 1); x.fillRect(7, 3, 1, 10);
    x.fillStyle = OUT; x.strokeStyle = OUT; x.strokeRect(1.5, 1.5, 13, 13);
    x.fillStyle = '#2a1a10'; if (dmg >= 1) { x.fillRect(4, 5, 3, 1); x.fillRect(6, 6, 1, 2); } if (dmg >= 2) { x.fillRect(9, 9, 3, 1); x.fillRect(10, 10, 1, 2); x.fillRect(5, 10, 2, 1); }
  }));
  // decor sprites (non-colliding)
  T.deco = [];
  for (let i = 0; i < 6; i++) T.deco.push(tile(x => {
    if (B.deco === 'bones') { x.fillStyle = B.accent; if (i < 3) { x.fillRect(4, 8, 7, 1); x.fillRect(3, 7, 2, 3); x.fillRect(10, 7, 2, 3); } else if (i < 5) { x.fillRect(6, 6, 4, 3); x.fillRect(7, 9, 2, 1); x.fillStyle = OUT; x.fillRect(7, 7, 1, 1); x.fillRect(9, 7, 1, 1); } else { x.fillStyle = B.floor[0]; for (let k = 0; k < 6; k++) x.fillRect(3 + k * 2, 5 + (k % 2) * 3, 1, 4); } }
    if (B.deco === 'shrooms') { const c = i % 2 ? '#5cf2c8' : '#c86bff'; x.fillStyle = '#d8d0c0'; x.fillRect(7, 9, 2, 4); x.fillStyle = c; x.fillRect(5, 7, 6, 2); x.fillRect(6, 6, 4, 1); if (i > 2) { x.fillStyle = '#d8d0c0'; x.fillRect(11, 11, 1, 2); x.fillStyle = c; x.fillRect(10, 10, 3, 1); } }
    if (B.deco === 'lava') { x.fillStyle = '#ff6a2a'; const ys = [4 + i, 9, 11 - (i % 3)]; x.fillRect(2, ys[0], 5, 1); x.fillRect(6, ys[0] + 1, 4, 1); x.fillRect(9, ys[1], 3, 1); x.fillStyle = '#ffd34e'; x.fillRect(4, ys[0], 1, 1); }
    if (B.deco === 'crystals') { const c = i % 2 ? '#9a8aff' : '#7dd8ff'; x.fillStyle = tint(c, -0.3); x.fillRect(6, 6, 3, 7); x.fillStyle = c; x.fillRect(7, 5, 2, 8); x.fillStyle = '#ffffff'; x.fillRect(7, 6, 1, 3); if (i > 2) { x.fillStyle = c; x.fillRect(10, 9, 2, 4); } }
  }));
  T.torch = [0, 1, 2].map(f => { const c = mkCanvas(8, 12), x = c.getContext('2d'); x.fillStyle = '#4a3a30'; x.fillRect(2, 7, 4, 2); x.fillRect(3, 9, 2, 3); const fl = [['#ff8a2e', 1, 2, 6, 5], ['#ffd34e', 2, 3, 4, 4], ['#fff1a0', 3, 4, 2, 2]]; for (const [col, a, b, w, h] of fl) { x.fillStyle = col; x.fillRect(a + (f === 1 ? 0 : f === 2 ? 1 : 0), b - (f === 2 ? 1 : 0), w - (f ? 1 : 0), h); } return c; });
  T.torchOff = (() => { const c = mkCanvas(8, 12), x = c.getContext('2d'); x.fillStyle = '#4a3a30'; x.fillRect(2, 7, 4, 2); x.fillRect(3, 9, 2, 3); x.fillStyle = '#2a2026'; x.fillRect(3, 5, 2, 2); return c; })();
  return TILECACHE[bi] = T;
}

const LCACHE = new Map();
function lightSpr(r) {
  r = Math.max(4, Math.round(r / 2) * 2); let c = LCACHE.get(r); if (c) return c;
  c = mkCanvas(r * 2, r * 2); const x = c.getContext('2d'), id = x.createImageData(r * 2, r * 2);
  for (let y = 0; y < r * 2; y++) for (let X = 0; X < r * 2; X++) {
    const d = Math.hypot(X + 0.5 - r, y + 0.5 - r) / r;
    const bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5][(y % 4) * 4 + (X % 4)] / 16;
    let a = d < 0.5 ? 1 : d < 0.72 ? 0.72 : d < 0.88 ? 0.42 : d < 1 ? 0.16 : 0;
    if (d >= 0.88 && d < 1 && bayer > 0.5) a = 0.3;
    id.data[(y * r * 2 + X) * 4 + 3] = a * 255;
  }
  x.putImageData(id, 0, 0); LCACHE.set(r, c); return c;
}
const GCACHE = new Map();
function glowSpr(col, r) {
  r = Math.max(3, Math.round(r)); const k = col + r; let c = GCACHE.get(k); if (c) return c;
  c = mkCanvas(r * 2, r * 2); const x = c.getContext('2d'); const gr = x.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, r * 2, r * 2);
  GCACHE.set(k, c); return c;
}

  const x0 = W / 2 - Math.min(P.items.length, 16) * 8; P.items.forEach((id, i) => g.drawImage(ICONS[id].c, x0 + (i % 16) * 16, 126 + Math.floor(i / 16) * 16));
  if (win && GAME.winUnlock) text('THE REVENANT HAS RISEN  -  NEW BEARER UNLOCKED', W / 2, 166, '#ff6a6a', { align:'center', alpha:a });
  if (!win && GAME.meta.unlocked.alchemist && RUN.fi >= 1 && GAME.endT < 99) {}
  if (GAME.endT > 1) {
    text('CLICK OR PRESS ENTER', W / 2, H - 18, Math.floor(GAME.t * 2) % 2 ? '#ffe68a' : '#a39cb8', { align:'center' });
    if (MOUSE.pressed || IN.ok()) { sfx('select'); GAME.state = 'title'; GAME.sel = 0; playSong('title'); }
  }
}

// ---------------------------------------------------------------------
// FRAME
// ---------------------------------------------------------------------
function render(dt) {
  if (GAME.state === 'title') drawTitle(dt);
  else if (GAME.state === 'select') drawSelect(dt);
  else {
    if (GAME.state === 'trans') {
      renderWorld(); tx2.clearRect(0, 0, W, H); tx2.drawImage(scr, 0, 0);
      const T = GAME.trans, p = 1 - Math.pow(1 - T.t / T.dur, 3), [dx, dy] = DOOR_DIRS[T.dir];
      g.fillStyle = '#05040a'; g.fillRect(0, 0, W, H);
      g.drawImage(T.snap, Math.round(-dx * p * W), Math.round(-dy * p * H));
      g.drawImage(TMP, Math.round(dx * (1 - p) * W), Math.round(dy * (1 - p) * H));
    } else renderWorld();
    if (GAME.state !== 'trans' && GAME.state !== 'dead' && GAME.state !== 'win') drawHUD();
    // screen overlays
    if (FLASH > 0) { g.fillStyle = `rgba(255,250,235,${Math.min(0.7, FLASH)})`; g.fillRect(0, 0, W, H); }
    if (REDFLASH > 0) { g.fillStyle = `rgba(200,20,40,${REDFLASH * 0.5})`; g.fillRect(0, 0, W, H); }
    if (P && P.hp <= 2 && !P.dead && GAME.state === 'play') drawVignette(0.35 + Math.sin(GAME.t * 5) * 0.15);
    if (GAME.state === 'pause') drawPause();
    if (GAME.state === 'dead') drawEnd(false, dt);
    if (GAME.state === 'win') drawEnd(true, dt);
  }
  if (GAME.fade) { const f = GAME.fade, a = f.t < f.dur / 2 ? f.t / (f.dur / 2) : 1 - (f.t - f.dur / 2) / (f.dur / 2); g.fillStyle = `rgba(5,4,10,${clamp(a, 0, 1)})`; g.fillRect(0, 0, W, H); }
  // cursor
  if (!PAD.used) { const c = GAME.state === 'play' || GAME.state === 'trans' ? SP.cursor : SP.cursor; g.drawImage(c.c, Math.round(MOUSE.x) - 5, Math.round(MOUSE.y) - 5); }
}
function drawBoom(f) {
  const p = 1 - f.t / f.max, R = f.r * (0.45 + p * 0.75), X = Math.round(f.x), Y = Math.round(f.y);
  f.puffs = f.puffs || Array.from({ length:7 }, () => ({ a:rand(0, TAU), d:rand(0.2, 0.9), s:rand(0.3, 0.55) }));
  const base = f.col || '#ff8a2e';
  const disc = (r, c) => { if (r < 0.5) return; g.fillStyle = c; g.beginPath(); g.arc(X, Y, Math.round(r), 0, TAU); g.fill(); };
  if (p < 0.55) { disc(R, OUT); disc(R - 1, tint(base, -0.25)); disc(R * 0.72, base); disc(R * 0.45 * (1 - p), '#fff1a0'); disc(R * 0.2 * (1 - p * 1.6), '#ffffff'); }
  for (const q of f.puffs) { const d = R * q.d * (0.6 + p), r = f.r * q.s * (p < 0.55 ? 0.7 : 1.1 - p); if (r < 1) continue; g.fillStyle = p < 0.4 ? base : p < 0.7 ? '#5a3a3a' : '#2e2630'; g.globalAlpha = p < 0.7 ? 1 : (1 - p) / 0.3; g.beginPath(); g.arc(Math.round(X + Math.cos(q.a) * d), Math.round(Y + Math.sin(q.a) * d - p * 6), Math.round(r), 0, TAU); g.fill(); g.globalAlpha = 1; }
}
let VIG = null;
function drawVignette(a) {
  if (!VIG) { VIG = mkCanvas(W, H); const x = VIG.getContext('2d'), gr = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62); gr.addColorStop(0, 'rgba(160,10,30,0)'); gr.addColorStop(1, 'rgba(160,10,30,0.9)'); x.fillStyle = gr; x.fillRect(0, 0, W, H); }
  g.globalAlpha = clamp(a, 0, 1); g.drawImage(VIG, 0, 0); g.globalAlpha = 1;
}
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  pollPad();
  if (GAME.quitArm > 0) GAME.quitArm -= dt;
  try { update(dt); render(dt); } catch (err) { console.error(err); }
  present(); endInput();
}
addEventListener('blur', () => { if (GAME.state === 'play' && P && !P.dead) { GAME.state = 'pause'; GAME.sel = 0; } });
document.addEventListener('visibilitychange', () => { if (document.hidden && GAME.state === 'play' && P && !P.dead) { GAME.state = 'pause'; GAME.sel = 0; } });
function boot() {
  buildArt(); GAME.meta = loadMeta(); playSong('title');
  addEventListener('beforeunload', () => { if (GAME.state === 'play' || GAME.state === 'pause') {/* checkpoint is per floor */} });
  requestAnimationFrame(frame);
}
boot();
</script>
