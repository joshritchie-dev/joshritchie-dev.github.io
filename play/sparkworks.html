<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#070b14; --panel:#0e1524; --edge:#1f2c45; --edge2:#2e4366; --ink:#e6eefb; --dim:#7f90ad; --cyan:#3ee6ff; --gold:#ffcf4a; --pink:#ff5aa8; --green:#5dffa8; --violet:#a98bff; --red:#ff5a5a;
  --head:'Chakra Petch', 'Segoe UI', system-ui, sans-serif; --body:'Inter', system-ui, sans-serif; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--body); overflow:hidden; user-select:none; -webkit-user-select:none; }
#app { position:fixed; inset:0; display:flex; }
#boardWrap { flex:1; position:relative; min-width:0; display:flex; flex-direction:column; }
#top { display:flex; align-items:baseline; gap:22px; padding:12px 18px 6px; }
#credits { font-family:var(--head); font-size:40px; font-weight:700; color:var(--gold); text-shadow:0 0 18px #ffcf4a55; font-variant-numeric:tabular-nums; }
#rate { font-family:var(--head); font-size:18px; color:var(--green); }
#cores { font-family:var(--head); font-size:16px; color:var(--violet); margin-left:auto; }
#cv { flex:1; display:block; width:100%; min-height:0; cursor:crosshair; }
#hint { position:absolute; left:18px; bottom:14px; right:18px; font-size:14px; color:var(--dim); pointer-events:none; }
#hint b { color:var(--cyan); }
#od { position:absolute; right:18px; bottom:14px; }
#side { width:360px; flex:none; background:var(--panel); border-left:1px solid var(--edge); display:flex; flex-direction:column; min-height:0; }
#tabs { display:flex; border-bottom:1px solid var(--edge); }
#tabs button { flex:1; background:none; border:0; color:var(--dim); font-family:var(--head); font-size:15px; letter-spacing:1px; padding:12px 0; cursor:pointer; border-bottom:2px solid transparent; }
#tabs button.on { color:var(--ink); border-color:var(--cyan); }
#tabs button .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--gold); margin-left:5px; vertical-align:middle; }
#pane { flex:1; overflow:auto; padding:12px; }
.sec { font-family:var(--head); font-size:12px; letter-spacing:2px; color:var(--dim); margin:14px 0 8px; text-transform:uppercase; }
.parts { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
.part { background:#0a1120; border:1px solid var(--edge); border-radius:10px; padding:8px; cursor:pointer; display:flex; gap:8px; align-items:center; text-align:left; color:var(--ink); font-family:var(--body); }
.part:hover { border-color:var(--edge2); }
.part.sel { border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset, 0 0 14px #3ee6ff33; }
.part.locked { opacity:.35; cursor:default; }
.part.cant .cost { color:var(--red); }
.part canvas { flex:none; }
.part b { font-family:var(--head); font-size:15px; display:block; }
.part .cost { font-family:var(--head); font-size:13px; color:var(--gold); }
.part small { display:block; font-size:11.5px; color:var(--dim); line-height:1.25; }
.card { background:#0a1120; border:1px solid var(--edge); border-radius:10px; padding:10px 12px; }
.card h3 { margin:0 0 4px; font-family:var(--head); font-size:18px; }
.card p { margin:4px 0; font-size:13px; color:var(--dim); line-height:1.4; }
.card .st { font-family:var(--head); font-size:14px; color:var(--ink); }
.btn { font-family:var(--head); font-size:14px; letter-spacing:.5px; background:#13203a; color:var(--ink); border:1px solid var(--edge2); border-radius:8px; padding:8px 12px; cursor:pointer; }
.btn:hover { border-color:var(--cyan); }
.btn.gold { background:linear-gradient(#ffd96a, #e8a92a); color:#231700; border-color:#ffe9a0; font-weight:700; }
.btn.violet { background:linear-gradient(#b9a0ff, #7a5af0); color:#120a2a; border-color:#d8c8ff; font-weight:700; }
.btn[disabled] { opacity:.35; pointer-events:none; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.res { display:flex; justify-content:space-between; align-items:center; gap:10px; background:#0a1120; border:1px solid var(--edge); border-radius:10px; padding:9px 11px; margin-bottom:7px; }
.res b { font-family:var(--head); font-size:15px; display:block; }
.res small { color:var(--dim); font-size:12px; line-height:1.3; display:block; }
.res .lv { color:var(--cyan); font-family:var(--head); font-size:12px; }
.res.done { opacity:.45; }
.ms { display:flex; gap:10px; align-items:center; padding:7px 10px; border:1px solid var(--edge); border-radius:8px; margin-bottom:6px; font-size:13px; }
.ms.on { border-color:var(--violet); background:#1a1430; }
.ms .n { font-family:var(--head); color:var(--violet); min-width:44px; }
#toast { position:fixed; left:50%; top:16px; transform:translate(-50%, -20px); opacity:0; transition:all .35s; z-index:20; background:#13203aee; border:1px solid var(--edge2); border-radius:10px; padding:10px 16px; font-family:var(--head); pointer-events:none; }
#toast.show { opacity:1; transform:translate(-50%, 0); }
.ov { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; background:#04070dd8; padding:16px; }
.ov.show { display:flex; }
.ov .card { max-width:460px; width:100%; padding:20px 22px; text-align:center; }
.ov h2 { font-family:var(--head); font-size:28px; margin:0 0 6px; color:var(--gold); }
.big { font-family:var(--head); font-size:34px; color:var(--gold); margin:8px 0; }
@media (max-width:860px) { #app { flex-direction:column; } #side { width:100%; height:46%; border-left:0; border-top:1px solid var(--edge); } #credits { font-size:28px; } #hint { display:none; } }
</style>
</head>
<body>
<div id="app">
  <div id="boardWrap">
    <div id="top"><div id="credits">0</div><div id="rate">0 /s</div><div id="cores"></div></div>
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="od"><button class="btn gold" id="bOD">OVERDRIVE</button></div>
  </div>
  <div id="side">
    <div id="tabs"><button class="on" data-t="build">BUILD</button><button data-t="research">RESEARCH</button><button data-t="reforge">REFORGE</button></div>
    <div id="pane"></div>
  </div>
</div>
<div id="toast"></div>
<div class="ov" id="ovWelcome"><div class="card"><h2 id="wT">Welcome back</h2><p id="wP"></p><div class="big" id="wV"></div><button class="btn gold" id="wOk">COLLECT</button></div></div>
<script>
'use strict';
// =====================================================================
// NUMBERS
// =====================================================================
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n, d = 1) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(d) : Math.floor(n).toString();
  const e = Math.floor(Math.log10(n) / 3);
  if (e < SUF.length) { const v = n / Math.pow(1000, e); return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + SUF[e]; }
  return n.toExponential(2).replace('+', '');
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = Math.random;

// =====================================================================
// DATA
// =====================================================================
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const PARTS = {
  belt:  { n:'Belt', d:'Carries orbs. Drag to lay a line.', cost:2, grow:1.0, col:'#3a5a8a', up:null },
  gen:   { n:'Spark Source', d:'Emits an orb. Upgrades: faster & richer.', cost:15, grow:3.2, col:'#3ee6ff', up:{ base:12, grow:1.55 } },
  core:  { n:'Core', d:'Sells orbs for credits. Upgrades: ×value.', cost:30, grow:4.5, col:'#ffcf4a', up:{ base:60, grow:1.7 } },
  add:   { n:'Charger', d:'Adds value to every orb that passes.', cost:20, grow:1.35, col:'#5dffa8', up:{ base:25, grow:1.5 } },
  mul:   { n:'Amplifier', d:'Multiplies orb value.', cost:250, grow:1.6, col:'#ff5aa8', up:{ base:300, grow:1.65 }, req:'r_mul' },
  split: { n:'Splitter', d:'Splits an orb in two: out left & right.', cost:2500, grow:2.0, col:'#a98bff', up:{ base:3000, grow:1.8 }, req:'r_split' },
  prism: { n:'Prism', d:'Huge multiplier, but only on orbs that have never touched a prism.', cost:40000, grow:2.2, col:'#ff9a3a', up:{ base:50000, grow:1.85 }, req:'r_prism' },
  comp:  { n:'Compressor', d:'Swallows 4 orbs, releases one worth their total ×bonus.', cost:350000, grow:2.4, col:'#ff5a5a', up:{ base:400000, grow:1.9 }, req:'r_comp' },
};
const ORDER = ['belt', 'gen', 'core', 'add', 'mul', 'split', 'prism', 'comp'];
function partStat(type, lvl) {
  switch (type) {
    case 'gen': return { period:Math.max(0.2, 2.2 * Math.pow(0.88, lvl)), value:1 + lvl * 1.5 };
    case 'core': return { mult:1 + lvl * 0.3 };
    case 'add': return { add:2 + lvl * 2 * (1 + lvl * 0.1) };
    case 'mul': return { mul:1.5 + lvl * 0.15 };
    case 'split': return { keep:Math.min(0.95, 0.6 + lvl * 0.05) };
    case 'prism': return { mul:3 + lvl * 0.6 };
    case 'comp': return { need:4, bonus:1.3 + lvl * 0.12 };
  }
  return {};
}
function statText(type, lvl) {
  const s = partStat(type, lvl);
  switch (type) {
    case 'gen': return `${fmt(s.value)} value every ${s.period.toFixed(2)}s`;
    case 'core': return `sells at ×${s.mult.toFixed(1)}`;
    case 'add': return `+${fmt(s.add)} value`;
    case 'mul': return `×${s.mul.toFixed(2)} value`;
    case 'split': return `two orbs at ${Math.round(s.keep * 100)}% each`;
    case 'prism': return `×${s.mul.toFixed(1)} (once per orb)`;
    case 'comp': return `4 orbs → 1 at ×${s.bonus.toFixed(2)} total`;
  }
  return 'moves orbs';
}
const RESEARCH = {
  r_mul:   { n:'Amplifiers', d:'Unlock the Amplifier.', cost:120 },
  r_od:    { n:'Overdrive', d:'Unlock Overdrive: sources fire ×3 for 15s.', cost:600 },
  r_grid1: { n:'Wider Floor I', d:'Board grows to 11×7.', cost:900 },
  r_speed: { n:'Greased Belts', d:'+25% orb speed per level.', cost:400, lv:6, grow:3.5 },
  r_split: { n:'Splitters', d:'Unlock the Splitter.', cost:1800 },
  r_core:  { n:'Market Contacts', d:'+20% all sales per level.', cost:1500, lv:10, grow:3.2 },
  r_gold:  { n:'Lucky Sparks', d:'Golden sparks appear more often and pay more.', cost:5000, lv:3, grow:6 },
  r_grid2: { n:'Wider Floor II', d:'Board grows to 13×9.', cost:60000 },
  r_prism: { n:'Prisms', d:'Unlock the Prism.', cost:25000 },
  r_comp:  { n:'Compressors', d:'Unlock the Compressor.', cost:250000 },
  r_grid3: { n:'Wider Floor III', d:'Board grows to 15×10.', cost:4e6 },
  r_od2:   { n:'Overdrive Mk II', d:'Overdrive lasts 25s and recharges faster.', cost:8e5, req:'r_od' },
  r_offline:{ n:'Night Shift', d:'Offline earnings rise from 40% to 80%.', cost:2e5 },
};
const GRIDS = [[9, 6], [11, 7], [13, 9], [15, 10]];
const MILESTONES = [
  [1, 'Start each run with 200 credits and Amplifiers unlocked.'],
  [3, 'Start with Splitters, Overdrive and Wider Floor I.'],
  [5, 'Saved layout is rebuilt for free after each Reforge (belts & parts at level 0).'],
  [10, 'Offline earnings at 100%. Start with Prisms.'],
  [25, 'Start with Compressors and Wider Floor II.'],
  [60, 'Orbs move 50% faster.'],
];
const REFORGE_AT = 1e6;

// =====================================================================
// STATE
// =====================================================================
let S = null;
function fresh(keep) {
  const s = { credits:0, lifetime:0, runEarned:0, cores:0, totalCores:0, research:{}, grid:0, tiles:{}, owned:{}, nextId:1, odT:0, odCD:0, saved:Date.now(), t:0, layout:null, stats:{ orbs:0, reforges:0 }, tut:0 };
  if (keep) { s.cores = keep.cores; s.totalCores = keep.totalCores; s.layout = keep.layout; s.stats = keep.stats; s.tut = 99; s.lifetime = keep.lifetime; }
  const c = s.cores;
  if (c >= 1) { s.credits = 200; s.research.r_mul = 1; }
  if (c >= 3) { s.research.r_split = 1; s.research.r_od = 1; s.research.r_grid1 = 1; s.grid = Math.max(s.grid, 1); }
  if (c >= 10) s.research.r_prism = 1;
  if (c >= 25) { s.research.r_comp = 1; s.research.r_grid2 = 1; s.grid = 2; }
  return s;
}
function starter(s) {
  place(s, 1, 2, 'gen', 0, true); for (let x = 2; x <= 5; x++) place(s, x, 2, 'belt', 0, true); place(s, 6, 2, 'core', 0, true);
  s.credits += 10;
}
const key = (x, y) => x + ',' + y;
const GW = () => GRIDS[S.grid][0], GH = () => GRIDS[S.grid][1];
function partCost(type) { const P = PARTS[type]; return Math.ceil(P.cost * Math.pow(P.grow, S.owned[type] || 0)); }
function upCost(t) { const U = PARTS[t.type].up; return Math.ceil(U.base * Math.pow(U.grow, t.lvl)); }
function place(s, x, y, type, dir, free) {
  const t = { id:s.nextId++, type, dir, lvl:0, x, y, cd:0, store:0, storeN:0, flash:0 };
  s.tiles[key(x, y)] = t; if (!free) s.owned[type] = (s.owned[type] || 0) + 1; else s.owned[type] = (s.owned[type] || 0) + (type === 'belt' ? 0 : 1);
  return t;
}
function refundOf(t) {
  let spent = 0; const P = PARTS[t.type];
  if (P.up) for (let l = 0; l < t.lvl; l++) spent += Math.ceil(P.up.base * Math.pow(P.up.grow, l));
  const n = Math.max(0, (S.owned[t.type] || 1) - 1);
  return Math.floor((Math.ceil(P.cost * Math.pow(P.grow, n)) + spent) * (t.type === 'belt' ? 1 : 0.5));
}
function sell(t) {
  const r = refundOf(t);
  delete S.tiles[key(t.x, t.y)];
  S.owned[t.type] = Math.max(0, (S.owned[t.type] || 1) - 1);
  S.credits += r;
  ORBS = ORBS.filter(o => !(o.tx === t.x && o.ty === t.y));
  return r;
}
const hasR = k => (S.research[k] || 0) > 0;
function salesMult() { return (1 + 0.2 * (S.research.r_core || 0)) * (1 + 0.1 * S.cores); }
function orbSpeed() { return 2.4 * (1 + 0.25 * (S.research.r_speed || 0)) * (S.totalCores >= 60 ? 1.5 : 1); }

// =====================================================================
// SIMULATION
// =====================================================================
let ORBS = [], POPS = [], PARTS_FX = [], GOLD = null, goldT = 40, incomeLog = [], INC = 0;
function emit(t, val, dir, extra) {
  ORBS.push({ x:t.x, y:t.y, tx:t.x + DIRS[dir][0], ty:t.y + DIRS[dir][1], dir, k:0, v:val, seen:new Set([t.id]), prism:extra && extra.prism, hops:0 });
}
function earn(v, x, y) {
  S.credits += v; S.lifetime += v; S.runEarned += v; incomeLog.push([S.t, v]);
  if (x !== undefined) POPS.push({ x, y, text:'+' + fmt(v), life:1, big:v > INC * 3 && INC > 0 });
}
function step(dt) {
  S.t += dt;
  // overdrive
  if (S.odT > 0) S.odT -= dt; else if (S.odCD > 0) S.odCD -= dt;
  const od = S.odT > 0 ? 3 : 1;
  // generators
  for (const k in S.tiles) {
    const t = S.tiles[k]; if (t.flash > 0) t.flash -= dt;
    if (t.type !== 'gen') continue;
    const st = partStat('gen', t.lvl);
    t.cd -= dt * od;
    if (t.cd <= 0) { t.cd += st.period; emit(t, st.value, t.dir); t.flash = 0.15; }
  }
  // orbs
  const sp = orbSpeed() * dt;
  const next = [];
  for (const o of ORBS) {
    o.k += sp;
    if (o.k < 1) { next.push(o); continue; }
    o.k -= 1; o.x = o.tx; o.y = o.ty; o.hops++;
    const t = S.tiles[key(o.x, o.y)];
    if (!t || o.hops > 200 || t.type === 'gen') { fizzle(o); continue; }
    let out = t.dir, alive = true;
    if (!o.seen.has(t.id)) {
      const st = partStat(t.type, t.lvl);
      switch (t.type) {
        case 'add': o.v += st.add; t.flash = 0.15; break;
        case 'mul': o.v *= st.mul; t.flash = 0.15; break;
        case 'prism': if (!o.prism) { o.v *= st.mul; o.prism = true; t.flash = 0.2; } break;
        case 'core': earn(o.v * st.mult * salesMult(), o.x, o.y); t.flash = 0.2; S.stats.orbs++; alive = false; break;
        case 'split': {
          t.flash = 0.15; alive = false;
          for (const d of [(t.dir + 3) % 4, (t.dir + 1) % 4]) { const c = { x:o.x, y:o.y, tx:o.x + DIRS[d][0], ty:o.y + DIRS[d][1], dir:d, k:o.k, v:o.v * st.keep, seen:new Set(o.seen), prism:o.prism, hops:o.hops }; c.seen.add(t.id); next.push(c); }
          break;
        }
        case 'comp': {
          t.store += o.v; t.storeN++; alive = false; t.flash = 0.1;
          if (t.storeN >= st.need) { const v = t.store * st.bonus; t.store = 0; t.storeN = 0; const c = { x:o.x, y:o.y, tx:o.x + DIRS[t.dir][0], ty:o.y + DIRS[t.dir][1], dir:t.dir, k:0, v, seen:new Set([t.id]), prism:false, hops:o.hops, big:true }; next.push(c); t.flash = 0.3; }
          break;
        }
      }
      if (alive && t.type !== 'belt') o.seen.add(t.id);
    } else if (t.type === 'core') { earn(o.v * partStat('core', t.lvl).mult * salesMult(), o.x, o.y); alive = false; }
    else if (t.type === 'comp' || t.type === 'split') { fizzle(o); continue; }
    if (!alive) continue;
    o.dir = out; o.tx = o.x + DIRS[out][0]; o.ty = o.y + DIRS[out][1];
    if (o.tx < 0 || o.ty < 0 || o.tx >= GW() || o.ty >= GH()) { fizzle(o); continue; }
    next.push(o);
  }
  ORBS = next.length > 1500 ? next.slice(next.length - 1500) : next;
  // income rate (10s window)
  while (incomeLog.length && incomeLog[0][0] < S.t - 10) incomeLog.shift();
  INC = incomeLog.reduce((a, b) => a + b[1], 0) / Math.min(10, Math.max(1, S.t));
  S.rate = INC;
  // golden spark
  goldT -= dt;
  if (!GOLD && goldT <= 0) { GOLD = { x:Math.floor(rnd() * GW()), y:Math.floor(rnd() * GH()), life:10 }; }
  if (GOLD) { GOLD.life -= dt; if (GOLD.life <= 0) { GOLD = null; goldT = nextGold(); } }
}
function nextGold() { return (70 + rnd() * 60) / (1 + 0.35 * (S.research.r_gold || 0)); }
function fizzle(o) { PARTS_FX.push({ x:o.x + 0.5 - DIRS[o.dir][0] * 0.0, y:o.y + 0.5, life:0.3, col:'#7f90ad' }); }

// =====================================================================
// RENDER
// =====================================================================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let DPR = 1, CW = 0, CH = 0, TS = 64, OX = 0, OY = 0;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); const r = cv.getBoundingClientRect(); CW = r.width; CH = r.height; cv.width = CW * DPR; cv.height = CH * DPR; layoutBoard(); }
function layoutBoard() { TS = Math.floor(Math.min((CW - 30) / GW(), (CH - 40) / GH())); TS = clamp(TS, 28, 96); OX = Math.floor((CW - TS * GW()) / 2); OY = Math.floor((CH - TS * GH()) / 2); }
addEventListener('resize', resize);
const orbCol = v => { const h = (200 + Math.log10(Math.max(1, v)) * 38) % 360; return `hsl(${h},100%,65%)`; };
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
function drawPart(c, type, dir, x, y, s, lvl, flash, ghost, t) {
  const P = PARTS[type], col = P.col, m = s * 0.08;
  c.save(); c.translate(x + s / 2, y + s / 2);
  if (ghost) c.globalAlpha = 0.45;
  if (type === 'belt') {
    c.fillStyle = '#132038'; rr(c, -s / 2 + m, -s / 2 + m, s - m * 2, s - m * 2, s * 0.12); c.fill();
    c.rotate(dir * Math.PI / 2);
    const off = ((performance.now() / 1000) * orbSpeed() * s) % (s / 3);
    c.strokeStyle = '#3a5a8a'; c.lineWidth = s * 0.07; c.lineCap = 'round';
    for (let k = -1; k < 3; k++) { const px = -s / 2 + k * s / 3 + off; if (px < -s * 0.42 || px > s * 0.32) continue; c.beginPath(); c.moveTo(px - s * 0.08, -s * 0.14); c.lineTo(px + s * 0.06, 0); c.lineTo(px - s * 0.08, s * 0.14); c.stroke(); }
    c.restore(); return;
  }
  const glow = flash > 0 ? Math.min(1, flash * 6) : 0;
  c.shadowColor = col; c.shadowBlur = s * (0.12 + glow * 0.4);
  c.fillStyle = '#0c1424'; rr(c, -s / 2 + m, -s / 2 + m, s - m * 2, s - m * 2, s * 0.16); c.fill();
  c.shadowBlur = 0;

    case 'click': tone(800, 0.03, 'square', 0.025); break;
    case 'sell': tone(500, 0.08, 'triangle', 0.05, -200); break;
    case 'up': [523, 659, 784].forEach((f, i) => tone(f, 0.08, 'triangle', 0.05, 0, i * 0.04)); break;
    case 'nope': tone(150, 0.1, 'square', 0.04); break;
    case 'gold': [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.12, 'triangle', 0.06, 0, i * 0.06)); break;
    case 'od': tone(110, 0.6, 'sawtooth', 0.06, 300); tone(220, 0.6, 'triangle', 0.05, 600); break;
    case 'reforge': [196, 262, 330, 392, 523, 659].forEach((f, i) => tone(f, 0.2, 'triangle', 0.06, 0, i * 0.08)); break;
    case 'core': if (performance.now() - lastSell > 70) { lastSell = performance.now(); tone(1100 + rnd() * 300, 0.035, 'sine', 0.018); } break;
  }
}
let TOASTT = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(TOASTT); TOASTT = setTimeout(() => el.classList.remove('show'), 1800); }

// =====================================================================
// SAVE / LOAD / OFFLINE
// =====================================================================
function save() {
  S.saved = Date.now();
  const tiles = Object.values(S.tiles).map(t => [t.x, t.y, t.type, t.dir, t.lvl]);
  const data = Object.assign({}, S, { tiles, rate:INC });
  try { localStorage.setItem('sparkworks', JSON.stringify(data)); } catch (e) {}
}
function load() {
  let d = null; try { d = JSON.parse(localStorage.getItem('sparkworks') || 'null'); } catch (e) {}
  if (!d) { S = fresh(); starter(S); return 0; }
  S = fresh({ cores:d.cores || 0, totalCores:d.totalCores || 0, layout:d.layout || null, stats:d.stats || { orbs:0, reforges:0 }, lifetime:d.lifetime || 0 });
  Object.assign(S, { credits:d.credits || 0, runEarned:d.runEarned || 0, research:d.research || {}, grid:d.grid || 0, owned:d.owned || {}, tut:d.tut === undefined ? 99 : d.tut, ghost:!!d.ghost, odCD:d.odCD || 0, nextId:1 });
  S.tiles = {};
  for (const [x, y, type, dir, lvl] of d.tiles || []) { const t = { id:S.nextId++, type, dir, lvl, x, y, cd:0, store:0, storeN:0, flash:0 }; S.tiles[key(x, y)] = t; }
  const away = Math.max(0, (Date.now() - (d.saved || Date.now())) / 1000);
  const eff = S.totalCores >= 10 ? 1 : hasR('r_offline') ? 0.8 : 0.4;
  return away > 60 && d.rate > 0 ? Math.min(away, 12 * 3600) * d.rate * eff : 0;
}

// =====================================================================
// LOOP
// =====================================================================
let last = performance.now(), saveT = 0, uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const before = S.stats.orbs;
  let rem = dt; while (rem > 1e-4) { const s = Math.min(rem, 1 / 60); step(s); rem -= s; }
  if (S.stats.orbs !== before) sfx('core');
  fxStep(dt); render();
  uiT -= dt;
  if (uiT <= 0) {
    uiT = 0.1;
    $('credits').textContent = fmt(S.credits);
    $('rate').textContent = `${fmt(INC)} /s`;
    $('cores').textContent = S.cores ? `◆ ${S.cores} Cores · +${S.cores * 10}%` : '';
    const od = $('bOD'); od.style.display = hasR('r_od') ? '' : 'none';
    od.disabled = S.odT > 0 || S.odCD > 0; od.textContent = S.odT > 0 ? `OVERDRIVE ${Math.ceil(S.odT)}s` : S.odCD > 0 ? `RECHARGING ${Math.ceil(S.odCD)}s` : 'OVERDRIVE [SPACE]';
    if (paneSig() !== PANE_SIG) renderPane();
    const canRes = Object.entries(RESEARCH).some(([k, R]) => (S.research[k] || 0) < (R.lv || 1) && (!R.req || hasR(R.req)) && S.credits >= Math.ceil(R.cost * Math.pow(R.grow || 1, S.research[k] || 0)));
    document.querySelector('[data-t="research"]').innerHTML = 'RESEARCH' + (canRes ? '<span class="dot"></span>' : '');
    document.querySelector('[data-t="reforge"]').innerHTML = 'REFORGE' + (coresFor() > 0 ? '<span class="dot" style="background:var(--violet)"></span>' : '');
    if (S.tut === 0 && S.t > 8) renderHint();
    if (S.tut === 4 && S.lifetime > 3000) tut();
  }
  saveT -= dt; if (saveT <= 0) { saveT = 10; save(); }
  requestAnimationFrame(frame);
}
addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
function boot() {
  const off = load();
  resize(); renderPane(); renderHint();
  if (off > 0) {
    $('wP').textContent = `Your machines kept humming while you were away.`; $('wV').textContent = '+' + fmt(off);
    $('ovWelcome').classList.add('show');
    $('wOk').onclick = () => { S.credits += off; S.lifetime += off; S.runEarned += off; $('ovWelcome').classList.remove('show'); audio(); sfx('gold'); };
  }
  requestAnimationFrame(frame);
}
boot();
</script>
