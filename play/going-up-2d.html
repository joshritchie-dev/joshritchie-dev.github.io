function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(h, a) { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndi(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function fmtNum(v) { if (Math.abs(v - Math.round(v)) < 0.001) return String(Math.round(v)); return (Math.round(v * 100) / 100).toString(); }
function fmtTime(t) { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }

// Seedable RNG for the run (floor layouts, rolls)
function Rng(seed) { this.s = seed >>> 0 || 1; }
Rng.prototype.randf = function () { let t = this.s += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
Rng.prototype.randi = function () { return Math.floor(this.randf() * 2147483647); };
Rng.prototype.range = function (a, b) { return a + Math.floor(this.randf() * (b - a + 1)); };
Rng.prototype.rangef = function (a, b) { return a + this.randf() * (b - a); };

const MODE_NORMAL = 0, MODE_HEADSHOTS = 1;
const BAG_SIZE = 12;

const G = {
  settings: { vol_master: 0.8, vol_music: 0.5, vol_sfx: 0.9, dmg_numbers: true, shake: true },
  best: { floor: 0, wins: 0, runs: 0 },
  meta: { totals: {}, done: [], unlocked: [], unlock_all: false },
  run_unlocks: [],
  in_run: false, mode: MODE_NORMAL, tower: 1, floor_i: 0, cash: 0, hp: 100, max_hp_bonus: 0,
  weapons: [null, null], active: 0, bag: [], keys: 0, pending_weapon: "", cabinets_opened: 0,
  run_seed: 0, uid_counter: 0, stats: {}, rng: new Rng(1),
  items: {}, item_order: [], kudos: 0, career: 0, reviews: 0, free_rerolls: 1,
  body: {}, wstats: [{}, {}],
  onNotify: null, onUnlock: null, onLevel: null,

  // ------------------------------------------------------------- run
  new_run(mode, weapon_id, seed) {

    this.weapons = [this.make_weapon(weapon_id), null]; this.active = 0; this.bag = []; this.keys = 0;
    this.pending_weapon = ""; this.cabinets_opened = 0;
    this.run_seed = seed || (Math.floor(Math.random() * 2147483646) + 1); this.rng = new Rng(this.run_seed);
    this.items = {}; this.item_order = []; this.kudos = 0; this.career = 0; this.reviews = 0; this.free_rerolls = 1;
    this.run_unlocks = [];
    this.stats = { kills: 0, headshots: 0, cash_earned: 0, cards_found: 0, floors: 0, sweats: 0, damage: 0, time: 0, deaths_by: "",
      reactions: 0, air_kills: 0, multikill: 0, clutch_time: 0, items_found: 0, evolves: 0, run_time: 0, taken: {} };
    this.recalc(); this.hp = this.max_hp();
    this.best.runs += 1; this.save_progress();
  },
  make_weapon(id) {
    const d = WEAPONS[id];
    return { id, level: 0, slots: [null, null, null, null], unlocked: [true, true, false, false], mag: d.mag || 0, reserve: d.reserve || 0, evo: false };
  },
  make_card(id, tier) { this.uid_counter++; return { id, tier: clamp(tier, 0, 3), uid: this.uid_counter }; },
  floor_def() { return FLOORS[this.floor_i]; },
  floor_label() { const f = this.floor_def(); return (this.tower > 1 ? "T" + this.tower + "-" : "") + f.label; },
  danger() {
    let d = 0;
    for (let i = 0; i < this.floor_i; i++) if (FLOORS[i].kind !== "store") d++;
    return d + (this.tower - 1) * COMBAT_FLOORS_PER_TOWER;
  },
  enemy_hp_mult() { return 1 + 0.24 * this.danger(); },
  enemy_dmg_mult() { return 1 + 0.08 * this.danger(); },
  cash_scale() { return 1 + 0.12 * this.danger(); },
  price_scale() { return (1 + 0.12 * this.danger()) * this.price_mult(); },
  is_hs_only() { return this.mode === MODE_HEADSHOTS; },
  add_cash(n) { this.cash = Math.max(0, this.cash + n); if (n > 0) this.stats.cash_earned += n; },
  spend(n) { if (this.cash < n) return false; this.cash -= n; return true; },
  heal(n) { this.hp = Math.min(this.max_hp(), this.hp + n); },
  say(text, color) { if (this.onNotify) this.onNotify(text, color || "#ffffff"); },

  // ------------------------------------------------------------- cards
  add_card(card, announce = true) {
    this.stats.cards_found = (this.stats.cards_found || 0) + 1;
    if (this.bag.length >= BAG_SIZE) {
      const v = this.card_sell_value(card); this.add_cash(v);
      if (announce) this.say(`Bag full! ${this.card_name(card)} sold for $${v}`, "#ffd34a");
      return false;
    }
    this.bag.push(card);
    if (announce) this.say(`+ ${TIER_NAMES[card.tier]} card: ${this.card_name(card)}`, TIER_COLORS[card.tier]);
    return true;
  },
  card_name(card) { return CARDS[card.id].name; },
  card_sell_value(card) { return Math.round([12, 25, 50, 100][card.tier] * this.cash_scale()); },
  card_price(tier) { return Math.round(CARD_PRICES[tier] * this.price_scale()); },
  roll_tier(bonus = 0) {
    const luck = this.body.luck || 0, d = this.danger();
    const w = [Math.max(6, 62 - 6 * luck - 1.6 * d - 30 * bonus), Math.max(4, 27 + 2 * luck + 0.7 * d + 6 * bonus),
      Math.max(1, 9 + 3 * luck + 0.6 * d + 14 * bonus), Math.max(0.5, 2 + luck + 0.3 * d + 10 * bonus)];
    let r = this.rng.randf() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < 4; i++) { r -= w[i]; if (r <= 0) return i; }
    return 0;
  },
  random_card_id() {
    const f = this.rng.randf(); const fam = f < 0.52 ? "normal" : f < 0.80 ? "fantasy" : "wild";
    const pool = CARD_IDS.filter(id => CARDS[id].family === fam && this.is_unlocked("card", id));
    return pool[Math.floor(this.rng.randf() * pool.length)];
  },
  random_card(bonus = 0, min_tier = 0) { return this.make_card(this.random_card_id(), Math.max(min_tier, this.roll_tier(bonus))); },
  card_vals(card, fam_mult = 1) {
    const def = CARDS[card.id], t = card.tier, vals = {};
    for (const g of ["inc", "dec", "fixed", "special"]) if (def[g]) for (const k in def[g]) vals[k] = def[g][k][t] * (g !== "special" ? fam_mult : 1);
    if (card.id === "old") vals.money = 3 * vals.slow;
    return vals;
  },
  card_text(card, fam_mult = 1) {
    let s = CARDS[card.id].text; const vals = this.card_vals(card, fam_mult);
    for (const k in vals) {
      const v = vals[k];
      s = s.split(`{${k}%}`).join(Math.round(v * 100) + "%");
      s = s.split(`{${k}+1}`).join(fmtNum(v + 1));
      s = s.split(`{${k}}`).join(fmtNum(v));
    }
    return s;
  },

  // ------------------------------------------------------------- derived stats
  _reset_derived() {
    this.body = { speed: 0, jump: 0, cooldown: 0, hp: 0, dmg_taken: 0, enemy_acc: 0, clones: 0, clone_power: 0, luck: 0, price: 0, slow: 0, money: 0,
      companions: [], dmg_all: 0, frail: 0, shock: 0, extra_chain: 0, catalyst: 0 };
    this.wstats = [this._blank_w(), this._blank_w()];
  },
  _blank_w() { return { hs: 0, flat: 0, dmg: 0, rate: 0, reload: 0, splode: 0, splode_r: 0, burn: 0, chain_chance: 0, chain_dmg: 0, chain_n: 0, rico: 0, rico_dmg: 0, chill: 0, venom: 0, echo: 0 }; },
  recalc() {
    const old_max = this.body.companions ? this.max_hp() : 100;
    this._reset_derived();
    for (let wi = 0; wi < 2; wi++) {
      const w = this.weapons[wi]; if (!w) continue;
      let mm = 0, dm = 0;
      for (const c of w.slots) { if (!c) continue; if (c.id === "mult_multer") mm += CARDS.mult_multer.special.mm[c.tier]; else if (c.id === "demult_multer") dm += CARDS.demult_multer.special.dm[c.tier]; }
      for (const c of w.slots) {
        if (!c || c.id === "mult_multer" || c.id === "demult_multer") continue;
        const def = CARDS[c.id]; const fam = (w.id === "d20" && def.family === "fantasy") ? 2 : 1;
        const target = def.scope === "body" ? this.body : this.wstats[wi]; const t = c.tier; const added = {};
        if (def.inc) for (const k in def.inc) added[k] = def.inc[k][t] * fam * (1 + mm);
        if (def.dec) for (const k in def.dec) added[k] = def.dec[k][t] * fam * (1 + dm);
        if (def.fixed) for (const k in def.fixed) added[k] = def.fixed[k][t] * fam;
        if (c.id === "old") added.money = 3 * Math.min(added.slow, CAPS.slow) * (1 + mm);
        if (c.id === "frog" || c.id === "jaguar" || c.id === "horse") { this.body.companions.push({ type: c.id, power: added[c.id], ride: added.ride || 0, uid: c.uid }); continue; }
        for (const k in added) {
          if (k === "splode_r") target[k] = Math.max(target[k] || 0, added[k]);
          else target[k] = (target[k] || 0) + added[k];
        }
      }
    }
    this._apply_items();
    for (const k in CAPS) {
      if (k in this.body) this.body[k] = Math.min(this.body[k], CAPS[k]);
      for (const ws of this.wstats) if (k in ws) ws[k] = Math.min(ws[k], CAPS[k]);
    }
    this.body.clones = Math.floor(this.body.clones);
    this.body.clone_power = Math.min(this.body.clone_power, 1);
    const new_max = this.max_hp();
    if (this.in_run && new_max !== old_max) { if (new_max > old_max) this.hp += new_max - old_max; this.hp = Math.min(this.hp, new_max); }
  },
  max_hp() { return 100 + (this.body.hp || 0) + this.max_hp_bonus + this.iv("donut_box", "hp"); },
  speed_mult() { return (1 + (this.body.speed || 0)) * (1 - (this.body.slow || 0)); },
  jump_mult() { return 1 + (this.body.jump || 0); },
  dmg_taken_mult() { return (1 - (this.body.dmg_taken || 0)) * (1 + (this.body.frail || 0)); },
  price_mult() { return 1 - ((this.body && this.body.price) || 0); },
  money_mult() { return 1 + (this.body.money || 0); },
  cooldown_mult() { return 1 - (this.body.cooldown || 0); },
  luck() { return this.body.luck || 0; },
  crit_chance() { return Math.min(0.04 * this.luck(), 0.5); },
  miss_chance() { return this.body.enemy_acc || 0; },
  weapon_level_mult(wi) { const w = this.weapons[wi]; return 1 + 0.2 * (w ? w.level : 0); },

  // ------------------------------------------------------------- items
  stacks(id) { return this.items[id] || 0; },
  has_item(id) { return (this.items[id] || 0) > 0; },
  iv(id, key) { const n = this.stacks(id); return n <= 0 ? 0 : this.iv_at(id, key, n); },
  iv_at(id, key, n) { const p = ITEMS[id].p[key]; return p[0] + p[1] * (Math.max(n, 1) - 1); },
  item_scale() { return 1 + 0.22 * this.danger(); },
  add_item(id, n = 1) {
    if (!(id in this.items)) this.item_order.push(id);

  },
  _item_floor(id) { return { bubble_wrap: 5, rubber_duck: 5, printer: 0.75, tesla_coil: 0.6, red_button: 10 }[id] || 0; },
  item_every(id) { return Math.max(this.iv(id, "every"), this._item_floor(id)); },
  item_text(id, n) {
    const def = ITEMS[id]; let t = def.desc;
    for (const k in def.p) {
      let v = this.iv_at(id, k, n);
      if (k === "every") v = Math.max(v, this._item_floor(id));
      if (k === "stacks") v = Math.max(v, 2);
      t = t.split(`{${k}%}`).join(Math.round(v * 100) + "%");
      t = t.split(`{${k}}`).join(fmtNum(Math.round(v * 100) / 100));
    }
    return t;
  },
  _apply_items() {
    if (!Object.keys(this.items).length) return;
    for (const ws of this.wstats) ws.rate += this.iv("hot_coffee", "rate");
    this.body.speed += this.iv("sneakers", "speed");

    if (this.has_item("break_room_mirror")) { this.body.clones += this.iv("break_room_mirror", "clones"); this.body.clone_power = Math.max(this.body.clone_power, 0.3); }
    for (let k = 0; k < Math.floor(this.iv("support_jaguar", "count")); k++) this.body.companions.push({ type: "jaguar", power: 1.3, ride: 0, uid: -100 - k });
  },

    const pool = Object.keys(ITEMS).filter(id => this.item_rarity(id) >= min_rar && this.is_unlocked("item", id));

    let pool = Object.keys(ITEMS).filter(id => this.item_rarity(id) === rar && this.is_unlocked("item", id) && !exclude.includes(id));
    if (!pool.length) pool = Object.keys(ITEMS).filter(id => this.is_unlocked("item", id) && !exclude.includes(id));

  // ------------------------------------------------------------- weapons

  _furnish(i) {

      storage: this._f_storage, mailsort: this._f_mailsort, servers: this._f_servers, library: this._f_library, lab: this._f_lab, atrium: this._f_atrium, reception: this._f_reception }[room.type] || this._f_office;

  }
  _f_cubicles(i, r) {

    else { for (let x = a.x; x + 4 <= rEndX(a); x += 6) for (let z = a.y; z + 2 <= rEndY(a); z += 2) { this.place(i, "cubicle", R(x, z, 2, 2), 3, 1.3); this.place(i, "cubicle", R(x + 2, z, 2, 2), 1, 1.3); } }

  }
  _f_office(i, r) {
    const a = rInner(r, 1), c = rCenter(a), horiz = this.rng.randf() < 0.5;
    const desk = horiz ? R(c[0] - 1, c[1], 2, 1) : R(c[0], c[1] - 1, 1, 2);

  _f_conference(i, r) {

  _f_breakroom(i, r) {

    this.place_on_wall(i, "fridge", 1, 1.9);

    for (let k = 0; k < 2; k++) {
      if (a.w > 0 && a.h > 0) {

  }
  _f_lounge(i, r) {

    this.place(i, "couch", R(c[0] - 1, c[1] - 2, 2, 1), 2, 0.8);
    this.place(i, "couch", R(c[0] - 1, c[1] + 2, 2, 1), 0, 0.8);
    for (let k = 0; k < 3; k++) this.place_on_wall(i, "plant", 1, 1.3);

  _f_storage(i, r) {
    const a = rInner(r, 1);

    const n = this.rng.range(2, 5);
    for (let k = 0; k < n; k++) { const c = [this.rng.range(r.x, rEndX(r) - 1), this.rng.range(r.y, rEndY(r) - 1)]; this.place(i, "boxes", R(c[0], c[1], 1, 1), this.rng.range(0, 3), this.rng.rangef(0.5, 1.6)); }

  _f_library(i, r) {

// ---------------------------------------------------------------- the roof
class RoofGen extends FloorGen {
  _build() {
    this.W = 50; this.D = 36; this._reset_arrays();
    const W = this.W, D = this.D, rng = this.rng;
    this.start_z = rng.range(D / 2 - 5, D / 2 + 5); this.exit_z = rng.range(D / 2 - 6, D / 2 + 6);
    const sx = this.start_side === 0 ? 0 : W;
    this.doors.push({ axis: "v", line: sx, a: this.start_z - 1, b: this.start_z + 1, kind: "elevator", role: "start" });
    this.start_cell = [this.start_side === 0 ? 0 : W - 1, this.start_z];
    this.exit_cell = [this.start_side === 0 ? W - 9 : 8, this.exit_z];
    this.rooms = [{ rect: R(0, 0, W, D), type: "roof", props: [] }]; this.room_id.fill(0);
    this._clear_zone(this.start_cell, 6, 4);
    for (let z = this.exit_cell[1] - 6; z < this.exit_cell[1] + 6; z++) for (let x = this.exit_cell[0] - 6; x < this.exit_cell[0] + 6; x++)
      if (this.inb(x, z) && Math.hypot(x + 0.5 - this.exit_cell[0], z + 0.5 - this.exit_cell[1]) < 5.6) this.reserved[this.idx(x, z)] = 1;
    this._try_prop("watertower", [3, 3], 5, 20);
    for (let k = 0; k < 7; k++) this._try_prop("ac", [2, 2], 1.3, 20);
    for (let k = 0; k < 4; k++) this._try_prop("skylight", rng.randf() < 0.5 ? [2, 3] : [3, 2], 0.45, 20);
    for (let k = 0; k < 8; k++) this._try_prop("vent", [1, 1], 0.9, 20);
    for (let k = 0; k < 2; k++) this._try_prop("dish", [1, 1], 1.6, 20);
    this._try_prop("antenna", [1, 1], 6, 20);
    for (let k = 0; k < 5; k++) this._try_prop("crates", [1, 1], rng.rangef(0.6, 1.4), 20);
    for (const kind of ["ammo", "ammo", "cabinet"]) { const p = this._edge_prop(kind); if (p) this.interacts.push({ kind, cell: [p.rect.x, p.rect.y], rot: p.rot, prop: p }); }
    for (let k = 0; k < 2; k++) for (let t = 0; t < 100; t++) {
      const c = [rng.range(2, W - 3), rng.range(2, D - 3)];
      if (this.cell_ok(c[0], c[1]) && Math.hypot(c[0] - this.start_cell[0], c[1] - this.start_cell[1]) > 10) { this.pickups.push({ kind: "donutbox", cell: c }); this.reserved[this.idx(c[0], c[1])] = 1; break; }
    }
    return this._finalize();
  }
  _try_prop(kind, size, h, tries) {
    for (let t = 0; t < tries; t++) {
      const c = [this.rng.range(2, this.W - 2 - size[0]), this.rng.range(2, this.D - 2 - size[1])];
      if (Math.hypot(c[0] - this.start_cell[0], c[1] - this.start_cell[1]) < 7) continue;
      let clear = true;
      for (let z = c[1] - 1; z < c[1] + size[1] + 1; z++) for (let x = c[0] - 1; x < c[0] + size[0] + 1; x++) if (this.inb(x, z) && this.blocked[this.idx(x, z)] !== 0) clear = false;
      if (!clear) continue;
      const p = this.place(0, kind, R(c[0], c[1], size[0], size[1]), this.rng.range(0, 3), h);
      if (p) return p;
    }
    return null;
  }
  _edge_prop(kind) {
    for (let t = 0; t < 60; t++) {
      const side = this.rng.range(0, 3); let c, facing;
      if (side === 0) { c = [this.rng.range(4, this.W - 5), 0]; facing = 2; }
      else if (side === 1) { c = [this.W - 1, this.rng.range(4, this.D - 5)]; facing = 3; }
      else if (side === 2) { c = [this.rng.range(4, this.W - 5), this.D - 1]; facing = 0; }
      else { c = [0, this.rng.range(4, this.D - 5)]; facing = 1; }
      if (Math.hypot(c[0] - this.start_cell[0], c[1] - this.start_cell[1]) < 8) continue;
      const f = [c[0] + DIRS[facing][0], c[1] + DIRS[facing][1]];
      if (!this.cell_ok(f[0], f[1])) continue;
      const p = this.place(0, kind, R(c[0], c[1], 1, 1), facing, 1);
      if (p) { this.reserved[this.idx(f[0], f[1])] = 1; return p; }
    }
    return null;
  }
}

// ---------------------------------------------------------------- Floor Mart
function buildStoreGen(seed, start_side) {
  const g = new FloorGen(seed); g.theme = "store"; g.W = 30; g.D = 20; g.start_side = start_side; g._reset_arrays();
  g.start_z = 10; g.exit_z = 10;
  const sx = start_side === 0 ? 0 : g.W, ex = start_side === 0 ? g.W : 0;
  g.doors.push({ axis: "v", line: sx, a: 9, b: 11, kind: "elevator", role: "start" });
  g.doors.push({ axis: "v", line: ex, a: 9, b: 11, kind: "elevator", role: "exit" });
  g.start_cell = [start_side === 0 ? 0 : g.W - 1, 10]; g.exit_cell = [start_side === 0 ? g.W - 1 : 0, 10];
  g.rooms = [{ rect: R(0, 0, g.W, g.D), type: "store", props: [] }]; g.room_id.fill(0);
  g._clear_zone(g.start_cell, 5, 4); g._clear_zone(g.exit_cell, 5, 4);
  for (const xs of [8, 12, 17, 21]) { g.place(0, "storeshelf", R(xs, 2, 1, 5), 1, 1.8); g.place(0, "storeshelf", R(xs, 13, 1, 5), 1, 1.8); }
  const co = g.place(0, "checkout", R(14, 9, 3, 1), 2, 1.0);
  const slot_x = start_side === 1 ? 4 : 25;
  const s1 = g.place(0, "slotmachine", R(slot_x, 0, 1, 1), 2, 1.9), s2 = g.place(0, "slotmachine", R(slot_x + 1, 0, 1, 1), 2, 1.9);
  const fit = g.place(0, "fitting", R(slot_x, 18, 2, 2), 0, 2.4);
  for (const pc of [[1, 1], [g.W - 2, 1], [1, g.D - 2], [g.W - 2, g.D - 2]]) g.place(0, "plant", R(pc[0], pc[1], 1, 1), 0, 1.3);
  if (co) g.interacts.push({ kind: "shop", cell: [15, 9], rot: 2, prop: co });
  if (s1) g.interacts.push({ kind: "slots", cell: [slot_x, 0], rot: 2, prop: s1 });
  if (s2) g.interacts.push({ kind: "slots", cell: [slot_x + 1, 0], rot: 2, prop: s2 });
  if (fit) g.interacts.push({ kind: "deck", cell: [slot_x, 18], rot: 0, prop: fit });
  g.store_counter = co;
  g._finalize();
  return g;
}

"use strict";
// ============================================================================
// World: one floor (combat / store / roof). Map, collisions, pathing, spawning,
// the clock, the clutch, The Sweat, the chopper, interactables, pickups.
// Combat maths lives in combat.js (mixed into World.prototype).
// Coordinates: metres. x right, y down. z up (hops, arcs).
// ============================================================================
const OX = 4, OY = 1;              // map margin (elevator cars live in the x margin)
const FLOOR_TIME = 150;
const LOW_PROP = 1.05;             // props at or below this can be hopped onto
const TALL_PROP = 1.2;             // props at or above this block bullets and sight

class World {
  constructor(kind) {
    this.kind = kind;              // combat | store | roof
    this.enemies = []; this.projs = []; this.pickups = []; this.puddles = []; this.companions = []; this.clones = [];
    this.texts = []; this.parts = []; this.lines = []; this.rings = []; this.flashes = [];
    this.interacts = []; this.time = 0; this.running = true; this.phase = "arrive"; this.phase_t = 0;
    this.time_left = FLOOR_TIME; this.elapsed = 0; this.clutch = false; this.sweat = null; this.sweat_spawn_t = -1; this.spawn_t = 1.5;
    this.last_tick = -1; this.initial_spawned = false; this.start_closed = false; this.out_of_car_t = 0;
    this.heli = null; this.fx_budget = 0; this.chain_cd = [0, 0];
    this.tapes = {}; this.tape_next = 1; this.tape_cur = [-1, -1]; this.tape_cur_t = [0, 0];
    this.flow = null; this.flow_t = 0; this.flow_cell = -1;
    this.result = null; this.banner = null; this.shake = 0;
    this.grid = new Map(); // spatial hash of enemies
  }

  // ------------------------------------------------------------- build
  build() {
    const f = G.floor_def(); this.fdef = f; this.theme = THEMES[f.theme];
    this.start_side = (G.floor_i + G.tower) % 2;
    const seed = G.run_seed + G.floor_i * 1013 + G.tower * 7919;
    let g;
    if (this.kind === "store") g = buildStoreGen(seed, this.start_side);
    else if (this.kind === "roof") { g = new RoofGen(seed); g.generate(seed, "roof", G.danger(), this.start_side); }
    else { g = new FloorGen(seed); g.floor_kind = "combat"; g.case_chance = 0.5; g.generate(seed, f.theme, G.danger(), this.start_side, G.floor_i === 0 && G.tower === 1); }
    this.gen = g;
    this.lobby = this.kind === "combat" && G.floor_i === 0 && G.tower === 1;
    const MW = g.W + OX * 2, MD = g.D + OY * 2; this.MW = MW; this.MD = MD;
    const n = MW * MD;
    this.solid = new Uint8Array(n).fill(1); this.propAt = new Int32Array(n).fill(-1);
    this.wallE = new Uint8Array(n); this.wallS = new Uint8Array(n);
    for (let z = 0; z < g.D; z++) for (let x = 0; x < g.W; x++) {
      const m = this.mi(x + OX, z + OY), gi = g.idx(x, z);
      this.solid[m] = 0;
      this.wallE[m] = g.wall_e[gi]; this.wallS[m] = g.wall_s[gi];
    }
    // props
    this.props = g.props.map((p, i) => {
      const pr = { kind: p.kind, x: p.rect.x + OX, y: p.rect.y + OY, w: p.rect.w, h: p.rect.h, ht: p.h, rot: p.rot, seed: (i * 7919 + G.run_seed) % 9973, used: false };
      for (let z = pr.y; z < pr.y + pr.h; z++) for (let x = pr.x; x < pr.x + pr.w; x++) this.propAt[this.mi(x, z)] = i;
      return pr;
    });
    this.decor = g.decor.map(d => ({ kind: d.kind, x: d.x + OX, y: d.z + OY, rot: d.rot, data: d.data }));
    // elevator cars
    this.cars = [];
    for (const d of g.doors) {
      if (d.kind !== "elevator") continue;
      const left = d.line === 0;
      const cx0 = left ? OX - 3 : g.W + OX;
      const car = { role: d.role, x: cx0, y: d.a - 1 + OY, w: 3, h: (d.b - d.a) + 2, left, door_a: d.a + OY, door_b: d.b + OY, open: 1, target: 1, line_x: left ? OX - 1 : g.W + OX - 1 };
      for (let y = car.y; y < car.y + car.h; y++) for (let x = car.x; x < car.x + 3; x++) this.solid[this.mi(x, y)] = 0;
      for (let y = car.y; y < car.y + car.h; y++) if (y < car.door_a || y >= car.door_b) this.wallE[this.mi(car.line_x, y)] = 1;
      this.cars.push(car);
    }
    this.start_car = this.cars.find(c => c.role === "start") || null;
    this.exit_car = this.cars.find(c => c.role === "exit") || null;
    // interactables
    for (const it of g.interacts) {
      const pr = this.props[g.props.indexOf(it.prop)];
      const f2 = DIRS[it.rot];
      const cx = it.cell[0] + OX + 0.5, cy = it.cell[1] + OY + 0.5;
      this.interacts.push({ kind: it.kind, x: cx + f2[0] * 0.9, y: cy + f2[1] * 0.9, px: cx, py: cy, r: 1.25, used: false, prop: pr });
    }
    if (this.exit_car) this.interacts.push({ kind: "exit", x: this.exit_car.x + 1.5, y: this.exit_car.y + this.exit_car.h / 2, r: 1.7, used: false });
    // floor pickups (donut boxes)
    this.pending_pickups = g.pickups.map(p => ({ x: p.cell[0] + OX + 0.5, y: p.cell[1] + OY + 0.5 }));
    // spawn cells (map coords)
    this.spawns = g.spawns.map(c => [c[0] + OX, c[1] + OY]);
    if (this.kind === "roof") { this.heli_target = { x: g.exit_cell[0] + OX + 0.5, y: g.exit_cell[1] + OY + 0.5 }; }
    if (this.kind === "store") { this.stock_cards = []; this.rerolls = 0; this.keys_bought = 0; this.shakes_bought = 0; this.roll_store(); this.quip_t = 2; }
    // player
    const sc = this.start_car;
    const px = sc ? sc.x + 1.5 : g.start_cell[0] + OX + 0.5, py = sc ? (sc.door_a + sc.door_b) / 2 : g.start_cell[1] + OY + 0.5;
    this.player = new Player(this, px, py, sc && sc.left ? 0 : Math.PI);
    for (const pp of this.pending_pickups) this.drop_pickup("donut", pp.x, pp.y, 25, true);
    this.procs = new Procs(this);
    this.spawn_party();
    this.tile = makeFloorPattern(this.theme, f.theme);
  }
  roll_store() {
    this.stock_cards = []; for (let i = 0; i < 4; i++) this.stock_cards.push(G.random_card(0.2));
    if (!this.stock_weapons) {
      const pool = G.weapon_pool_unlocked().filter(id => !G.weapons.some(w => w && w.id === id) && id !== G.pending_weapon);
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(G.rng.randf() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      this.stock_weapons = pool.slice(0, 2);
      this.stock_items = []; for (let i = 0; i < 3; i++) { const id = G.random_item_id(0.3, this.stock_items); if (id) this.stock_items.push(id); }
    }
  }
  spawn_party() {
    this.companions = [];
    let idx = 0;
    for (const c of G.body.companions) this.companions.push(new Companion(this, c.type, c.power, c.ride, idx++));
    this.clones = [];
    for (let i = 0; i < G.body.clones; i++) this.clones.push(new Clone(this, i));
  }
  mi(x, y) { return x + y * this.MW; }
  inb(x, y) { return x >= 0 && y >= 0 && x < this.MW && y < this.MD; }

  // ------------------------------------------------------------- collision
  // solid for walkers at height z?  (props below z are walkable/hoppable)
  cellBlocks(x, y, z) {
    if (!this.inb(x, y)) return true;
    const m = this.mi(x, y); if (this.solid[m]) return true;
    const p = this.propAt[m]; if (p >= 0 && this.props[p].ht > z - 0.02) return true;
    return false;
  }
  groundAt(x, y) {
    const cx = Math.floor(x), cy = Math.floor(y); if (!this.inb(cx, cy)) return 0;
    const p = this.propAt[this.mi(cx, cy)]; if (p >= 0 && this.props[p].ht <= LOW_PROP) return this.props[p].ht;
    return 0;
  }
  // push a circle out of walls and blocking cells. z = feet height.
  collide(o, r, z = 0) {
    for (let it = 0; it < 3; it++) {
      let moved = false;
      const x0 = Math.floor(o.x - r - 1), x1 = Math.floor(o.x + r + 1), y0 = Math.floor(o.y - r - 1), y1 = Math.floor(o.y + r + 1);
      for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
        if (this.cellBlocks(cx, cy, z)) moved = this._pushBox(o, r, cx, cy, cx + 1, cy + 1) || moved;
        if (!this.inb(cx, cy)) continue;
        const m = this.mi(cx, cy);
        if (this.wallE[m]) moved = this._pushBox(o, r, cx + 1 - 0.07, cy - 0.02, cx + 1 + 0.07, cy + 1.02) || moved;
        if (this.wallS[m]) moved = this._pushBox(o, r, cx - 0.02, cy + 1 - 0.07, cx + 1.02, cy + 1 + 0.07) || moved;
      }
      if (!moved) return it > 0;
    }
    return true;
  }
  _pushBox(o, r, ax, ay, bx, by) {
    const qx = clamp(o.x, ax, bx), qy = clamp(o.y, ay, by);
    let dx = o.x - qx, dy = o.y - qy; const d2 = dx * dx + dy * dy;
    if (d2 >= r * r) return false;
    if (d2 > 1e-9) { const d = Math.sqrt(d2), k = (r - d) / d; o.x += dx * k; o.y += dy * k; }
    else { // centre inside the box: push out along the smallest axis
      const l = o.x - ax, rr = bx - o.x, t = o.y - ay, b = by - o.y, m = Math.min(l, rr, t, b);
      if (m === l) o.x = ax - r; else if (m === rr) o.x = bx + r; else if (m === t) o.y = ay - r; else o.y = by + r;
    }
    return true;
  }
  // ray cast against walls and (tall) props. Returns distance to the first hit (or maxd).
  // tall: only props >= TALL_PROP block (bullets, sight). low=true: every prop blocks (rolling dice, walkers)
  ray(x0, y0, dx, dy, maxd, low = false) {
    let cx = Math.floor(x0), cy = Math.floor(y0);
    const stx = dx > 0 ? 1 : -1, sty = dy > 0 ? 1 : -1;
    const tdx = dx !== 0 ? Math.abs(1 / dx) : 1e9, tdy = dy !== 0 ? Math.abs(1 / dy) : 1e9;
    let tx = dx !== 0 ? ((dx > 0 ? cx + 1 - x0 : x0 - cx) * tdx) : 1e9;
    let ty = dy !== 0 ? ((dy > 0 ? cy + 1 - y0 : y0 - cy) * tdy) : 1e9;
    let t = 0, nx = 0, ny = 0;
    for (let guard = 0; guard < 400; guard++) {
      if (this._rayCellBlocks(cx, cy, low) && t > 0) return { t, nx, ny };
      if (tx < ty) {
        t = tx; if (t > maxd) break;
        // crossing vertical line between cx and cx+stx
        const wx = stx > 0 ? cx : cx - 1;
        if (this.inb(wx, cy) && this.wallE[this.mi(wx, cy)]) return { t: Math.max(0, t - 0.07 * tdx), nx: -stx, ny: 0 };
        cx += stx; tx += tdx; nx = -stx; ny = 0;
      } else {
        t = ty; if (t > maxd) break;
        const wy = sty > 0 ? cy : cy - 1;
        if (this.inb(cx, wy) && this.wallS[this.mi(cx, wy)]) return { t: Math.max(0, t - 0.07 * tdy), nx: 0, ny: -sty };
        cy += sty; ty += tdy; nx = 0; ny = -sty;
      }
    }
    return { t: maxd, nx: 0, ny: 0, miss: true };
  }
  _rayCellBlocks(cx, cy, low) {
    if (!this.inb(cx, cy)) return true;
    const m = this.mi(cx, cy); if (this.solid[m]) return true;
    const p = this.propAt[m]; if (p < 0) return false;
    return low ? true : this.props[p].ht >= TALL_PROP;
  }
  has_los(ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy); if (d < 0.01) return true;
    return this.ray(ax, ay, dx / d, dy / d, d).t >= d - 0.05;
  }

  // ------------------------------------------------------------- pathing (flow field toward John)
  update_flow(dt) {
    this.flow_t -= dt;
    const p = this.player, pc = this.mi(Math.floor(p.x), Math.floor(p.y));
    if (this.flow && this.flow_t > 0 && pc === this.flow_cell) return;
    this.flow_t = 0.3; this.flow_cell = pc;
    const n = this.MW * this.MD; const dist = this.flow || new Float32Array(n); dist.fill(1e9);
    if (!this.cellBlocks(Math.floor(p.x), Math.floor(p.y), 0)) {
      const cap = n * 6; if (!this._fq || this._fq.length < cap) this._fq = new Int32Array(cap);
      const q = this._fq; let h = 0, t = 0; q[t++] = pc; dist[pc] = 0;
      while (h < t) {
        const c = q[h++], cx = c % this.MW, cy = (c / this.MW) | 0, cd = dist[c];
        for (let k = 0; k < 8; k++) {
          const dx = DX8[k], dy = DY8[k];
          if (!this.canStep(cx, cy, dx, dy)) continue;
          const ni = c + dx + dy * this.MW, nd = cd + (k < 4 ? 1 : 1.414);
          if (nd < dist[ni] - 1e-4) { dist[ni] = nd; if (t < cap) q[t++] = ni; }
        }
      }
    }
    this.flow = dist;
  }
  canStep(x, y, dx, dy) {
    if (dx !== 0 && dy !== 0) return this.canStep(x, y, dx, 0) && this.canStep(x, y, 0, dy) && this.canStep(x + dx, y, 0, dy) && this.canStep(x, y + dy, dx, 0);
    const nx = x + dx, ny = y + dy;
    if (this.cellBlocks(nx, ny, 0)) return false;
    if (dx === 1 && this.wallE[this.mi(x, y)]) return false;
    if (dx === -1 && this.wallE[this.mi(nx, ny)]) return false;
    if (dy === 1 && this.wallS[this.mi(x, y)]) return false;
    if (dy === -1 && this.wallS[this.mi(nx, ny)]) return false;
    return true;
  }
  flow_dir(x, y) {
    if (!this.flow) return null;
    const cx = Math.floor(x), cy = Math.floor(y); if (!this.inb(cx, cy)) return null;
    const c = this.mi(cx, cy); let best = this.flow[c], bx = 0, by = 0;
    for (let k = 0; k < 8; k++) {
      const dx = DX8[k], dy = DY8[k];
      if (!this.canStep(cx, cy, dx, dy)) continue;
      const v = this.flow[c + dx + dy * this.MW];
      if (v < best - 0.01) { best = v; bx = dx; by = dy; }
    }
    if (bx === 0 && by === 0) return null;
    // aim at the next cell centre (smooths around corners)
    const tx = cx + bx + 0.5 - x, ty = cy + by + 0.5 - y, l = Math.hypot(tx, ty) || 1;
    return [tx / l, ty / l];
  }
  random_spawn_point() { const c = this.spawns[Math.floor(Math.random() * this.spawns.length)]; return [c[0] + 0.5, c[1] + 0.5]; }

  // ------------------------------------------------------------- spatial queries
  rebuild_grid() {
    this.grid.clear();
    for (const e of this.enemies) { if (!e.alive) continue; const k = (Math.floor(e.x / 3) << 16) | (Math.floor(e.y / 3) & 0xffff); let b = this.grid.get(k); if (!b) this.grid.set(k, b = []); b.push(e); }
  }
  enemies_near(x, y, r) {
    const out = [];
    for (const e of this.enemies) if (e.alive && Math.hypot(e.x - x, e.y - y) < r + e.r * 0.6) out.push(e);
    return out;
  }
  nearest_enemy(x, y, r, need_los) {
    let best = null, bd = r;
    for (const e of this.enemies) {
      if (!e.alive) continue; const d = Math.hypot(e.x - x, e.y - y);
      if (d < bd && (!need_los || this.has_los(x, y, e.x, e.y))) { bd = d; best = e; }
    }
    return best;
  }
  separation(e) {
    let sx = 0, sy = 0; const kx = Math.floor(e.x / 3), ky = Math.floor(e.y / 3);
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const bucket = this.grid.get(((kx + a) << 16) | ((ky + b) & 0xffff)); if (!bucket) continue;
      for (const o of bucket) {
        if (o === e) continue; const dx = e.x - o.x, dy = e.y - o.y, d = Math.hypot(dx, dy), want = e.r + o.r;
        if (d < want && d > 0.001) { const k = (want - d) / want; sx += dx / d * k; sy += dy / d * k; }
      }
    }
    return [sx, sy];
  }

  // ------------------------------------------------------------- main update
  update(dt) {
    if (!this.running) return;
    this.time += dt; this.phase_t += dt; this.fx_budget = 0;
    this.shake = Math.max(0, this.shake - dt * 2);
    for (let i = 0; i < 2; i++) { this.chain_cd[i] -= dt; this.tape_cur_t[i] -= dt; }
    const p = this.player;
    this.rebuild_grid();
    if (this.kind !== "store") this.update_flow(dt);
    p.update(dt);
    this.procs.update(dt);
    for (const e of this.enemies) e.update(dt);
    if (this.enemies.length > 60 || this.time % 1 < dt) this.enemies = this.enemies.filter(e => e.alive || e.death_t < 0.8);
    for (const c of this.companions) c.update(dt);
    for (const c of this.clones) c.update(dt);
    this.update_projs(dt);
    this.update_pickups(dt);
    this.update_puddles(dt);
    this._tick_tapes();
    this.update_fx(dt);
    this.update_cars(dt);
    this.update_interact();
    if (this.kind === "store") this.update_store(dt); else this.update_level(dt);
  }
  update_cars(dt) {
    for (const c of this.cars) {
      c.open = c.target > c.open ? Math.min(c.target, c.open + dt * 1.6) : Math.max(c.target, c.open - dt * 1.6);
      for (let y = c.door_a; y < c.door_b; y++) this.wallE[this.mi(c.line_x, y)] = c.open < 0.35 ? 1 : 0;
    }
    // the arrival car closes behind you (no hiding in it)
    const sc = this.start_car;
    if (sc && !this.start_closed && this.phase === "play") {
      if (this.in_car(sc, this.player.x, this.player.y)) this.out_of_car_t = 0;
      else { this.out_of_car_t += dt; if (this.out_of_car_t > 1.2) { this.start_closed = true; sc.target = 0; Sfx.play("door", 0.5); } }
    }
    // nothing gets shut inside the arrival car
    if (sc && this.start_closed) {
      for (const e of this.enemies) if (e.alive && this.in_car(sc, e.x, e.y)) this.relocate_enemy(e);
      for (const c of this.companions) if (!c.mounted && this.in_car(sc, c.x, c.y)) { c.x = this.player.x; c.y = this.player.y; }
    }
  }
  in_car(c, x, y) { return c && x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h; }

  update_level(dt) {
    const roof = this.kind === "roof";
    if (this.heli) this.update_heli(dt);
    if (this.phase === "arrive") {
      if (this.phase_t > 1.0) {
        this.phase = "play"; this.phase_t = 0; this._spawn_initial();
        const sub = roof ? "Hold out until the chopper arrives." : "Get to the elevator on the far side. Or farm. Your call.";
        this.show_banner(roof ? "THE ROOF" : "FLOOR " + this.fdef.label, this.fdef.name.toUpperCase() + "  -  " + sub, "#ffc93c");
      }
    } else if (this.phase === "play") {
      this.elapsed += dt; this.time_left -= dt; G.stats.time += dt;
      const secs = Math.ceil(this.time_left);
      if (secs <= 10 && secs !== this.last_tick && !this.clutch && secs > 0) { this.last_tick = secs; Sfx.play("tick"); }
      if (this.time_left <= 0 && !this.clutch) this._enter_clutch();
      if (!this.clutch) this._spawn_tick(dt);
      if (this.sweat_spawn_t > 0) { this.sweat_spawn_t -= dt; if (this.sweat_spawn_t <= 0) this._spawn_sweat(); }
    } else if (this.phase === "leaving") {
      if (this.phase_t > 1.15) { this.phase = "done"; this.running = false; this.result = roof ? "win" : "exit"; }
    }
  }
  update_store(dt) {
    if (this.phase === "arrive" && this.phase_t > 1.0) {
      this.phase = "play"; this.phase_t = 0;
      this.show_banner("FLOOR MART", "Shop at the counter, gamble on the bandits, change cards in the fitting room or [Tab]. No timer.", "#ff5050");
    } else if (this.phase === "leaving" && this.phase_t > 1.15) { this.phase = "done"; this.running = false; this.result = "exit"; }
    this.quip_t -= dt;
    const co = this.gen.store_counter;
    if (co && this.quip_t <= 0) {
      const cx = co.rect.x + OX + 1.5, cy = co.rect.y + OY + 0.5;
      if (Math.hypot(this.player.x - cx, this.player.y - cy) < 9) { this.quip_t = rnd(7, 12); this.say_quip(); }
    }
  }
  say_quip() {
    const co = this.gen.store_counter; if (!co) return;
    const cx = co.rect.x + OX + 1.5, cy = co.rect.y + OY - 0.4;
    this.texts.push({ x: cx, y: cy - 0.6, text: QUIPS_CASHIER[Math.floor(Math.random() * QUIPS_CASHIER.length)], col: "#ffffff", t: 0, life: 3.5, vy: 0, size: 13, bubble: true });
    Sfx.play("mumble", 0.4);
  }
  show_banner(title, sub, col) { this.banner = { title, sub, col, t: 0 }; }

  _spawn_initial() {
    if (this.initial_spawned) return; this.initial_spawned = true;
    const n = 3 + Math.min(G.danger(), 10);
    for (let i = 0; i < n; i++) { const pt = this._spawn_point(18); this.spawn_enemy(this._pick_kind(), pt[0], pt[1], this._elite_roll()); }
  }
  _elite_roll() { return G.rng.randf() < Math.min(0.04 + 0.008 * G.danger(), 0.15); }
  _pick_kind() {
    const mix = this.fdef.mix, keys = Object.keys(mix); let r = G.rng.randf() * keys.reduce((s, k) => s + mix[k], 0);
    for (const k of keys) { r -= mix[k]; if (r <= 0) return k; }
    return keys[0];
  }
  _spawn_tick(dt) {
    this.spawn_t -= dt; if (this.spawn_t > 0) return;
    const d = G.danger(), progress = clamp(this.elapsed / FLOOR_TIME, 0, 1);
    this.spawn_t = Math.max(0.35, 2.6 / (1 + 0.1 * d)) * (1 - 0.45 * progress);
    const cap = Math.min(6 + Math.floor(1.8 * d), 40) + (this.kind === "roof" ? 6 : 0);
    const alive = this.enemies.filter(e => e.alive).length; if (alive >= cap) return;
    const kind = this._pick_kind();
    const n = kind === "zambam" ? G.rng.range(2, 2 + Math.min(2, Math.floor(d / 2))) : 1;
    const pt = this._spawn_point(14);
    for (let i = 0; i < Math.min(n, cap - alive); i++) this.spawn_enemy(kind, pt[0] + rnd(-0.6, 0.6), pt[1] + rnd(-0.6, 0.6), this._elite_roll());
  }
  _spawn_point(min_d, roomy = false) {

      const x = c[0] + 0.5, y = c[1] + 0.5, d = Math.hypot(x - p.x, y - p.y);
      if (d < min_d) continue;
      if (!fallback) fallback = [x, y];
      if (d > 48) continue;

  }
  _roomy(c) { for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (this.cellBlocks(c[0] + dx, c[1] + dy, 0)) return false; return true; }
  relocate_enemy(e) { const pt = this._spawn_point(e.kind === "sweat" ? 16 : 12, e.kind === "sweat"); e.x = pt[0]; e.y = pt[1]; e.vx = e.vy = 0; }

  _enter_clutch() {

    this.sweat_spawn_t = 2.5;

  }
  _spawn_sweat() {

  }
  begin_exit() {
    if (this.phase !== "play") return;

    this._leave();
  }
  _leave() {
    this.phase = "leaving"; this.phase_t = 0;

    if (this.player.mount) this.player.dismount();
    if (this.exit_car) this.exit_car.target = 0;
    Sfx.play("ding");
  }
  _spawn_heli() {
    const t = this.heli_target;
    this.heli = { x: t.x + 30, y: t.y - 30, z: 30, land_t: 6, rot: 0, landed: false };
    Sfx.play("heli");
    this.show_banner("THE CHOPPER IS INBOUND", "Get to the helipad! [E] to board once it lands.", "#ffc93c");
  }
  update_heli(dt) {
    const h = this.heli; h.rot += dt * 25;
    if (h.land_t > 0) {
      h.land_t -= dt; let k = 1 - clamp(h.land_t / 6, 0, 1); k = 1 - Math.pow(1 - k, 3);

  }

  // ------------------------------------------------------------- interactables
  update_interact() {
    const p = this.player; let best = null, bs = 1e9;

    }

    if (!important) for (const c of this.companions) {
      const d = Math.hypot(p.x - c.x, p.y - c.y);

      case "case": return `[E] Weapon Case  $${this.cost(it)}  (random weapon)`;
      case "ammo": return "[E] Ammo Crate  (AK ammo)";
      case "exit": return "[E] Press the button. Going up!";
      case "horse": return "[E] Ride the Mini-Horse";
      case "heli": return "[E] Board the chopper. You're out of here!";
      case "shop": return "[E] Shop (the cashier looks thrilled)";

        if (G.rng.randf() < 0.5) this.drop_item(it.x, it.y, G.random_item_id()); else this.drop_card(it.x, it.y, G.random_card(0.15));

  // ------------------------------------------------------------- pickups

  // ------------------------------------------------------------- puddles
  spawn_puddle(x, y) { this.puddles.push({ x, y, r: 1.7, t: 6, life: 6, kind: "sweat" }); if (this.puddles.length > 48) this.puddles.shift(); }

  in_water(x, y) { for (const p of this.puddles) if (p.kind === "water" && Math.hypot(p.x - x, p.y - y) < p.r) return true; return false; }

  // ------------------------------------------------------------- fx

"use strict";
// ============================================================================
// Combat: the damage pipeline, reactions, explosions, chains, tape, golf bowling,
// projectiles, loot. Port of world.gd (v2). Mixed into World.prototype.
// ============================================================================
const C_HEAD = "#ffd23c", C_CRIT = "#ff6ad5";

Object.assign(World.prototype, {
  // ------------------------------------------------------------- weapon hits
  weapon_hit(e, base, head, slot, opts = {}) {
    if (!e || !e.alive) return 0;
    const w = G.weapons[slot]; if (!w) return 0;
    const wd = WEAPONS[w.id], ws = G.wstats[slot];
    if (!head && (G.is_hs_only() || wd.hs_only)) {
      this.fx_text(e.x, e.y - 0.5, "TINK", "#c0c0cc"); Sfx.play("tink", 0.5); UI.hitmarker(false, false, true);
      return 0;
    }
    const depth = opts.depth || 0;
    let dmg = (base + ws.flat) * (1 + ws.dmg) * G.weapon_level_mult(slot) * (opts.power || 1);
    dmg *= this.global_dmg_mult();
    if (w.evo && w.id === "ak") dmg *= 1.3;
    if (head) dmg *= wd.hs * (1 + ws.hs);
    const crit = G.rng.randf() < G.crit_chance(); if (crit) dmg *= 2;
    if (e.sleep_t > 0 && e.kind !== "sweat") { dmg *= 2.5 * this.reaction_mult(); e.sleep_t = 0; this._reaction(e, "RUDE AWAKENING", "#c8b0ff"); }
    if (w.id === "stapler" && w.evo && e.stun_t > 0) dmg *= 2;
    if (!head && e.def.armor) dmg *= e.def.armor;
    dmg *= e.vuln_mult();
    const info = { slot, head, crit, splode: ws.splode, splode_r: ws.splode_r, weapon: w.id, depth, src: opts.src || "weapon", melee: !!opts.melee };
    e.take_hit(dmg, info);
    if (opts.melee && e.alive) e.stagger();
    if (head) G.stats.headshots++;
    let col = head ? C_HEAD : "#ffffff"; if (crit) col = C_CRIT;
    this.fx_text(e.x, e.y - e.r - 0.2, String(Math.round(dmg)) + (crit ? "!" : ""), col, head || crit ? 15 : 13);
    UI.hitmarker(head, !e.alive, false);
    Sfx.play(head ? "headshot" : "hit", head ? 0.55 : 0.45);
    if (crit) Sfx.play("crit", 0.5);
    const pm = opts.proc || 1;
    if (e.alive && e.frozen_t > 0 && dmg >= e.max_hp * 0.2 && this._has_evo("extinguisher")) e.take_hit(e.hp + 1, { slot, depth, src: "shatter", weapon: w.id });
    if (!opts.no_effects) {
      if (ws.burn > 0) e.ignite(dmg * ws.burn / 3, 3, depth + 1);
      if (ws.chain_chance > 0 && this.chain_cd[slot] <= 0 && G.rng.randf() < ws.chain_chance) { this.chain_cd[slot] = 0.12; this.chain_lightning(e, dmg * ws.chain_dmg, Math.round(ws.chain_n), depth + 1); }
      if (ws.chill > 0 && G.rng.randf() < ws.chill * pm) e.add_chill(1, depth + 1);
      if (ws.venom > 0) e.poison(dmg * ws.venom / 3, 3, depth + 1);
      if (ws.rico > 0 && depth === 0 && !opts.no_rico && G.rng.randf() < ws.rico) this._ricochet(e, base * ws.rico_dmg, slot, opts);
      if (w.evo && w.id === "ak" && head && dmg > 0) { w.mag = Math.min(w.mag + 1, G.mag_size(w)); if (G.rng.randf() < 0.35) this.drop_pickup("cash", e.x, e.y, 1); }
      this.tape_share(e, dmg, depth);
      this.procs.on_hit(e, dmg, info, pm);
    }
    return dmg;
  },
  _has_evo(id) { return G.weapons.some(w => w && w.id === id && w.evo); },
  global_dmg_mult() {
    let m = 1 + (G.body.dmg_all || 0);
    if (G.has_item("synergy")) m += G.iv("synergy", "per") * Object.keys(G.items).length;
    if (this.clutch && G.has_item("overtime")) m += G.iv("overtime", "dmg");
    return m;
  },
  reaction_mult() { return 1 + (G.body.catalyst || 0); },
  _reaction(e, label, col) {
    this.fx_text(e.x, e.y - e.r - 0.6, label, col, 14);
    G.stats.reactions = (G.stats.reactions || 0) + 1; G.record_run_stat("reactions", G.stats.reactions);
  },
  _ricochet(src, dmg, slot, opts) {
    let best = null, bd = 7.5;
    for (const o of this.enemies) { if (o === src || !o.alive) continue; const d = Math.hypot(o.x - src.x, o.y - src.y); if (d < bd && this.has_los(src.x, src.y, o.x, o.y)) { bd = d; best = o; } }

      case "note": return false;

  update(dt) {

    this.lx = p.x; this.ly = p.y;

    if (G.has_item("static_socks")) this.static_charge = Math.min(G.iv("static_socks", "cap"), this.static_charge + d);
    if (G.has_item("water_bottle")) { this.drip_d += d; if (this.drip_d >= 2.6 && p.z <= 0.01) { this.drip_d = 0; w.spawn_water(p.x, p.y, G.iv("water_bottle", "r"), G.iv("water_bottle", "life")); } }

class Companion {
  constructor(w, kind, power, ride, idx) {
    this.w = w; this.kind = kind; this.power = power; this.ride = ride; this.idx = idx;
    const p = w.player; const a = Math.PI * 0.75 + idx * 0.9;
    this.ox = Math.cos(a) * 1.6; this.oy = Math.sin(a) * 1.6;

    this.cd = 1; this.retarget_t = 0; this.target = null; this.bite = 0; this.mounted = false; this.walk = 0; this.stuck_t = 0;
    this.r = kind === "horse" ? 0.45 : kind === "jaguar" ? 0.4 : 0.22;
  }
  scale_dmg() { return this.power * G.item_scale(); }
  update(dt) {

        gx = this.target.x; gy = this.target.y; spd = 11;
        if (Math.hypot(this.x - gx, this.y - gy) < 1.5 && this.cd <= 0) { this.cd = 0.8; this.bite = 0.25; w.companion_hit(this.target, 12 * this.scale_dmg(), "jaguar"); Sfx.play("growl", 0.4, rnd(0.9, 1.2)); }
      } else this.target = null;
    } else if (this.kind === "frog") {

        const e = w.nearest_enemy(this.x, this.y, 14, true);
        if (e) { this.cd = 1.6; w.spawn_dart(this.x, this.y, e.x, e.y, 6 * this.scale_dmg()); Sfx.play("ribbit", 0.4, rnd(0.9, 1.3)); } else this.cd = 0.4;

        if (e) { this.cd = 1.2; w.companion_hit(e, 10 * this.scale_dmg(), "horse"); const l = Math.hypot(e.x - this.x, e.y - this.y) || 1; e.apply_knock((e.x - this.x) / l * 8, (e.y - this.y) / l * 8); Sfx.play("neigh", 0.4); }
        else this.cd = 0.3;
      }
    }
    const tx = gx - this.x, ty = gy - this.y, d = Math.hypot(tx, ty);
    if (d > 30) { this.x = p.x + this.ox * 0.5; this.y = p.y + this.oy * 0.5; this.vx = this.vy = 0; return; }

    }
    const a = Math.min(1, 40 * dt / Math.max(0.1, spd)); this.vx = lerp(this.vx, wx, a); this.vy = lerp(this.vy, wy, a);

class Clone {

function mixHex(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${Math.round(lerp(A[0], B[0], k))},${Math.round(lerp(A[1], B[1], k))},${Math.round(lerp(A[2], B[2], k))})`; }

const Music = {
  want: null, song: null, step: 0, next: 0, timer: null,
  play(name, force) {
    if (this.want === name && !force && this.timer) return;
    this.want = name; if (!AC.ctx) return;
    this.song = SONGS[name] || null; this.step = 0; this.next = AC.ctx.currentTime + 0.05;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 50);
  },
  stop() { this.want = null; this.song = null; },
  freq(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  tick() {
    if (!AC.ctx || !this.song) return;
    const s = this.song, spb = 60 / s.bpm / 4;
    while (this.next < AC.ctx.currentTime + 0.2) {
      const bi = Math.floor(this.step / 16) % s.bars.length, st = this.step % 16, bar = s.bars[bi], t = this.next, out = AC.mus;
      const b = bar.bass[st]; if (b) Sfx.tone(s.soft ? "triangle" : "sawtooth", this.freq(b), this.freq(b), spb * 1.6, s.soft ? 0.35 : 0.22, out, t);
      const dch = bar.drums[st];
      if (dch === "k") Sfx.tone("sine", 140, 45, 0.2, 0.7, out, t);
      if (dch === "s") Sfx.noise(0.12, s.soft ? 0.12 : 0.28, "bandpass", 1800, 1200, 0.8, out, t);
      if (dch === "h" || (s.hat && st % 2 === 0 && dch === "-")) Sfx.noise(0.04, s.soft ? 0.05 : 0.1, "highpass", 7000, 7000, 1, out, t);
      if ((bar.bossa && (st === 0 || st === 3 || st === 6 || st === 10 || st === 12)) || (!bar.bossa && (st === 0 || st === 8)))
        for (const n of bar.chord) Sfx.tone(s.soft ? "sine" : "triangle", this.freq(n), this.freq(n), spb * (bar.bossa ? 2.5 : 6), s.soft ? 0.1 : 0.06, out, t, 0.01);
      const lead = s.lead[bi % s.lead.length][st];
      if (lead) Sfx.tone(s.soft ? "sine" : "square", this.freq(lead), this.freq(lead), spb * 1.8, (s.leadVol || 0.4) * (s.soft ? 0.35 : 0.18), out, t, 0.01);
      this.next += spb; this.step++;
    }
  },
};

      s.querySelector('[data-a="back"]').onclick = () => this.title();

    });
  },
  howto() {

        <div><h3>Controls</h3><table class="keys">
          <tr><td>WASD / arrows</td><td>Move</td></tr><tr><td>Mouse</td><td>Aim</td></tr>
          <tr><td>Left click</td><td>Attack (hold)</td></tr><tr><td>Right click</td><td>Alt attack / aim down sights</td></tr>
          <tr><td>Space</td><td>Hop (clears desks and couches)</td></tr><tr><td>Shift</td><td>Slide (katana) / ground-pound (Trust Fall)</td></tr>
          <tr><td>R</td><td>Reload</td></tr><tr><td>Q, wheel, 1, 2</td><td>Swap weapon</td></tr>
          <tr><td>E</td><td>Use / ride the horse / press the elevator button</td></tr>
          <tr><td>Tab</td><td>Cards and items</td></tr><tr><td>Esc / P</td><td>Pause</td></tr></table></div>
        <div><h3>The tower</h3><ul class="tight">
          <li>Floors 1–14 (there is no 13th floor) and the roof. Floors 5 and 10 are Floor Mart.</li>
          <li>Each floor has a <b>2:30</b> timer while bad guys keep coming. At zero you're in <b>the clutch</b>: respawns stop and <b>The Sweat</b> shows up. He's slower than you, and drops a gold card, a slot key and cash.</li>
          <li>The elevator is on the far side. Step in and press <b>E</b>. The ride is where you change cards and cash in <b>Performance Reviews</b> (one per Career level from Kudos stars). The muzak heals you.</li>
          <li>Each weapon has four card slots (green, blue, red, gold). Cards go in the slot of their colour. Red and gold need a Slot Key. Fuse two identical cards to raise the tier.</li>
          <li>Items stack without limit. Tune a weapon to Lv2 and own its catalyst item to <b>evolve</b> it.</li>
          <li>The head sits in the middle of every bad guy. Your crosshair turns gold over it. The AK only hurts on head hits.</li>
          <li>Melee hits stagger a bad guy winding up an attack, and melee kills heal you a little.</li>
        </ul></div>

  },
  corkboard() {

      <div class="row end"><button class="btn" data-close>Close</button></div>`, el => {

      <label class="tog"><input type="checkbox" data-t="dmg_numbers" ${s.dmg_numbers ? "checked" : ""}> Damage numbers</label>
      <label class="tog"><input type="checkbox" data-t="shake" ${s.shake ? "checked" : ""}> Screen shake</label>
      <div class="row end"><button class="btn" data-close>Done</button></div>`, el => {
      el.querySelectorAll("input[type=range]").forEach(r => r.oninput = () => { s[r.dataset.k] = +r.value; r.nextElementSibling.textContent = Math.round(r.value * 100) + "%"; audioVolumes(); G.save_settings(); });

  pause() {

    this.open("pause", `<h2>Paused</h2><p class="muted">Floor ${esc(G.floor_label())} · ${G.is_hs_only() ? "Headshots Only" : "Normal"} · $${G.cash}</p>

        <button class="btn big" data-close>Resume</button>
        <button class="btn" data-a="cards">Cards and items</button>

      el.querySelector('[data-a="how"]').onclick = () => this.howto();
      el.querySelector('[data-a="set"]').onclick = () => this.settings();
      el.querySelector('[data-a="quit"]').onclick = () => {

        m.innerHTML = `<p>Abandon this run? Your progress on the Corkboard is kept.</p><button class="btn" data-a="no">Keep going</button><button class="btn danger" data-a="yes">Abandon</button>`;
