  // =================================================================== cards
  deckSel: null, deckEditable: false, deckTab: "cards", deckMsg: "",
  openDeck(editable) { this.deckEditable = !!editable; this.deckSel = null; this.deckMsg = editable ? "Click a card, then a slot of the same colour." : "View only. You can change cards during the elevator ride or at Floor Mart."; this.renderDeck(); },
  renderDeck() {
    const ed = this.deckEditable;
    const cardHtml = (c, sel, small) => { const d = CARDS[c.id]; return `<div class="card t${c.tier} ${sel ? "sel" : ""} ${small ? "small" : ""}"><div class="ct" style="color:${FAMILY_COLORS[d.family]}">${FAMILY_NAMES[d.family]}</div><b>${esc(d.name)}</b>${small ? "" : `<p>${nl(G.card_text(c))}</p>`}</div>`; };
    const wpanel = wi => {
      const w = G.weapons[wi];
      if (!w) return `<div class="wpanel empty"><b>Weapon ${wi + 1}</b><p class="muted">Empty. Weapon cases, reviews and Floor Mart can fill it.</p></div>`;
      const slots = [0, 1, 2, 3].map(s => {
        const c = w.slots[s], sel = this.deckSel && this.deckSel.type === "slot" && this.deckSel.w === wi && this.deckSel.s === s;
        if (!w.unlocked[s]) return `<button class="slot lock t${s}" data-slot="${wi},${s}">${G.keys > 0 && ed ? "USE KEY" : "LOCKED"}</button>`;
        return `<button class="slot t${s} ${sel ? "sel" : ""}" data-slot="${wi},${s}">${c ? cardHtml(c, sel, true) : `<span>${TIER_NAMES[s]}</span>`}</button>`;
      }).join("");
      const sum = G.weapon_summary(wi);
      const evo = EVOS[w.id];
      return `<div class="wpanel ${G.active === wi ? "act" : ""}"><div class="wh"><canvas width="120" height="40" data-icon="${w.id}${w.evo ? "*" : ""}"></canvas><div><b class="${w.evo ? "gold" : ""}">${esc(G.weapon_name(w))}</b><span>Lv${w.level}${w.evo ? " · EVOLVED" : ` · evolves at Lv${EVO_LEVEL} + ${esc(ITEMS[evo.item].name)}`}</span></div></div>
        <div class="slots">${slots}</div><div class="sum">${sum.length ? sum.map(esc).join(" · ") : "No card bonuses yet."}</div></div>`;
    };
    let right = "";
    if (this.deckTab === "items") {
      right = G.item_order.length ? `<div class="items">${G.item_order.map(id => { const d = ITEMS[id], n = G.stacks(id); return `<div class="item r${d.rarity}"><b>${esc(d.name)} <em>x${n}</em></b><span class="tag">${RARITY_NAMES[d.rarity]}</span><p>${esc(G.item_text(id, n))}</p></div>`; }).join("")}</div>` : `<p class="muted">No items yet. Reviews, supply cabinets, Floor Mart and The Sweat give them out.</p>`;
    } else {
      const bag = G.bag.map((c, i) => `<button class="bagc" data-bag="${i}">${cardHtml(c, this.deckSel && this.deckSel.type === "bag" && this.deckSel.i === i)}</button>`).join("");
      right = `<div class="bag">${bag || `<p class="muted">Your bag is empty. Cards drop from bad guys, cabinets and The Sweat.</p>`}</div>`;
    }
    // selected detail + actions
    const sc = this._selCard(); let act = "";
    if (sc && ed) {
      const twin = sc.tier < 3 ? this._twin(sc) : null;
      act = `<div class="acts">${this.deckSel.type === "slot" ? `<button class="btn" data-a="unequip">Unequip</button>` : ""}${twin ? `<button class="btn" data-a="fuse">Fuse → ${TIER_NAMES[sc.tier + 1]}</button>` : ""}<button class="btn ghost" data-a="shred">Shred +$${G.card_sell_value(sc)}</button></div>`;
    }
    let delivery = "";
    if (G.pending_weapon) {
      const wd = WEAPONS[G.pending_weapon];
      delivery = `<div class="delivery"><b>DELIVERY: ${esc(wd.name)}</b> <span class="muted">${esc(wd.blurb)}</span>${ed ? `<div class="row">${[0, 1].map(wi => `<button class="btn" data-take="${wi}">${G.weapons[wi] ? "Replace " + esc(WEAPONS[G.weapons[wi].id].name) : "Take as #" + (wi + 1)}</button>`).join("")}<button class="btn ghost" data-a="sellwpn">Sell $${Math.round(60 * G.cash_scale())}</button></div>` : `<div class="muted">Swap it in during the elevator ride.</div>`}</div>`;
    }
    const el = this.open("deck", `
      <div class="deckhead"><h2>Cards</h2><div class="stats">$${G.cash} · KEYS ${G.keys} · BAG ${G.bag.length}/${BAG_SIZE}</div>
        <div class="tabs"><button class="${this.deckTab === "cards" ? "on" : ""}" data-tab="cards">Cards</button><button class="${this.deckTab === "items" ? "on" : ""}" data-tab="items">Items (${Object.keys(G.items).length})</button></div></div>
      <div class="deckbody"><div class="weps">${wpanel(0)}${wpanel(1)}${delivery}</div><div class="rightcol">${right}</div></div>
      <div class="deckfoot"><div class="msg">${esc(this.deckMsg)}</div>${act}<button class="btn" data-close>Done</button></div>`, el2 => {
      el2.querySelectorAll("[data-icon]").forEach(c => drawIcon(c, c.dataset.icon));
      el2.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { this.deckTab = b.dataset.tab; this.renderDeck(); });
      el2.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => { const [wi, s] = b.dataset.slot.split(",").map(Number); this._onSlot(wi, s); });
      el2.querySelectorAll("[data-bag]").forEach(b => b.onclick = () => { const i = +b.dataset.bag; this.deckSel = (this.deckSel && this.deckSel.type === "bag" && this.deckSel.i === i) ? null : { type: "bag", i }; this.deckMsg = this.deckSel ? (ed ? `Put it in a ${TIER_NAMES[G.bag[i].tier].toLowerCase()} slot.` : "") : ""; Sfx.play("ui"); this.renderDeck(); });
      el2.querySelectorAll("[data-take]").forEach(b => b.onclick = () => this._takeDelivery(+b.dataset.take));
      const q = s => el2.querySelector(`[data-a="${s}"]`);
      if (q("unequip")) q("unequip").onclick = () => this._unequip();
      if (q("fuse")) q("fuse").onclick = () => this._fuse();
      if (q("shred")) q("shred").onclick = () => this._shred();
      if (q("sellwpn")) q("sellwpn").onclick = () => { G.add_cash(Math.round(60 * G.cash_scale())); G.pending_weapon = ""; Sfx.play("buy"); this.deckMsg = "Sold."; this.renderDeck(); };
    }, "wide");
    return el;
  },
  _selCard() { const s = this.deckSel; if (!s) return null; if (s.type === "bag") return G.bag[s.i] || null; const w = G.weapons[s.w]; return w ? w.slots[s.s] : null; },
  _twin(c) {
    for (let i = 0; i < G.bag.length; i++) { const b = G.bag[i]; if (b.uid !== c.uid && b.id === c.id && b.tier === c.tier) return { type: "bag", i }; }
    for (let wi = 0; wi < 2; wi++) { const w = G.weapons[wi]; if (!w) continue; for (let s = 0; s < 4; s++) { const sc = w.slots[s]; if (sc && sc.uid !== c.uid && sc.id === c.id && sc.tier === c.tier) return { type: "slot", w: wi, s }; } }
    return null;
  },
  _apply(msg) { G.recalc(); if (Main.world) Main.world.on_items_changed(); this.deckMsg = msg; this.renderDeck(); },
  _onSlot(wi, s) {
    const w = G.weapons[wi]; if (!w) return; const ed = this.deckEditable;
    if (!w.unlocked[s]) {
      if (!ed) { this.deckMsg = "Locked. Unlock it with a Slot Key in the elevator."; return this.renderDeck(); }
      if (G.keys > 0) { G.keys--; w.unlocked[s] = true; Sfx.play("key"); return this._apply(`${TIER_NAMES[s]} slot unlocked!`); }
      this.deckMsg = "Locked. Slot Keys come from The Sweat, reviews or Floor Mart."; Sfx.play("deny"); return this.renderDeck();
    }
    if (!ed) { this.deckSel = w.slots[s] ? { type: "slot", w: wi, s } : null; return this.renderDeck(); }
    const sel = this.deckSel;
    if (sel && sel.type === "bag") {
      const card = G.bag[sel.i];
      if (card.tier !== s) { this.deckMsg = `${TIER_NAMES[card.tier]} cards go in ${TIER_NAMES[card.tier].toLowerCase()} slots.`; Sfx.play("deny"); return this.renderDeck(); }
      const old = w.slots[s]; w.slots[s] = card; if (old) G.bag[sel.i] = old; else G.bag.splice(sel.i, 1);
      this.deckSel = null; Sfx.play("equip"); return this._apply(`Equipped ${CARDS[card.id].name}.`);
    }
    if (sel && sel.type === "slot") {
      if (sel.w === wi && sel.s === s) { this.deckSel = null; return this.renderDeck(); }
      if (sel.s === s && sel.w !== wi) { const a = G.weapons[sel.w].slots[sel.s]; G.weapons[sel.w].slots[sel.s] = w.slots[s]; w.slots[s] = a; this.deckSel = null; Sfx.play("equip"); return this._apply("Moved."); }
    }
    this.deckSel = w.slots[s] ? { type: "slot", w: wi, s } : null; Sfx.play("ui"); this.renderDeck();
  },
  _unequip() {
    const s = this.deckSel; if (!s || s.type !== "slot") return;
    if (G.bag.length >= BAG_SIZE) { this.deckMsg = "Bag is full. Shred something first."; return this.renderDeck(); }
    const w = G.weapons[s.w], c = w.slots[s.s]; w.slots[s.s] = null; G.bag.push(c); this.deckSel = null; Sfx.play("equip"); this._apply("Unequipped.");
  },
  _shred() {
    const c = this._selCard(); if (!c) return; const s = this.deckSel, v = G.card_sell_value(c);
    if (s.type === "bag") G.bag.splice(s.i, 1); else G.weapons[s.w].slots[s.s] = null;
    G.add_cash(v); this.deckSel = null; Sfx.play("cash"); this._apply(`Shredded for $${v}.`);
  },
  _fuse() {
    const c = this._selCard(); if (!c || c.tier >= 3) return; const twin = this._twin(c); if (!twin) return;
    const rem = [this.deckSel, twin], bagIdx = rem.filter(r => r.type === "bag").map(r => r.i);
    if (!bagIdx.length && G.bag.length >= BAG_SIZE) { this.deckMsg = "Bag is full. Shred something first."; return this.renderDeck(); }
    bagIdx.sort((a, b) => b - a).forEach(i => G.bag.splice(i, 1));
    for (const r of rem) if (r.type === "slot") G.weapons[r.w].slots[r.s] = null;
    const nc = G.make_card(c.id, c.tier + 1); G.bag.push(nc); this.deckSel = { type: "bag", i: G.bag.length - 1 };
    Sfx.play("card"); this._apply(`Fused into a ${TIER_NAMES[nc.tier]} ${CARDS[nc.id].name}!`);
  },
  _takeDelivery(wi) {
    const id = G.pending_weapon; if (!id) return; const old = G.weapons[wi];
    if (old) { let lost = 0; for (const c of old.slots) if (c) { if (G.bag.length < BAG_SIZE) G.bag.push(c); else { const v = G.card_sell_value(c); G.add_cash(v); lost += v; } } if (lost) G.say(`Bag full: leftover cards sold for $${lost}`, "#ffd34a"); }
    G.weapons[wi] = G.make_weapon(id); G.pending_weapon = ""; G.active = wi; Sfx.play("case"); this.deckSel = null; this._apply(`${WEAPONS[id].name} equipped.`);
  },

  // =================================================================== reviews
  offers: null, reviewMsg: "",
  openReview() {
    if (G.reviews <= 0) return;
    if (!this.offers) this.offers = G.gen_offers();
    const rp = Math.round(30 * G.price_scale()), skip = Math.round(25 * G.cash_scale());
    const cards = this.offers.map((o, i) => { const f = G.offer_info(o); return `<button class="offer" data-o="${i}" style="--c:${f.col}"><canvas width="120" height="48" data-icon="${f.icon || ""}"></canvas><span class="tag">${esc(f.tag)}</span><b>${esc(f.name)}</b><p>${nl(f.desc)}</p>${f.extra ? `<em>${nl(f.extra)}</em>` : ""}</button>`; }).join("");
    this.open("review", `<h2>Performance Review</h2><p class="muted">Reviews left: ${G.reviews} · Career level ${G.career} · $${G.cash}${this.reviewMsg ? ` · <span class="ok">${esc(this.reviewMsg)}</span>` : ""}</p>
      <div class="offers">${cards}</div>
      <div class="row end"><button class="btn ghost" data-a="reroll" ${G.free_rerolls <= 0 && G.cash < rp ? "disabled" : ""}>${G.free_rerolls > 0 ? "Reroll (free)" : `Reroll $${rp}`}</button><button class="btn ghost" data-a="skip">Skip +$${skip}</button><button class="btn" data-close>Later</button></div>`, el => {
      el.querySelectorAll("[data-icon]").forEach(c => drawIcon(c, c.dataset.icon));
      el.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
        const o = this.offers[+b.dataset.o]; const msg = G.apply_offer(o); G.reviews--; this.offers = null; this.reviewMsg = msg;
        Sfx.play(o.type === "evo" ? "evolve" : "review"); if (Main.world) Main.world.on_items_changed();
        if (o.type === "evo") HUD.toast("EVOLUTION!", msg, "#ffe14a");
        if (G.reviews > 0) this.openReview(); else { this.close("review"); G.say(msg, "#ffd23c"); }
      });
      el.querySelector('[data-a="reroll"]').onclick = () => { if (G.free_rerolls > 0) G.free_rerolls--; else if (!G.spend(rp)) return; this.offers = G.gen_offers(); this.reviewMsg = "Rerolled."; Sfx.play("slot_spin", 0.5); this.openReview(); };
      el.querySelector('[data-a="skip"]').onclick = () => { G.reviews--; G.add_cash(skip); this.offers = null; this.reviewMsg = `Skipped. +$${skip}`; Sfx.play("cash"); if (G.reviews > 0) this.openReview(); else this.close("review"); };
    }, "wide");
  },

  // =================================================================== shop
  openShop(w) {
    const price = b => Math.round(b * G.price_scale());
    const rr = price(25 + 15 * w.rerolls);
    const cards = w.stock_cards.map((c, i) => c ? `<div class="sitem"><div class="card t${c.tier}"><div class="ct" style="color:${FAMILY_COLORS[CARDS[c.id].family]}">${FAMILY_NAMES[CARDS[c.id].family]}</div><b>${esc(CARDS[c.id].name)}</b><p>${nl(G.card_text(c))}</p></div><button class="btn" data-card="${i}" ${G.cash < G.card_price(c.tier) || G.bag.length >= BAG_SIZE ? "disabled" : ""}>$${G.card_price(c.tier)}</button></div>` : `<div class="sitem sold">SOLD</div>`).join("");
    const weps = w.stock_weapons.map((id, i) => id ? `<div class="sitem"><canvas width="120" height="40" data-icon="${id}"></canvas><b>${esc(WEAPONS[id].name)}</b><p>${esc(WEAPONS[id].blurb)}</p><button class="btn" data-wep="${i}" ${G.cash < price(260) ? "disabled" : ""}>$${price(260)}</button></div>` : `<div class="sitem sold">SOLD</div>`).join("") || `<p class="muted">Out of stock.</p>`;
    const items = w.stock_items.map((id, i) => id ? `<div class="sitem r${ITEMS[id].rarity}"><b>${esc(ITEMS[id].name)}${G.stacks(id) ? ` <em>(you have ${G.stacks(id)})</em>` : ""}</b><span class="tag">${RARITY_NAMES[ITEMS[id].rarity]}</span><p>${esc(G.item_text(id, G.stacks(id) + 1))}</p><button class="btn" data-item="${i}" ${G.cash < G.item_price(id) ? "disabled" : ""}>$${G.item_price(id)}</button></div>` : `<div class="sitem sold">SOLD</div>`).join("");
    const services = [];
    for (let wi = 0; wi < 2; wi++) { const wp = G.weapons[wi]; if (wp && wp.level < 5) services.push({ id: "tune", arg: wi, name: `Tune-up ${G.weapon_name(wp)} (Lv${wp.level} > ${wp.level + 1})`, price: price(110 * (wp.level + 1)) }); }
    services.push({ id: "key", name: "Slot Key (unlocks a red/gold slot)", price: price(200 * (1 + 0.5 * w.keys_bought)) });
    services.push({ id: "shake", name: "Protein Shake (+15 max HP)", price: price(140), ok: w.shakes_bought < 3 });
    services.push({ id: "heal", name: "Bandages (heal to full)", price: price(40), ok: G.hp < G.max_hp() - 0.5 });
    if (G.weapons.some(x => x && x.id === "ak")) services.push({ id: "ammo", name: "AK ammo (+90)", price: price(50) });
    services.push({ id: "grab", name: "Grab Bag (random card, luckier)", price: price(110), ok: G.bag.length < BAG_SIZE });
    const sv = services.map((s, i) => `<button class="btn svc" data-svc="${i}" ${G.cash < s.price || s.ok === false ? "disabled" : ""}><span>${esc(s.name)}</span><b>$${s.price}</b></button>`).join("");
    this.open("shop", `<div class="deckhead"><h2>Floor Mart</h2><div class="stats">$${G.cash} · BAG ${G.bag.length}/${BAG_SIZE}</div></div>
      <h3>Cards <button class="btn small ghost" data-a="reroll" ${G.cash < rr ? "disabled" : ""}>Reroll $${rr}</button></h3><div class="sgrid">${cards}</div>
      <div class="cols"><div><h3>Items</h3><div class="sgrid two">${items}</div></div><div><h3>Weapons</h3><div class="sgrid two">${weps}</div></div></div>
      <h3>Services</h3><div class="svcs">${sv}</div>
      <div class="row end"><button class="btn" data-close>Leave the counter</button></div>`, el => {
      el.querySelectorAll("[data-icon]").forEach(c => drawIcon(c, c.dataset.icon));
      el.querySelectorAll("[data-card]").forEach(b => b.onclick = () => { const i = +b.dataset.card, c = w.stock_cards[i]; if (!G.spend(G.card_price(c.tier))) return; G.add_card(c); w.stock_cards[i] = null; Sfx.play("buy"); this.openShop(w); });
      el.querySelectorAll("[data-wep]").forEach(b => b.onclick = () => { const i = +b.dataset.wep, id = w.stock_weapons[i]; if (!G.spend(price(260))) return; w.stock_weapons[i] = ""; if (!G.weapons[1]) { G.weapons[1] = G.make_weapon(id); G.recalc(); G.say(`${WEAPONS[id].name} equipped as weapon 2`, "#ffc93c"); } else { G.pending_weapon = id; G.say(`${WEAPONS[id].name}: swap it in from Cards`, "#ffc93c"); } Sfx.play("buy"); this.openShop(w); });
      el.querySelectorAll("[data-item]").forEach(b => b.onclick = () => { const i = +b.dataset.item, id = w.stock_items[i]; if (!G.spend(G.item_price(id))) return; G.add_item(id); w.stock_items[i] = ""; w.on_items_changed(); Sfx.play("item"); this.openShop(w); });
      el.querySelectorAll("[data-svc]").forEach(b => b.onclick = () => {
        const s = services[+b.dataset.svc]; if (!G.spend(s.price)) return;
        switch (s.id) {
          case "tune": G.weapons[s.arg].level++; G.say(`${G.weapon_name(G.weapons[s.arg])} tuned up to Lv${G.weapons[s.arg].level}`, "#ffc93c"); break;
          case "key": G.keys++; w.keys_bought++; Sfx.play("key"); break;
          case "shake": G.max_hp_bonus += 15; G.hp += 15; w.shakes_bought++; break;
          case "heal": G.hp = G.max_hp(); Sfx.play("heal"); break;
          case "ammo": for (const x of G.weapons) if (x && x.id === "ak") { x.reserve += 90; break; } break;
          case "grab": G.add_card(G.random_card(0.5)); break;
        }
        Sfx.play("buy"); G.recalc(); this.openShop(w);
      });
      el.querySelector('[data-a="reroll"]').onclick = () => { if (!G.spend(rr)) return; w.rerolls++; w.roll_store(); Sfx.play("slot_spin", 0.6); this.openShop(w); };
    }, "wide");
  },

  // =================================================================== slots
  slot: { reels: [3, 3, 3], spinning: false, res: "Pull the lever. The house always wins. Mostly.", col: "#c8c8d8" },
  openSlots() {
    const S = this.slot, SYM = [["seven", "7", 2], ["d20", "d20", 2], ["key", "KEY", 3], ["cash", "$", 6], ["heart", "♥", 5], ["sweat", "SWT", 4]];
    const PAY3 = { seven: 20, d20: 10, key: 3, cash: 6, heart: 3, sweat: 0 }, PAY2 = 1.75, bets = [20, 50, 100].map(b => Math.round(b * G.cash_scale()));
    const render = () => this.open("slots", `<h2>One-Armed Bandit</h2><p class="muted">$${G.cash}</p>
      <div class="reels">${S.reels.map(r => `<div class="reel">${SYM[r][1]}</div>`).join("")}</div>
      <div class="sres" style="color:${S.col}">${esc(S.res)}</div>
      <div class="row center">${bets.map((b, i) => `<button class="btn" data-bet="${i}" ${S.spinning || G.cash < b ? "disabled" : ""}>BET $${b}</button>`).join("")}</div>
      <p class="muted small">Three 7s ×20 · three d20 ×10 + a gold card · three $ ×6 · three keys ×3 + a key · three hearts ×3 + full HP · any pair ×1.75 (not sweats)</p>
      <div class="row end"><button class="btn ghost" data-close ${S.spinning ? "disabled" : ""}>Walk away</button></div>`, el => {
      el.querySelectorAll("[data-bet]").forEach(b => b.onclick = () => spin(bets[+b.dataset.bet]));
    });
    const roll = () => { let r = G.rng.randf() * SYM.reduce((s, x) => s + x[2], 0); for (let i = 0; i < SYM.length; i++) { r -= SYM[i][2]; if (r <= 0) return i; } return 0; };
    const spin = bet => {
      if (S.spinning || !G.spend(bet)) return;
      S.spinning = true; const stops = [roll(), roll(), roll()];
      const luck = G.luck(); if (luck > 0 && stops[0] === stops[1] && stops[2] !== stops[0] && SYM[stops[0]][0] !== "sweat" && G.rng.randf() < 0.06 * luck) stops[2] = stops[0];
      Sfx.play("slot_spin"); S.res = "..."; S.col = "#fff"; render();
      let t = 0; const iv = setInterval(() => {
        t += 0.06; const stopped = t > 1.6 ? 3 : t > 1.2 ? 2 : t > 0.8 ? 1 : 0;
        for (let k = 0; k < 3; k++) S.reels[k] = k < stopped ? stops[k] : Math.floor(Math.random() * SYM.length);
        const el = document.getElementById("ov-slots"); if (el) el.querySelectorAll(".reel").forEach((r, k) => r.textContent = SYM[S.reels[k]][1]);
        if (stopped >= 3) {
          clearInterval(iv); S.spinning = false;
          const [a, b, c] = stops.map(i => SYM[i][0]); let win = 0;
          if (a === b && b === c) {
            win = Math.round(bet * PAY3[a]);
            if (a === "seven") { S.res = `SEVEN SEVEN SEVEN! +$${win}`; Sfx.play("jackpot"); }
            else if (a === "d20") { const card = G.make_card(G.random_card_id(), 3); G.add_card(card); S.res = `CRITICAL ROLL! +$${win} and a GOLD ${CARDS[card.id].name}`; Sfx.play("jackpot"); }
            else if (a === "key") { G.keys++; S.res = `Keys! +$${win} and a Slot Key`; Sfx.play("slot_win"); }
            else if (a === "cash") { S.res = `Cha-ching! +$${win}`; Sfx.play("slot_win"); }
            else if (a === "heart") { G.hp = G.max_hp(); S.res = `Health insurance! +$${win} and full HP`; Sfx.play("slot_win"); }
            else { S.res = "Three Sweats. The machine smells weird now."; Sfx.play("slot_lose"); }
            S.col = win > 0 ? "#ffd23c" : "#8fd0ff";
          } else if ((a === b && a !== "sweat") || (b === c && b !== "sweat") || (a === c && a !== "sweat")) { win = Math.round(bet * PAY2); S.res = `A pair. +$${win}`; S.col = "#8cf06a"; Sfx.play("slot_win", 0.6, 1.2); }
          else { S.res = ["Nothing. Classic.", "The cashier didn't even look up.", "So close. (It wasn't close.)", "Try again? The machine believes in you."][Math.floor(Math.random() * 4)]; S.col = "#b8b0b8"; Sfx.play("slot_lose"); }
          if (win > 0) G.add_cash(win);
          if (document.getElementById("ov-slots")) render();
        }
      }, 60);
    };
    render();
  },

  // =================================================================== elevator ride
  ride(from, to) {
    this.setScreen(`<div class="ride">
      <div class="car"><div class="ind"><span id="ride-floor">${esc(from)}</span><i>▲</i></div><div class="doors"><div></div><div></div></div></div>
      <div class="rinfo"><div class="kicker">Elevator · next stop: floor ${esc(to)}</div>
        <div class="rtime" id="ride-time">0:30</div>
        <p class="muted">The muzak is weirdly healing (35% of max HP). This is the only place, besides Floor Mart, where you can change cards.</p>
        <div class="menu"><button class="btn big" data-a="rev" id="ride-rev">Performance Reviews</button><button class="btn" data-a="cards">Cards and items</button><button class="btn ghost" data-a="go" id="ride-go">Open the doors early</button></div>
        <p class="muted small" id="ride-hp"></p></div></div>`, s => {
      s.querySelector('[data-a="rev"]').onclick = () => { Sfx.play("ui"); this.openReview(); };
      s.querySelector('[data-a="cards"]').onclick = () => { Sfx.play("ui"); this.openDeck(true); };
      s.querySelector('[data-a="go"]').onclick = () => { Sfx.play("ding"); Main.ride_t = 0; Main.rideForce = true; };
    });
    this.updateRide(30);
  },
  updateRide(t) {
    const te = $("#ride-time"); if (!te) return;
    te.textContent = t > 0 ? fmtTime(t) : "DING";
    const rb = $("#ride-rev"); if (rb) { rb.textContent = G.reviews > 0 ? `Performance Reviews (${G.reviews})` : "No reviews to cash in"; rb.disabled = G.reviews <= 0; }
    const hp = $("#ride-hp"); if (hp) hp.textContent = `HP ${Math.ceil(G.hp)} / ${Math.round(G.max_hp())} · $${G.cash}` + (t <= 0 && this.stack.length ? " · We're here. Close the menu to step out." : "");
  },

  // =================================================================== end screens
  statsBlock() {
    const s = G.stats, taken = s.taken || {}; let worst = "", wv = 0; for (const k in taken) if (taken[k] > wv) { wv = taken[k]; worst = k; }
    return `<div class="statgrid">
      <div><span>Mode</span><b>${G.is_hs_only() ? "Headshots Only" : "Normal"}</b></div><div><span>Reached</span><b>Floor ${esc(G.floor_label())}</b></div>
      <div><span>Kills</span><b>${s.kills}</b></div><div><span>Head hits</span><b>${s.headshots}</b></div>
      <div><span>Sweats defeated</span><b>${s.sweats}</b></div><div><span>Cash earned</span><b>$${s.cash_earned}</b></div>
      <div><span>Items</span><b>${Object.keys(G.items).length}</b></div><div><span>Career level</span><b>${G.career}</b></div>
      <div><span>Reactions</span><b>${s.reactions || 0}</b></div><div><span>Time on the clock</span><b>${fmtTime(s.time)}</b></div>
      ${worst ? `<div class="wide"><span>Biggest problem</span><b>${esc(worst)} (${Math.round(wv)} damage)</b></div>` : ""}</div>
      ${G.run_unlocks.length ? `<div class="unl"><b>Unlocked this run:</b> ${G.run_unlocks.map(id => { const c = CHALLENGES.find(x => x.id === id); return esc(c.name + " → " + G.reward_name(c.reward)); }).join(" · ")}</div>` : ""}`;
  },
  gameover() {
    Music.play("title");
    const by = G.stats.deaths_by;
    this.setScreen(`<div class="endscr"><div class="kicker">${by ? "Clocked out by " + esc(by) : "Run abandoned"}</div><h1 class="logo red">YOU'RE FIRED</h1>
      ${this.statsBlock()}<div class="row center"><button class="btn big" data-a="again">Try again</button><button class="btn" data-a="title">Title screen</button></div></div>`, s => {
      s.querySelector('[data-a="again"]').onclick = () => this.pick();
      s.querySelector('[data-a="title"]').onclick = () => this.title();
    });
  },
  win() {
    Music.play("roof");
    this.setScreen(`<div class="endscr"><div class="kicker">The chopper lifts off the roof</div><h1 class="logo">YOU ESCAPED</h1>
      <p class="sub">Tower ${G.tower} cleared. The building behind you is somehow taller now.</p>${this.statsBlock()}
      <div class="row center"><button class="btn big" data-a="more">Keep going up (harder tower)</button><button class="btn" data-a="retire">Retire a hero</button></div></div>`, s => {
      s.querySelector('[data-a="more"]').onclick = () => Main.keepGoing();
      s.querySelector('[data-a="retire"]').onclick = () => { G.in_run = false; this.title(); };
    });
  },
};

function floorName(n) { const per = FLOORS.length; const t = Math.floor((n - 1) / per) + 1, f = FLOORS[(n - 1) % per]; return (t > 1 ? "T" + t + "-" : "") + f.label; }

// small canvas icons for menus
function drawIcon(c, key) {
  const g = c.getContext("2d"); g.clearRect(0, 0, c.width, c.height); if (!key) return;
  if (key.startsWith("item:")) { const id = key.slice(5), col = TIER_COLORS[ITEMS[id].rarity]; g.fillStyle = "#1a1a22"; g.beginPath(); g.arc(c.width / 2, c.height / 2, 20, 0, 7); g.fill(); g.strokeStyle = col; g.lineWidth = 3; g.stroke(); drawItemGlyph(g, id, c.width / 2, c.height / 2, 34); return; }
  if (key === "card") { g.fillStyle = "#fff"; g.fillRect(c.width / 2 - 14, 4, 28, 40); g.fillStyle = "#4aa3ff"; g.fillRect(c.width / 2 - 11, 7, 22, 34); return; }
  if (key === "key") { g.strokeStyle = "#ffd34a"; g.lineWidth = 5; g.beginPath(); g.arc(c.width / 2 - 14, c.height / 2, 9, 0, 7); g.moveTo(c.width / 2 - 5, c.height / 2); g.lineTo(c.width / 2 + 22, c.height / 2); g.lineTo(c.width / 2 + 22, c.height / 2 + 9); g.stroke(); return; }
  if (key === "heart") { g.fillStyle = "#ff7a8a"; g.font = "36px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("♥", c.width / 2, c.height / 2 + 2); return; }
  let id = key.replace("weapon:", ""), evo = false; if (id.endsWith("*")) { evo = true; id = id.slice(0, -1); }
  if (!WEAPONS[id]) return;
  drawWeaponIcon(g, id, evo || (key.startsWith("weapon:") && G.weapons.some(w => w && w.id === id && w.evo)), 4, 2, c.width - 8, c.height - 4);
}

"use strict";
// ============================================================================
// Input + main loop + run flow.
// ============================================================================
const ACTIONS = { jump: ["Space"], slide: ["ShiftLeft", "ShiftRight", "KeyC", "ControlLeft"], interact: ["KeyE", "KeyF"], reload: ["KeyR"], swap: ["KeyQ"] };
const Input = {
  keys: new Set(), edge: new Set(), mouse: [false, false, false], medge: [false, false, false], mx: 0, my: 0, wheel: 0,
  down(code) { return this.keys.has(code); },
  pressed(name) { const codes = ACTIONS[name] || [name]; return codes.some(c => this.edge.has(c)); },
  mousePressed(b) { return this.medge[b]; },
  mouseWorld() { return Render.s2w(this.mx, this.my); },
  endFrame() { this.edge.clear(); this.medge = [false, false, false]; },
  clear() { this.keys.clear(); this.mouse = [false, false, false]; },
};

const Main = {
  state: "title", world: null, ride_t: 0, rideForce: false, dead_t: 0, last: 0, acc: 0,
  init() {
    G.load_all();
    G.onNotify = (t, c) => HUD.note(t, c);
    G.onUnlock = (name, reward) => { HUD.toast("CORKBOARD: " + name.toUpperCase(), "Unlocked " + reward, "#7cf08c"); Sfx.play("unlock"); };
    G.onLevel = lv => { HUD.toast("PERFORMANCE REVIEW EARNED", `Career level ${lv}. Cash it in on the elevator ride.`, "#ffd23c"); Sfx.play("review"); };
    Render.init($("#cv")); UI.init();
    window.addEventListener("resize", () => Render.resize());
    const cv = $("#cv");
    window.addEventListener("keydown", e => {
      if (e.target && (e.target.tagName === "INPUT")) return;
      if (e.code === "Tab") { e.preventDefault(); if (!e.repeat) this.onTab(); return; }
      if (e.code === "Escape" || e.code === "KeyP") { if (!e.repeat) this.onEsc(); return; }
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code) && this.state === "play") e.preventDefault();
      if (!this.keys_ok()) return;
      if (!this.keys_ok_overlay()) return;
      if (!Input.keys.has(e.code)) Input.edge.add(e.code);
      Input.keys.add(e.code);
    });
    window.addEventListener("keyup", e => Input.keys.delete(e.code));
    window.addEventListener("blur", () => Input.clear());
    window.addEventListener("mousemove", e => { const r = cv.getBoundingClientRect(); Input.mx = e.clientX - r.left; Input.my = e.clientY - r.top; });
    cv.addEventListener("mousedown", e => { audioInit(); if (UI.stack.length) return; Input.mouse[e.button] = true; Input.medge[e.button] = true; e.preventDefault(); });
    window.addEventListener("mouseup", e => { Input.mouse[e.button] = false; });
    cv.addEventListener("contextmenu", e => e.preventDefault());
    cv.addEventListener("wheel", e => { if (this.state === "play" && !UI.stack.length) { Input.wheel = Math.sign(e.deltaY); e.preventDefault(); } }, { passive: false });
    document.addEventListener("visibilitychange", () => { if (document.hidden && (this.state === "play" || this.state === "ride") && !UI.stack.length) UI.pause(); });
    UI.title();
    requestAnimationFrame(t => { this.last = t; this.frame(t); });
  },
  keys_ok() { return this.state === "play"; },
  keys_ok_overlay() { return UI.stack.length === 0; },
  onTab() {
    if (this.state === "play" && this.world) {
      if (UI.stack.includes("deck")) return UI.close("deck");
      if (UI.stack.length) return;
      UI.openDeck(this.world.kind === "store");
    } else if (this.state === "ride") {
      if (UI.stack.includes("deck")) return UI.close("deck");
      if (!UI.stack.length) UI.openDeck(true);
    }
  },
  onEsc() {
    if (UI.stack.length) { const top = UI.top(); if (top === "slots" && UI.slot.spinning) return; UI.close(top); return; }
    if (this.state === "play" || this.state === "ride") UI.pause();
  },
  startRun(mode, wid) {
    G.new_run(mode, wid);
    this.goto_floor();
  },
  goto_floor() {
    const f = G.floor_def();
    const kind = f.kind === "store" ? "store" : f.kind === "roof" ? "roof" : "combat";
    const w = new World(kind); this.world = w; w.build();
    Render.staticWorld = null; Render.camInit = false; HUD.mmWorld = null; HUD.notes = []; HUD.toasts = [];
    UI.setScreen(""); UI.closeAll(); Input.clear();
    this.state = "play"; this.dead_t = 0;
    G.record_floor_reached();
    Music.play(kind === "store" ? "store" : kind === "roof" ? "roof" : "floor");
    document.body.classList.add("playing");
  },
  goto_ride() {
    this.state = "ride"; this.world = null; document.body.classList.remove("playing");
    this.ride_t = 30; this.rideForce = false; G.free_rerolls = 1; UI.offers = null; UI.reviewMsg = "";
    const from = String(G.floor_def().label), to = G.floor_i + 1 < FLOORS.length ? String(FLOORS[G.floor_i + 1].label) : "R";
    Music.play("muzak"); Sfx.play("ding");
    UI.ride(from, to);
    setTimeout(() => { if (this.state === "ride" && G.reviews > 0 && !UI.stack.length) UI.openReview(); }, 600);
  },
  endRun(why) {
    G.in_run = false; G.record_floor_reached(); G.save_progress();
    this.state = "end"; this.world = null; document.body.classList.remove("playing");
    UI.gameover();
  },
  keepGoing() { G.tower++; G.floor_i = 0; G.in_run = true; this.goto_floor(); },

  frame(t) {
    let dt = Math.min(0.05, (t - this.last) / 1000); this.last = t;
    try { this.update(dt); } catch (err) { console.error(err); }
    Input.endFrame();
    requestAnimationFrame(tt => this.frame(tt));
  },
  update(dt) {
    if (this.state === "play" && this.world) {
      const w = this.world;
      if (!UI.stack.length) {
        // fixed-ish substeps for stable physics
        const steps = Math.max(1, Math.ceil(dt / 0.017)), h = dt / steps;
        for (let i = 0; i < steps; i++) { w.update(h); w.run_timers(h); if (i < steps - 1) Input.endFrame(); }
        G.stats.run_time += dt;
      }
      if (!this.noRender) Render.draw(w, UI.stack.length ? 0 : dt);
      if (w.player.dead) { this.dead_t += dt; if (this.dead_t > 1.6) { this.endRun("dead"); return; } }
      if (w.result === "exit") { this.goto_ride(); return; }
      if (w.result === "win") { G.best.wins++; G.add_total("wins", 1); G.record_floor_reached(); G.save_progress(); this.state = "end"; this.world = null; document.body.classList.remove("playing"); UI.win(); return; }
    } else if (this.state === "ride") {
      const was = this.ride_t;
      this.ride_t = Math.max(0, this.ride_t - dt);
      const healed = Math.max(0, Math.min(was, 30) - Math.max(this.ride_t, 10)); // heal during the first 20 s
      if (healed > 0) G.heal(G.max_hp() * 0.35 * healed / 20);
      UI.updateRide(this.ride_t);
      if (this.ride_t <= 0 && !UI.stack.length) {
        G.floor_i = Math.min(G.floor_i + 1, FLOORS.length - 1); this.goto_floor();
      }
    }
  },
};
window.addEventListener("load", () => Main.init());

</script>
