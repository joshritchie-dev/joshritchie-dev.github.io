<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Value Chain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: Sparkworks' neon factory board, moved into an office after hours.
   Elevator buttons choose the floor; the side panel is the intranet. Single dark look by design. */
:root { --bg:#070b14; --panel:#0e1524; --panel2:#0a1120; --edge:#1f2c45; --edge2:#2e4366; --ink:#e6eefb; --dim:#7f90ad; --dim2:#5a6a88;
  --cyan:#3ee6ff; --gold:#ffcf4a; --pink:#ff5aa8; --green:#5dffa8; --violet:#a98bff; --red:#ff5a5a; --doc:#ff6ae0; --hl:#ffe36a;
  --head:'Space Grotesk', 'Segoe UI', system-ui, sans-serif; --body:'Inter', system-ui, sans-serif; color-scheme:dark; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--body); }
body { overflow:hidden; }
button { font:inherit; color:inherit; cursor:pointer; }
button:disabled { cursor:not-allowed; }
:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
#app { position:fixed; inset:0; display:flex; padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
#boardWrap { flex:1; position:relative; min-width:0; display:flex; flex-direction:column; }
.num { font-variant-numeric:tabular-nums; }

/* header */
#top { display:flex; align-items:center; gap:16px; padding:10px 16px 6px; flex-wrap:wrap; }
.brand { display:flex; flex-direction:column; line-height:1.05; }
.brand b { font:700 15px/1 var(--head); letter-spacing:3px; color:var(--cyan); text-shadow:0 0 14px #3ee6ff66; }
.brand small { font-size:10.5px; color:var(--dim2); letter-spacing:.4px; margin-top:3px; }
.money { display:flex; align-items:baseline; gap:12px; }
#cash { font:700 34px/1 var(--head); color:var(--gold); text-shadow:0 0 18px #ffcf4a55; }
#rate { font:600 16px/1 var(--head); color:var(--green); }
.stat { display:flex; flex-direction:column; gap:3px; min-width:110px; background:none; border:0; padding:0; text-align:left; }
.stat small { font:600 10px/1 var(--head); letter-spacing:1.2px; text-transform:uppercase; color:var(--dim); }
.stat b { font:600 13px/1.1 var(--head); }
.meter { height:5px; border-radius:3px; background:#16233c; overflow:hidden; width:100%; }
.meter span { display:block; height:100%; border-radius:3px; background:var(--green); width:0; transition:width .3s; }
#moraleBox { flex-direction:row; flex-wrap:wrap; align-items:center; column-gap:8px; width:140px; }
#moraleBox small { width:100%; }
#moraleBox .meter { flex:1; }
#moraleBox b { font-size:12px; color:var(--dim); width:24px; text-align:right; }
.rankchip { cursor:pointer; min-width:150px; max-width:220px; }
.rankchip b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rankchip .meter span { background:var(--gold); }
.rankchip.ready b { color:var(--gold); }
.rankchip.ready small { color:var(--gold); }
.eqs { font:600 12px/1.35 var(--head); color:var(--violet); min-width:0; margin-left:auto; text-align:right; }
.eqs .seats { color:var(--doc); }
.hbtns { display:flex; gap:6px; }
.hb { background:var(--panel); border:1px solid var(--edge); border-radius:8px; width:32px; height:32px; font:600 14px/1 var(--head); color:var(--dim); }
.hb:hover { color:var(--ink); border-color:var(--edge2); }

/* floors: an elevator panel */
#floorRow { display:flex; gap:10px; align-items:center; padding:4px 16px 0; }
#floors { display:flex; gap:8px; align-items:stretch; flex-wrap:wrap; flex:1; min-width:0; }
.fl { display:flex; align-items:center; gap:9px; background:var(--panel2); border:1px solid var(--edge); border-radius:999px; padding:4px 13px 4px 4px; color:var(--dim); text-align:left; min-width:0; position:relative; }
.fl .btn-n { width:30px; height:30px; flex:none; border-radius:50%; border:2px solid var(--edge2); display:flex; align-items:center; justify-content:center; font:700 13px/1 var(--head); color:var(--ink); background:#0c1424; }
.fl span { display:flex; flex-direction:column; line-height:1.15; }
.fl b { font:600 12px/1.2 var(--head); color:var(--ink); white-space:nowrap; }
.fl small { font-size:10.5px; white-space:nowrap; }
.fl.on { border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset, 0 0 14px #3ee6ff33; }
.fl.on .btn-n { border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 10px #3ee6ff66; }
.fl.locked { opacity:.45; }
.fl .ping { position:absolute; top:2px; left:26px; width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); }

#cvWrap { flex:1; min-height:0; position:relative; }
#cv { display:block; width:100%; height:100%; cursor:crosshair; touch-action:none; }
#buffs { position:absolute; left:16px; top:8px; display:flex; flex-direction:column; gap:4px; pointer-events:none; }
.buff { font:600 11.5px/1 var(--head); background:#0c1424dd; border:1px solid var(--edge2); border-radius:999px; padding:5px 10px; color:var(--ink); }
.buff i { font-style:normal; color:var(--green); }
.buff.bad i { color:var(--red); }

#toolbar { display:flex; align-items:center; gap:10px; padding:4px 16px 2px; }
.tl { display:flex; gap:6px; }
.tb { background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:7px 10px; font:600 12px/1 var(--head); letter-spacing:.3px; color:var(--dim); white-space:nowrap; }
.tb:hover:not(:disabled) { color:var(--ink); border-color:var(--edge2); }
.tb:disabled { opacity:.4; }
.tb.crunch { background:#2a1a0a; border-color:#7a5418; color:var(--gold); letter-spacing:1px; }
.tb.crunch.live { background:var(--gold); color:#1a1205; box-shadow:0 0 18px #ffcf4a88; }
#ticker { flex:1; min-width:0; font-size:12.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#ticker b { color:var(--ink); font-weight:600; }
#hint { padding:2px 16px 10px; font-size:12.5px; color:var(--dim); min-height:26px; }
#hint b { color:var(--cyan); }

/* side panel */
#side { width:380px; flex:none; background:var(--panel); border-left:1px solid var(--edge); display:flex; flex-direction:column; min-height:0; }
#tabs { display:flex; flex-wrap:wrap; border-bottom:1px solid var(--edge); }
#tabs button { flex:1 1 auto; background:none; border:0; color:var(--dim); font:600 12px/1 var(--head); padding:12px 3px 10px; white-space:nowrap; border-bottom:2px solid transparent; }
#tabs button.on { color:var(--ink); border-color:var(--cyan); }
#tabs .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--gold); margin-left:5px; vertical-align:middle; }
#tabs .badge { display:inline-block; min-width:16px; padding:2px 4px; margin-left:5px; border-radius:999px; background:var(--red); color:#fff; font-size:10px; text-align:center; vertical-align:1px; }
#pane { flex:1; overflow:auto; padding:12px; overscroll-behavior:contain; }
.sec { font:600 11px/1.3 var(--head); letter-spacing:1.8px; color:var(--dim); margin:16px 0 8px; text-transform:uppercase; display:flex; justify-content:space-between; gap:8px; }
.sec:first-child { margin-top:2px; }
.card { background:var(--panel2); border:1px solid var(--edge); border-radius:12px; padding:12px; margin-bottom:8px; }
.card h3 { margin:0 0 6px; font:700 17px/1.2 var(--head); }
.card h3 small { font:500 12px/1 var(--body); color:var(--dim); margin-left:6px; }
.card p { margin:0 0 8px; font-size:13px; line-height:1.45; color:#c5d0e4; }
.card p:last-child { margin-bottom:0; }
.st { font:600 12.5px/1.4 var(--head); color:var(--cyan); }
.row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.btn { background:#0c1424; border:1px solid var(--edge2); border-radius:8px; padding:8px 11px; font:700 12px/1 var(--head); letter-spacing:.6px; color:var(--ink); }
.btn:hover:not(:disabled) { border-color:var(--cyan); }
.btn:disabled { opacity:.45; }
.btn.gold { background:var(--gold); border-color:var(--gold); color:#1a1205; }
.btn.violet { background:var(--violet); border-color:var(--violet); color:#140d2a; }
.btn.doc { background:var(--doc); border-color:var(--doc); color:#2a0b22; }
.btn.red { border-color:#7a2a35; color:#ff9aa5; }
.big { font:700 30px/1.1 var(--head); margin:8px 0; }
.parts { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:7px; }
.part { background:var(--panel2); border:1px solid var(--edge); border-radius:10px; padding:7px; display:flex; gap:8px; align-items:flex-start; text-align:left; color:var(--ink); min-width:0; }
.part:hover:not(.locked) { border-color:var(--edge2); }
.part.sel { border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset, 0 0 14px #3ee6ff33; }
.part.locked { opacity:.4; cursor:default; }
.part img { flex:none; width:40px; height:40px; }
.part > span { display:flex; flex-direction:column; min-width:0; gap:2px; }
.part b { font:700 13px/1.15 var(--head); }
.part b i { font-style:normal; color:var(--dim2); font-size:10.5px; margin-left:3px; }
.part .cost { font:600 12px/1 var(--head); color:var(--gold); }
.part.cant .cost { color:var(--red); }
.part small { font-size:11px; line-height:1.3; color:var(--dim); }
.res { display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px solid var(--edge); border-radius:10px; padding:9px 10px; margin-bottom:6px; }
.res > div { flex:1; min-width:0; }
.res b { font:700 13px/1.2 var(--head); display:block; }
.res small { display:block; font-size:12px; color:var(--dim); line-height:1.35; margin-top:2px; }
.res.done { opacity:.55; }
.lv { font:600 11px/1 var(--head); color:var(--dim); margin-left:4px; }
.tog { background:#0c1424; border:1px solid var(--edge2); border-radius:999px; padding:6px 12px; font:700 11px/1 var(--head); color:var(--dim); }
.tog.on { background:var(--green); border-color:var(--green); color:#062014; }
.ms { display:flex; gap:10px; font-size:12.5px; color:var(--dim); padding:5px 0; border-bottom:1px solid #16233c; }
.ms .n { flex:0 0 64px; font:600 12px/1.4 var(--head); color:var(--dim2); }
.ms.on { color:var(--ink); }
.ms.on .n { color:var(--violet); }
.tess { color:var(--doc); }
.ladder { display:flex; flex-direction:column; gap:4px; }
.lad { display:flex; gap:10px; align-items:baseline; font-size:12.5px; color:var(--dim); padding:6px 8px; border-radius:8px; }
.lad b { font:600 13px/1.2 var(--head); color:var(--ink); flex:0 0 150px; }
.lad.now { background:#13203a; box-shadow:0 0 0 1px var(--edge2) inset; }
.lad.done b { color:var(--green); }
.lad.future b { color:var(--dim); }
.pbar { height:8px; border-radius:4px; background:#16233c; overflow:hidden; margin:8px 0 4px; }
.pbar span { display:block; height:100%; background:linear-gradient(90deg, #a07a20, var(--gold)); }
.feed { display:flex; flex-direction:column; gap:7px; }
.feed div { font-size:12.5px; line-height:1.45; color:#c5d0e4; padding-left:9px; border-left:2px solid var(--edge2); }
.feed div.promo { border-color:var(--gold); } .feed div.mail { border-color:var(--cyan); } .feed div.walk { border-color:var(--green); } .feed div.first { border-color:var(--pink); } .feed div.reorg { border-color:var(--violet); } .feed div.crunch { border-color:#ff9a3a; }
.mail { background:var(--panel2); border:1px solid var(--edge); border-radius:12px; padding:11px 12px; margin-bottom:8px; }
.mail .mh { display:flex; justify-content:space-between; gap:8px; font-size:11.5px; color:var(--dim); }
.mail .mh b { color:var(--ink); font-weight:600; }
.mail .ms2 { font:700 14px/1.3 var(--head); margin:3px 0 4px; }
.mail p { margin:0 0 8px; font-size:13px; line-height:1.45; color:#c5d0e4; }
.choice { display:block; width:100%; text-align:left; background:#0c1424; border:1px solid var(--edge2); border-radius:9px; padding:8px 10px; font-size:12.5px; line-height:1.35; margin-top:5px; color:var(--ink); }
.choice:hover { border-color:var(--cyan); }
.dec { display:flex; flex-direction:column; gap:2px; padding:6px 0; border-bottom:1px solid #16233c; font-size:12.5px; }
.dec b { font:600 13px/1.25 var(--head); color:var(--hl); }
.dec span { color:var(--dim); }
input.search { width:100%; background:#0c1424; border:1px solid var(--edge2); border-radius:8px; padding:8px 10px; color:var(--ink); font:inherit; font-size:13px; margin-bottom:6px; }
mark.jg { background:transparent; color:var(--hl); border-bottom:1px dotted #ffe36a88; cursor:help; }
#jtip { position:fixed; z-index:60; max-width:270px; background:#1b1530; border:1px solid #4a3a7a; color:#fff; border-radius:9px; padding:8px 10px; font-size:12.5px; line-height:1.4; pointer-events:none; box-shadow:0 10px 30px #000a; }
#jtip b { display:block; color:var(--hl); font:600 12px/1.3 var(--head); margin-bottom:2px; }

/* modal + toasts */
.ov { position:fixed; inset:0; background:#02040aaa; backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:20px max(16px, env(safe-area-inset-right)) 20px max(16px, env(safe-area-inset-left)); z-index:50; overflow-y:auto; }
.mo { background:var(--panel); border:1px solid var(--edge2); border-radius:16px; padding:22px 24px 20px; width:100%; max-width:470px; box-shadow:0 30px 80px #000c; margin:auto 0; }
.mo .kick { font:700 11px/1 var(--head); letter-spacing:2px; text-transform:uppercase; color:var(--cyan); }
.mo h2 { font:700 25px/1.15 var(--head); margin:6px 0 10px; }
.mo p { font-size:14px; line-height:1.55; color:#c5d0e4; margin:0 0 10px; }
.mo .quote { font-style:italic; color:var(--ink); border-left:3px solid var(--gold); padding-left:10px; }
.mo ul { margin:0 0 10px; padding-left:18px; font-size:13.5px; line-height:1.5; color:#c5d0e4; }
.mo .acts { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; flex-wrap:wrap; }
.mo .bigv { font:700 32px/1.1 var(--head); color:var(--gold); margin:4px 0 10px; }
#toasts { position:fixed; right:max(16px, env(safe-area-inset-right)); bottom:max(16px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:6px; z-index:40; pointer-events:none; max-width:min(380px, calc(100vw - 32px)); align-items:flex-end; }
.toast { background:#0c1424f2; border:1px solid var(--edge2); border-radius:10px; padding:9px 12px; font-size:13px; line-height:1.4; box-shadow:0 8px 24px #000a; animation:tin .2s ease; }
.toast b { color:var(--gold); }
.toast.good { border-color:#2a7a55; } .toast.bad { border-color:#7a2a35; } .toast.decn { border-color:#6a5a1a; }
@keyframes tin { from { opacity:0; transform:translateY(6px); } }

/* phone and narrow screens: stack, and let the page scroll */
@media (max-width: 860px) {
  body { overflow:auto; }
  #app { position:static; flex-direction:column; }
  #boardWrap { height:auto; }
  #top { gap:10px 14px; padding:10px 16px 4px; }
  .brand small { display:none; }
  #cash { font-size:28px; }
  .eqs { margin-left:0; text-align:left; width:100%; }
  .eqs:empty { display:none; }
  #floors { flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; }
  .fl { flex:none; padding-right:4px; }
  .fl span { display:none; }
  .fl.on { padding-right:12px; }
  .fl.on span { display:flex; }
  .fl small { display:none; }
  #cvWrap { flex:none; height:min(62vh, 520px); }
  #tabs { flex-wrap:nowrap; overflow-x:auto; }
  #toolbar { flex-wrap:wrap; }
  #ticker { order:3; flex-basis:100%; white-space:normal; font-size:12px; }
  .tb.crunch { margin-left:auto; }
  #side { width:100%; border-left:0; border-top:1px solid var(--edge); }
  #pane { overflow:visible; }
  .parts { grid-template-columns:minmax(0, 1fr); }
}
@media (max-width: 420px) {
  .stat { min-width:0; }
  #moraleBox { width:118px; }
  .rankchip { max-width:170px; }
  .tb { padding:7px 8px; }
}
</style>
<div id="app">
  <section id="boardWrap" aria-label="The office">
    <header id="top">
      <div class="brand"><b>VALUE CHAIN</b><small>Hollingsworth Group · after hours</small></div>
      <div class="money"><div id="cash" class="num">$0</div><div id="rate" class="num">$0/s</div></div>
      <div class="stat" id="moraleBox" title="Morale speeds up Brainstorms. Crunch Time, Meetings and Consultants wear it down."><small>Morale</small><div class="meter"><span id="moraleBar"></span></div><b id="moraleTxt">80</b></div>
      <button type="button" class="stat rankchip" id="rankChip" title="Open Career"><small id="rankSmall">Career</small><b id="rankTitle">Unpaid Intern</b><div class="meter"><span id="promoBar"></span></div></button>
      <div class="stat eqs" id="eqLine"></div>
    </header>
    <div id="floorRow"><nav id="floors" aria-label="Floors"></nav><div class="hbtns"><button type="button" class="hb" id="bSound" aria-label="Sound" title="Sound">♪</button><button type="button" class="hb" id="bHelp" aria-label="How to play" title="How to play">?</button></div></div>
    <div id="cvWrap"><canvas id="cv" aria-label="Floor plan. Click a tile to build."></canvas><div id="buffs"></div></div>
    <div id="toolbar">
      <div class="tl"><button type="button" class="tb" id="bRotate" title="Rotate (R)">⟳ Rotate</button><button type="button" class="tb" id="bUpg" title="Upgrade selected (U)">▲ Upgrade</button><button type="button" class="tb" id="bSellSel" title="Sell selected (X)">✕ Sell</button></div>
      <div id="ticker" aria-live="polite"></div>
      <button type="button" class="tb crunch" id="bCrunch" title="Crunch Time (Space)">CRUNCH TIME</button>
    </div>
    <div id="hint"></div>
  </section>
  <aside id="side" aria-label="Office tools">
    <nav id="tabs"></nav>
    <div id="pane"></div>
  </aside>
</div>
<div id="ov" class="ov" role="dialog" aria-modal="true" hidden><div class="mo" id="mo"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="jtip" hidden></div>
<script>
"use strict";
const JARGON = [
  ['circle back', 'We will never speak of this again.', 'circl(?:e|ed|ing) back'],
  ['touch base', 'Interrupt someone to confirm nothing has changed.', 'touch(?:ing|ed)? base'],
  ['synergy', 'Two departments doing one job, worse.', 'synerg(?:y|ies|ize|izing|istic)'],
  ['leverage', 'Use, but with more syllables.', 'leverag(?:e|ed|ing)'],
  ['move the needle', 'Make a number on a slide go up.', 'mov(?:e|ed|ing) the needle'],
  ['low-hanging fruit', 'Work someone else already did.'],
  ['deep dive', 'A meeting about a meeting.', 'deep[- ]dives?'],
  ['take it offline', 'Stop talking in front of my boss.', 'tak(?:e|ing) (?:it|this) offline'],
  ['bandwidth', 'Willingness, disguised as capacity.'],
  ['paradigm shift', 'The same thing, in a new font.'],
  ['value add', 'The part we bill extra for.', 'value[- ]adds?'],
  ['pivot', 'We were wrong, but faster.', 'pivot(?:ed|ing|s)?'],
  ['run it up the flagpole', 'Ask someone more senior to say no.', '(?:run|ran|running) it up the flagpole'],
  ['parking lot', 'Where good ideas go to die.'],
  ['win-win', 'I win twice.', 'win[- ]win'],
  ['thought leadership', 'Opinions with a headshot.'],
  ['disrupt', 'Break something that worked.', 'disrupt(?:ed|ing|ive|ion)?'],
  ['ideate', 'Think, but billable.', 'ideat(?:e|ed|ing|ion)'],
  ['north star', 'A metric nobody can name.'],
  ['core competency', 'The one thing we haven\'t outsourced yet.', 'core competenc(?:y|ies)'],
  ['best practice', 'What a consultant did once, in 2009.', 'best practices?'],
  ['action item', 'A task assigned to whoever left the call first.', 'action items?'],
  ['deliverable', 'Anything with a logo on it.', 'deliverables?'],
  ['stakeholder', 'Someone who can say no but never says yes.', 'stakeholders?'],
  ['alignment', 'Everyone agreeing to do nothing.', 'align(?:ment|ed)'],
  ['holistic', 'We didn\'t read any of it, all at once.', 'holistic(?:ally)?'],
  ['scalable', 'Works until a second person uses it.', 'scal(?:able|e it)'],
  ['game changer', 'Slightly different.', 'game[- ]changers?'],
  ['blue-sky thinking', 'Ideas with no budget.', 'blue[- ]sky(?: thinking)?'],
  ['think outside the box', 'Do my job for me.', '(?:think(?:ing)? )?outside the box'],
  ['hard stop', 'I\'m leaving whether this ends or not.'],
  ['EOD', 'Some time before the heat death of the universe.', 'EOD'],
  ['per my last email', 'Can you read?'],
  ['unpack', 'I didn\'t understand any of that.', 'unpack(?:ing)?'],
  ['double-click', 'Explain it again, slower.', 'double[- ]click(?:ing)?'],
  ['level set', 'Remind everyone who is in charge.', 'level[- ]set'],
  ['socialize', 'Forward it to everyone and hope.', 'socializ(?:e|ed|ing)'],

  const e = Math.floor(Math.log10(n) / 3);

const J = (() => {

}
let PANE_SIG = '';
function renderPane() {

}
function paneSig() {
  const sel = SEL && tileXY(SEL.f, SEL.x, SEL.y) === SEL ? SEL.id + ':' + SEL.lvl + ':' + SEL.dir + ':' + (SEL.boost || 0) + ':' + (PARTS[SEL.type].up ? +afford(upCostL(SEL)) : 0) : '';
  switch (TAB) {
    case 'build': return S.view + S.rank + S.tier + ORDER.map(t => visible(t) ? +unlocked(t) + '' + +afford(partCostL(t)) : '').join('') + sel + !!(S.layout && S.ghost) + TOOL;
    case 'train': return S.rank + Object.entries(TRAINING).map(([k, R]) => trLv(k) + ':' + +afford(trCostL(R, trLv(k)))).join('');
    case 'career': return S.rank + ':' + canPromote() + ':' + S.log.length + ':' + (S.log[0] && S.log[0].t) + ':' + crunchOpen() + Math.round(S.morale / 5);
    case 'inbox': return S.inbox.map(m => m.id).join(',') + S.stats.mails + ':' + Math.floor(S.t / 60) + ':' + decodedN();

function renderHint() {

  else h.innerHTML = IS_TOUCH ? 'Tap a part, then tap the floor · tap a placed part to upgrade, rotate or sell · drag to lay workflows' : '<b>R</b>/wheel rotate · <b>right-click</b> sell · <b>U</b> upgrade · <b>1–0</b> pick part · <b>Q/E</b> change floor · <b>Space</b> Crunch · drag to lay workflows';
}
let HINT_SIG = '';

// ---------------------------------------------------------------------
// ACTIONS
// ---------------------------------------------------------------------
function placeAt(x, y, type, dir) {
  const why = tryPlace(S.view, x, y, type, dir);
  if (why) { toast(esc(why), 'bad', 2200); sfx('nope'); return false; }
  sfx('place'); return true;
}
function doUpgrade(t) { if (!t) return; if (upgrade(t)) { sfx('up'); renderPane(); } else sfx('nope'); }
function doSell(t) { if (!t || t.type === 'arr') return; const r = sell(t); toast(`Sold ${esc(PARTS[t.type].n)} for ${fmtV(r)}`); sfx('sell'); if (SEL === t) SEL = null; renderPane(); }
function doRotate(by = 1) { if (SEL && tileXY(SEL.f, SEL.x, SEL.y) === SEL) { rotateTile(SEL, by); sfx('click'); renderPane(); } else { TOOL_DIR = (TOOL_DIR + by) % 4; } }

function doPromote() {
  if (!canPromote()) { toast(`${esc(RANKS[Math.min(S.rank + 1, RANKS.length - 1)].boss)}: ${jz(pick(PROMO_DENY))}`, 'bad', 4200); sfx('nope'); return; }
  promote(); sfx('promo'); BLAYER = null; renderPane(); flush();
}
function doClaim() { const r = claimWalk(); if (!r) return; sfx('walk'); toast(`<b>${esc(r.w.n)}:</b> ${jz(r.say)}<br>${esc(r.res)}`, 'good', 4500); }

// ---------------------------------------------------------------------
// ENGINE NOTIFICATIONS
// ---------------------------------------------------------------------
let DEC_N = 0, DEC_T = 0;
function flush() {
  if (S.newDec) { DEC_N += S.newDec; S.newDec = 0; }
  if (DEC_N && performance.now() - DEC_T > 2500) { toast(`Decoded <b>${DEC_N}</b> new phrase${DEC_N > 1 ? 's' : ''}. Hover the highlighted text.`, 'decn', 2600); DEC_N = 0; DEC_T = performance.now(); }
  if (!S.pending.length) return;
  const L = S.pending; S.pending = [];
  for (const p of L) {
    if (p.type === 'ach') { const a = ACHIEVEMENTS.find(x => x.id === p.id); if (a) toast(`Trophy: <b>${esc(a.n)}</b><br>${esc(a.d)}`, 'good', 4200); }
    else if (p.type === 'mail') { const e = EMAILS.find(x => x.id === p.id); if (e) { toast(`New email from <b>${esc(e.from)}</b><br>${esc(e.subj)}`, '', 3600); sfx('mail'); } }
    else if (p.type === 'promo') promoModal(p);
    else if (p.type === 'story') storyModal(p.id);

}

// ---------------------------------------------------------------------
// INPUT
// ---------------------------------------------------------------------
function tileAt(e) { const r = cv.getBoundingClientRect(); const x = Math.floor((e.clientX - r.left - OX) / TS), y = Math.floor((e.clientY - r.top - OY) / TS); return x >= 0 && y >= 0 && x < GW() && y < GH() ? { x, y } : null; }
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  audio(); IS_TOUCH = e.pointerType !== 'mouse';
  const p = tileAt(e); if (!p) return;
  const f = S.view;
  if (S.walk && S.walk.f === f && S.walk.x === p.x && S.walk.y === p.y && e.button === 0) { doClaim(); return; }
  const t = tileXY(f, p.x, p.y);
  if (e.button === 2) { if (t) doSell(t); return; }
  if (t && TOOL && TOOL !== 'belt' && t.type === 'belt' && unlocked(TOOL) && !(TOOL === 'gen' && f > 0)) {

  else renderPane();
});
addEventListener('pointerup', () => { DRAG = null; });
addEventListener('pointercancel', () => { DRAG = null; });
cv.addEventListener('pointermove', e => {
  const p = tileAt(e); HOVER = p;
  if (DRAG && p && TOOL === 'belt' && (p.x !== DRAG.last.x || p.y !== DRAG.last.y)) {
    const dx = p.x - DRAG.last.x, dy = p.y - DRAG.last.y;
    if (Math.abs(dx) + Math.abs(dy) === 1) {
      const d = dx === 1 ? 0 : dy === 1 ? 1 : dx === -1 ? 2 : 3;
      const prev = tileXY(S.view, DRAG.last.x, DRAG.last.y); if (prev && prev.type === 'belt') prev.dir = d;
      TOOL_DIR = d; if (!tileXY(S.view, p.x, p.y)) placeAt(p.x, p.y, 'belt', d); DRAG.last = p; renderPane();

});
cv.addEventListener('pointerleave', () => { HOVER = null; });

addEventListener('keydown', e => {
  if (MODAL) { if (e.key === 'Escape') closeModal(); return; }

  else if (k === ' ') { e.preventDefault(); doCrunch(); }
  else if (k === 'u' && SEL) doUpgrade(SEL);
  else if ((k === 'delete' || k === 'backspace' || k === 'x') && SEL) doSell(SEL);
  else if (k === 'q') setView(S.view - 1);
  else if (k === 'e') setView(S.view + 1);

document.addEventListener('click', e => {

addEventListener('beforeunload', save);
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {

function boot(data) {

      () => { $('mOk').onclick = () => { earn(off.L); audio(); sfx('walk'); closeModal(); }; });
  }

}
try { window.claude?.hot?.snapshot?.(() => ({ save:S ? serialize() : null })); } catch (e) {}
(window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {}));
