<style>

<script>
"use strict";
// ============================================================================
// FOLD engine: paper squares on a grid. Shared by the game and the level generator.
// A cell is one square of paper. state[i] = {x, y, z, fx, fy}: grid position, layer
// rank at that position (0 = bottom), and mirror parity from vertical / horizontal folds.
// Road bits: N=1 E=2 S=4 W=8 (in the face's own printed frame).
// ============================================================================
const N = 1, E = 2, S = 4, Wb = 8;
const DIRV = [[0, -1, N, S], [1, 0, E, Wb], [0, 1, S, N], [-1, 0, Wb, E]]; // dx, dy, bit, opposite
function mirX(b) { return (b & (N | S)) | ((b & E) ? Wb : 0) | ((b & Wb) ? E : 0); }
function mirY(b) { return (b & (E | Wb)) | ((b & N) ? S : 0) | ((b & S) ? N : 0); }

function initState(level) { const st = []; for (let i = 0; i < level.w * level.h; i++) st.push({ x: i % level.w, y: (i / level.w) | 0, z: 0, fx: 0, fy: 0 }); return st; }
function cloneState(s) { return s.map(c => ({ x: c.x, y: c.y, z: c.z, fx: c.fx, fy: c.fy })); }
function bbox(s) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const c of s) { if (c.x < x0) x0 = c.x; if (c.y < y0) y0 = c.y; if (c.x > x1) x1 = c.x; if (c.y > y1) y1 = c.y; } return { x0, y0, x1, y1 }; }
// every legal fold: axis "v" = vertical crease at x = k (between columns k-1 and k), side +1 = the x>=k part moves
function legalFolds(s) {
  const b = bbox(s), out = [];
  for (let k = b.x0 + 1; k <= b.x1; k++) { out.push({ axis: "v", k, side: 1 }, { axis: "v", k, side: -1 }); }
  for (let k = b.y0 + 1; k <= b.y1; k++) { out.push({ axis: "h", k, side: 1 }, { axis: "h", k, side: -1 }); }
  return out;
}
function moving(c, f) { const v = f.axis === "v" ? c.x : c.y; return f.side > 0 ? v >= f.k : v < f.k; }
function applyFold(s, f) {
  const ns = cloneState(s), key = (x, y) => x * 4096 + y;
  const stat = new Map(), movCount = new Map();
  for (const c of s) { const m = moving(c, f), k = key(c.x, c.y); if (m) movCount.set(k, (movCount.get(k) || 0) + 1); else stat.set(k, (stat.get(k) || 0) + 1); }
  for (let i = 0; i < s.length; i++) {
    const c = s[i]; if (!moving(c, f)) continue;
    const n = movCount.get(key(c.x, c.y)), d = ns[i];
    if (f.axis === "v") { d.x = 2 * f.k - 1 - c.x; d.fx ^= 1; } else { d.y = 2 * f.k - 1 - c.y; d.fy ^= 1; }

}

function faceUp(c) { return (c.fx ^ c.fy) ? "b" : "f"; }
function faceXform(c) { const up = faceUp(c); return { mx: up === "f" ? c.fx : c.fx ^ 1, my: c.fy }; }
function visBits(level, i, c) { const face = level.cells[i][faceUp(c)]; if (!face || !face.r) return 0; const t = faceXform(c); let b = face.r; if (t.mx) b = mirX(b); if (t.my) b = mirY(b); return b; }
// visible map: position -> {i, face} (holes are see-through)
function visibleMap(level, s) {
  const by = new Map();
  for (let i = 0; i < s.length; i++) { const c = s[i], k = c.x + "," + c.y; let a = by.get(k); if (!a) by.set(k, a = []); a.push(i); }
  const vis = new Map();
  for (const [k, arr] of by) {
    arr.sort((a, b) => s[b].z - s[a].z);
    const top = arr.find(i => !level.cells[i].hole);
    if (top !== undefined) vis.set(k, { i: top, face: faceUp(s[top]) });
  }
  return vis;
}
// does this state meet the level goal? returns {ok, path:[positions]} for drawing
function checkGoal(level, s) {
  const vis = visibleMap(level, s);
  // landmarks must stay visible, face up
  for (const lm of level.keep || []) {
    const c = s[lm.i], v = vis.get(c.x + "," + c.y);
    if (!v || v.i !== lm.i || v.face !== lm.face) return { ok: false };
  }
  if (level.goal === "meet") {
    const a = s[level.meet[0]], b = s[level.meet[1]];
    return { ok: a.x === b.x && a.y === b.y, at: [a.x, a.y] };

  // connect: every town visible, all on one road network
  const towns = {};
  for (const [k, v] of vis) { const f = level.cells[v.i][v.face]; if (f && f.c) towns[f.c] = k; }
  for (const t of level.towns) if (!towns[t]) return { ok: false };
  const start = towns[level.towns[0]], seen = new Map([[start, null]]), q = [start];
  while (q.length) {
    const k = q.shift(), [x, y] = k.split(",").map(Number), v = vis.get(k), bits = visBits(level, v.i, s[v.i]);
    for (const [dx, dy, bit, opp] of DIRV) {
      if (!(bits & bit)) continue;
      const nk = (x + dx) + "," + (y + dy), nv = vis.get(nk); if (!nv || seen.has(nk)) continue;
      if (!(visBits(level, nv.i, s[nv.i]) & opp)) continue;
      seen.set(nk, k); q.push(nk);
    }
  }
  for (const t of level.towns) if (!seen.has(towns[t])) return { ok: false };
  // path for the victory drive: chain town -> town
  const path = [];
  for (let ti = level.towns.length - 1; ti > 0; ti--) {
    let k = towns[level.towns[ti]]; const seg = [];
    // rebuild BFS from previous town for a clean segment
    const from = towns[level.towns[ti - 1]], prev = bfsPath(level, s, vis, from); let cur = towns[level.towns[ti]];
    while (cur) { seg.push(cur); cur = prev.get(cur); }
    path.unshift(...(path.length ? seg.slice(0, -1) : seg).reverse());
  }
  return { ok: true, path: path.map(k => k.split(",").map(Number)) };
}
function bfsPath(level, s, vis, start) {
  const seen = new Map([[start, null]]), q = [start];
  while (q.length) {
    const k = q.shift(), [x, y] = k.split(",").map(Number), v = vis.get(k), bits = visBits(level, v.i, s[v.i]);
    for (const [dx, dy, bit, opp] of DIRV) {
      if (!(bits & bit)) continue;
      const nk = (x + dx) + "," + (y + dy), nv = vis.get(nk); if (!nv || seen.has(nk)) continue;
      if (!(visBits(level, nv.i, s[nv.i]) & opp)) continue;
      seen.set(nk, k); q.push(nk);
    }
  }
  return seen;
}
// breadth-first solver. Returns the shortest fold list (or null) within maxDepth / maxStates.
function solve(level, s0, maxDepth, maxStates = 400000) {
  if (checkGoal(level, s0).ok) return [];
  const seen = new Set([stateKey(s0)]); let frontier = [{ s: s0, path: [] }];
  for (let d = 1; d <= maxDepth; d++) {
    const next = [];
    for (const node of frontier) {
      for (const f of legalFolds(node.s)) {
        const ns = applyFold(node.s, f), key = stateKey(ns);
        if (seen.has(key)) continue; seen.add(key);
        const path = node.path.concat([f]);
        if (checkGoal(level, ns).ok) return path;
        next.push({ s: ns, path });
        if (seen.size > maxStates) return undefined; // gave up
      }
    }
    frontier = next;
  }
  return null;
}
if (typeof module !== "undefined") module.exports = { N, E, S, Wb, DIRV, mirX, mirY, initState, cloneState, bbox, legalFolds, applyFold, stateKey, faceUp, faceXform, visBits, visibleMap, checkGoal, solve, moving };

</script>

// ============================================================================

$("#bReset").addEventListener("click", () => { Sfx.init(); resetLevel(); });
$("#bHint").addEventListener("click", () => { Sfx.init(); hint(); });
$("#bSound").addEventListener("click", () => { Sfx.init(); save.sound = !save.sound; writeSave(); updateSoundBtn(); Sfx.play("tap"); });
$("#bMaps").addEventListener("click", () => { Sfx.init(); showLevels(); });
function updateSoundBtn() { const b = $("#bSound"); b.classList.toggle("muted", !save.sound); b.querySelector(".wave").style.display = save.sound ? "" : "none"; b.setAttribute("aria-pressed", String(save.sound)); }

window.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const ov = document.querySelector(".ov.show");
  if (e.key === "Escape") { if (ov && ov.id === "levels" && G.L) closeOverlays(); else { G.sel = null; G.hint = null; } return; }
  if (ov) return;
  Sfx.init();
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) setPeek(true); return; }
  if (e.repeat) return;
  if (e.key === "z" || e.key === "Z" || e.key === "Backspace") { e.preventDefault(); undo(); }
  else if (e.key === "r" || e.key === "R") resetLevel();
  else if (e.key === "h" || e.key === "H") hint();
});
window.addEventListener("keyup", e => { if (e.code === "Space") setPeek(false); });
window.addEventListener("blur", () => setPeek(false));
window.addEventListener("resize", () => layout());

// ---------------------------------------------------------------- HUD & overlays
let toastTimer = 0;
function toast(msg, ms = 3000) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function updateHUD() {
  const L = G.L; if (!L) return;
  const ch = LEVELS[G.ci];
  $("#lvName").textContent = `${ch.name}, map ${G.li + 1} of ${ch.levels.length}`;
  const vis = visibleMap(L, G.s), shownTowns = new Set();
  for (const v of vis.values()) { const f = L.cells[v.i][v.face]; if (f && f.c) shownTowns.add(f.c); }
  const chip = (t) => `<span class="chip${shownTowns.has(t) ? "" : " off"}"><span class="dot"></span>${esc(t)}</span>`;
  let html;
  if (L.goal === "meet") {
    const pin = (j) => `<span class="chip"><span class="pin" style="background:${PIN_COL[j]}"><i>${j ? "B" : "A"}</i></span>${esc(L.towns[j])}</span>`;
    html = `Fold ${pin(0)} onto ${pin(1)}.`;
  } else if (L.towns.length === 3) html = `Join ${chip(L.towns[0])}, ${chip(L.towns[1])} and ${chip(L.towns[2])} by one road.`;
  else html = `Join ${chip(L.towns[0])} and ${chip(L.towns[1])} by road.`;
  if (L.keep && L.keep.length) {
    let ok = 0;
    for (const lm of L.keep) { const c = G.s[lm.i], v = vis.get(c.x + "," + c.y); if (v && v.i === lm.i && v.face === lm.face) ok++; }
    html += ` <span class="chip"><span class="star">★</span>${ok} of ${L.keep.length} landmarks showing</span>`;
  }
  $("#goal").innerHTML = html;
  const folds = G.hist.length;
  $("#folds").innerHTML = `<b>${folds}</b><span>${folds === 1 ? "fold" : "folds"}, par ${L.par}</span>`;
  $("#bUndo").disabled = !folds || G.won; $("#bReset").disabled = !folds || G.won;
  $("#bHint").disabled = G.won; $("#bPeek").disabled = G.won;
}
function closeOverlays() { document.querySelectorAll(".ov.show").forEach(o => o.classList.remove("show")); }
function showOverlay(id) { closeOverlays(); $("#" + id).classList.add("show"); const b = $("#" + id).querySelector(".btn.main, .tile:not(:disabled), button"); if (b) setTimeout(() => b.focus({ preventScroll: true }), 30); }
function showIntro(ci) {
  $("#iName").textContent = LEVELS[ci].name; $("#iBlurb").textContent = LEVELS[ci].blurb;
  showOverlay("intro");
}
$("#iGo").addEventListener("click", () => { Sfx.init(); closeOverlays(); levelTip(); });
function nextUnsolved() {
  for (const [ci, li] of ORDER) if (!solved(ci, li) && unlocked(ci, li)) return [ci, li];
  return null;
}
function showTitle() {
  const n = Object.keys(save.best).length;
  $("#tProgress").textContent = n ? `${n} of ${ORDER.length} maps folded.` : `${ORDER.length} maps in ${LEVELS.length} chapters.`;
  $("#tPlay").textContent = n ? "Carry on" : "Play";
  showOverlay("title");
}
$("#tPlay").addEventListener("click", () => { Sfx.init(); const nx = nextUnsolved() || [0, 0]; loadLevel(nx[0], nx[1]); });
$("#tMaps").addEventListener("click", () => { Sfx.init(); showLevels(); });
function showLevels() {
  let html = "";
  LEVELS.forEach((ch, ci) => {
    let got = 0; ch.levels.forEach((l, li) => { const b = save.best[lid(ci, li)]; if (b != null) got += starsFor(b, l.par); });
    html += `<section class="chap"><h3>${esc(ch.name)} <small>${got} of ${ch.levels.length * 3} stars</small></h3><p>${esc(ch.blurb)}</p><div class="tiles">`;
    ch.levels.forEach((l, li) => {
      const b = save.best[lid(ci, li)], st = b != null ? starsFor(b, l.par) : 0, open = unlocked(ci, li);
      const cur = G.L && G.ci === ci && G.li === li ? " cur" : "";
      html += `<button class="tile${cur}" data-ci="${ci}" data-li="${li}" ${open ? "" : "disabled"} aria-label="${esc(ch.name)} map ${li + 1}${open ? (st ? `, ${st} stars` : "") : ", locked"}"><b>${li + 1}</b><em>${"★".repeat(st)}</em></button>`;
    });
    html += `</div></section>`;
  });
  $("#chaps").innerHTML = html;
  $("#lClose").style.display = G.L ? "" : "none";
  showOverlay("levels");
}
$("#chaps").addEventListener("click", e => { const t = e.target.closest(".tile"); if (!t || t.disabled) return; Sfx.init(); loadLevel(+t.dataset.ci, +t.dataset.li); });
$("#lClose").addEventListener("click", () => { if (G.L) closeOverlays(); else showTitle(); });
function showWin() {
  G.winShown = true;
  const L = G.L, folds = G.hist.length, st = starsFor(folds, L.par), best = save.best[lid(G.ci, G.li)];
  $("#wHead").textContent = L.goal === "meet" ? `${L.towns[0]} meets ${L.towns[1]}` : "The road is open";
  $("#wStars").innerHTML = [0, 1, 2].map(k => `<span class="${k < st ? "" : "no"}">★</span>`).join("");
  $("#wStars").setAttribute("aria-label", `${st} of 3 stars`);
  let txt = `You took ${folds} ${folds === 1 ? "fold" : "folds"}. Par is ${L.par}.`;
  if (st < 3) txt += ` Fold it in ${L.par} for three stars.`;
  if (best < folds) txt += ` Your best is ${best}.`;
  const n = orderIndex(G.ci, G.li), last = n === ORDER.length - 1;
  if (last) txt += Object.keys(save.best).length === ORDER.length ? " That's every map folded. Go back for any stars you missed." : " That was the last map. A few earlier ones are still unsolved.";
  $("#wText").textContent = txt;
  $("#wNext").style.display = last ? "none" : "";
  $("#wNext").textContent = !last && ORDER[n + 1][1] === 0 ? `Next: ${LEVELS[ORDER[n + 1][0]].name}` : "Next map";
  showOverlay("win");
}
$("#wNext").addEventListener("click", () => { const n = orderIndex(G.ci, G.li); if (n < ORDER.length - 1) loadLevel(ORDER[n + 1][0], ORDER[n + 1][1]); });
$("#wAgain").addEventListener("click", () => loadLevel(G.ci, G.li));
$("#wMaps").addEventListener("click", () => showLevels());

// ---------------------------------------------------------------- main loop
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t;
  try { update(dt); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function update(dt) {
  if (!G.L) return;
  const a = G.anim;
  if (a) {
    const sp = G.fast ? 1e9 : Math.PI / FOLD_TIME, dir = Math.sign(a.target - a.th);
    a.th += dir * sp * dt;
    if (dir === 0 || (dir > 0 && a.th >= a.target) || (dir < 0 && a.th <= a.target)) {
      a.th = a.target; G.anim = null;
      if (a.target >= Math.PI) commitFold(a);
    }
  }
  // camera glides to the middle of the paper and zooms to fit it
  let b;
  if (G.peek) b = bbox(G.peekState);
  else if (G.anim) { const p = bbox(G.anim.from), q = bbox(G.anim.to); b = { x0: Math.min(p.x0, q.x0), y0: Math.min(p.y0, q.y0), x1: Math.max(p.x1, q.x1), y1: Math.max(p.y1, q.y1) }; }
  else b = bbox(G.s);
  const tx = (b.x0 + b.x1 + 1) / 2, ty = (b.y0 + b.y1 + 1) / 2, k = G.fast ? 1 : 1 - Math.exp(-dt * 6);
  if (!G.drag) { G.cam.x += (tx - G.cam.x) * k; G.cam.y += (ty - G.cam.y) * k; G.cs += (fitSize(b) - G.cs) * k; }
  if (G.won) {
    const before = G.winT; G.winT += dt;
    if (G.route && Math.floor(before / 0.3) !== Math.floor(G.winT / 0.3) && G.winT / 0.3 < G.route.length) Sfx.play("car");
    if (!G.winShown && G.winT > (G.fast ? 0 : winDuration())) showWin();
  }
}

// ---------------------------------------------------------------- boot
loadSave(); updateSoundBtn(); layout();
window.FOLD = { G, LEVELS, ORDER, loadLevel, startFold, undo, resetLevel, hint, showLevels, showTitle, save, dragFold, creaseAt };
(function boot() {
  let lastId = null; try { lastId = localStorage.getItem(SAVE_KEY + "-last"); } catch (e) { /* ignore */ }
  const m = lastId && /^(\d+)-(\d+)$/.exec(lastId);
  if (m && LEVELS[+m[1]] && LEVELS[+m[1]].levels[+m[2]] && unlocked(+m[1], +m[2])) { G.ci = +m[1]; G.li = +m[2]; }
  // show the current map behind the title card
  G.L = LEVELS[G.ci].levels[G.li]; G.s0 = initState(G.L); G.s = G.s0; G.sheets = buildSheets(G.L);
  G.peekState = G.L.cells.map((_, i) => ({ x: G.L.w - 1 - (i % G.L.w), y: (i / G.L.w) | 0, z: 0, fx: 1, fy: 0 }));
  const b = bbox(G.s); G.cam.x = (b.x0 + b.x1 + 1) / 2; G.cam.y = (b.y0 + b.y1 + 1) / 2;
  layout(); updateHUD(); showTitle();
  requestAnimationFrame(t => { last = t; frame(t); });
})();

</script>
