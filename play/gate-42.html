<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gate 42</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Overpass+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: airport wayfinding — signage-yellow on terminal charcoal; departure board above the gate, panels to the side. Single dark look by design. */
:root {
  --bg: #121418; --panel: #1b1f25; --panel2: #232830; --line: #2f363f; --line2: #3c444e;
  --fg: #eef1f4; --mute: #95a0ad; --dim: #66707c;
  --sign: #ffcc00; --sign-ink: #0d0f12; --board: #0b0d10; --flap: #f7c948;
  --cash: #8bd66b; --rage: #ff5d4f; --calm: #4fd1c5; --scr: #b694ff; --rep: #4fd1c5; --warn: #ffab3d;
  --f-sign: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Overpass Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--sign); outline-offset: 2px; }
button:disabled { cursor: not-allowed; }
#app { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.logo { display: flex; align-items: center; gap: 9px; margin-right: auto; }
.logo-sq { background: var(--sign); color: var(--sign-ink); font: 800 22px/1 var(--f-sign); padding: 6px 7px 4px; border-radius: 3px; letter-spacing: .5px; }
.logo-tx { display: flex; flex-direction: column; line-height: 1.05; }
.logo-tx b { font: 800 20px/1 var(--f-sign); letter-spacing: 2px; }
.logo-tx small { color: var(--mute); font: 600 11px/1.2 var(--f-sign); letter-spacing: 1.4px; text-transform: uppercase; margin-top: 2px; }
.clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; }
.clock b { font: 700 20px/1 var(--f-mono); color: var(--flap); }
.clock span { font: 600 11px/1.3 var(--f-sign); color: var(--mute); letter-spacing: 1.2px; text-transform: uppercase; }
.wx { font: 700 12px/1 var(--f-sign); letter-spacing: 1.2px; text-transform: uppercase; color: var(--mute); border: 1px solid var(--line2); padding: 5px 7px; border-radius: 3px; }
.wx.bad { color: var(--warn); border-color: var(--warn); }
.hstat { display: flex; flex-direction: column; line-height: 1.1; min-width: 70px; }
.hstat small { font: 600 10px/1.2 var(--f-sign); letter-spacing: 1.3px; text-transform: uppercase; color: var(--mute); }
.hstat b { font: 700 17px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.hstat b.neg { color: var(--rage); }
.speed { display: flex; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; }
.speed button { background: transparent; border: 0; border-right: 1px solid var(--line2); padding: 6px 9px; font: 700 13px/1 var(--f-mono); color: var(--mute); }
.speed button:last-child { border-right: 0; }
.speed button.on { background: var(--sign); color: var(--sign-ink); }
.ghost { background: transparent; border: 1px solid var(--line2); border-radius: 4px; padding: 6px 10px; font: 600 13px/1 var(--f-sign); letter-spacing: 1px; text-transform: uppercase; color: var(--mute); }
.ghost:hover { color: var(--fg); border-color: var(--mute); }

/* ---------- meters ---------- */
.meters { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.meter { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px 8px; min-width: 0; }
.meter .mh { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.meter .ml { font: 700 11px/1.2 var(--f-sign); letter-spacing: 1.3px; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
.meter .mv { font: 700 15px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter .ms { font-size: 11.5px; color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 5px; position: relative; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--calm); transition: width .3s; }
.bar.rep i { background: var(--rep); } .bar.scr i { background: var(--scr); } .bar.rage i { background: var(--rage); } .bar.cash i { background: var(--cash); }
.bar .tick { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--fg); opacity: .6; }
.meter.alert { border-color: var(--rage); }
.meter.alert .mv { color: var(--rage); }

/* ---------- main grid ---------- */
.grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(330px, 1fr); grid-template-areas: "board side" "scene side" "pa side" "feed side"; grid-template-rows: auto auto auto 1fr; gap: 10px; align-items: start; }
.maincol { display: contents; }
.board { grid-area: board; } .scene { grid-area: scene; } .pa { grid-area: pa; } .feed { grid-area: feed; } .side { grid-area: side; }

/* departure board */
.board { background: var(--board); border: 1px solid #000; border-radius: 6px; padding: 8px 10px 9px; box-shadow: inset 0 0 0 1px #1d2128; overflow-x: auto; }
.bd-h, .bd-r { display: grid; grid-template-columns: 52px 72px minmax(96px, 1.3fr) minmax(130px, 1.4fr) 64px; gap: 8px; align-items: center; min-width: 470px; }
.bd-h { font: 700 10.5px/1 var(--f-sign); letter-spacing: 1.6px; color: var(--sign); text-transform: uppercase; padding: 0 2px 6px; border-bottom: 1px solid #1d2128; }
.bd-r { font: 600 13.5px/1 var(--f-mono); color: #f2f2f2; padding: 5px 2px; border-bottom: 1px solid #15181d; }
.bd-r:last-child { border-bottom: 0; }
.bd-r .fl { display: inline-flex; gap: 1px; }
.fl i { font-style: normal; background: #171a1f; padding: 2px 1px; min-width: .72em; text-align: center; border-radius: 1px; box-shadow: inset 0 -1px 0 #000, inset 0 1px 0 #252a31; }
.fl i.f { animation: flap .32s steps(3) both; }
@keyframes flap { 0% { transform: scaleY(1); color: transparent; } 40% { transform: scaleY(.1); } 100% { transform: scaleY(1); } }
.st-ok { color: #9fe870; } .st-board { color: var(--sign); } .st-late { color: var(--warn); } .st-bad { color: var(--rage); } .st-gone { color: var(--dim); } .st-final { color: #ff8a3d; }
.bd-r.gone { opacity: .55; }
.bd-load { font: 600 11.5px/1 var(--f-mono); color: var(--mute); text-align: right; }

/* scene */
.scene { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid #000; background: #000; }
#cv { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
.scene-tag { position: absolute; left: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.scene-tag span { background: rgba(10, 12, 15, .82); border: 1px solid #000; border-radius: 3px; padding: 3px 6px; font: 700 11px/1 var(--f-sign); letter-spacing: 1px; text-transform: uppercase; }
.scene-tag .paused { color: var(--sign); }
.scene-tag .r { color: var(--rage); }

/* PA bar */
.pa { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.pa-b { position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--line2); border-radius: 5px; padding: 7px 9px 6px; text-align: left; min-height: 48px; }
.pa-b b { display: block; font: 700 14px/1.1 var(--f-sign); letter-spacing: .6px; text-transform: uppercase; }
.pa-b small { display: block; font-size: 11.5px; color: var(--mute); margin-top: 2px; }
.pa-b .k { position: absolute; right: 6px; top: 5px; font: 700 10px/1 var(--f-mono); color: var(--dim); }
.pa-b .cd { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--sign); opacity: .8; }
.pa-b:not(:disabled):hover { border-color: var(--sign); background: var(--panel2); }
.pa-b:disabled { opacity: .5; }
.pa-b.ready b { color: var(--sign); }
.pa-lbl { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: space-between; font: 700 11px/1.2 var(--f-sign); letter-spacing: 1.3px; text-transform: uppercase; color: var(--mute); }
.pa-lbl span:last-child { color: var(--dim); letter-spacing: .5px; text-transform: none; font: 500 11.5px/1.2 var(--f-body); }

/* feed */
.feed { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.fd { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; padding: 5px 0; border-bottom: 1px solid #222830; font-size: 13.5px; line-height: 1.4; }
.fd:last-child { border-bottom: 0; }
.fd-t { font: 600 11px/1.6 var(--f-mono); color: var(--dim); }
.fd-x { min-width: 0; overflow-wrap: anywhere; }
.fd-u { color: #8ab4ff; font-weight: 600; margin-right: 5px; }
.k-pa .fd-x { color: #ffe9a3; font-style: italic; }
.k-pa .fd-x::before { content: "PA · "; font-style: normal; font: 700 11px/1 var(--f-sign); letter-spacing: 1px; color: var(--sign); }
.k-flight .fd-x b { color: var(--cash); font-weight: 600; }
.k-flight .fd-x b.neg { color: var(--rage); }
.k-viral .fd-x { color: #ff8ad8; font-weight: 600; }
.k-sys .fd-x { color: var(--mute); }
.k-event .fd-x { color: #cfd8e3; }
.k-tip .fd-x { color: var(--calm); }
.fd-h { display: flex; justify-content: space-between; align-items: center; font: 700 11px/1.2 var(--f-sign); letter-spacing: 1.3px; text-transform: uppercase; color: var(--mute); padding-bottom: 4px; }

/* ---------- side panel ---------- */
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; position: sticky; top: 8px; max-height: calc(100vh - 16px); display: flex; flex-direction: column; }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.tabs button { background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 10px 11px 8px; font: 700 13.5px/1 var(--f-sign); letter-spacing: 1.1px; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--sign); }
.tabs button small { color: var(--dim); font-weight: 600; margin-left: 3px; }
.tabs button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--sign); margin-left: 4px; vertical-align: 2px; }
.pane { padding: 12px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ph h2 { font: 800 19px/1.1 var(--f-sign); letter-spacing: .8px; text-transform: uppercase; margin: 0; text-wrap: balance; }
.ph span { font-size: 12.5px; color: var(--mute); text-align: right; }
.note { font-size: 13px; color: var(--mute); margin: 0; }
.sec { font: 700 11.5px/1.2 var(--f-sign); letter-spacing: 1.5px; text-transform: uppercase; color: var(--sign); display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.sec small { color: var(--dim); letter-spacing: .6px; text-transform: none; font: 500 12px/1.2 var(--f-body); }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 9px 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.card.on { border-color: #5a4f1c; }
.card.locked { opacity: .55; }
.card h3 { margin: 0; font: 700 15px/1.15 var(--f-sign); letter-spacing: .4px; }
.card h3 small { display: block; font: 500 12px/1.3 var(--f-body); color: var(--mute); letter-spacing: 0; margin-top: 1px; }
.card p { margin: 0; grid-column: 1 / -1; font-size: 12.8px; color: #c3cad3; }
.card .tags { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font: 600 11px/1 var(--f-mono); padding: 3px 5px; border-radius: 3px; background: #2a3039; color: var(--mute); white-space: nowrap; }
.tag.c { color: var(--cash); } .tag.r { color: var(--rage); } .tag.s { color: var(--scr); } .tag.y { color: var(--sign); }
.btn { background: var(--sign); color: var(--sign-ink); border: 0; border-radius: 4px; padding: 7px 11px; font: 800 13px/1 var(--f-sign); letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { background: #3a4049; color: #8b939c; }
.btn.alt { background: transparent; color: var(--fg); border: 1px solid var(--line2); }
.btn.alt:hover:not(:disabled) { border-color: var(--sign); }
.btn.red { background: var(--rage); color: #fff; }
.sw { width: 44px; height: 24px; border-radius: 12px; border: 1px solid var(--line2); background: #2a3039; position: relative; padding: 0; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #8b939c; transition: left .15s; }
.sw.on { background: var(--sign); border-color: var(--sign); }
.sw.on::after { left: 22px; background: var(--sign-ink); }
.sumbox { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.sumbox div { background: var(--panel2); border-radius: 4px; padding: 6px 8px; font-size: 11.5px; color: var(--mute); min-width: 0; }
.sumbox b { display: block; font: 700 15px/1.2 var(--f-mono); color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ladder { display: flex; gap: 3px; margin-top: 2px; grid-column: 1 / -1; }
.ladder i { flex: 1; height: 4px; border-radius: 2px; background: #333a44; }
.ladder i.on { background: var(--sign); }
.rng { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
.rng input { flex: 1; accent-color: var(--sign); min-width: 0; }
.rng b { font: 700 14px/1 var(--f-mono); min-width: 44px; text-align: right; }
.seg { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.seg button { background: #2a3039; border: 1px solid var(--line2); border-radius: 4px; padding: 6px 4px; font: 700 12.5px/1.1 var(--f-sign); letter-spacing: .6px; text-transform: uppercase; color: var(--mute); }
.seg button.on { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
.dem { display: grid; grid-template-columns: 1fr; gap: 4px; }
.dem .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--mute); }
.dem .row b { color: var(--fg); font-family: var(--f-mono); font-weight: 600; }
.dbar { position: relative; height: 12px; background: #2a3039; border-radius: 3px; overflow: hidden; }
.dbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--calm); opacity: .85; }
.dbar u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--sign); }
.spark { width: 100%; height: 64px; display: block; flex: none; }
.pane > * { flex-shrink: 0; }
.dec-l { display: flex; flex-direction: column; gap: 6px; }
.dec { background: var(--panel2); border-radius: 4px; padding: 7px 9px; font-size: 13px; }
.dec b { display: block; font: 700 14px/1.2 var(--f-sign); letter-spacing: .4px; color: var(--sign); }
.dec.no b { color: var(--dim); }
.dec.no span { color: var(--dim); }
.srch { background: #12151a; border: 1px solid var(--line2); border-radius: 4px; padding: 7px 9px; color: var(--fg); font: inherit; width: 100%; }
.ach { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ach div { background: var(--panel2); border-radius: 4px; padding: 6px 8px; font-size: 12px; color: var(--dim); min-width: 0; }
.ach div b { display: block; font: 700 13px/1.2 var(--f-sign); color: var(--mute); letter-spacing: .4px; }
.ach div.got { color: #c3cad3; } .ach div.got b { color: var(--sign); }

/* jargon */
mark.jg { background: transparent; color: inherit; border-bottom: 1px dotted var(--sign); cursor: help; padding: 0; }
#jtip { position: fixed; z-index: 90; max-width: 260px; background: #0b0d10; border: 1px solid var(--sign); border-radius: 5px; padding: 8px 10px; font-size: 13px; color: var(--fg); pointer-events: none; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); }
#jtip b { display: block; font: 700 12px/1.2 var(--f-sign); letter-spacing: 1.2px; text-transform: uppercase; color: var(--sign); margin-bottom: 3px; }

/* ---------- overlays ---------- */
.ov { position: fixed; inset: 0; z-index: 50; background: rgba(5, 6, 8, .72); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.mo { background: var(--panel); border: 1px solid var(--line2); border-top: 4px solid var(--sign); border-radius: 6px; width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 18px 20px 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); }
.mo.wide { width: min(680px, 100%); }
.mo .kicker { font: 700 12px/1 var(--f-sign); letter-spacing: 2px; text-transform: uppercase; color: var(--sign); }
.mo h2 { font: 800 28px/1.05 var(--f-sign); letter-spacing: .5px; margin: 0; text-wrap: balance; }
.mo p { margin: 0; color: #cfd6de; }
.mo .from { font-size: 12.5px; color: var(--mute); }
.mo .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.mo ul { margin: 0; padding-left: 18px; color: #cfd6de; display: flex; flex-direction: column; gap: 5px; }
.choice { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--line2); border-radius: 5px; padding: 10px 12px; font-size: 14px; }
.choice:hover:not(:disabled) { border-color: var(--sign); }
.choice:disabled { opacity: .5; }
.choice small { color: var(--mute); font: 600 12px/1.2 var(--f-mono); white-space: nowrap; }
.big-num { font: 800 34px/1 var(--f-mono); }
.res { background: var(--panel2); border-radius: 5px; padding: 10px 12px; }
.res.good { border-left: 3px solid var(--cash); } .res.bad { border-left: 3px solid var(--rage); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats div { background: var(--panel2); border-radius: 4px; padding: 7px 9px; font-size: 12px; color: var(--mute); min-width: 0; }
.stats b { display: block; font: 700 17px/1.2 var(--f-mono); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title-sign { display: flex; align-items: center; gap: 14px; }
.title-sign .logo-sq { font-size: 44px; padding: 10px 12px 7px; }
.title-sign h2 { font-size: 40px; letter-spacing: 3px; }
.senator { font: 700 15px/1.35 var(--f-body); color: #fff; background: #191c22; border-left: 3px solid var(--scr); padding: 9px 12px; border-radius: 4px; }

#toasts { position: fixed; z-index: 70; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
.toast { background: #0b0d10; border: 1px solid var(--line2); border-left: 3px solid var(--sign); border-radius: 5px; padding: 8px 12px; font-size: 13.5px; max-width: 340px; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); animation: tin .25s ease-out; }
.toast.tip { border-left-color: var(--calm); }
.toast b { color: var(--sign); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

@media (max-width: 1100px) { .meters { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "board" "scene" "pa" "side" "feed"; grid-template-rows: none; }
  .side { position: static; max-height: none; }
  .pane { overflow: visible; }
  .feed { max-height: 360px; }
}
@media (max-width: 560px) {
  body { font-size: 14px; }
  .top { gap: 8px 10px; padding: 8px; }
  .logo { flex: 1 1 100%; }
  .hstat { min-width: 0; }

const J = (() => {

  const sorted = items.slice().sort((a, b) => b.src.length - a.src.length);
  const all = new RegExp('(?<![\\w-])(?:' + sorted.map(x => x.src).join('|') + ')(?![\\w-])', 'gi');
  const which = str => { for (const it of sorted) if (it.test.test(str)) return it.i; return -1; };
  return { items, all, which };
})();

function modMul(k) { let m = 1; for (const x of S.mods) if (x.k === k) m *= x.v; return m; }

// ---------------------------------------------------------------------
// MAIN TICK (one game minute)
// ---------------------------------------------------------------------

// ---------------------------------------------------------------------
// PA ANNOUNCEMENTS
// ---------------------------------------------------------------------
function paState(id) { return S.pa[id] || (S.pa[id] = { last:-9999, hist:[] }); }

// ---------------------------------------------------------------------
// SHOPPING
// ---------------------------------------------------------------------
function canBuy(cost) { return S.cash >= cost; }
function buyFee(id) {
  const f = feeById(id); if (!f || S.own[id] || !tierOpen(f.tier) || !canBuy(f.cost)) return false;
  S.cash -= f.cost; S.own[id] = 1; S.on[id] = 1; award('firstfee');
  feed('sys', `New revenue innovation: ${f.brand}. Passengers will love it.`);
  if (id === 'breath') award('breathe');
  checkFeeAch(); return true;
}
function toggleFee(id) { if (!S.own[id]) return false; S.on[id] = S.on[id] ? 0 : 1; if (S.on[id] && id === 'breath') award('breathe'); checkFeeAch(); return true; }

function buyAmen(id) { const a = AMENITIES.find(x => x.id === id); if (!a || S.amen[id] || !canBuy(a.cost)) return false; S.cash -= a.cost; S.amen[id] = 1; feed('sys', `Gate 42 upgrade: ${a.brand}.`); return true; }

function upgrade(k) {
  const c = upgradeCost(k); if (c === null || !canBuy(c)) return false;
  S.cash -= c; S[k]++;
  const L = LADDERS[k][S[k]];
  feed('sys', k === 'plane' ? `New aircraft: ${L.name} (${L.seats} seats). Flies from the next flight that opens for booking.` : `Upgrade: ${L.name}.`);
  return true;
}
function setOverbook(v) { if (!active('yield')) return false; S.ob = clamp(Math.round(v * 20) / 20, 0, 0.4); return true; }
function setBump(id) { if (!BUMP[id]) return false; S.bump = id; return true; }
function buyRival(id) {
  const r = RIVALS.find(x => x.id === id); if (!r || S.rivals[id] || !canBuy(r.cost)) return false;
  const idx = RIVALS.indexOf(r); if (idx > 0 && !S.rivals[RIVALS[idx - 1].id]) return false;
  S.cash -= r.cost; S.rivals[id] = S.day; S.stock *= 1.08;

// ---------------------------------------------------------------------
// OPS ALERTS
// ---------------------------------------------------------------------
function queueEvent() {
  const pool = EVENTS.filter(e => !S.evDone[e.id] && (!e.cond || e.cond(S)));

  const e = pick(pool); S.evDone[e.id] = S.day; S.inbox.push(e.id);
}
function eventById(id) { return EVENTS.find(e => e.id === id); }

  if (fx.rep) addRep(fx.rep);

  if (fx.unlockNext) { const f = nextLockedFee(S); if (f) { S.own[f.id] = 1; S.on[f.id] = 0; out.unlocked = f.id; feed('sys', `Unlocked: ${f.name}. It's off until you switch it on.`); } }

// ---------------------------------------------------------------------
// HEARINGS
// ---------------------------------------------------------------------
function openHearing() {
  const rel = HEARING_Q.filter(q => (q.fee && active(q.fee)) || (q.tag === 'bump' && S.stats.invol > 0) || (q.tag === 'weather' && S.stats.lies > 0));
  const gen = HEARING_Q.filter(q => !q.fee && !q.tag);
  const qs = [];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  for (const q of shuffle(rel)) if (qs.length < 2) qs.push(HEARING_Q.indexOf(q));
  for (const q of shuffle(gen)) if (qs.length < 3) qs.push(HEARING_Q.indexOf(q));
  // answers are shown in a random order
  S.hearing = { qs, order:qs.map(() => shuffle([0, 1, 2])), ans:[] };

let NEW_HEARD = 0, LAST_HEARD_TOAST = 0;
function processPending() {
  if (!S) return;
  const list = S.pending; S.pending = [];
  for (const p of list) {
    if (p.type === 'tip') { feed('tip', TIPS[p.id]); toast(esc(TIPS[p.id]), 7000, 'tip'); }
    else if (p.type === 'ach') { const a = ACHIEVEMENTS.find(x => x.id === p.id); if (a) { toast(`Achievement: <b>${esc(a.name)}</b><br>${esc(a.d)}`, 4000); sfx('good'); } }
    else if (p.type === 'hearing') queueModal(hearingModal);
    else if (p.type === 'day') { S.lastDayRep = p; queueModal(() => dayModal(p)); save(); }
    else if (p.type === 'win') queueModal(winModal);
    else if (p.type === 'over') { const w = p.why; queueModal(() => overModal(w)); save(); }
  }
  if (S.newHeard) { NEW_HEARD += S.newHeard; S.newHeard = 0; }
  const now = performance.now();
  if (NEW_HEARD && now - LAST_HEARD_TOAST > 2500) { toast(NEW_HEARD === 1 ? 'Decoded <b>1</b> new phrase. Hover dotted text to read it.' : `Decoded <b>${NEW_HEARD}</b> new phrases`, 2200); NEW_HEARD = 0; LAST_HEARD_TOAST = now; if (Object.keys(S.heard).length >= 100) award('decoder'); }
  if (!MODAL && !MQ.length && S.inbox.length && !S.over) eventModal();
}

$('cv').addEventListener('click', e => {
  if (!S || MODAL) return;
  const r = $('cv').getBoundingClientRect(), x = (e.clientX - r.left) / r.width * ART.W, y = (e.clientY - r.top) / r.height * ART.H;
  const id = ART.pickAt(x, y), g = id && S.groups.find(q => q.id === id);
  if (!g) { if (TIP_EL === 'cv') hideTip(); return; }
  const fl = S.flights.find(f => f.id === g.fid);
  const html = `<b>${esc(PTYPES[g.type].name)}${g.n > 1 ? ' ×' + g.n : ''}</b>${esc(fl ? fl.no + ' to ' + fl.dest : '')}<br>Rage ${Math.round(g.rage)}${g.melted ? ' (melted down)' : ''} · paid ${money(g.paid || 0)} each in fees${g.prio ? ' · priority' : ''}`;
  TIP_EL = 'cv'; showTipAt(html, { left:e.clientX - 1, top:e.clientY - 4, width:2, height:8, bottom:e.clientY + 4 });
});
$('bSound').onclick = () => { SOUND = !SOUND; try { localStorage.setItem('gate42_sound', SOUND ? 'on' : 'off'); } catch (e) {} renderHud(); if (SOUND) sfx('click'); };
$('bMenu').onclick = () => { if (!MODAL && S) menuModal(); };

// ---------------------------------------------------------------------
// LOOP
// ---------------------------------------------------------------------
let LAST_TS = 0, FX_SEEN = 0;
function loop(ts) {
  const dt = Math.min(0.1, Math.max(0, (ts - (LAST_TS || ts)) / 1000)); LAST_TS = ts;
  let dtG = 0;
  if (S && !MODAL && !MQ.length && SPEED > 0 && !S.over && !S.dayOver && !S.hearing && !S.inbox.length) {
    ACC += dt * SPEED * MPS;
    const n = Math.floor(ACC);
    if (n > 0) { const done = advance(n); ACC -= n; if (done < n) ACC = 0; }
    dtG = dt * SPEED * MPS;
  }
  if (S) {
    // sounds for engine events
    for (let i = FX_SEEN; i < FX.length; i++) { const f = FX[i]; if (f.type === 'coin' && f.v >= 20) sfx('coin'); else if (f.type === 'melt') sfx('melt'); else if (f.type === 'viral') sfx('bad'); }
    try { ART.frame(S.t + (dtG ? ACC : 0), dt, dtG); } catch (err) { console.error(err); }
    FX_SEEN = FX.length;
    if (S.flights.some(f => f.phase === 'push' && f.dep === S.t && !f._snd)) { S.flights.forEach(f => { if (f.phase === 'push' && f.dep === S.t) f._snd = 1; }); sfx('depart'); }
    processPending();
    if (ts - LAST_UI > 200) { LAST_UI = ts; renderAll(); }
    if (ts - LAST_SAVE > 30000 && !S.over) save();
  }
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------
function start(data) {
  ART.init($('cv'));
  if (data && data.save && load(data.save)) { renderAll(true); resumeChecks(); }
  else { newGame(); renderAll(true); titleModal(); }
  requestAnimationFrame(loop);
}
addEventListener('beforeunload', () => { if (S && !S.over) save(); });
try { window.claude?.hot?.snapshot?.(() => ({ save:S ? JSON.stringify(S) : null })); } catch (e) {}
(window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}));
</script>
