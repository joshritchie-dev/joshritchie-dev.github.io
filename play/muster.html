// ------------------------------------------------------------------ the game's own flow
const game = { mode: "title", autopilot: false, lastWord: "", tab: "dog", speed: 1, results: null };

function startDemo() {
  D = buildField("pasture", 7, 18, { demo: true, noMeg: true });
  D.phase = "demo";
  D.t = D.len * 0.2;
  ground = paintGround(D);
  cam.x = D.w / 2; cam.y = D.h / 2;
}

function startDay() {
  const seed = (S.day * 7919 + REGION_ORDER.indexOf(S.region) * 104729) >>> 0;
  D = buildField(S.region, seed, S.flock);
  ground = paintGround(D);
  cam.x = D.dogs[0].x; cam.y = D.dogs[0].y;
  game.mode = "play";
  game.lastWord = "";
  $("sheet").hidden = true;
  $("hud").hidden = false;
  $("hudField").textContent = REGIONS[S.region].name;
  $("hudDay").textContent = `Day ${S.day}  ·  ${D.sheep.length} sheep on the hill`;
  D.phase = "run";
  showBanner("Away to me!");
  audio.wind(S.region === "coast" || S.region === "glen" ? 0.06 : 0.035);
}

function endDay(allIn) {
  if (D.phase !== "run") return;
  D.phase = "done";
  const R = REGIONS[D.region];
  const penned = D.penned;
  const out = D.sheep.filter((s) => !s.penned && !s.lost).length;
  // a night out on the hill: some don't come back
  let night = 0;
  for (const s of D.sheep) if (!s.penned && !s.lost && rand() < R.night) night++;
  const price = woolPrice(D.region);
  const wool = penned * price;
  const bonus = allIn ? wool * 0.25 + Math.max(0, D.len - D.t) * 0.25 * R.mult : 0;
  // lambing overnight (ewes in the fold, up to the land you have)
  const flockAfter = S.flock - D.lost - night;
  let lambs = 0;
  const ewes = D.sheep.filter((s) => s.penned && !s.ram).length;
  for (let i = 0; i < ewes; i++) if (rand() < lambChance()) lambs++;
  lambs = Math.max(0, Math.min(lambs, cap() - flockAfter));
  const res = { region: D.region, day: S.day, penned, out, lost: D.lost, lostWhy: { ...D.lostWhy }, night, wool, bonus, lambs, allIn,
    total: wool + bonus, flockBefore: S.flock, time: D.t };
  S.money += res.total;
  S.flock = Math.max(1, flockAfter + lambs);
  S.bestDay = Math.max(S.bestDay, penned);
  S.history = (S.history || []).concat([{ d: S.day, r: D.region, p: penned, m: Math.round(res.total) }]).slice(-30);
  const winNow = !S.won && D.region === "glen" && penned >= GOAL;
  if (winNow) S.won = true;
  S.day++;
  writeSave();
  game.results = res;
  game.mode = "ledger";
  setTimeout(() => {
    $("hud").hidden = true;
    showLedger(winNow ? "won" : "day");
  }, 400);
}

function pauseGame() {
  game.mode = "pause";
  $("hud").hidden = true;
  showLedger("pause");
}

// ------------------------------------------------------------------ the ledger (all the between-days pages)
function rank() {
  const l = S.lifetime;
  if (S.won) return "Master of the Muster";
  if (l >= 5000) return "Fell Master";
  if (l >= 1500) return "Head Shepherd";
  if (l >= 400) return "Shepherd";
  if (l >= 100) return "Hand";
  return "Pup";
}
// tally marks as a shepherd scores them: four strokes and a bar across
function tallyMarks(n) {
  const gate = (k) => {
    let p = "";
    for (let i = 0; i < Math.min(k, 4); i++) p += `<line x1="${4 + i * 6}" y1="3" x2="${3 + i * 6}" y2="25"/>`;
    if (k === 5) p += `<line x1="0" y1="20" x2="25" y2="7"/>`;
    return `<svg width="30" height="28" viewBox="-2 0 30 28" aria-hidden="true"><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round">${p}</g></svg>`;
  };
  const shown = Math.min(n, 150);
  let out = "";
  for (let i = 0; i < Math.floor(shown / 5); i++) out += gate(5);
  if (shown % 5) out += gate(shown % 5);
  return out + (n > shown ? " …" : "");
}

function wireLedger(page) {
  const L = $("ledger");
  const on = (id, fn) => { const el = L.querySelector("#" + id); if (el) el.addEventListener("click", () => { audio.unlock(); fn(); }); };
  on("bPlay", () => { if (S.day === 1 && S.money === 0) startDay(); else showLedger("farm"); });
  on("bNew", () => { L.querySelector("#newConfirm").hidden = false; });
  on("bNewYes", () => { S = freshSave(); writeSave(); showLedger("farm"); });
  on("bFarm", () => { startDemoIfNeeded(); showLedger("farm"); });
  on("bDay", () => startDay());
  on("bResume", () => { game.mode = "play"; $("sheet").hidden = true; $("hud").hidden = false; });
  on("bGiveUp", () => { game.mode = "play"; endDay(false); });
  L.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { game.tab = b.dataset.tab; showLedger("farm"); }));
  L.querySelectorAll("[data-buy]").forEach((b) => b.addEventListener("click", () => buy(b.dataset.buy)));
  L.querySelectorAll("[data-lease]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.lease, R = REGIONS[k];
    if (S.money >= R.lease) { S.money -= R.lease; S.leases[k] = true; S.region = k; writeSave(); showLedger("farm"); }
  }));
  L.querySelectorAll("input[name=region]").forEach((r) => r.addEventListener("change", () => { S.region = r.value; writeSave(); showLedger("farm"); }));
}
function buy(k) {
  const u = UPGRADES[k];
  const lvl = S.up[k];
  const cost = upCost(k, k === "ewes" ? S.ewesBought : lvl);
  if (S.money < cost) return;
  if (k === "ewes") {
    if (S.flock + 3 > cap()) return;
    S.flock += 3; S.ewesBought++;
  } else {
    if (lvl >= u.max) return;
    S.up[k]++;
  }
  S.money -= cost;
  writeSave();
  audio.fold(3);
  showLedger("farm");
  const again = $("ledger").querySelector(`[data-buy="${k}"]`);
  if (again && !again.disabled) again.focus({ preventScroll: true });
}
function startDemoIfNeeded() { if (!D || D.phase !== "demo") startDemo(); }

// ------------------------------------------------------------------ main loop
let last = performance.now(), acc = 0;
const FIXED = 1 / 60;
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (game.mode === "play" || (D && D.phase === "demo")) {
    acc += dt * game.speed;
    let n = 0;
    while (acc >= FIXED && n < 8 * game.speed) { step(FIXED); acc -= FIXED; n++; }
    if (D && D.phase === "demo") for (let i = 0; i < n; i++) demoTick();
  }
  updateCam(dt);
  render(dt);
  if (game.mode === "play") updateHud();
  requestAnimationFrame(frame);
}
// behind the title, the flock is brought in over and over by itself
function demoTick() {
  D.demoT = (D.demoT || 0) + 1 / 60;
  const left = D.sheep.filter((s) => !s.penned).length;
  if (left === 0 || D.demoT > 240) startDemo();
}

// ------------------------------------------------------------------ boot
function boot(data) {
  loadSave();
  if (data && data.save) S = Object.assign(freshSave(), data.save);
  audio.setMuted(S.muted);
  resize();
  startDemo();
  // wool grown while away: the idle part of a hill farm
  const away = (Date.now() - (S.lastSeen || Date.now())) / 60000;
  if (away > 2 && (S.day > 1)) {
    const mins = Math.min(away, 8 * 60);
    const best = REGION_ORDER.filter((k) => S.leases[k]).reduce((m, k) => Math.max(m, REGIONS[k].mult), 1);
    const grown = Math.round(S.flock * 0.03 * mins * best * (1 + 0.2 * S.up.shed));
    if (grown > 0) {
      S.money += grown;
      const h = Math.floor(mins / 60), m = Math.round(mins % 60);
      game.awayText = `You were gone ${h ? `${h} h ` : ""}${m} min. The flock grazed and the fleeces grew: ${fmt(grown)} of wool sold at the mart.`;
      writeSave();
      showLedger("away");
    } else showLedger("title");
  } else showLedger("title");
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ save: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
window.addEventListener("pagehide", writeSave);

// a handle for testing
window.__muster = {
  get S() { return S; }, get D() { return D; }, game,
  startDay, endDay, step, herdTarget, flockCentre, wayHome, setRegion(k) { S.region = k; S.leases[k] = true; },
};
</script>
