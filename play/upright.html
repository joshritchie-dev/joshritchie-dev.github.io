<title>Upright</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Layout: one game screen. A slim scoreboard on top, the room filling the rest, a hint line under it.
   Single committed look: late-night dorm-room navy, bottled-water blue, lava orange, bottle-cap gold. */
:root {
  --bg:#0b1026; --panel:#151d3d; --panel2:#1d2752; --line:#2c3a73; --ink:#fff6e5; --mute:#a9b3d6;
  --water:#4fb3ff; --lava:#ff6b2c; --cap:#ffcc33; --good:#5ee08a; --bad:#ff5e78; --rare:#c084fc;
  --display:'Lilita One', 'Arial Black', Impact, sans-serif;
  --body:'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme:dark;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 var(--body); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:10px; overflow:hidden; }
button { font:inherit; color:inherit; cursor:pointer; }
:focus-visible { outline:3px solid var(--cap); outline-offset:2px; }
#app { height:100%; max-width:1400px; margin:0 auto; display:grid; grid-template-rows:auto minmax(0, 1fr) auto; gap:8px; }

/* ---- scoreboard ---- */
.hud { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; }
.brand { font:28px/1 var(--display); letter-spacing:1px; color:var(--water); text-shadow:0 3px 0 #08317a; transform:rotate(-2deg); }
.hearts { display:flex; gap:3px; }
.hearts i { width:13px; height:24px; border-radius:4px 4px 3px 3px; border:2px solid var(--water); position:relative; display:block; }
.hearts i::before { content:''; position:absolute; left:2px; right:2px; top:-6px; height:4px; border-radius:2px; background:var(--water); }
.hearts i.full { background:linear-gradient(to top, var(--water) 55%, transparent 55%); }
.hearts i.empty { border-color:#3a4677; } .hearts i.empty::before { background:#3a4677; }
.caps { display:flex; align-items:center; gap:6px; font:22px/1 var(--display); color:var(--cap); }
.capico { width:18px; height:18px; border-radius:50%; background:var(--cap); box-shadow:inset 0 0 0 3px #d49b00; display:block; }
.where { font-size:14px; color:var(--mute); }
.where b { color:var(--ink); font-weight:600; }
.stk { display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; }
.stk span { position:relative; }
.stk img { width:26px; height:26px; display:block; }
.stk em { position:absolute; right:-3px; bottom:-3px; font:11px/1 var(--display); background:var(--bg); color:var(--cap); border-radius:6px; padding:1px 3px; font-style:normal; }
.ghost { border:2px solid var(--line); background:var(--panel); border-radius:10px; padding:6px 12px; font-weight:600; }
.ghost:hover { border-color:var(--water); }

/* ---- stage ---- */
.stage { position:relative; border-radius:16px; overflow:hidden; background:#1a2346; box-shadow:0 0 0 2px var(--line), 0 18px 40px rgba(0,0,0,0.35); touch-action:none; min-height:300px; }
#cv { display:block; width:100%; height:100%; cursor:grab; }
#cv.dragging { cursor:grabbing; }
.hint { text-align:center; color:var(--mute); font-size:14px; min-height:20px; }
.hint b { color:var(--ink); }

/* ---- modals ---- */
.ov { position:fixed; inset:0; z-index:40; background:rgba(5,8,22,0.72); display:grid; place-items:center; padding:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.modal { width:100%; max-width:640px; max-height:calc(100% - 8px); overflow:auto; background:var(--panel); border:2px solid var(--line); border-radius:20px; padding:20px 22px; box-shadow:0 30px 80px rgba(0,0,0,0.5); animation:pop .22s ease-out; }
@keyframes pop { from { transform:scale(0.94); opacity:0; } to { transform:none; opacity:1; } }
.modal h2 { margin:0 0 6px; font:34px/1.05 var(--display); letter-spacing:0.5px; text-wrap:balance; }
.modal h3 { margin:16px 0 8px; font:13px/1.2 var(--body); font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--mute); }
.modal p { margin:8px 0; }
.kicker { font:13px/1.2 var(--body); font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--lava); }
.hero { font:clamp(54px, 13vw, 92px)/0.9 var(--display); color:var(--water); text-shadow:0 6px 0 #08317a; letter-spacing:2px; margin:4px 0 2px; transform:rotate(-2deg); }
.hero em { font-style:normal; color:var(--lava); text-shadow:0 6px 0 #7a1d06; }
.row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center; }
.btn { border:0; border-radius:14px; padding:11px 18px; font:20px/1 var(--display); letter-spacing:0.5px; background:var(--lava); color:#fff; box-shadow:0 5px 0 #a3330b; }
.btn:active:not([disabled]) { transform:translateY(3px); box-shadow:0 2px 0 #a3330b; }
.btn.alt { background:var(--panel2); box-shadow:0 5px 0 #0c1330; color:var(--ink); }
.btn.blue { background:var(--water); box-shadow:0 5px 0 #1b66a8; color:#06213f; }
.btn[disabled] { opacity:0.45; cursor:not-allowed; }
.note { color:var(--mute); font-size:14px; }

/* bottle picker */
.bottles { display:grid; grid-template-columns:repeat(auto-fill, minmax(112px, 1fr)); gap:8px; margin-top:8px; }
.bt { border:2px solid var(--line); background:var(--panel2); border-radius:14px; padding:8px 6px 10px; text-align:center; display:grid; justify-items:center; gap:4px; }
.bt img { width:54px; height:90px; }
.bt b { font:16px/1.1 var(--display); letter-spacing:0.3px; }
.bt small { font-size:12px; color:var(--mute); line-height:1.25; }
.bt.on { border-color:var(--cap); box-shadow:0 0 0 2px var(--cap) inset; }
.bt.locked { opacity:0.55; }
.bt.locked img { filter:grayscale(1) brightness(0.5); }
.desc { min-height:42px; margin-top:10px; }

/* stickers */
.cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin-top:10px; }
.card { border:2px solid var(--line); background:var(--panel2); border-radius:16px; padding:12px; text-align:left; display:grid; grid-template-columns:44px minmax(0, 1fr); gap:4px 10px; align-items:center; }
.card img { width:44px; height:44px; grid-row:1 / 3; }
.card b { font:18px/1.1 var(--display); letter-spacing:0.3px; }
.card .r { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:1px; }
.card .d { grid-column:1 / 3; font-size:14px; color:var(--mute); }
.card .price { grid-column:1 / 3; font:18px/1 var(--display); color:var(--cap); }
.card:hover:not([disabled]) { border-color:var(--cap); transform:translateY(-2px); }
.card[disabled] { opacity:0.45; cursor:not-allowed; }
.card.sold { opacity:0.35; }
.vend { background:linear-gradient(#24306a, #18214a); border-radius:18px; padding:12px; border:3px solid #33418a; }
.stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:6px; margin-top:8px; }
.stats div { background:var(--panel2); border-radius:12px; padding:8px 10px; font-size:12px; color:var(--mute); }
.stats b { display:block; font:22px/1.1 var(--display); color:var(--ink); letter-spacing:0.5px; }
.how { padding-left:18px; margin:8px 0; } .how li { margin:6px 0; }
.unl { background:rgba(94,224,138,0.12); border:2px solid var(--good); border-radius:14px; padding:10px 12px; margin-top:10px; }

/* ---- toasts ---- */
#toasts { position:fixed; z-index:50; left:50%; transform:translateX(-50%); top:calc(64px + env(safe-area-inset-top, 0px)); display:grid; gap:6px; justify-items:center; pointer-events:none; width:min(92vw, 420px); }
.toast { background:var(--panel2); border:2px solid var(--line); color:var(--ink); border-radius:12px; padding:8px 14px; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,0.4); animation:pop .2s ease-out; text-align:center; }
.toast b { color:var(--cap); }

@media (max-width:640px) {
  body { padding-block:8px; }
  .brand { font-size:22px; }
  .where { order:5; width:100%; font-size:13px; }
  .stk { margin-left:0; order:6; width:100%; }
  .stk:empty { display:none; }
  .stk img { width:20px; height:20px; }
  #bMenu { margin-left:auto; padding:5px 10px; }
  .cards { grid-template-columns:repeat(auto-fit, minmax(136px, 1fr)); gap:8px; }
  .card { padding:10px; grid-template-columns:34px minmax(0, 1fr); }
  .card img { width:34px; height:34px; }
  .card b { font-size:16px; }
  .card .d { font-size:13px; }
  .modal { padding:16px; }
  .modal h2 { font-size:28px; }
  .btn { font-size:18px; padding:10px 14px; }
}
@media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>

  lava:['Floor is lava!', 'Sizzle.', 'Into the lava.'],

// =====================================================================
// UPRIGHT — physics (no DOM). Units: one bottle is 1.0 tall. y points up.
// Bottle: convex polygon rigid body. Water: point mass on a prismatic
// joint along the bottle's axis, with inelastic end stops and damping.
// =====================================================================
const PHY = { dt:1 / 240, iters:10, slop:0.005, beta:0.2, g:30, margin:0.02, stopHz:10, stopZeta:1.0 };

// shell outline, centred on the shell's middle (local coords, CCW)
const SHELL = [[-0.17, -0.5], [0.17, -0.5], [0.17, 0.2], [0.075, 0.5], [-0.075, 0.5], [-0.17, 0.2]];
const INNER = { lo:-0.46, hi:0.46 };                 // where water can be, along the axis

function makeBottle(spec) {
  // spec: { mShell, mWaterFull, fill, baseMass, mu, e, damp, width, gMul, aero }
  const wscale = spec.width || 1;
  const capW = spec.capW || 0.075;
  const shell = SHELL.map(([x, y]) => [y >= 0.5 ? Math.sign(x) * capW * wscale : x * wscale, y]);
  const mS = spec.mShell, mB = spec.baseMass || 0;
  // rigid part: shell (thin box) + optional weight glued to the bottom
  const m = mS + mB, cy = (mB * -0.44) / m;
  const W2 = (0.34 * wscale) ** 2;
  let I = mS * (1 + W2) / 12 + mS * cy * cy + mB * (-0.44 - cy) ** 2;
  const poly = shell.map(([x, y]) => [x, y - cy]);
  const norms = [];
  for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; const ex = b[0] - a[0], ey = b[1] - a[1], l = Math.hypot(ex, ey); norms.push([ey / l, -ex / l]); }
  const fill = Math.max(0.05, Math.min(0.95, spec.fill));
  const mw = spec.mWaterFull * fill;
  const half = (INNER.hi - INNER.lo) * fill / 2;
  return {
    x:0, y:0, a:0, vx:0, vy:0, w:0, m, I, im:1 / m, iI:1 / I, cy, poly, norms, wv:poly.map(() => [0, 0]), wn:norms.map(() => [0, 0]),
    mu:spec.mu, e:spec.e, capCatch:!!spec.capCatch, catch:spec.catch || 0, stick:spec.stick || 0, gMul:spec.gMul || 1, aero:spec.aero || 0, fill, width:wscale,
    water:{ m:mw, im:1 / mw, x:0, y:0, vx:0, vy:0, lo:INNER.lo + half - cy, hi:INNER.hi - half - cy, damp:spec.damp, half, L:2 * half, L0:2 * half, Lmax:Math.max(2 * half, 0.86), cy },
    contacts:[], touching:new Set(), spin:0
  };
}
// the water's position along the axis, relative to the body COM
function waterS(b) { const ax = -Math.sin(b.a), ay = Math.cos(b.a); return (b.water.x - b.x) * ax + (b.water.y - b.y) * ay; }
function placeBottle(b, x, y, a) {
  // put the bottle with its COM at x,y; water resting at the low end (in the bottle's frame)
  b.x = x; b.y = y; b.a = a; b.vx = b.vy = b.w = 0;
  const ax = -Math.sin(a), ay = Math.cos(a), s = Math.cos(a) >= 0 ? b.water.lo : b.water.hi;

// bottom-centre of the shell in world coords, for placing on surfaces
function bottomOffset(b) { return 0.5 + b.cy; }
// throw: the whole system's centre of mass gets (vx, vy) and everything spins at w around it
function launch(b, vx, vy, w) {

const STK_ICON = {};
function stickerIcon(id) {

  g.fillStyle = '#fff'; g.beginPath(); g.arc(24, 24, 22, 0, 6.3); g.fill();

  g.strokeStyle = ink; g.fillStyle = ink; g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';

    case 'ring': g.beginPath(); g.arc(24, 24, 9, 0, 6.3); g.stroke(); g.beginPath(); g.arc(24, 24, 3, 0, 6.3); g.fill(); break;
    case 'dot': g.beginPath(); g.arc(24, 24, 5, 0, 6.3); g.fill(); g.globalAlpha = 0.5; g.beginPath(); g.arc(24, 24, 10, 0, 6.3); g.stroke(); g.globalAlpha = 1; break;
    case 'plus': L([[24, 13], [24, 35]]); L([[13, 24], [35, 24]]); break;
    case 'cap': g.beginPath(); for (let i = 0; i < 16; i++) { const a = i / 16 * 6.283, r = i % 2 ? 10 : 8.5; g.lineTo(24 + Math.cos(a) * r, 24 + Math.sin(a) * r); } g.closePath(); g.stroke(); break;
    case 'wind': L([[12, 18], [32, 18], [35, 15]]); L([[12, 24], [36, 24]]); L([[12, 30], [30, 30], [33, 33]]); break;
    case 'pig': g.beginPath(); g.ellipse(24, 25, 9, 6, 0, 0, 6.3); g.stroke(); g.beginPath(); g.arc(21, 25, 1.5, 0, 6.3); g.arc(27, 25, 1.5, 0, 6.3); g.fill(); break;
    case 'weight': g.beginPath(); g.moveTo(16, 33); g.lineTo(32, 33); g.lineTo(29, 18); g.lineTo(19, 18); g.closePath(); g.fill(); g.fillStyle = st.col; g.font = 'bold 8px sans-serif'; g.textAlign = 'center'; g.fillText('KG', 24, 30); break;
    case 'spin': g.beginPath(); g.arc(24, 24, 10, -0.5, 4.2); g.stroke(); L([[30, 12], [33, 19], [26, 19]]); break;
    case 'brace': g.strokeRect(15, 18, 18, 12); L([[19, 18], [19, 30]]); L([[29, 18], [29, 30]]); break;
    case 'bubble': for (const [x, y, r] of [[19, 20, 5], [29, 22, 4], [22, 30, 4]]) { g.beginPath(); g.arc(x, y, r, 0, 6.3); g.stroke(); } break;
    case 'magnet': g.beginPath(); g.arc(24, 22, 8, Math.PI, 0); g.stroke(); L([[16, 22], [16, 33]]); L([[32, 22], [32, 33]]); break;
    case 'clock': g.beginPath(); g.arc(24, 24, 10, 0, 6.3); g.stroke(); L([[24, 24], [24, 17]]); L([[24, 24], [29, 27]]); break;
    case 'fries': for (let i = 0; i < 4; i++) L([[18 + i * 4, 30], [17 + i * 4.5, 15]]); g.fillRect(15, 28, 18, 7); break;
    case 'drop': g.beginPath(); g.moveTo(24, 12); g.quadraticCurveTo(33, 25, 24, 34); g.quadraticCurveTo(15, 25, 24, 12); g.fill(); break;
    case 'feather': L([[16, 33], [32, 15]]); for (let i = 0; i < 4; i++) L([[20 + i * 3.5, 29 - i * 3.5], [27 + i * 2, 31 - i * 4]]); break;

    case 'gyro': g.beginPath(); g.ellipse(24, 24, 10, 4, 0.5, 0, 6.3); g.stroke(); g.beginPath(); g.ellipse(24, 24, 10, 4, -0.5, 0, 6.3); g.stroke(); break;

      case 'hit': if (e.box && e.box.kind === 'paw') { sfx('swat'); } else if (e.v > 1) { sfx('thunk', Math.min(3, e.v / 3)); } if (e.v > 3) burst(e.x, e.y, 4, 'rgba(255,255,255,0.7)', 2, 0.35, 10, 0.04); break;
      case 'slap': sfx('slosh', e.v); if (G.b) burst(G.b.x, G.b.y + 0.2, Math.min(10, e.v | 0), 'rgba(110,190,255,0.9)', 3, 0.5, 20, 0.05); break;
      case 'coin': sfx('coin'); burst(e.x, e.y, 10, '#ffcc33', 4, 0.5, 6, 0.05); floatText(e.x, e.y + 0.3, '+1', '#ffcc33'); break;
      case 'tap': sfx('tap'); break;
      case 'knocked': banner('SWAT!', '#ffb703', 'The cat got you', 1.0); sfx('swat'); break;
      case 'result': onResult(e.r); break;
      case 'room': CAM_SNAP = true; { const F = FLOORS[RUN.floor]; banner(RUN.room === 3 ? F.boss.n.toUpperCase() : `FLOOR ${RUN.floor + 1}-${RUN.room + 1}`, RUN.room === 3 ? '#ff6b2c' : '#4fb3ff', RUN.room === 3 ? F.boss.d : F.n, RUN.room === 3 ? 2.6 : 1.6); } break;
      case 'clear': sfx('clear'); for (let i = 0; i < 4; i++) burst(G.b.x + (Math.random() - 0.5) * 3, G.b.y + 1, 14, ['#ffcc33', '#ff6b2c', '#4fb3ff', '#5ee08a'][i], 9, 1.4, 12, 0.07); floatText(G.b.x, G.b.y + 1.6, `+${e.bonus} Caps`, '#ffcc33', true); break;
      case 'reward': setTimeout(() => { if (G.mode === 'reward' && !MODAL) rewardModal(); }, 900); break;
      case 'shop': setTimeout(() => { if (G.mode === 'shop' && !MODAL) shopModal(); }, 400); break;
      case 'dead': case 'win': { const won = e.type === 'win', unl = e.unl; setTimeout(() => endModal(won, unl), won ? 1200 : 900); if (!won) sfx('fall'); break; }
      case 'sticker': break;

  }
}
let CAM_SNAP = true;

  } else if (r.kind === 'noflip') { sfx('noflip'); banner(pickOne(LINES.noflip), '#ffcc33', 'No bottle lost. Try again.', 1.2); }
  else if (r.kind === 'lava') { sfx('lava'); CAM.shake = 1; burst(x, 0.1, 22, 'rgba(220,220,220,0.75)', 3, 1.2, -4, 0.12); burst(x, 0.1, 12, '#ffb347', 6, 0.6, 18, 0.06); banner(pickOne(LINES.lava), '#ff6b2c', r.saved ? 'Bubble Wrap saved you' : `${RUN.hearts} bottle${RUN.hearts === 1 ? '' : 's'} left`, 1.2); }
  else { sfx('fall'); CAM.shake = 0.5; banner(pickOne(LINES.fall), '#ff5e78', r.saved ? 'Bubble Wrap saved you' : `${RUN.hearts} bottle${RUN.hearts === 1 ? '' : 's'} left`, 1.2); }
}
const pickOne = a => a[Math.floor(Math.random() * a.length)];

// ---------------------------------------------------------------------
// INPUT
// ---------------------------------------------------------------------
function dragMax() { return Math.max(110, Math.min(260, Math.min(CAM.W, CAM.H) * 0.36)); }
function ptr(e) { const r = CAM.cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
function onDown(e) {
  audio();
  if (MODAL || !RUN) return;
  if (G.mode === 'flight') { secondFlick(); return; }
  if (G.mode !== 'aim' || e.button === 2) return;
  const p = ptr(e); AIM.on = true; AIM.sx = AIM.x = p.x; AIM.sy = AIM.y = p.y; AIM.v = null; AIM.pred = null; AIM.id = e.pointerId;
  try { CAM.cv.setPointerCapture(e.pointerId); } catch (er) {}
  CAM.cv.classList.add('dragging');
}
function onMove(e) {
  if (!AIM.on || e.pointerId !== AIM.id) return;
  const p = ptr(e); AIM.x = p.x; AIM.y = p.y;
  const m = dragMax(); AIM.v = aimVelocity((AIM.sx - AIM.x) / m, (AIM.y - AIM.sy) / m);
}
function onUp(e) {
  if (!AIM.on || (e.pointerId !== undefined && e.pointerId !== AIM.id)) return;
  AIM.on = false; CAM.cv.classList.remove('dragging');
  if (AIM.v && G.mode === 'aim' && !MODAL) throwBottle(AIM.v.vx, AIM.v.vy);
  AIM.v = null; AIM.pred = null;
}
function cancelAim() { AIM.on = false; AIM.v = null; AIM.pred = null; CAM.cv.classList.remove('dragging'); }

// ---------------------------------------------------------------------
// LOOP
// ---------------------------------------------------------------------
let LAST = 0, UI_T = 0;
function loop(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - (LAST || ts)) / 1000)); LAST = ts;
  fxStep(dt);
  if (RUN && ROOM && G.b) {
    if (!MODAL) simulate(dt);
    if (G.mode === 'result') { G.resultT += dt; if (G.resultT > 1.15) { afterResult(); } }
    handleEvents();
    // Crystal Ball, at most ~10 times a second
    if (AIM.on && AIM.v && stk('crystal') && G.mode === 'aim') {
      const key = AIM.v.vx.toFixed(2) + ',' + AIM.v.vy.toFixed(2);
      const moving = G.W.boxes.some(b => b.move);
      if ((key !== AIM.predKey || moving) && ts - AIM.predT > 90) { AIM.predKey = key; AIM.predT = ts; AIM.pred = predictThrow(AIM.v.vx, AIM.v.vy); }
    } else if (!AIM.on) AIM.pred = null;
    if (G.mode !== 'aim' && AIM.on) cancelAim();
    camFrame(dt, CAM_SNAP); CAM_SNAP = false;
    draw(AIM.on ? AIM : null);
  } else if (CAM.g) { drawIdle(); }
  if (ts - UI_T > 120) { UI_T = ts; renderHUD(); renderHint(); }
  requestAnimationFrame(loop);
}
// behind the title screen: an empty dorm room with a bottle on the desk
function drawIdle() {
  if (!IDLE) { const keep = RUN; RUN = { bottle:PICK, stickers:{}, floor:0 }; IDLE = { room:genRoom(0, 0, 7) }; const W = buildWorld(IDLE.room); const prevW = G.W; G.W = W; ROOM = IDLE.room; G.cur = 0; placeOn(0); IDLE.b = G.b; IDLE.W = W; G.W = prevW; ROOM = null; RUN = keep; }
  const keepR = RUN, keepRoom = ROOM, keepB = G.b, keepW = G.W, keepCur = G.cur;
  RUN = { bottle:PICK, stickers:{}, floor:0, room:0 }; ROOM = IDLE.room; G.b = IDLE.b; G.W = IDLE.W; G.cur = 0;
  const m = G.mode; G.mode = 'aim'; camFrame(0.016, !IDLE.framed); IDLE.framed = true; draw(null); G.mode = m;
  RUN = keepR; ROOM = keepRoom; G.b = keepB; G.W = keepW; G.cur = keepCur;
}
let IDLE = null;

function start(data) {
  CAM.cv = $('cv'); CAM.g = CAM.cv.getContext('2d');
  camResize();
  addEventListener('resize', () => { camResize(); });
  if (window.ResizeObserver) new ResizeObserver(() => camResize()).observe($('stage'));
  CAM.cv.addEventListener('pointerdown', onDown);
  addEventListener('pointermove', onMove);
  addEventListener('pointerup', onUp);
  addEventListener('pointercancel', () => cancelAim());
  CAM.cv.addEventListener('contextmenu', e => { e.preventDefault(); cancelAim(); });
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (AIM.on) { cancelAim(); return; } if (MODAL && MODAL.closable) { closeModal(); return; } if (!MODAL && RUN) menuModal(); }
    if ((e.key === ' ' || e.key === 'Enter') && G.mode === 'flight' && !MODAL) { e.preventDefault(); secondFlick(); }
  });
  $('bMenu').onclick = () => { audio(); sfx('click'); if (!MODAL) menuModal(); else if (MODAL.closable) closeModal(); };
  META = loadMeta();
  try { const p = localStorage.getItem('upright_pick'); if (p && META.unlocked[p]) PICK = p; } catch (e) {}
  // hot reload: carry the run over
  if (data && data.run) { try { localStorage.setItem(RUN_KEY, data.run); } catch (e) {} }
  if (data && data.run && resumeRun()) {}
  else titleModal();
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveMeta(); } });
try { window.claude?.hot?.snapshot?.(() => ({ run:RUN ? JSON.stringify(RUN) : null })); } catch (e) {}
(window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}));
</script>
