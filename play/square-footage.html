<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Square Footage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a facilities-management console — floor plan on the left like a drawing sheet, a title-block side panel on the right.
   Palette: drafting-paper greys with a cool bias, plan-ink, safety orange for anything you can act on, blueprint blue for info. */
:root {
  --bg:#e6e9e7; --paper:#f8f9f7; --paper2:#eef1ee; --ink:#1d2126; --mute:#5c6670; --line:#cfd5d1;
  --accent:#d9520b; --accent-ink:#ffffff; --accent-soft:#fbe5d6; --blue:#2b5797; --blue-soft:#dde7f5;
  --good:#23794b; --good-soft:#dcefe3; --bad:#b8331f; --bad-soft:#f7e0db; --syn:#6d45b3; --syn-soft:#ece5f7;
  --cvbg:#d6d9d4; --shadow:rgba(20,26,34,.16);
  --display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#15181b; --paper:#1d2125; --paper2:#252a2f; --ink:#e8ebe8; --mute:#9aa4ad; --line:#343b42;
  --accent:#f07a35; --accent-ink:#1a0d04; --accent-soft:#3a2416; --blue:#8fb2e8; --blue-soft:#1f2b3d;
  --good:#5cc68c; --good-soft:#1b3427; --bad:#f08572; --bad-soft:#3b201b; --syn:#b398ea; --syn-soft:#2a2240;
  --cvbg:#2a2f33; --shadow:rgba(0,0,0,.45); color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#15181b; --paper:#1d2125; --paper2:#252a2f; --ink:#e8ebe8; --mute:#9aa4ad; --line:#343b42;
  --accent:#f07a35; --accent-ink:#1a0d04; --accent-soft:#3a2416; --blue:#8fb2e8; --blue-soft:#1f2b3d;
  --good:#5cc68c; --good-soft:#1b3427; --bad:#f08572; --bad-soft:#3b201b; --syn:#b398ea; --syn-soft:#2a2240;
  --cvbg:#2a2f33; --shadow:rgba(0,0,0,.45); color-scheme:dark; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--body); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:12px; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
#app { display:grid; gap:10px; max-width:1560px; margin:0 auto; }
.mono, .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* ---- header: a title block ---- */
.top { display:flex; align-items:stretch; flex-wrap:wrap; gap:0; background:var(--paper); border:1.5px solid var(--ink); }
.top > * { padding:7px 12px; border-right:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; min-width:0; }
.brand { flex-direction:row; align-items:center; gap:10px; margin-right:auto; border-right:1.5px solid var(--ink); }
.brand .mark { display:grid; grid-template-columns:repeat(2, 9px); gap:2px; }
.brand .mark i { width:9px; height:9px; border:2px solid var(--ink); border-radius:1px; }
.brand .mark i:nth-child(2) { background:var(--accent); border-color:var(--accent); }
.brand b { display:block; font:800 20px/1 var(--display); font-stretch:125%; letter-spacing:-0.2px; text-transform:uppercase; }
.brand span#hBldg { display:block; font:500 11.5px/1.3 var(--mono); color:var(--mute); margin-top:3px; letter-spacing:.2px; }
.lab { font:600 10.5px/1.2 var(--body); text-transform:uppercase; letter-spacing:.9px; color:var(--mute); white-space:nowrap; }
.money b { font:700 22px/1.1 var(--mono); font-variant-numeric:tabular-nums; }
.money .sub { font:500 11.5px var(--mono); color:var(--good); }
.money .sub.neg { color:var(--bad); }
.kpi b { font:600 15px/1.2 var(--mono); font-variant-numeric:tabular-nums; }
.kpi.syn b { color:var(--syn); }
.kpi.val { min-width:150px; }
.bar { height:5px; background:var(--paper2); border-radius:3px; overflow:hidden; margin-top:4px; }
.bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
.bar.good i { background:var(--good); } .bar.warn i { background:var(--accent); } .bar.bad i { background:var(--bad); }
.clock b { font:700 17px/1.1 var(--mono); }
.clock span { font-size:11.5px; color:var(--mute); }
.clock .bar.day i { background:var(--accent); }
.speed { flex-direction:row !important; align-items:center; gap:3px; }
.speed button { border:1px solid var(--line); background:var(--paper); padding:5px 9px; font:600 12.5px var(--mono); color:var(--mute); border-radius:4px; }
.speed button.on { background:var(--ink); border-color:var(--ink); color:var(--paper); }
.top .ghost { border:0; border-right:0; background:transparent; font-weight:700; text-transform:uppercase; letter-spacing:.8px; font-size:12px; color:var(--ink); }
.top .ghost:hover { background:var(--paper2); }

/* ---- main grid ---- */
main.grid { display:grid; grid-template-columns:minmax(0, 1fr) minmax(330px, 390px); gap:12px; align-items:start; }
.floorcol { display:grid; gap:10px; min-width:0; }
.floorcard { background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:8px; min-width:0; }
.floorhead { display:flex; gap:8px; align-items:center; flex-wrap:wrap; min-height:26px; padding:0 2px 6px; }
.hint { font-size:12.5px; color:var(--mute); flex:1; min-width:200px; }
.hint b { color:var(--ink); }
.chip { font:600 12px var(--body); padding:3px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
.cvwrap { position:relative; width:100%; background:var(--cvbg); border-radius:4px; overflow:hidden; }
#cv { display:block; width:100%; touch-action:none; cursor:default; }
#cv.place { cursor:crosshair; }
.floortools { display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center; padding:8px 2px 0; }
.seg { display:flex; align-items:center; gap:3px; flex-wrap:wrap; }
.seg .lab { margin-right:4px; }
.seg button { border:1px solid var(--line); background:var(--paper); border-radius:4px; padding:4px 9px; font-size:12.5px; font-weight:600; color:var(--mute); }
.seg button.on { border-color:var(--ink); color:var(--ink); background:var(--paper2); box-shadow:inset 0 -2px 0 var(--accent); }
.feed { background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:8px 12px; height:220px; overflow:auto; }
.feed h4 { margin:0 0 4px; font:700 11px/1.2 var(--body); text-transform:uppercase; letter-spacing:1px; color:var(--mute); }
.entry { padding:5px 0; border-bottom:1px dashed var(--line); font-size:13px; }
.entry:last-child { border-bottom:0; }
.entry .ts { font:500 11px var(--mono); color:var(--mute); margin-right:6px; }
.entry.k-good .txt { color:var(--good); } .entry.k-bad .txt { color:var(--bad); } .entry.k-event .txt { color:var(--accent); font-weight:600; }

/* ---- side ---- */
.side { display:flex; flex-direction:column; gap:10px; position:sticky; top:12px; max-height:calc(100vh - 24px); min-height:0; }
.insp { background:var(--paper); border:1.5px solid var(--ink); border-radius:6px; padding:10px 12px; flex:none; max-height:52vh; overflow:auto; }
.insp .ih { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.insp h3 { margin:0; font:800 16px/1.2 var(--display); font-stretch:112%; text-wrap:balance; }
.insp .ih span { font:500 11.5px var(--mono); color:var(--mute); }
.insp .x { margin-left:auto; border:0; background:transparent; font-size:18px; line-height:1; color:var(--mute); padding:0 4px; }
.insp p { margin:6px 0; color:var(--mute); font-size:13px; }
.tabs { display:flex; border:1px solid var(--line); border-radius:6px 6px 0 0; background:var(--paper2); overflow-x:auto; scrollbar-width:none; flex:none; }
.tabs button { flex:1; border:0; background:transparent; padding:9px 10px; font-size:13px; font-weight:700; color:var(--mute); border-bottom:2px solid transparent; white-space:nowrap; }
.tabs button.on { color:var(--ink); background:var(--paper); border-bottom-color:var(--accent); }
.tabs .badge { display:inline-block; min-width:16px; padding:0 4px; margin-left:4px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-size:10.5px; line-height:16px; }
.pane { background:var(--paper); border:1px solid var(--line); border-top:0; border-radius:0 0 6px 6px; padding:10px 12px; overflow:auto; min-height:0; flex:1; margin-top:-10px; }
.sec { margin:14px 0 7px; display:flex; align-items:baseline; gap:8px; font:700 11px/1.2 var(--body); text-transform:uppercase; letter-spacing:1px; color:var(--mute); }
.sec:first-child { margin-top:2px; }
.sec .k { margin-left:auto; text-transform:none; letter-spacing:0; font:500 11.5px var(--mono); }
.note { font-size:12.5px; color:var(--mute); margin:6px 0; }

/* build palette */
.pal { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px; }
.it { display:grid; grid-template-columns:40px minmax(0, 1fr); gap:2px 8px; align-items:center; text-align:left; border:1px solid var(--line); background:var(--paper); border-radius:5px; padding:5px 7px 5px 5px; }
.it img { width:40px; height:40px; grid-row:1 / 3; border-radius:3px; }
.it b { font-size:13px; font-weight:700; line-height:1.15; }
.it small { font:500 11.5px var(--mono); color:var(--mute); }
.it small.free { color:var(--good); font-weight:600; }
.it.on { border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent) inset; background:var(--accent-soft); }
.it[disabled] { opacity:.45; cursor:not-allowed; }
.it:hover:not([disabled]) { border-color:var(--ink); }
.desc { font-size:12.5px; color:var(--mute); margin:8px 0 0; }
.btn { border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:5px; padding:6px 11px; font-weight:700; font-size:13px; white-space:nowrap; }
.btn.alt { background:var(--paper); color:var(--ink); border-color:var(--line); }
.btn.alt:hover:not([disabled]) { border-color:var(--ink); }
.btn.warn { background:var(--paper); color:var(--bad); border-color:var(--bad); }
.btn[disabled] { opacity:.45; cursor:not-allowed; }
.btn.big { padding:10px 18px; font-size:15px; }
.row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px; }
.kv { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:5px; margin-top:6px; }
.kv div { background:var(--paper2); border-radius:4px; padding:5px 8px; font-size:11px; color:var(--mute); }
.kv b { display:block; color:var(--ink); font:600 13.5px var(--mono); font-variant-numeric:tabular-nums; }
.kv b.good { color:var(--good); } .kv b.bad { color:var(--bad); }
.fx { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.fx span { font:600 11.5px/1.7 var(--mono); padding:0 7px; border-radius:999px; background:var(--good-soft); color:var(--good); white-space:nowrap; }
.fx span.neg { background:var(--bad-soft); color:var(--bad); }
.fx span.zero { background:var(--paper2); color:var(--mute); }
.needs { display:grid; grid-template-columns:auto minmax(0, 1fr) minmax(34px, auto); gap:4px 8px; align-items:center; font-size:12px; margin-top:6px; }
.needs .bar { margin:0; height:7px; }
.needs .v { font:500 11.5px var(--mono); text-align:right; color:var(--mute); }
.card { border:1px solid var(--line); border-radius:5px; padding:8px 10px; }
.callout { border-radius:5px; padding:9px 11px; margin:8px 0; font-size:13px; background:var(--paper2); }
.callout.go { background:var(--good-soft); color:var(--good); }
.callout.warn { background:var(--accent-soft); color:var(--accent); }
.callout.bad { background:var(--bad-soft); color:var(--bad); }
.callout.blue { background:var(--blue-soft); color:var(--blue); }
.onb { border:1.5px dashed var(--accent); background:var(--accent-soft); border-radius:6px; padding:8px 10px; margin-bottom:10px; }
.onb .t { font-weight:800; color:var(--accent); font-size:13px; }
.onb .h { font-size:12.5px; margin-top:2px; }
.onb .p { font:500 11px var(--mono); color:var(--mute); margin-top:4px; }

/* team list */
.people { display:grid; gap:4px; }
.pp { display:grid; grid-template-columns:28px minmax(0, 1fr) 64px; gap:0 8px; align-items:center; text-align:left; border:1px solid var(--line); background:var(--paper); border-radius:5px; padding:5px 8px; }
.pp:hover { border-color:var(--ink); }
.pp .av { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; color:#fff; font:700 10px var(--body); }
.pp .nm { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pp .nm small { display:block; font:500 11px var(--body); color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pp .bar { margin:0; }
.pp .mv { font:500 10.5px var(--mono); color:var(--mute); text-align:right; }
.sortby { display:flex; gap:4px; flex-wrap:wrap; }
.sortby button { border:1px solid var(--line); background:var(--paper); border-radius:4px; padding:2px 8px; font-size:12px; color:var(--mute); }
.sortby button.on { color:var(--ink); border-color:var(--ink); }

/* policies */
.pol { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:2px 10px; align-items:center; border:1px solid var(--line); border-radius:5px; padding:7px 9px; margin-bottom:5px; }
.pol b { font-size:13px; }
.pol .d { grid-column:1; font-size:12.5px; color:var(--mute); }
.pol.own { background:var(--syn-soft); border-color:transparent; }
.pol .own { font:600 11.5px var(--mono); color:var(--syn); }
.btn.syn { background:var(--syn); border-color:var(--syn); color:var(--accent-ink); }

/* company */
.goal { border:1.5px solid var(--ink); border-radius:6px; padding:10px 12px; }
.goal .gnum { font:700 22px var(--mono); }
.goal .bar { height:8px; }
.hist { display:block; width:100%; height:90px; }
.ms { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:5px; }
.ms div { border:1px dashed var(--line); border-radius:5px; padding:5px 8px; font-size:12px; color:var(--mute); }
.ms div.got { border-style:solid; border-color:var(--good); background:var(--good-soft); color:var(--ink); }
.ms b { display:block; font-size:12.5px; }
.stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:5px; }
.stats div { background:var(--paper2); border-radius:4px; padding:5px 8px; font-size:11px; color:var(--mute); }
.stats b { display:block; color:var(--ink); font:600 14px var(--mono); }

/* ---- modals ---- */
.ov { position:fixed; inset:0; z-index:40; background:rgba(16,20,26,.55); display:grid; place-items:center; padding:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.modal { width:100%; max-width:560px; max-height:calc(100% - 8px); overflow:auto; background:var(--paper); border:1.5px solid var(--ink); border-radius:8px; padding:18px 20px; box-shadow:0 20px 60px var(--shadow); animation:rise .22s ease-out; }
@keyframes rise { from { transform:translateY(8px); opacity:0; } to { transform:none; opacity:1; } }
.modal h2 { margin:2px 0 6px; font:800 24px/1.1 var(--display); font-stretch:118%; text-wrap:balance; }
.modal h3 { margin:14px 0 6px; font:700 11px/1.2 var(--body); text-transform:uppercase; letter-spacing:1px; color:var(--mute); }
.modal p { margin:8px 0; }
.kicker { font:700 11px/1.2 var(--mono); letter-spacing:1px; text-transform:uppercase; color:var(--accent); }
.hero { font:900 clamp(34px, 8vw, 54px)/0.92 var(--display); font-stretch:125%; text-transform:uppercase; letter-spacing:-1px; margin:6px 0 2px; }
.hero em { font-style:normal; color:var(--accent); }
.sheet { display:flex; justify-content:space-between; font:500 11px var(--mono); color:var(--mute); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:4px 0; margin:8px 0 10px; gap:10px; flex-wrap:wrap; }
.field { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:5px; background:var(--paper); font-size:15px; margin-top:4px; }
.chk { display:flex; gap:8px; align-items:center; font-size:13px; margin-top:10px; color:var(--mute); }
.li { padding:4px 0 4px 14px; position:relative; font-size:13.5px; }
.li::before { content:''; position:absolute; left:0; top:11px; width:6px; height:6px; border-radius:1px; background:var(--line); }
.li.good::before { background:var(--good); } .li.bad::before { background:var(--bad); } .li.event::before { background:var(--accent); }
.modal ul { padding-left:18px; margin:8px 0; } .modal ul li { margin:5px 0; }

/* ---- toasts ---- */
#toasts { position:fixed; z-index:50; right:max(16px, env(safe-area-inset-right, 0px)); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); display:grid; gap:6px; justify-items:end; pointer-events:none; }
.toast { background:var(--ink); color:var(--paper); border-radius:6px; padding:8px 12px; font-size:13px; max-width:320px; box-shadow:0 8px 24px var(--shadow); animation:rise .22s ease-out; }
.toast b { color:var(--accent); }
.toast.bad { background:var(--bad); color:#fff; } .toast.bad b { color:#fff; }

@media (max-width:1060px) {
  main.grid { grid-template-columns:minmax(0, 1fr); }
  .floorcol { display:contents; }
  .floorcard { order:1; } .side { order:2; position:static; max-height:none; } .feed { order:3; }
  .pane { overflow:visible; }
  .insp { max-height:none; }
}
@media (max-width:640px) {
  .top > * { padding:6px 9px; border-bottom:1px solid var(--line); }
  .brand { flex-basis:100%; border-right:0; border-bottom:1.5px solid var(--ink); }
  .kpi.syn, .kpi:not(.val):not(.syn) { display:none; }
  .money b { font-size:18px; }
  .money, .kpi.val, .clock { flex:1 1 30%; min-width:0; }
  .clock { align-items:flex-start; border-right:0; }
  .lab { overflow:hidden; text-overflow:ellipsis; }
  .speed { flex:1 1 auto; border-bottom:0 !important; }
  .top .ghost { flex:0 0 auto; border-bottom:0; }
  .toast { font-size:12px; padding:6px 10px; max-width:250px; }
  .speed button { padding:5px 7px; }
  .seg button { padding:4px 7px; }
  .feed { height:auto; max-height:260px; }
  .pal { grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); }
  .it small { font-size:10.5px; }
}
@media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>

    <div class="money"><span class="lab">Cash</span><b id="hCash">$0</b><span class="sub" id="hToday">Today +$0</span></div>

  <main class="grid">

function freshToday() { return { rev:0, deliv:0, delivCash:0, synergy:0, meetings:0, quits:[], wages:0, promos:[], jams:0, empties:0, hired:0 }; }

function addObj(o) { o.id = S.nextId++; o.q = []; o.u = []; S.objs[o.id] = o; return o; }
const def = t => ITEMS[t] || FIXED[t];
const elevObj = () => Object.values(S.objs).find(o => o.type === 'elev' || o.type === 'core');

// ---------------------------------------------------------------------
// GEOMETRY
// ---------------------------------------------------------------------
function footprint(type, dir) { const d = def(type); let w = d.w, h = d.h; if (dir % 2 === 0 && w !== h) [w, h] = [h, w]; return [w, h]; }
function accessOf(o) {
  if (def(o.type).noFront) return null;
  const [dx, dy] = DIRS[o.dir];
  if (dx === 1) return [o.x + o.w, o.y + Math.floor((o.h - 1) / 2)];
  if (dx === -1) return [o.x - 1, o.y + Math.floor((o.h - 1) / 2)];
  if (dy === 1) return [o.x + Math.floor((o.w - 1) / 2), o.y + o.h];
  return [o.x + Math.floor((o.w - 1) / 2), o.y - 1];
}
const inB = (x, y) => x >= 0 && y >= 0 && x < L.W && y < L.H;
const ci = (x, y) => y * L.W + x;
function buildOcc(skip) {
  const occ = new Int32Array(S.width * B().h);
  for (const o of Object.values(S.objs)) { if (o.id === skip) continue; for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) occ[y * S.width + x] = o.id; }
  return occ;
}
function bfs(occ, W, H, sources) {
  const d = new Int16Array(W * H).fill(-1), q = new Int32Array(W * H); let h = 0, t = 0;
  for (const [x, y] of sources) { const i = y * W + x; if (x >= 0 && y >= 0 && x < W && y < H && !occ[i] && d[i] < 0) { d[i] = 0; q[t++] = i; } }
  while (h < t) { const i = q[h++], x = i % W, y = (i / W) | 0, nd = d[i] + 1;
    if (x + 1 < W && !occ[i + 1] && d[i + 1] < 0) { d[i + 1] = nd; q[t++] = i + 1; }
    if (x > 0 && !occ[i - 1] && d[i - 1] < 0) { d[i - 1] = nd; q[t++] = i - 1; }
    if (y + 1 < H && !occ[i + W] && d[i + W] < 0) { d[i + W] = nd; q[t++] = i + W; }
    if (y > 0 && !occ[i - W] && d[i - W] < 0) { d[i - W] = nd; q[t++] = i - W; } }
  return d;
}

// ---------------------------------------------------------------------
// PLACEMENT
// ---------------------------------------------------------------------
function unlocked(type) { const u = ITEMS[type].unlock; if (!u) return true; if (u.hc) return S.stats.maxHc >= u.hc; if (u.policy) return has(u.policy); return true; }
function unlockText(type) { const u = ITEMS[type].unlock; if (!u) return ''; if (u.hc) return `Unlocks at ${u.hc} people`; return `Needs the ${POLICIES.find(p => p.id === u.policy).n} policy`; }
function owned(type) {
  const g = ITEMS[type].group;
  const match = t => g ? ITEMS[t] && ITEMS[t].group === g : t === type;
  let n = 0; for (const o of Object.values(S.objs)) if (match(o.type)) n++;
  for (const t in S.stock) if (match(t)) n += S.stock[t].length;
  return n;
}
function price(type) { const it = ITEMS[type]; return Math.round(it.cost * Math.pow(it.grow, owned(type)) * B().mult); }
function stockOf(type) { return (S.stock[type] || []).length; }
function canPlace(type, x, y, dir, ignore) {
  const d = def(type); const [w, h] = footprint(type, dir);
  const W = S.width, H = B().h;
  if (x < 0 || y < 0 || x + w > W || y + h > H) return 'Off the floor.';
  const occ = buildOcc(ignore);
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (occ[yy * W + xx]) return 'Something is already there.';
  const tmp = { type, x, y, w, h, dir };
  const acc = accessOf(tmp);
  if (acc) { const [ax, ay] = acc; if (ax < 0 || ay < 0 || ax >= W || ay >= H) return 'Its front has to face open floor.'; if (occ[ay * W + ax]) return 'Its front square has to stay open.'; }
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) occ[yy * W + xx] = -1;
  // everything must still be reachable from the elevator
  const e = elevObj(); const ea = accessOf(e.id === ignore ? e : e);
  const dist = bfs(occ, W, H, [ea]);
  if (acc && dist[acc[1] * W + acc[0]] < 0) return 'Nobody could reach it from the elevator.';
  for (const o of Object.values(S.objs)) { if (o.id === ignore) continue; const a = accessOf(o); if (!a) continue; if (dist[a[1] * W + a[0]] < 0) return `That would cut off the ${o.type === 'desk' || o.type === 'cube' ? 'desk' : def(o.type).n} at row ${a[1] + 1}.`; }

}

let TOUCH = false, HOVER = null, PREVIEW = null, DRAG = null, GHOST = null;

function computeGhost() {
  const c = TOUCH ? PREVIEW : HOVER; if (!c || TOOL.mode === 'select' || !S) { GHOST = null; return; }

  let why = canPlace(a.type, a.x, a.y, TOOL.dir, TOOL.mode === 'move' ? TOOL.id : undefined);
  if (!why && TOOL.mode === 'place' && !stockOf(a.type) && S.cash < price(a.type)) why = `Costs ${fmtMoney(price(a.type))}.`;
  const o = { id:src ? src.id : 999999, type:a.type, x:a.x, y:a.y, w:a.w, h:a.h, dir:TOOL.dir, lvl:src ? src.lvl : 0, stock:25, jam:0, on:true, mgr:src ? src.mgr : null, q:[], u:[], mtg:null, wid:0 };

  sfx('place'); save(); GHOST = null; renderAll(); return true;
}

  for (const w of S.workers) { if (w.st === 'out') continue; const d = Math.hypot(w.x - wpt.x, w.y - wpt.y); if (d < bd) { bd = d; best = w; } }
  if (best) return { w:best.id };

}

function cancelTool() { TOOL.mode = 'select'; TOOL.type = null; PREVIEW = null; GHOST = null; $('cv').classList.remove('place'); renderAll(); }

// BUTTONS + KEYS

document.addEventListener('click', e => {

addEventListener('keydown', e => {

// ---------------------------------------------------------------------
// LOOP + BOOT
// ---------------------------------------------------------------------
let LAST_TS = 0, LAST_UI = 0, SAVE_T = 0;
function loop(ts) {
