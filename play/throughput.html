<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Throughput</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* THROUGHPUT — the same cheerful corporate intranet as ADATO, now with a whiteboard.
   Single deliberate light look: fluorescent greige, corporate blue, highlighter yellow, marker ink. */
:root {
  --bg:#e7e9e1; --paper:#fbfbf7; --paper2:#f2f3ee; --ink:#1c2230; --mute:#5f6779; --line:#d2d5cb;
  --brand:#2c4bd6; --brand-soft:#e4e9ff; --marker:#fff06b; --good:#1b8556; --bad:#c93b28; --warn:#a96f0c;
  --display:'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { min-height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--body); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:12px; }
button, input { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
#app { display:grid; grid-template-rows:auto auto auto; gap:10px; max-width:1500px; margin:0 auto; }

/* ---- header ---- */
.top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.brand { display:flex; align-items:baseline; gap:10px; margin-right:auto; }
.brand b { font:800 26px/1 var(--display); letter-spacing:-0.5px; color:var(--brand); }
.brand span { font-size:12px; color:var(--mute); letter-spacing:0.4px; text-transform:uppercase; }
.clock { display:flex; flex-direction:column; align-items:flex-end; }
.clock b { font:600 20px/1 var(--mono); font-variant-numeric:tabular-nums; }
.clock span { font-size:12px; color:var(--mute); }
.who { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.pill { background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12.5px; white-space:nowrap; }
.pill.title { background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:600; }
.pill.money { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.ghost { background:transparent; border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12.5px; color:var(--mute); }
.ghost:hover { border-color:var(--ink); color:var(--ink); }

/* ---- meters ---- */
.meters { display:flex; flex-wrap:wrap; gap:8px; }
.meter { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:6px 10px; min-width:0; flex:1 1 120px; }
.meter .k { font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--mute); display:flex; justify-content:space-between; gap:6px; }
.meter .v { font:600 15px/1.2 var(--mono); font-variant-numeric:tabular-nums; }
.meter .v small { color:var(--mute); font-weight:400; font-size:12px; }
.bar { height:6px; background:var(--paper2); border-radius:3px; overflow:hidden; margin-top:4px; }
.bar i { display:block; height:100%; background:var(--brand); border-radius:3px; transition:width .35s; }
.bar.good i { background:var(--good); } .bar.bad i { background:var(--bad); } .bar.warn i { background:var(--warn); }
.meter.ok { border-color:#9bd3b7; }
.meter.skills { flex:2 1 220px; }
.skills .row3 { display:flex; gap:12px; }
.skills .row3 div { flex:1; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }
.chip { font-size:11.5px; padding:1px 7px; border-radius:999px; background:var(--brand-soft); color:var(--brand); font-weight:600; }

/* ---- main grid ---- */
main.grid { display:grid; grid-template-columns:minmax(0, 1.35fr) minmax(340px, 1fr); gap:12px; align-items:start; }
.mapcol { display:grid; gap:10px; min-width:0; }
.mapbox { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:6px; }
.mapbox canvas { display:block; width:100%; height:auto; aspect-ratio:760 / 480; max-width:100%; border-radius:8px; }
.feed { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 12px; overflow:auto; height:300px; }
.feed h4, .pane-h { margin:0 0 6px; font:700 12px/1.2 var(--body); text-transform:uppercase; letter-spacing:0.8px; color:var(--mute); }
.entry { padding:7px 0; border-bottom:1px dashed var(--line); }
.entry:last-child { border-bottom:0; }
.entry .ts { font:500 11px var(--mono); color:var(--mute); margin-right:6px; }
.entry.first { animation:pop .45s ease-out; }
.entry.k-bingo .txt { font-weight:700; }
.entry.k-good .txt { color:#14563a; } .entry.k-bad .txt { color:#7a2214; }
@keyframes pop { from { background:var(--brand-soft); } to { background:transparent; } }
.deltas { display:inline-flex; gap:4px; flex-wrap:wrap; margin-left:4px; vertical-align:1px; }
.d { font:600 11px/1.6 var(--mono); padding:0 6px; border-radius:999px; background:#e3f3ea; color:var(--good); white-space:nowrap; }
.d.neg { background:#fbe6e2; color:var(--bad); }

.side { display:flex; flex-direction:column; background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:hidden; position:sticky; top:12px; max-height:calc(100vh - 24px); }
.tabs { display:flex; overflow-x:auto; border-bottom:1px solid var(--line); background:var(--paper2); scrollbar-width:none; }
.tabs button { border:0; background:transparent; padding:10px 12px; font-size:13px; font-weight:600; color:var(--mute); border-bottom:2px solid transparent; white-space:nowrap; }
.tabs button.on { color:var(--ink); border-bottom-color:var(--brand); background:var(--paper); }
.tabs .badge { display:inline-block; min-width:17px; padding:0 5px; margin-left:5px; border-radius:999px; background:var(--bad); color:#fff; font-size:11px; line-height:17px; text-align:center; }
.tabs .badge.blue { background:var(--brand); }
#pane { padding:12px; overflow:auto; min-height:0; flex:1; }

/* ---- room pane ---- */
.room-h { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.room-h h2 { margin:0; font:700 21px/1.1 var(--display); text-wrap:balance; }
.room-h span { color:var(--mute); font-size:12.5px; }
.people { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 10px; }
.person { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:3px 4px 3px 4px; font-size:12.5px; }
.person i { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; color:#fff; font:700 9px var(--body); font-style:normal; }
.person button { border:0; background:var(--brand-soft); color:var(--brand); border-radius:999px; padding:2px 8px; font-size:12px; font-weight:600; }
.person button[disabled] { background:var(--paper2); color:var(--mute); cursor:default; }
.result { background:var(--brand-soft); border-radius:10px; padding:9px 11px; margin-bottom:10px; font-size:13.5px; }
.acts { display:grid; gap:7px; }
.act { display:grid; grid-template-columns:auto minmax(0, 1fr) auto; gap:4px 10px; align-items:start; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
.act:hover:not([disabled]) { border-color:var(--brand); box-shadow:0 1px 0 var(--brand); }
.act[disabled] { opacity:0.55; cursor:not-allowed; }
.act .n { font-weight:650; }
.act .desc { grid-column:2 / 4; font-size:12.5px; color:var(--mute); }
.act .meta { font:500 11.5px/1.5 var(--mono); color:var(--mute); text-align:right; white-space:nowrap; }
.act .why { grid-column:2 / 4; font-size:12px; color:var(--bad); font-weight:600; }
.act .key { font:600 11px/18px var(--mono); width:18px; height:18px; text-align:center; border-radius:5px; background:var(--paper2); color:var(--mute); margin-top:1px; }
.goto { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:6px; margin-top:6px; }
.goto button { text-align:left; background:var(--paper2); border:1px solid transparent; border-radius:8px; padding:6px 9px; font-size:12.5px; }
.goto button:hover:not([disabled]) { border-color:var(--brand); }
.goto button[disabled] { opacity:0.5; cursor:not-allowed; }
.goto button small { display:block; color:var(--mute); font-family:var(--mono); font-size:11px; }
.sec { margin:16px 0 8px; font:700 12px/1.2 var(--body); text-transform:uppercase; letter-spacing:0.8px; color:var(--mute); }
.shop { display:grid; gap:7px; }
.item { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:2px 10px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
.item .n { font-weight:650; }
.item .desc { font-size:12.5px; color:var(--mute); grid-column:1; }
.item .own { font:600 12px var(--mono); color:var(--brand); }
.btn { border:1px solid var(--brand); background:var(--brand); color:#fff; border-radius:8px; padding:6px 11px; font-weight:600; font-size:13px; white-space:nowrap; }
.btn.alt { background:var(--paper); color:var(--brand); }
.btn[disabled] { opacity:0.45; cursor:not-allowed; }
.btn.big { padding:10px 18px; font-size:15px; }
.note { font-size:12.5px; color:var(--mute); }

/* ---- career / bingo / decoder ---- */
.req { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:2px 10px; padding:7px 0; border-bottom:1px dashed var(--line); }
.req .v { font:600 13px var(--mono); font-variant-numeric:tabular-nums; }
.req .bar { grid-column:1 / 3; }
.req.ok .v { color:var(--good); }
.callout { border-radius:10px; padding:10px 12px; margin:10px 0; font-size:13.5px; background:var(--paper2); }
.callout.go { background:#e3f3ea; color:#14563a; font-weight:600; }
.callout.warn { background:#fdf0d8; color:#6e4806; }
.callout.bad { background:#fbe6e2; color:#7a2214; }
.stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:6px; }
.stats div { background:var(--paper2); border-radius:8px; padding:6px 9px; font-size:12px; color:var(--mute); }
.stats b { display:block; color:var(--ink); font:600 15px var(--mono); }
.achs { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:6px; }
.ach { border:1px dashed var(--line); border-radius:8px; padding:6px 9px; font-size:12px; color:var(--mute); }
.ach.got { border-style:solid; border-color:#9bd3b7; background:#eef8f2; color:var(--ink); }
.ach b { display:block; font-size:12.5px; }
.bingo { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:4px; }
.bingo div { aspect-ratio:1; max-width:100%; border:1px solid var(--line); border-radius:6px; display:grid; place-items:center; text-align:center; font-size:11px; line-height:1.15; padding:3px; overflow-wrap:anywhere; background:var(--paper); position:relative; }
.bingo div.on { background:var(--marker); border-color:#e2d24a; font-weight:700; }
.bingo div.on::after { content:''; position:absolute; inset:18%; border:3px solid rgba(201,59,40,0.55); border-radius:50%; transform:rotate(-8deg); }
.bingo div.free { background:var(--brand); color:#fff; font-weight:700; }
.dec-search { width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); margin:4px 0 10px; }
.dec { display:grid; gap:4px; }
.dec div { padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px; }
.dec b { font-weight:650; }
.dec .unk { color:var(--mute); letter-spacing:1px; }
.mail { display:grid; gap:6px; }
.mail button { text-align:left; display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:1px 8px; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
.mail button.unread { border-left:4px solid var(--brand); }
.mail button .f { font-weight:650; font-size:13px; }
.mail button .t { font:500 11px var(--mono); color:var(--mute); }
.mail button .s { grid-column:1 / 3; font-size:13px; color:var(--ink); }
.empty { color:var(--mute); font-size:13px; padding:20px 4px; text-align:center; }

/* ---- jargon ---- */
mark.jg { background:linear-gradient(transparent 12%, var(--marker) 12%, var(--marker) 88%, transparent 88%); color:inherit; padding:0 1px; border-radius:2px; cursor:help; }
mark.jg:focus-visible { outline:2px solid var(--ink); }
#jtip { position:fixed; z-index:60; max-width:270px; background:var(--ink); color:var(--paper); border-radius:9px; padding:8px 11px; font-size:13px; pointer-events:none; box-shadow:0 8px 24px rgba(20,24,32,.25); }
#jtip b { display:block; font:700 11px/1.4 var(--body); letter-spacing:0.8px; text-transform:uppercase; color:var(--marker); }

/* ---- modal ---- */
.ov { position:fixed; inset:0; z-index:40; background:rgba(28,34,48,.5); display:grid; place-items:center; padding:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.modal { width:100%; max-width:580px; max-height:calc(100% - 8px); overflow:auto; background:var(--paper); border-radius:14px; padding:20px 22px; box-shadow:0 20px 60px rgba(20,24,32,.35); animation:rise .25s ease-out; }
@keyframes rise { from { transform:translateY(10px); opacity:0; } to { transform:none; opacity:1; } }
.modal h2 { margin:0 0 4px; font:800 26px/1.1 var(--display); text-wrap:balance; }
.modal h3 { margin:14px 0 6px; font:700 13px/1.2 var(--body); text-transform:uppercase; letter-spacing:0.8px; color:var(--mute); }
.modal p { margin:8px 0; }
.modal .kicker { font:700 12px/1.2 var(--body); letter-spacing:1px; text-transform:uppercase; color:var(--brand); }
.modal .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.mhead { border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:10px; font-size:13px; }
.mhead div { display:grid; grid-template-columns:62px minmax(0, 1fr); }
.mhead span { color:var(--mute); }
.mhead .subj { font:700 17px/1.3 var(--body); margin-top:4px; display:block; }
.choice { display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--paper); border-radius:10px; padding:9px 12px; margin-top:7px; }
.choice:hover:not([disabled]) { border-color:var(--brand); }
.choice[disabled] { opacity:0.5; cursor:not-allowed; }
.choice small { display:block; font:500 11.5px var(--mono); color:var(--mute); margin-top:2px; }
.li { padding:5px 0 5px 14px; position:relative; }
.li::before { content:''; position:absolute; left:0; top:12px; width:6px; height:6px; border-radius:50%; background:var(--line); }
.li.good::before { background:var(--good); } .li.bad::before { background:var(--bad); }
.rating { font:800 18px/1.2 var(--display); margin:4px 0; }
.rating.exceeds { color:var(--good); } .rating.meets { color:var(--brand); } .rating.below { color:var(--bad); }
.post { border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:10px; background:var(--paper2); }
.post .ph { display:flex; gap:10px; align-items:center; margin-bottom:6px; }
.post .av { width:36px; height:36px; border-radius:50%; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; }
.post .meta { font-size:12px; color:var(--mute); margin-top:8px; }
.title-hero { font:800 clamp(40px, 9vw, 64px)/0.95 var(--display); color:var(--brand); letter-spacing:-1.5px; margin:0; }
.title-sub { font:600 15px var(--body); color:var(--mute); letter-spacing:0.4px; margin:6px 0 12px; }
.field { margin-top:4px; width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--paper); font-size:15px; }
.bgs { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px; margin-top:8px; }
.bgs button { text-align:left; border:1.5px solid var(--line); background:var(--paper); border-radius:10px; padding:9px 11px; }
.bgs button.on { border-color:var(--brand); background:var(--brand-soft); }
.bgs b { display:block; }
.bgs span { font-size:12.5px; color:var(--mute); }

/* ---- toasts ---- */
#toasts { position:fixed; z-index:50; right:max(16px, env(safe-area-inset-right, 0px)); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); display:grid; gap:6px; justify-items:end; pointer-events:none; }
.toast { background:var(--ink); color:var(--paper); border-radius:10px; padding:8px 12px; font-size:13px; max-width:320px; box-shadow:0 8px 24px rgba(20,24,32,.25); animation:rise .25s ease-out; }
.toast b { color:var(--marker); }
.toast mark.jg { color:var(--ink); }

@media (max-width:980px) {
  main.grid { grid-template-columns:minmax(0, 1fr); }
  .mapcol { display:contents; }
  .viewbox { order:1; } .side { order:2; } .feed { order:3; height:auto; max-height:340px; }
  .side { overflow:visible; position:static; max-height:none; }
  #pane { overflow:visible; }
  .clock { align-items:flex-start; }
}
@media (max-width:520px) {
  .brand span { display:none; }
  .meter { flex-basis:46%; }
  .meter.skills { flex-basis:100%; }
  .act .meta { grid-column:2 / 4; text-align:left; }
}
@media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }

/* ---- speed ---- */
.speed { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--paper); }
.speed button { border:0; border-right:1px solid var(--line); background:transparent; padding:5px 9px; font:600 12.5px var(--mono); color:var(--mute); }
.speed button:last-child { border-right:0; }
.speed button.on { background:var(--ink); color:var(--paper); }
.pill.budget { background:#e9f4ee; border-color:#bfe0cc; color:#14563a; }
.pill.budget.neg { background:#fbe6e2; border-color:#f0b9ad; color:var(--bad); }

/* ---- view box: office map or whiteboard ---- */
.viewbox { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:6px; min-width:0; }
.vhead { display:flex; align-items:center; gap:10px; padding:2px 4px 6px; flex-wrap:wrap; }
.vtabs { display:flex; background:var(--paper2); border-radius:9px; padding:3px; gap:2px; }
.vtabs button { border:0; background:transparent; border-radius:7px; padding:6px 14px; font-weight:650; font-size:13px; color:var(--mute); }
.vtabs button.on { background:var(--paper); color:var(--ink); box-shadow:0 1px 2px rgba(20,24,32,.12); }
.vtabs button .dotw { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--bad); margin-left:6px; vertical-align:1px; }
.busy { flex:1; min-width:180px; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--mute); }
.busy .bar { flex:1; margin:0; height:7px; }
.busy b { color:var(--ink); font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60%; }
#officeView canvas { display:block; width:100%; height:auto; aspect-ratio:760 / 480; border-radius:8px; }
.wbwrap { width:100%; }
#wb { display:block; width:100%; touch-action:none; cursor:crosshair; }
.bstats { display:flex; flex-wrap:wrap; gap:6px 14px; padding:0 6px 6px; font-size:12.5px; color:var(--mute); }
.bstats b { color:var(--ink); font-family:var(--mono); font-weight:600; }
.bstats .warn { color:var(--bad); font-weight:600; }
.palette { display:flex; flex-wrap:wrap; gap:5px; padding:8px 4px 4px; border-top:1px dashed var(--line); margin-top:6px; }
.tool { display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper); border-radius:9px; padding:4px 8px 4px 4px; font-size:12.5px; text-align:left; }
.tool img { width:28px; height:28px; flex:none; }
.tool span { display:flex; flex-direction:column; line-height:1.15; }
.tool b { font-weight:650; }
.tool small { font:500 11px var(--mono); color:var(--mute); }
.tool.on { border-color:var(--brand); background:var(--brand-soft); box-shadow:0 0 0 1px var(--brand) inset; }
.tool[disabled] { opacity:.45; cursor:not-allowed; }
.tool.rot { padding:4px 10px; font-weight:650; }
.tool.inbox { border-style:dashed; border-color:var(--bad); }
.inspector { padding:8px 6px 4px; font-size:13px; }
.inspector .ih { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.inspector .ih h3 { margin:0; font:700 17px/1.2 var(--display); }
.inspector .ih span { color:var(--mute); font-size:12px; }
.inspector p { margin:4px 0; color:var(--mute); }
.inspector .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }

const SPOTS = { conf:[106, 92], boss:[279, 98], hr:[442, 98], exec:[637, 100], ops:[205, 300], it:[518, 280], roof:[668, 270], break:[141, 430], lobby:[520, 430] };
const TOP_Y = 156, BOT_Y = 350, HALL_X = 434;
const GRAPH = (() => {
  const nodes = [], edges = [];
  const add = (x, y, tag) => { nodes.push({ x, y, tag }); return nodes.length - 1; };
  const link = (a, b) => edges.push([a, b, Math.hypot(nodes[a].x - nodes[b].x, nodes[a].y - nodes[b].y)]);
  const top = [], bot = [], center = {};
  for (const [id, r] of Object.entries(ROOMS)) {
    const [sx, sy] = SPOTS[id]; center[id] = add(sx, sy, id);
    for (const [dx, dy] of r.doors) {
      const d = add(dx, dy, 'door'); link(center[id], d);
      const hy = Math.abs(dy - TOP_Y) < Math.abs(dy - BOT_Y) ? TOP_Y : BOT_Y;
      const h = add(dx, hy, 'hall'); link(d, h); (hy === TOP_Y ? top : bot).push(h);
    }
  }
  top.push(add(HALL_X, TOP_Y, 'hall')); bot.push(add(HALL_X, BOT_Y, 'hall'));
  link(top[top.length - 1], bot[bot.length - 1]);
  for (const line of [top, bot]) { line.sort((a, b) => nodes[a].x - nodes[b].x); for (let i = 1; i < line.length; i++) link(line[i - 1], line[i]); }
  const adj = nodes.map(() => []);
  for (const [a, b, d] of edges) { adj[a].push([b, d]); adj[b].push([a, d]); }
  return { nodes, adj, center };
})();
function routeBetween(a, b) {
  if (a === b) return { pts:[], len:0 };
  const { nodes, adj, center } = GRAPH, s = center[a], t = center[b];
  const dist = nodes.map(() => Infinity), prev = nodes.map(() => -1), done = nodes.map(() => false);
  dist[s] = 0;
  for (;;) {
    let u = -1, best = Infinity; for (let i = 0; i < nodes.length; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
    if (u < 0 || u === t) break; done[u] = true;
    for (const [v, d] of adj[u]) if (dist[u] + d < dist[v]) { dist[v] = dist[u] + d; prev[v] = u; }
  }
  const pts = []; for (let u = t; u >= 0; u = prev[u]) pts.unshift([nodes[u].x, nodes[u].y]);
  return { pts, len:dist[t] };
}
const walkMinutes = (a, b) => a === b ? 0 : Math.max(2, Math.round(routeBetween(a, b).len / 70));
function roomAtPoint(x, y) { for (const [id, r] of Object.entries(ROOMS)) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return id; return null; }

const J = (() => {
  const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const items = JARGON.map(([p, m, re], i) => ({ i, p, m, src:re || rx(p), test:new RegExp('^(?:' + (re || rx(p)) + ')$', 'i') }));
  const sorted = items.slice().sort((a, b) => b.src.length - a.src.length);
  const all = new RegExp('\\b(?:' + sorted.map(x => x.src).join('|') + ')\\b', 'gi');
  const which = str => { for (const it of sorted) if (it.test.test(str)) return it.i; return -1; };
  return { items, all, which };
})();
function findJargon(text) { const out = []; J.all.lastIndex = 0; let m; while ((m = J.all.exec(text))) { const i = J.which(m[0]); if (i >= 0) out.push(i); } return out; }

  h += `<button type="button" class="btn alt" data-rot="${t.id}">Rotate</button><button type="button" class="btn alt" data-rm="${t.id}" style="color:var(--bad);border-color:var(--bad)">${t.type === 'intake' ? 'Pick up' : 'Remove'}</button></div>`;
  if (st && st.up && t.lvl < MAX_LVL) h += `<p class="note">Each upgrade adds ${WORKERS[t.type] && seats(t) < 4 ? 'a seat and ' : ''}speed${t.type === 'desk' ? ' and value' : ''}.</p>`;
  $('inspector').innerHTML = h;
}
function renderBoardStats() {
  const back = backlogTotal(), un = unstaffed().length;
  const h = `<span>Waiting <b>${back}</b></span><span>Closed today <b>${S.today.closed}</b></span><span>Impact today <b>${fmtNum(S.today.impact)}</b></span><span>Bounced today <b>${S.today.rejected}</b></span><span>Team speed <b>×${teamMult().toFixed(2)}</b></span>${un ? `<span class="warn">${un} station${un > 1 ? 's' : ''} with nobody</span>` : ''}`;

}
function setView(v) {
  VIEW = v; $('officeView').hidden = v !== 'office'; $('boardView').hidden = v !== 'board';
  for (const b of document.querySelectorAll('[data-view]')) b.classList.toggle('on', b.dataset.view === v);
  if (v === 'board') { wbLayout(); KEYS.pal = KEYS.insp = ''; } else if (MAP.resize) MAP.resize();
}

// ---------------------------------------------------------------------
// MODALS
// ---------------------------------------------------------------------
function openModal(html, opts = {}) {
  closeModal(true);
  const ov = document.createElement('div'); ov.className = 'ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
  ov.innerHTML = `<div class="modal">${html}</div>`;
  $('ovWrap').appendChild(ov); MODAL = { ov, kind:opts.kind || '', closable:!!opts.closable }; hideTip();
  const f = ov.querySelector('input, .btn:not([disabled]), .choice:not([disabled])'); if (f) setTimeout(() => { try { f.focus({ preventScroll:true }); } catch (e) {} }, 40);
  return ov;
}
function closeModal(silent) { if (!MODAL) return; MODAL.ov.remove(); MODAL = null; hideTip(); if (!silent) { renderAll(); setTimeout(nextModal, 0); } }
function queueModal(fn) { MQ.push(fn); if (!MODAL) nextModal(); }
function nextModal() { if (MODAL) return; const fn = MQ.shift(); if (fn) fn(); }
function titleModal() {
  const has = hasSave();
  openModal(`<h1 class="title-hero tp">Throughput</h1><div class="title-sub">Another Week in Operations</div>
    <p>SynergyCorp just created an Operations department, and it is you. Every department in the building sends you requests. ${jz('Design the process on the whiteboard, hire people to run it, keep your boss happy, and climb all the way to COO. Every Friday is a performance review.')}</p>
    <p class="note">Walking and doing things takes time, and the clock keeps running. Highlighted jargon can be hovered or tapped to decode.</p>
    <label for="tName" class="note">Your name</label><input class="field" id="tName" value="${esc(has ? '' : 'Alex')}" maxlength="20" autocomplete="off" placeholder="Alex">
    <div class="row">${has ? '<button type="button" class="btn alt big" id="tCont">Continue your career</button>' : ''}<button type="button" class="btn big" id="tNew">${has ? 'Start a new career' : 'Start your first day'}</button></div>`, { kind:'title' });
  $('tNew').onclick = () => { audio(); const n = $('tName').value.trim() || 'Alex'; wipeSave(); newGame(n); for (const k in KEYS) delete KEYS[k]; WB.sel = null; WB.tool = 'select'; TAB = 'here'; setView('office'); closeModal(); save(); queueModal(() => openMail(0) && mailModal(0)); };
  if (has) $('tCont').onclick = () => { audio(); let ok = false; try { ok = loadRaw(localStorage.getItem(SAVE_KEY)); } catch (e) {} if (!ok) { newGame('Alex'); } for (const k in KEYS) delete KEYS[k]; closeModal(); };
}
function mailModal(k) {
  const e = openMail(k); if (!e) return;
  const m = S.inbox[k];
  openModal(`<div class="mhead"><div><span>From</span><b>${esc(fromName(e))}</b></div><div><span>To</span>${esc(S.name)}</div><div><span>Sent</span>${WEEKDAYS[(m.day - 1) % 5]} ${clock(m.min)}</div><span class="subj">${jz(e.subj)}</span></div>
    <div>${e.body.split('\n').map(p => `<p>${jz(fill(p))}</p>`).join('')}</div>
    <div>${e.choices.map((c, i) => { const why = choiceBlocked(c); return `<button type="button" class="choice" data-ch="${i}" ${why ? 'disabled' : ''}>${jz(c.l)}${c.mins || why ? `<small>${c.mins ? c.mins + ' min' : ''}${why ? (c.mins ? ' · ' : '') + esc(why) : ''}</small>` : ''}</button>`; }).join('')}</div>
    <div class="row"><button type="button" class="btn alt" id="mLater">Later</button></div>`, { kind:'mail', closable:true });
  MODAL.ov.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => {
    const idx = S.inbox.indexOf(m); if (idx < 0) return;
    const ci = +b.dataset.ch, c = e.choices[ci];
    if (answerMail(idx, ci)) { settle(); sfx('click'); closeModal(); if (c.mins) toast(`Dealing with it: ${c.mins} min.`); }
  });
  $('mLater').onclick = () => closeModal();
}
function eodModal(sum) {
  const lines = sum.lines.map(([t, k]) => `<div class="li ${k}">${jz(t)}</div>`).join('');
  let rv = '';
  if (sum.review) {
    const r = sum.review;
    rv = `<h3>Weekly performance review</h3><div class="rating ${r.rating}">${jz(r.text)}</div>
      <div class="stats"><div>Closed<b>${fmtNum(r.w.closed)} / ${fmtNum(r.w.quota)}</b></div><div>Within SLA<b>${Math.round(r.sla * 100)}%</b></div><div>Impact<b>${fmtNum(r.w.impact)}</b></div><div>Bounced<b>${r.w.rejected}</b></div></div>
      ${r.lines.map(l => `<div class="li ${r.rating === 'below' ? 'bad' : 'good'}">${jz(l)}</div>`).join('')}`;
  }
  sfx(sum.review ? (sum.review.rating === 'below' ? 'bad' : 'good') : 'done');
  openModal(`<div class="kicker">${sum.weekday} · Week ${sum.week}</div><h2>${sum.reason === 'burnout' ? 'Burned out' : 'End of the day'}</h2>
    <div class="stats"><div>Tickets closed<b>${fmtNum(sum.closed)}</b></div><div>Impact<b>${fmtNum(sum.impact)}</b></div><div>Bounced<b>${sum.rejected}</b></div><div>Late<b>${sum.breached}</b></div></div>
    ${rv}<h3>Overnight</h3>${lines}
    <div class="row"><button type="button" class="btn big" id="mOk">${S.over ? 'Continue' : 'Start ' + WEEKDAYS[weekday()]}</button></div>`, { kind:'eod' });

}
function promoModal(p) {
  const R0 = RANKS[p.rank]; sfx('good');
  openModal(`<div class="kicker">Promotion</div><h2>${esc(R0.t)}</h2><p><i>${jz(p.line)}</i></p>${R0.unlock ? `<div class="callout go">${jz(R0.unlock)}</div>` : ''}
    <p class="note">Your whiteboard grows to ${R0.grid[0]}×${R0.grid[1]}, your headcount to ${R0.hc}, your budget to ${fmtMoney(R0.budget)} a day. Visibility halves, because nobody remembers what you did as a ${esc(RANKS[p.rank - 1].t)}.</p>
    <div class="row"><button type="button" class="btn big" id="mOk">Back to work</button></div>`, { kind:'promo' });

}
function endModal(id) {
  const E = ENDINGS[id]; sfx(id === 'coo' ? 'good' : 'bad'); wipeSave();
  openModal(`<div class="kicker">The end</div><h2>${esc(E.title)}</h2><p class="note">${esc(E.sub)}</p><p>${jz(E.text)}</p>
    <div class="stats"><div>Days<b>${S.day}</b></div><div>Tickets closed<b>${fmtNum(S.stats.closed)}</b></div><div>Lifetime impact<b>${fmtNum(S.impL)}</b></div><div>People hired<b>${S.stats.hires}</b></div><div>Phrases decoded<b>${Object.keys(S.dec).length}/${JARGON.length}</b></div><div>Achievements<b>${Object.keys(S.ach).length}/${ACHIEVEMENTS.length}</b></div></div>
    <div class="row"><button type="button" class="btn big" id="mNew">Start a new career</button></div>`, { kind:'end' });
  $('mNew').onclick = () => { closeModal(true); titleModal(); };
}
function helpModal() {
  openModal(`<div class="kicker">Employee handbook</div><h2>How Operations works</h2>
    <ul style="padding-left:18px;margin:8px 0">
      <li><b>Tickets</b> arrive at each department's <b>inbox</b> on the whiteboard and travel along <b>Handoffs</b>. A <b>Desk</b> does the Work; a ticket closes at <b>Done</b>.</li>

      <li><b>Friday review:</b> tickets closed against your quota, and how many were on time. Two bad weeks in a row and you're offboarded.</li>
      <li><b>Promotions</b> need Impact (the value of what you close), Visibility and skills. Then ask your boss.</li>

    </ul><div class="row"><button type="button" class="btn" id="mOk">Back to work</button></div>`, { kind:'help', closable:true });

function menuModal() {
  openModal(`<div class="kicker">Menu</div><h2>${esc(S.name)}, ${esc(rank().t)}</h2>
    <div class="row"><button type="button" class="btn alt" id="mHelp">How to play</button><button type="button" class="btn alt" id="mSound">Sound: ${SOUND ? 'on' : 'off'}</button><button type="button" class="btn alt" id="mNew">Start over</button><button type="button" class="btn" id="mOk">Back</button></div>
    <div id="mConfirm" hidden><div class="callout bad" style="margin-top:12px">Start a new career? This one will be lost.</div><div class="row"><button type="button" class="btn alt" id="mNo">Keep going</button><button type="button" class="btn" id="mYes" style="background:var(--bad);border-color:var(--bad)">Start over</button></div></div>`, { kind:'menu', closable:true });
  $('mOk').onclick = () => closeModal(); $('mHelp').onclick = () => helpModal();
  $('mSound').onclick = () => { SOUND = !SOUND; try { localStorage.setItem('tp_sound', SOUND ? 'on' : 'off'); } catch (e) {} $('mSound').textContent = 'Sound: ' + (SOUND ? 'on' : 'off'); };
  $('mNew').onclick = () => { $('mConfirm').hidden = false; };
  $('mNo').onclick = () => { $('mConfirm').hidden = true; };
  $('mYes').onclick = () => { wipeSave(); MQ.length = 0; closeModal(true); titleModal(); };
}

// ---------------------------------------------------------------------
// ENGINE EVENTS
// ---------------------------------------------------------------------
let DEC_BUF = [], DEC_T = 0, MAIL_BUF = [], MAIL_T = 0;
function flush() {
  if (!S) return;
  const L = S.pending; S.pending = [];
  for (const p of L) {
    if (p.type === 'jargon') DEC_BUF.push(p.i);
    else if (p.type === 'ach') { const a = ACHIEVEMENTS.find(x => x.id === p.id); if (a) { toast(`Achievement: <b>${esc(a.n)}</b><br>${esc(a.d)}`, '', 4500); sfx('good'); } }
    else if (p.type === 'mail') MAIL_BUF.push(p.id);
    else if (p.type === 'pop') { WB.pops.push({ x:p.x, y:p.y, text:p.text, bad:p.bad, late:p.late, life:1 }); if (!p.bad) sfx('close'); }
    else if (p.type === 'arrive') { if (TAB !== 'inbox' || !MODAL) TAB = 'here'; KEYS.pane = ''; }
    else if (p.type === 'promo') { const pp = p; queueModal(() => promoModal(pp)); }
    else if (p.type === 'eod') { const sum = p.sum; save(); queueModal(() => eodModal(sum)); }
    else if (p.type === 'end') { const id = p.id; queueModal(() => endModal(id)); }
  }
  const now = performance.now();
  if (MAIL_BUF.length && now - MAIL_T > 2500) { const n = MAIL_BUF.length, e = emailById(MAIL_BUF[n - 1]); toast(n === 1 ? `New email from ${esc(fromName(e))}<br><b>${jz(e.subj)}</b>` : `<b>${n}</b> new emails. Latest from ${esc(fromName(e))}: <b>${jz(e.subj)}</b>`, '', 4200); sfx('mail'); MAIL_BUF = []; MAIL_T = now; }
  if (DEC_BUF.length && now - DEC_T > 2500) { const n = DEC_BUF.length; toast(n === 1 ? `Decoded: <b>${esc(JARGON[DEC_BUF[0]][0])}</b>` : `Decoded <b>${n}</b> new phrases`, '', 2600); DEC_BUF = []; DEC_T = now; }
}
function renderAll() {
  if (!S) return;
  renderHeader(); renderMeters(); renderBusy(); renderTabs(); renderPane(); renderFeed();
  if (VIEW === 'board') { renderPalette(); renderInspector(); renderBoardStats(); }
  flush();
}

// ---------------------------------------------------------------------
// INPUT
// ---------------------------------------------------------------------
function act(ok) { if (ok) { sfx('click'); settle(); save(); } else sfx('nope'); renderAll(); }
document.addEventListener('click', e => {
  const mk = e.target.closest && e.target.closest('mark.jg');
  if (mk && !mk.closest('button')) { if (TIP_EL === mk && !$('jtip').hidden && performance.now() - TIP_T > 450) hideTip(); else showTip(mk); e.stopPropagation(); e.preventDefault(); return; }
  if (!S) return;
  const t = e.target.closest('button'); if (!t) return;
  if (MODAL && !MODAL.ov.contains(t)) return;
  audio();
  const d = t.dataset;
  if (d.speed !== undefined) { SPEED = +d.speed; if (SPEED) PREV_SPEED = SPEED; renderHeader(); return; }
  if (d.view) { setView(d.view); sfx('click'); renderAll(); return; }
  if (d.tab) { TAB = d.tab; sfx('click'); renderTabs(); renderPane(); $('pane').scrollTop = 0; return; }
  if (d.act) return act(startAction(d.act));
  if (d.go) { if (travel(d.go)) { sfx('click'); renderAll(); } return; }
  if (d.chat) return act(chatWith(d.chat));
  if (d.hire) { const r = hire(d.hire); if (r.why) { toast(esc(r.why), 'bad'); sfx('nope'); } else { sfx('good'); toast(`Hired <b>${esc(r.p.n)}</b>. Put them on a station: Whiteboard or Team tab.`); } save(); renderAll(); return; }
  if (d.tool) return act(buyTool(d.tool));
  if (d.gear) return act(buyGear(d.gear));
  if (d.mail !== undefined) { mailModal(+d.mail); renderAll(); return; }
  if (d.fire) { const p = staffById(+d.fire); if (p && (MODAL || confirmFire(p))) {} return; }
  if (d.wtool) { WB.tool = WB.tool === d.wtool && d.wtool !== 'select' ? 'select' : d.wtool; if (WB.tool !== 'select') WB.sel = null; sfx('click'); renderAll(); return; }
  if (d.wrot) { WB.dir = (WB.dir + 1) % 4; sfx('click'); renderAll(); return; }
  if (d.up) { const tl = tileById(+d.up), why = upgradeTile(tl); if (why) { toast(esc(why), 'bad'); sfx('nope'); } else { sfx('place'); save(); } renderAll(); return; }
  if (d.rot) { rotateTile(tileById(+d.rot)); sfx('click'); renderAll(); return; }
  if (d.tri) { cycleTriage(tileById(+d.tri)); sfx('click'); renderAll(); return; }
  if (d.rm) { const tl = tileById(+d.rm); if (tl) wbRemove(tl); return; }
  if (d.unassign) { assign(+d.unassign, null); sfx('click'); renderAll(); return; }
  switch (t.id) {
    case 'bMenu': if (!MODAL) menuModal(); return;
  }
});
function confirmFire(p) {
  openModal(`<div class="kicker">People & Culture</div><h2>Let ${esc(p.n)} go?</h2><p>${jz('Brenda will call it "rightsizing." Everyone else on the team loses a little morale.')}</p><div class="row"><button type="button" class="btn alt" id="mNo">Keep them</button><button type="button" class="btn" id="mYes" style="background:var(--bad);border-color:var(--bad)">Let them go</button></div>`, { kind:'fire', closable:true });
  $('mNo').onclick = () => closeModal(); $('mYes').onclick = () => { letGo(p.id); sfx('sell'); save(); closeModal(); };
  return true;
}
document.addEventListener('change', e => {
  const el = e.target; if (!S) return;
  if (el.dataset.assign) { const why = assign(+el.dataset.assign, el.value ? +el.value : null); if (why) { toast(esc(why), 'bad'); sfx('nope'); } else sfx('click'); save(); renderAll(); }
  if (el.dataset.seat && el.value) { const why = assign(+el.value, +el.dataset.seat); if (why) { toast(esc(why), 'bad'); sfx('nope'); } else sfx('place'); save(); renderAll(); }
});
document.addEventListener('input', e => { if (e.target.id === 'decQ') { DEC_Q = e.target.value; renderPane(); } });
document.addEventListener('mouseover', e => { const m = e.target.closest && e.target.closest('mark.jg'); if (m) showTip(m); else if (TIP_EL) hideTip(); });
document.addEventListener('focusin', e => { const m = e.target.closest && e.target.closest('mark.jg'); if (m) showTip(m); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('mark.jg')) hideTip(); });
addEventListener('scroll', () => { if (TIP_EL) hideTip(); }, true);
addEventListener('keydown', e => {
  if (e.key === 'Escape' && MODAL && MODAL.closable) { closeModal(); return; }
  if (MODAL || !S || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); if (SPEED) { PREV_SPEED = SPEED; SPEED = 0; } else SPEED = PREV_SPEED || 1; renderHeader(); return; }
  if (VIEW !== 'board') return;
  if (k === 'escape') { WB.tool = 'select'; WB.sel = null; renderAll(); }
  else if (k === 'r') { if (WB.sel && S.tiles[key(WB.sel.x, WB.sel.y)] === WB.sel) rotateTile(WB.sel); else WB.dir = (WB.dir + 1) % 4; sfx('click'); renderAll(); }
  else if ((k === 'delete' || k === 'backspace') && WB.sel) wbRemove(WB.sel);
  else if (/^[0-9]$/.test(k)) { const type = PALETTE[k === '0' ? 9 : +k - 1]; if (type && S.rank >= STATIONS[type].rank && (!STATIONS[type].tool || S.tools[STATIONS[type].tool])) { WB.tool = type; WB.sel = null; renderAll(); } }
});

// ---------------------------------------------------------------------
// LOOP + BOOT
// ---------------------------------------------------------------------
let LAST_TS = 0, LAST_UI = 0, SAVE_T = 0;
function loop(ts) {
  const dt = Math.min(0.1, Math.max(0, (ts - (LAST_TS || ts)) / 1000)); LAST_TS = ts;
  MAP.t += dt; stepWalkers(dt); wbFx(dt);
  if (S && !S.over && !MODAL && SPEED > 0 && S.pending.length === 0) { advance(dt * 4 * SPEED); settle(); }
  if (S) {
    flush();
    if (VIEW === 'office') drawMap(); else wbDraw(ts);
    if (ts - LAST_UI > 150) {
      LAST_UI = ts;
      renderHeader(); renderMeters(); renderBusy(); renderTabs(); renderFeed();
      if (paneSig() !== KEYS.pane) renderPane();
      if (VIEW === 'board') { renderPalette(); renderInspector(); renderBoardStats(); }
      const wbDot = unstaffed().length > 0; const vb = document.querySelector('[data-view="board"]'); const want = 'Whiteboard' + (wbDot ? '<span class="dotw"></span>' : ''); if (vb.innerHTML !== want) vb.innerHTML = want;
    }
    if (ts - SAVE_T > 5000) { SAVE_T = ts; save(); }
  }
  requestAnimationFrame(loop);
}
function start(data) {
  mapInit($('map')); wbInit($('wb'));
  MAP.onClick = id => { audio(); if (!S || MODAL || S.over) return; if (roomLocked(id)) { toast(`${esc(LOCS[id].n)} is for ${esc(RANKS[LOCS[id].minRank].t)}s and above.`, 'bad'); sfx('nope'); return; } if (id === S.loc && !S.busy) { TAB = 'here'; renderAll(); return; } if (travel(id)) { sfx('click'); TAB = 'here'; renderAll(); } else if (S.busy) toast('You\'re busy. One thing at a time.', 'bad'); };
  MAP.tagFor = id => { if (!S) return ''; if (roomLocked(id)) return `Locked · ${RANKS[LOCS[id].minRank].t}`; if (id === S.loc) return 'You are here'; return `${id === 'boss' ? bossName() + '\'s Office' : LOCS[id].n} · ${walkMinutes(S.loc, id)} min walk`; };
  if (data && data.save && loadRaw(data.save)) { renderAll(); }
  else { newGame('Alex'); S.dummy = true; renderAll(); titleModal(); }
  requestAnimationFrame(loop);
}
addEventListener('beforeunload', () => save());
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
try { window.claude?.hot?.snapshot?.(() => ({ save:S && !S.dummy && !S.over ? JSON.stringify(S) : null })); } catch (e) {}
(window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}));
</script>
